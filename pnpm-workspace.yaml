packages:
  - apps/discord-bot
  - apps/dashboard

# No dependency preflight before a script; it cannot be trusted in this repo.
#
# pnpm's default here is `install`: every `pnpm <script>` checks dependency
# freshness and, when unsatisfied, silently shells out to `pnpm install` --
# which asks to REMOVE the modules directory before reinstalling. A coding-agent
# worktree bridges `node_modules` from the main checkout, so pnpm reads that
# bridge as out-of-sync and offers to purge the *shared* tree every checkout
# uses. `warn` dropped that action but kept the diagnosis, and the diagnosis is
# not reliable here either:
#
#   - In a worktree it is a false positive by construction: the bridged
#     workspace-state file names the main checkout's project roots, which can
#     never equal the worktree's.
#   - In the main checkout it is a false positive whenever a worktree ran
#     `pnpm install` last, because the bridge symlinks that state file, so the
#     worktree's install rewrites the main checkout's copy.
#   - It prints to stdout, so it corrupts `--json` output and breaks automation.
#
# The true positive it might catch -- a manifest edited without an install -- is
# already caught by CI's `pnpm install --frozen-lockfile` and by a clear runtime
# module-resolution error. `false` is strictly safer than `warn` about the
# destructive install (it does nothing at all) and removes the noise -- the same
# reasoning that removed `engines.node`; see CLAUDE.md.
verifyDepsBeforeRun: false

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
