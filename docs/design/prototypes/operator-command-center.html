<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center Sketch</title>
<!-- Throwaway UX sketch of the operator's command center (docs/design/operator-command-center.md). Sample data only; it calls nothing in Arcadia, stores nothing, and is not production code. The sky is a plain gradient, not the real renderer. -->
<style>
:root {
  color-scheme: dark;
  --text: #f5f2ed; --soft: #d6d9e4; --muted: #a9b0c2; --eyebrow: #e4c8a9; --focus: #ffd9aa; --ember: #ffbf5a; --ok: #a8e6b8; --bad: #ff9a8a;
  --surface: rgb(12 18 36 / .86); --surface-strong: rgb(10 15 30 / .95); --line: rgb(236 226 211 / .2); --button: #273d61;
  --sky-top: #1b1430; --sky-mid: #4a2b3a; --sky-low: #b0664a; --bg: #07080f;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --text: #1d1a17; --soft: #3a3631; --muted: #5d5850; --eyebrow: #8a4b1c; --focus: #8a4b1c; --ember: #a75a00; --ok: #1f6b38; --bad: #a3271a;
    --surface: rgb(255 251 245 / .9); --surface-strong: rgb(255 251 245 / .97); --line: rgb(60 40 20 / .18); --button: #f0dcc4;
    --sky-top: #f6d9b8; --sky-mid: #f1c6a0; --sky-low: #e7a77e; --bg: #fbf3ea;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.5 var(--ui);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%) fixed, var(--bg); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:is(a, button, select, summary):focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 120px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 4px 0 12px; }
.wordmark { font-weight: 700; letter-spacing: .02em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
.scope { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.scope select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.sample { font-size: 12px; color: var(--eyebrow); }
.arrival { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.arrival strong { display: block; }
.grid { display: grid; gap: 14px; }
@media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .trail-col { position: sticky; top: 12px; } }
section > h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--eyebrow); margin: 18px 4px 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.wait { display: grid; gap: 4px; }
.wait .cost { color: var(--muted); font-size: 13px; }
.wait.blocker { border-color: var(--ember); }
.go { justify-self: start; margin-top: 4px; padding: 6px 12px; border-radius: 10px; background: var(--button); border: 1px solid var(--line); text-decoration: none; font-size: 14px; }
.topic-head { display: flex; gap: 8px; align-items: baseline; }
.topic-head h3 { margin: 0; font-size: 16px; flex: 1; }
.changed { width: 9px; height: 9px; border-radius: 50%; background: var(--ember); flex: none; transform: translateY(-1px); }
.changed.read { background: transparent; border: 1px solid var(--line); }
.proj { font-size: 12px; color: var(--muted); }
.goal, .meta { font-size: 13px; color: var(--soft); margin: 2px 0; }
.bar { display: flex; gap: 2px; margin: 6px 0 2px; }
.bar i { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.bar i.done { background: var(--ok); }
.summary { margin: 6px 0; }
.label { font-size: 11px; color: var(--muted); }
.blocked { color: var(--bad); font-size: 14px; margin: 4px 0; }
.move { font-size: 14px; margin: 4px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.row button { padding: 5px 10px; border-radius: 10px; background: transparent; border: 1px solid var(--line); font-size: 13px; }
.row button[aria-pressed="true"] { background: var(--button); }
.quiet { color: var(--muted); font-size: 14px; padding: 4px; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: flex; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 14px; }
.feed li:first-child { border-top: 0; }
.feed time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.feed .unread::before { content: "●"; color: var(--ember); margin-right: 4px; }
.note { font-size: 12px; color: var(--muted); }
.relay { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 32px));
  background: var(--surface-strong); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .2s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="wordmark">arcadia</span>
    <span class="pill" role="status"><span class="dot" aria-hidden="true"></span>Needs you · Production on</span>
    <span class="sample">Sample data</span>
    <label class="scope">Scope
      <select id="scope" aria-label="Scope">
        <option value="all">All projects</option>
        <option value="arcadia">Arcadia</option>
        <option value="plan:record-run">Arcadia › Record-run test pins</option>
      </select>
    </label>
  </header>

  <div class="arrival" id="arrival" role="note"></div>

  <div class="grid">
    <div>
      <section aria-labelledby="wait-h">
        <h2 id="wait-h">Waiting on you</h2>
        <div id="waiting"></div>
      </section>
      <section aria-labelledby="topics-h">
        <h2 id="topics-h">Topics</h2>
        <div id="topics"></div>
        <p class="quiet" id="quiet"></p>
      </section>
    </div>
    <div class="trail-col">
      <section aria-labelledby="feed-h">
        <h2 id="feed-h">Feed</h2>
        <div class="card"><ul class="feed" id="feed"></ul>
          <p class="note">Only what changed since you read each topic. Settled items leave once read. Older items live in each topic's trail.</p></div>
      </section>
    </div>
  </div>
</div>
<div class="relay" aria-hidden="true">Ask Arcadia anything…</div>

<script>
// Sample data only. Nothing here is read from or written to Arcadia.
const WAITING = [
  { icon: "🚨", project: "arcadia", topic: "plan:record-run", title: "Approve the build packet for pin-surface-date-validation", cost: "Waiting 6 h. Production on this Action stays stopped.", control: "Open the approval →", blocker: true },
  { icon: "🔘", project: "arcadia", topic: "plan:record-run", title: "Decision 0188: continue after a reviewed fix?", cost: "Waiting 2 h. The next Action can't launch until you answer.", control: "Answer →" },
  { icon: "🔀", project: "arcadia", topic: "other:arcadia", title: "Merge #2220: progress-first digest (reviewed, green)", cost: "Waiting 40 min. The evening digest keeps the old layout.", control: "Merge on GitHub ↗" }
];
const TOPICS = [
  { id: "plan:record-run", project: "arcadia", title: "Record-run test pins", goal: "Goal: record a run with unattended test pins", done: 4, total: 6, since: 2,
    summary: "Two pins landed overnight. The third is stopped on a build-packet approval.", ai: true,
    blocked: "Blocked: build-packet approval, 6 h", move: "Your move: approve the packet", updates: 12, changed: true },
  { id: "other:arcadia", project: "arcadia", title: "Arcadia: other work", goal: "Off-Plan threads: 5", done: null,
    summary: "The digest rewrite is ready to merge. The idle-front check is in its second review round.", ai: true,
    blocked: null, move: "Your move: merge #2220", updates: 7, changed: true },
  { id: "plan:serial-overnight", project: "arcadia", title: "Keep serial production running overnight", goal: "Goal: three test-only Actions, unattended", done: 3, total: 3, since: 0,
    summary: "Reached. Three Actions finished and two merged.", ai: false, blocked: null, move: null, updates: 0, changed: false, quiet: true }
];
const FEED = [
  { at: "09:12", topic: "plan:record-run", text: "#2216 merged · Record-run test pins", unread: true },
  { at: "08:40", topic: "plan:record-run", text: "Session ended: pin-safety-lines, review passed", unread: true },
  { at: "08:02", topic: "plan:record-run", text: "5 commits by Claudia Mason", unread: false },
  { at: "07:31", topic: "other:arcadia", text: "#2218 review round 1: changes requested, fixed", unread: true },
  { at: "06:55", topic: "other:arcadia", text: "#2220 opened: progress-first digest", unread: false }
];
const state = { scope: "all", read: new Set(), kept: new Set() };
const inScope = id => state.scope === "all" || state.scope === "arcadia" || id === state.scope;
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function render() {
  const topics = TOPICS.filter(t => inScope(t.id));
  const waiting = WAITING.filter(w => inScope(w.topic));
  const changed = topics.filter(t => t.changed && !state.read.has(t.id));
  const arrival = document.getElementById("arrival");
  arrival.replaceChildren(el("strong", null, "Since you were here (14 h)"),
    el("span", null, `6 merged, 2 goals moved, ${waiting.length} ${waiting.length === 1 ? "tap waits" : "taps wait"} on you.`));

  const w = document.getElementById("waiting");
  w.replaceChildren(...(waiting.length ? waiting.map(item => {
    const c = el("div", `card wait${item.blocker ? " blocker" : ""}`);
    c.append(el("strong", null, `${item.icon} ${item.title}`), el("span", "cost", item.cost));
    const a = el("a", "go", item.control); a.href = "#"; a.addEventListener("click", e => e.preventDefault());
    c.append(a); return c;
  }) : [el("p", "quiet", "Nothing ready is waiting on you.")]));

  const list = document.getElementById("topics");
  const shown = topics.filter(t => !t.quiet || state.kept.has(t.id));
  shown.sort((a, b) => Number(state.kept.has(b.id)) - Number(state.kept.has(a.id)));
  list.replaceChildren(...shown.map(t => {
    const c = el("article", "card"); c.setAttribute("aria-label", t.title);
    const isRead = !t.changed || state.read.has(t.id);
    const head = el("div", "topic-head");
    const dot = el("span", `changed${isRead ? " read" : ""}`); dot.setAttribute("aria-hidden", "true");
    head.append(dot, el("h3", null, t.title), el("span", "proj", t.project === "arcadia" ? "Arcadia" : t.project));
    c.append(head);
    if (!isRead) c.append(el("span", "sr", "Changed since you read."));
    c.append(el("p", "goal", t.goal));
    if (t.total) {
      const bar = el("div", "bar"); bar.setAttribute("role", "img"); bar.setAttribute("aria-label", `${t.done} of ${t.total} Actions done`);
      for (let i = 0; i < t.total; i++) bar.append(el("i", i < t.done ? "done" : ""));
      c.append(bar, el("p", "meta", `${t.done}/${t.total} Actions · +${t.since} since you read`));
    }
    c.append(el("p", "summary", t.summary), el("span", "label", t.ai ? "AI-written from the facts above" : "Computed"));
    if (t.blocked) c.append(el("p", "blocked", t.blocked));
    if (t.move) c.append(el("p", "move", t.move));
    const row = el("div", "row");
    const upd = el("button", null, `${t.updates} updates ▸`); upd.addEventListener("click", () => { state.scope = t.id.startsWith("plan:record") ? t.id : state.scope; sync(); });
    const mark = el("button", null, isRead ? "Mark unread" : "Mark read");
    mark.addEventListener("click", () => { isRead ? state.read.delete(t.id) : state.read.add(t.id); render(); });
    const pin = el("button", null, state.kept.has(t.id) ? "Pinned" : "Pin"); pin.setAttribute("aria-pressed", String(state.kept.has(t.id)));
    pin.addEventListener("click", () => { state.kept.has(t.id) ? state.kept.delete(t.id) : state.kept.add(t.id); render(); });
    row.append(upd, mark, pin); c.append(row); return c;
  }));
  const quiet = topics.filter(t => t.quiet && !state.kept.has(t.id));
  document.getElementById("quiet").textContent = quiet.length ? `Quiet: ${quiet.length} topic${quiet.length === 1 ? "" : "s"}, nothing new ▸` : "";
  document.getElementById("topics-h").textContent = `Topics · ${changed.length} changed`;

  const feed = document.getElementById("feed");
  const items = FEED.filter(f => inScope(f.topic) && !(state.read.has(f.topic)));
  feed.replaceChildren(...(items.length ? items.map(f => {
    const li = el("li"); li.append(el("time", null, f.at)); li.append(el("span", f.unread ? "unread" : "", f.text)); return li;
  }) : [el("li", null, "Nothing new in this scope.")]));
}
function sync() { document.getElementById("scope").value = state.scope; render(); }
document.getElementById("scope").addEventListener("change", e => { state.scope = e.target.value; render(); });
render();
</script>
</body>
</html>
