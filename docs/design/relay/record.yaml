concepts:
  - id: C-001
    title: Way-grounded answers with citations
    kind: mechanism
    statement: Relay answers questions about the Arcadia Way by retrieving the checked-in guidance, cites what it used, and says when the guidance does not answer. Only the operator asked for this; no other source addresses it.
    origins:
      - source: S001
        locator: The name and the first-time operator
    fit:
      status: partial
      evidence:
        - docs/agent-guidance/index.json
        - src/projects/agentGuidance.ts
        - docs/notes-to-self.md
        - START_HERE.md
    position: leaning
    serves:
      - REQ-001
    load_bearing: true
    verification:
      status: untested
    reason: The corpus and its index exist, but nothing answers questions from them for an operator.
  - id: C-002
    title: Graded question set for Way knowledge
    kind: mechanism
    statement: A checked-in set of first-time-operator questions, judged by a separate grader against the cited guidance, with a pass mark the operator sets, makes Way knowledge measurable instead of asserted.
    origins:
      - source: S001
        locator: The name and the first-time operator
      - &a1
        source: S005
        locator: whole file
    fit:
      status: partial
      evidence:
