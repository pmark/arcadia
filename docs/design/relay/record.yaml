    title: Project routing by lightweight prefix, explicit over inferred
    kind: mechanism
    statement: A recognizable Project name at the start of a request is enough to route it; explicit routing beats inference, original wording is preserved, the reason for the destination is shown, and the system asks only when the answer would materially change routing, safety or committed records.
    origins:
      - *a117
    position: merged
    merged_into: C-003
  - id: C-607
    title: Translate vague contributions into the smallest useful structure
    kind: mechanism
    statement: Anything loosely shaped like project progress is accepted and mapped to the smallest useful structure (Outcome, Milestone, Actions, Decision, plan amendment, Artifact, clarification question, deferral with a reactivation trigger, or authorized execution), which the operator may correct before it becomes durable truth.
    origins:
      - *a118
    position: merged
    merged_into: C-003
  - id: C-608
    title: Agent Ask convention for coding agents without extra authority
    kind: interface
    statement: Coding agents submit a conventional Agent Ask (desired result, likely Project and intent kind, acceptance evidence, dependencies) that is normalized into the same corrigible proposal an operator input would yield. The convention aids intent extraction only; agents cannot approve their own Decisions, claim operator agreement, or turn attachment imperatives into execution authority.
    origins:
      - *a119
    position: merged
    merged_into: C-003
  - id: C-609
    title: Single operator-owned execution order as projection
    kind: mechanism
    statement: All approved Actions sit in one operator-owned portfolio execution order that is a projection over canonical Actions, not a separate task store. Blocked and waiting Actions keep their position and show why they are ineligible, and the operator can reorder directly with a reversible receipt.
    origins:
      - *a120
    position: merged
    merged_into: C-016
  - id: C-610
    title: Always-know-next-action semantics
    kind: requirement
    statement: The system must name the first eligible Action in the explicit order and explain each higher skipped item, or name the single concrete condition preventing selection. It must never invent work to fill an empty queue or let a model-derived score silently set priority.
    origins:
      - source: S006
        locator: Accepted work has one explicit order
    position: merged
    merged_into: C-016
  - id: C-611
    title: Eight-step authority loop
    kind: mechanism
    statement: Ask processing follows an ordered loop - preserve original intent, interpret with deterministic evidence and cheapest sufficient intelligence, show interpretation and risks in a corrigible session, ask only materially relevant questions, present the exact commit or execution boundary, act only within understood granted authority, produce and validate Artifacts, then trace results and report what is next, deferred, refused or blocked.
    origins:
      - *a121
    position: merged
    merged_into: C-003
  - id: C-612
    title: Operator-answerable transparency questions
    kind: requirement
    statement: At every point the operator must be able to learn what was heard, why a Project, structure, processor or model was chosen, what is happening now, what will be created, changed, deferred, skipped or refused, what authority is required and its consequence, what evidence proves the result, and what the next Action is.
    origins:
      - source: S006
        locator: The authority contract
    position: merged
    merged_into: C-003
  - id: C-613
    title: Spare model capacity as scheduling signal only
    kind: constraint
    statement: Otherwise-expiring included model allowance may signal when to schedule safe Back Burner work, but the system must distinguish included allowance, banked resets, purchased credits and API spend, never treat unknown capacity as free, and never let an opportunity grant execution or spending authority.
    origins:
      - source: S006
        locator: Spare capacity as a planning resource
    position: rejected
    reason: Scheduling spare capacity does not serve any Relay requirement.
  - id: C-700
    title: Prove Go delivery from a real coding-agent caller first
    kind: requirement
    statement: REQ-001. Before building a conversation, retain live evidence of one real end-to-end `arcadia go` delivery invoked inside an actual coding-agent session (caller directory, provider/model/effort, selected versus assigned work, claim/candidate/Session identities, whether continuation resumes or starts a Session). Dashboard-only calls, host-terminal substitutes, stub agents and manual assembly do not count.
    origins:
      - *a122
    position: merged
    merged_into: C-029
  - id: C-701
    title: Reuse existing proof on the cheapest eligible disposable task
    kind: constraint
    statement: The live proof uses one eligible isolated disposable task with a trivial change and the least costly suitable agent. Existing claims and prior probe records are checked first and a qualifying proof is reused with provenance; missing setup or authority stops with an exact refusal and no inferred workspace, pointer move, attempt reset or duplicate owner.
    origins:
      - *a123
    position: merged
    merged_into: C-029
  - id: C-702
    title: Delivery counts only with a full, layered evidence chain
    kind: mechanism
    statement: REQ-009. Delivery is complete only when the same Go flow yields change, validation, commit, accessible draft PR, independent current-head review and required-check results, with operator interventions recorded. The delivery Artifact keeps source revision/checks, installed revision/adoption receipt and live request/Session/PR receipts as separate layers; missing, failed or unknown stages stay explicit, and agent exit or source tests alone never count.
    origins:
      - *a124
    position: merged
    merged_into: C-011
  - id: C-703
    title: Read-only What-is-next orientation in a Project conversation
    kind: mechanism
    statement: REQ-002. A Project-scoped conversation accepts "What is next" and shows Go's current Action or exact gate, observation time and selected versus assigned work when they differ, using the existing resolver with zero pointer, queue, claim or Session mutations. Fixtures cover ready, gated, empty, missing, stale and assigned-B-versus-selected-A cases.
    origins:
      - *a125
    position: merged
    merged_into: C-016
  - id: C-704
    title: Project-isolated persistent conversation history
    kind: requirement
    statement: REQ-003. User messages and canonical record references survive reload under the correct Project, using an existing persistence capability or a minimal addition after inspection. Switching Projects never exposes or submits against the previous Project, and Action status and approval truth stay in their canonical stores.
    origins:
      - source: S007
        locator: action implement-project-go-conversation, criterion 2
    position: rejected
    reason: S005 accepted one conversation record; each message keeps its scope instead of isolating history per Project.
  - id: C-705
    title: Accessible composer with numbered text options
    kind: requirement
    statement: The composer acknowledges each received request and renders questions as numbered text options with stated consequences, optionally with buttons. Desktop and narrow/mobile keyboard and screen-reader checks must show the current response reachable without hidden native pickers or forced scroll away from history being read.
    origins:
      - *a126
    position: merged
    merged_into: C-009
  - id: C-706
    title: Bounded interpretation, no model for routine status
    kind: constraint
    statement: Unsupported or ambiguous input shows its interpretation limit and one clarification and neither executes nor silently amends scope. Routine orientation and status invoke zero models; free-text interpretation reuses the configured bounded route and cannot authorize effects.
    origins:
      - *a127
    position: merged
    merged_into: C-016
  - id: C-707
    title: Go and Continue only through protected preview and browser confirmation
    kind: mechanism
    statement: REQ-004. Go or Continue fetches a fresh existing protected preview (target, owner, provider/model/effort, limits, stable request identity, consequences), and only the existing explicit browser confirmation may commit; a first message, generic yes, copied approval prose or model-generated confirmation launches nothing.
    origins:
      - *a128
    position: merged
    merged_into: C-014
  - id: C-708
    title: Adapter binds to existing resolver and gates, no new launch policy
    kind: constraint
    statement: The adapter binds Project, Plan, Action, resolution identity and preview fingerprint without a second resolver or launch policy. Changed facts, expired authority and non-dispatchable states return the existing refusal with a fresh-read path before effects; browser-origin and provider/custody/production gates stay enforced.
    origins:
      - *a129
    position: merged
    merged_into: C-014
  - id: C-709
    title: Truthful launch outcome states
    kind: requirement
    statement: REQ-005. Confirmation displays launched, reused, refused or unknown per the protected response; "started" appears only with a durable Session receipt and a working inspection link. Preview, confirmation and result remain visible and operable on desktop, mobile and with accessibility tools.
    origins:
      - *a130
    position: merged
    merged_into: C-011
  - id: C-710
    title: Session progress projected only from canonical receipts
    kind: mechanism
    statement: REQ-006. Status and re-entry read the bound Session without interrupting it and show recorded stages (preparation, running, agent exit, validation, accepted completion, PR created, review readiness). Only canonical receipts yield claims, so stale host evidence or agent exit alone never reads as working or delivered; updates are deterministic, deduplicated, time-stamped and add no model watcher, notification or separate Action-state authority.
    origins:
      - *a131
    position: merged
    merged_into: C-011
  - id: C-711
    title: Scope-change and stop requests cannot act silently
    kind: risk
    statement: Questions stay usable while work runs, but scope-change and stop requests must not silently amend the assignment or claim a stop without a supported receipt. The conversation points to the governed route or states the missing capability.
    origins:
      - *a132
    position: merged
    merged_into: C-014
  - id: C-712
    title: Idempotent request identity across duplicates and reconnects
    kind: mechanism
    statement: REQ-007. Duplicate and concurrent messages, repeated confirmation and reload/reconnect for one bound launch request yield at most one claim, candidate and Session through the existing protected identity. Unverifiable reuse refuses rather than minting a new identity, changed input under an existing identity is rejected, and two-tab/two-Project tests show no cross-target leakage.
    origins:
      - *a133
    position: merged
    merged_into: C-012
  - id: C-713
    title: Unknown outcome on lost launch response, reconcile before retry
    kind: mechanism
    statement: A timeout or lost launch response renders "outcome unknown", preserves the original identity and reconciles durable evidence before offering another start. Fixtures cover succeeded-before-response-lost, in-progress, actual refusal and unavailable reconciliation; reconnect restores bindings, keeps prior receipts and labels stale observations.
    origins:
      - *a134
    position: merged
    merged_into: C-011
  - id: C-714
    title: Live conversation-to-PR proof, operator docs and no-escalation boundary
    kind: requirement
    statement: REQ-008, REQ-010. After separately receipted adoption, one operator-assisted conversation flow reaches a real Session, validated change and draft PR, with START_HERE.md and an executable QA checklist (success, changed preview, refusal, reconnect; desktop/mobile, keyboard/screen-reader). No automatic next Action, scope amendment, authority change, merge or Production activation; external messaging, direct text approvals, multi-Action continuation and new stop controls stay deferred.
    origins:
      - *a135
    position: merged
    merged_into: C-029
choices:
  - id: CH-01
    question: One conversation record, or one per Project?
    options:
      - concept: C-004
        consequence: One conversation follows the operator everywhere, and each message keeps its scope.
      - concept: C-704
        consequence: History is isolated per Project, and the operator has a conversation per Project.
    chosen: C-004
    decided_by: operator
    decision_ref: S005
  - id: CH-02
    question: What gets built first?
    options:
      - concept: C-028
        consequence: A first-timer can get cited answers soon through Relay mode, at low cost and with a measured result. There is no synced thread yet, so it stays in a coding-agent chat.
      - concept: C-027
        consequence: The familiar messaging experience comes first. Answers stay receipts and status until later, so a first-timer still can't learn the Way from it.
      - concept: C-029
        consequence: One real delivery from a conversation comes first, reusing a draft Plan. Least help to a first-timer, and it depends on a Go flow that isn't proved yet.
  - id: CH-03
    question: What is Relay made of?
    options:
      - concept: C-030
        consequence: No new runtime, and the same contract becomes the default shell. Each turn costs a coding-agent session, and restricting its tools has to be proved on all three hosts.
      - concept: C-031
        consequence: Tighter control and cheaper turns, but a second runner to maintain, which conflicts with the standard-harness rule and doesn't lead to the default shell.
scrutiny: []
riskiest_assumption:
  statement: The checked-in guidance is enough for an agent to answer a first-time operator correctly and practically. It may be too large, stale or written for agents.
  test: Write about 30 first-timer questions, have Relay mode answer them from the guidance alone, and have a separate judge grade the answers against the cited text. Failures show whether the gap is in retrieval or in the guidance.
  status: untested
