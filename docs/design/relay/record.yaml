      evidence: docs/design/relay/probes/way-knowledge-1.md
    reason: R1-F4 predicted this and the measurement agrees. Answers stay near 1.7 KB, and 17 of 17 off-topic queries find no match, but 9 of 20 matched results are wrong, so this doesn't deliver REQ-001's honest limit.
  - id: C-037
    title: Way passages with stable addresses
    kind: constraint
    statement: Each discrete rule or procedure in the guidance gets a stable address, one trigger line and a short body that stands alone, with a generated index that is never a second source of truth. An operator's map for first-timers and an agent's map for procedures are views of the same index.
    origins:
      - *a2
    fit:
      status: partial
      evidence:
        - docs/agent-guidance/index.json
        - START_HERE.md
    position: leaning
    serves:
      - REQ-011
      - REQ-001
    reason: "R1-F7: a short standing-alone body that rewrites guidance would be a second truth, and passages must keep their exceptions. Should wait, per R1's verdict."
  - id: C-038
    title: Latency budgets by layer, and an immediate acknowledgment
    kind: requirement
    statement: Each layer has a measured time budget, and the operator sees an acknowledgment at once while slower work continues. Latency is reported per route, so the slow path is visible.
    origins:
      - *a2
    fit:
      status: missing
      evidence:
        - apps/dashboard/components/workspace/workspace-ask.tsx
    position: leaning
    serves:
      - REQ-010
      - REQ-004
    reason: Speed can't be held without being measured, and no numbers exist yet.
  - id: C-100
    title: Attention cost as the master criterion
    kind: requirement
    statement: Every message, setting, panel element or paragraph of documentation is treated as spending a human's attention and must return more value than it costs, or be removed.
    origins:
      - *a3
    position: merged
    merged_into: C-010
  - id: C-101
    title: Act only on a request or a written rule
    kind: requirement
    statement: The agent starts work only when an allowed person addresses it directly (or speaks in a conversation the team opened to requests), or when a rule the team wrote permits unrequested work. Unrequested work begins in a record-only mode.
    origins:
      - *a4
    position: merged
    merged_into: C-013
  - id: C-102
    title: Speak only when a person must act or can use a result
    kind: requirement
    statement: Confirm a request once with a concrete statement of intent, stay silent while working, then write again only for a ready result, a needed decision or an inability to finish. Messages are short, go back to the originating conversation, and ask one structured question at a time.
    origins:
      - *a5
      - *a6
    position: merged
    merged_into: C-010
  - id: C-103
    title: Stop by impact, not effort; report honestly
    kind: requirement
    statement: Local changes proceed to a reviewable result, while changes needing a design decision halt with a question. Drafts are labelled unfinished, failures are reported as failures, and limits are never circumvented to avoid asking.
    origins:
      - *a7
      - *a8
    position: merged
    merged_into: C-011
  - id: C-104
    title: Few concepts, few settings, behaviour as prompt text
    kind: constraint
    statement: New business needs become an attribute of an existing domain concept or prompt text rather than a new concept. A default replaces a setting whenever one value fits nearly all teams, and team-described behaviour is prose, not configuration.
    origins:
      - *a9
    position: merged
    merged_into: C-010
  - id: C-105
    title: Operator responsibility ramp
    kind: requirement
    statement: Operators begin with a short allowed list and proactive work that is only recorded, widen both after reviewing what the agent would have done, answer noise by shortening prompts or pausing rather than adding explanations, avoid volume work, and own what is posted under their identity.
    origins:
      - *a10
    position: merged
    merged_into: C-019
  - id: C-106
    title: Trigger to Eval to Ticket pipeline with immutable events
    kind: mechanism
    statement: Sources emit immutable Triggers grouped into Threads; a batch of Triggers is judged by an Eval that either creates a Ticket carrying a Mandate or records a non-acceptance. Accepting the same Trigger twice yields one Ticket, giving audit and idempotence.
    origins:
      - *a11
    position: merged
    merged_into: C-012
  - id: C-107
    title: Source owns read position, self-filtering and address translation
    kind: mechanism
    statement: Each event stream persists its own read position so restarts do not replay, discards its own bot's messages and out-of-scope events before they enter the domain, and translates events into Threads and reply addresses.
    origins:
      - *a12
    position: merged
    merged_into: C-018
  - id: C-108
    title: Serial, stateless Eval per Thread with merged arrivals
    kind: mechanism
    statement: At most one Eval runs on a Thread at once; Triggers arriving meanwhile merge into the next batch. Eval keeps no state of its own, sees the Thread snapshot, every Ticket on it including ended ones, and the current Policy, and returns a Decision.
    origins:
      - *a13
      - source: S002
        locator: docs/001-domain.md#concepts
    position: merged
    merged_into: C-019
  - id: C-109
    title: Two-layer Eval, deterministic gate then model assessment
    kind: mechanism
    statement: The first layer is a deterministic check of who may originate work and with what strength; only then does a model assess whether the work matches the enabled rules. Prompt text and message content cannot change the gate.
    origins:
      - *a14
      - *a15
    position: merged
    merged_into: C-013
  - id: C-110
    title: Mandate as immutable record of why work is permitted
    kind: mechanism
    statement: An accept creates a Mandate recording the policy version, scope, strength, matched rules, sender identity and how the event arrived. Widening scope needs a new Ticket; only accept, a person's stop and failed revalidation can change a Mandate's existence, not a Ticket merely ending.
    origins:
      - source: S002
        locator: docs/001-domain.md#concepts
      - source: S002
        locator: docs/002-authorization.md#resume-and-stop
    position: rejected
    reason: Agent Asks, Decisions and Grants already record why work is permitted, and more strictly.
  - id: C-111
    title: Explicit versus inferred strength
    kind: mechanism
    statement: "Requests carry one of two strengths: explicit (allowed person addressing the agent, or a follow-up on a Thread with work) or inferred (unaddressed, unlisted, or allowed-bot input). Inferred candidates need assessment and are gated by the accept mode; some inputs are not admitted at all."
    origins:
      - *a16
    position: merged
    merged_into: C-013
  - id: C-112
    title: Per-scope admission table
    kind: mechanism
    statement: Each source's receiving scopes carry a small table deciding whether a message from a listed or unlisted sender, addressed or not, becomes an explicit request, an inferred candidate or nothing. It is versioned with the policy, and defaults to ignoring unlisted senders.
    origins:
      - *a17
    position: merged
    merged_into: C-013
  - id: C-113
    title: Bots can propose but never request or stop
    kind: constraint
    statement: Only bots on a per-source list may yield inferred candidates, and only when addressing the agent or in a receive-everything scope. They can never issue explicit requests or stop work; automated reviewers using ordinary accounts are treated as people unless the team's prompt text says otherwise.
    origins:
      - *a18
    position: merged
    merged_into: C-013
  - id: C-114
    title: Off, observe and auto accept modes
    kind: mechanism
    statement: 'A three-position mode governs proactive work: off ignores all inferred input, observe assesses and records "would accept" without acting (the default), and auto accepts on a positive assessment. Explicit requests work in every mode, and a proactive accept needs at least one matching rule.'
    origins:
      - *a19
    position: merged
    merged_into: C-019
  - id: C-115
    title: Rules judged exhaustively; matched rules override process defaults
    kind: mechanism
    statement: An assessment evaluates every enabled rule exactly once, matching or not. Matched rules' names and instructions travel with the Ticket and override default process or communication behaviour for that Ticket only, while team-wide requirements stay in shared prompt sections.
    origins:
      - source: S002
        locator: docs/002-authorization.md#accept-mode-and-rules
    position: parked
    revival: Observe mode meets its pass mark and the operator wants rule-based action, through a Decision.
  - id: C-116
    title: Subscription fan-out bypasses the gate and grants nothing
    kind: mechanism
    statement: Every message on a Thread a Ticket subscribes to reaches that Ticket as context regardless of sender, with no new authority and no Eval. A person's message on the Ticket's own Thread is decided by the working agent, and may resume an ended Ticket under its old Mandate.
    origins:
      - *a20
      - *a21
    position: merged
    merged_into: C-017
  - id: C-117
    title: Executor-owned follow-ups with hand-back and release
    kind: mechanism
    statement: While a worker owns a human follow-up, the router cannot accept or reroute it and may only stop work. The worker either handles it within scope or hands it back once with a reason; unread messages are released to Eval when a Ticket ends. A message reaches fresh Eval only when no Ticket still owns it.
    origins:
      - source: S002
        locator: docs/002-authorization.md#handing-back-and-releasing-follow-ups
      - source: S002
        locator: docs/003-execution.md#follow-ups-and-context-threads
    position: parked
    revival: Follow-ups regularly reach the wrong work.
  - id: C-118
    title: Context-only subscriptions
    kind: mechanism
    statement: A worker can follow related Threads purely for information. Messages there carry no authority, give no ownership of follow-ups and cannot resume an ended Ticket; the router attaches a Thread to a Ticket only on an explicit reference, not topic similarity.
    origins:
      - *a22
      - *a23
    position: merged
    merged_into: C-017
  - id: C-119
    title: Policy changes notify live work instead of revoking it
    kind: mechanism
    statement: Rules, accept mode and per-source parts form a versioned Policy. A change discards running Evals, requeues their Triggers and sends a policy-changed notice to affected live Tickets, but does not cancel in-flight work; any revocation happens through revalidation when an ended Ticket would resume.
    origins:
      - source: S002
        locator: docs/002-authorization.md#policy-version
      - source: S002
        locator: docs/001-domain.md#rejected-concepts
    position: parked
    revival: More than one operator shares a workspace.
  - id: C-120
    title: Revalidation of a Mandate before resume
    kind: mechanism
    statement: Before an ended Ticket wakes, its Mandate is rechecked against current policy, sender membership, bot list, accept mode and enabled rules according to what the Mandate relied on. On failure the Ticket stays ended and its waiting messages go to fresh Eval.
    origins:
      - source: S002
        locator: docs/002-authorization.md#revalidation-before-resume
    position: parked
    revival: More than one operator shares a workspace, or work resumes automatically.
  - id: C-121
    title: Stop is a Decision, not an executor declaration
    kind: constraint
    statement: A person saying stop in a thread is just another event for Eval, and a worker may not assert that a person asked it to stop. A panel stop is a direct command. A person-stopped Ticket stays ended and receives nothing, and pauses hold across restarts and new sessions until a person lifts them.
    origins:
      - *a24
      - *a25
      - *a26
    position: merged
    merged_into: C-014
  - id: C-122
    title: Eval timeout and unavailable outcome
    kind: mechanism
    statement: The clock starts when a candidate reaches the router, and a timeout requeues the batch up to two times before recording an unavailable Decision. Failures and stale-policy decisions also record unavailable; only recent, unresolved ones surface to a person, who can re-evaluate or dismiss.
    origins:
      - *a27
    position: merged
    merged_into: C-019
  - id: C-123
    title: Mutually exclusive ticket stages computed from facts
    kind: mechanism
    statement: An open Ticket's stage is derived by an ordered first-match table over what it waits for (undelivered input, a question, review, blocked or failed, queued, idle, working), with person-facing labels. Stage is computed from stored reports and inputs, so it survives restarts and never contradicts other state.
    origins:
      - *a28
      - *a29
    position: merged
    merged_into: C-011
  - id: C-124
    title: Structured reports and structured questions
    kind: interface
    statement: Workers report through a closed set of states (progress, waiting, ready, blocked, failed, dropped) and ask people through a dedicated field holding one concrete question that the router forwards unchanged. Waiting on a person is never inferred from free text.
    origins:
      - *a30
      - *a31
      - *a32
    position: merged
    merged_into: C-009
  - id: C-125
    title: Ticket state independent of executor session state
    kind: mechanism
    statement: A Ticket owns its own lifecycle and may have several Assignments over time, each pending, running or ended on its own, so handoff, retry, resumption and multiple executors do not corrupt Ticket status.
    origins:
      - *a33
      - *a34
    position: merged
    merged_into: C-012
  - id: C-126
    title: Worker slots, reserved human slot, and background-work limits
    kind: mechanism
    statement: A Ticket occupies a concurrency slot while launching or in an active turn, with one extra slot reserved so a person's message can always continue existing work. Background jobs get a bounded window after a turn, then are killed with a report; handoff to a person frees the slot.
    origins:
      - source: S002
        locator: docs/003-execution.md#concurrency
    position: parked
    revival: Relay's turns are delayed by coding-agent work in real use.
  - id: C-127
    title: Per-Ticket directory with prepare command
    kind: mechanism
    statement: Each Ticket gets its own working directory, created once by a configurable prepare command run under a time limit (typically a git worktree). A failed preparation fails the Ticket and is retried on later activity, and a pull request is associated with a Ticket by matching its branch name.
    origins:
      - source: S002
        locator: docs/003-execution.md#preparing-a-ticket-directory
    position: rejected
    reason: Arcadia's candidate worktrees already provide this.
  - id: C-128
    title: Executor isolation is defaults, not a security boundary
    kind: risk
    statement: Workers run commands without approval as the operator's OS user, and wrappers plus blocked-command lists only cover invocations by name. The source states a worker can still run a program by absolute path, so no sandbox is claimed.
    origins:
      - *a35
    position: merged
    merged_into: C-014
  - id: C-129
    title: Merge policy lives in prompt text, not host logic
    kind: mechanism
    statement: Auto-merge conditions (own PR, approvals covering the head commit, small diff size, no merge as the agent's own account, withdrawal before a new push) are instructions to the agent. Enforcement of approvals is deferred to branch protection on the host platform.
    origins:
      - source: S002
        locator: docs/003-execution.md#merging
      - source: S002
        locator: docs/004-prompts.md#what-a-team-writes
    position: rejected
    reason: Arcadia enforces merge under Decisions 0060 and 0080 rather than leaving it to prompt text.
  - id: C-130
    title: Ticket completion by pull-request outcome
    kind: mechanism
    statement: A Ticket with pull requests is finished when none it opened remain open, and ends with the last close outcome while keeping its subscriptions so later comments can resume it. A close is held back while resumed or recovered work is unfinished.
    origins:
      - source: S002
        locator: docs/003-execution.md#pull-requests
    position: rejected
    reason: Arcadia's pull-request and completion procedures already govern this.
  - id: C-131
    title: Stored work with ordered retries
    kind: mechanism
    statement: Relays, deliveries, launches and outgoing messages are persisted before they are attempted and retried with doubling backoff. Per-conversation message order is kept, a failure holds back later items of its kind, and only repeated failures surface as system problems.
    origins:
      - *a36
      - *a37
    position: merged
    merged_into: C-012
  - id: C-132
    title: Restart recovery with a recovery note and replay of unread input
    kind: mechanism
    statement: After a restart, interrupted assignments end and relaunch oldest-first with a note telling the worker to inspect its directory, history and the remote platform before repeating outside actions. A record of which messages the session took into history decides what counts as read and what is redelivered.
    origins:
      - *a38
    position: merged
    merged_into: C-012
  - id: C-133
    title: Failed or blocked hold, with transient-error retry and human release
    kind: mechanism
    statement: A failed or blocked Ticket stops receiving automatic input, with CI and bot messages recorded but not delivered, while the worker's tools stay usable by a person. Transient network or provider errors are retried a few times first, and a person's message or retry lifts the hold.
    origins:
      - source: S002
        locator: docs/003-execution.md#executor-blocked-or-failed
      - source: S002
        locator: docs/001-domain.md#rejected-concepts
    position: rejected
    reason: Arcadia's repair and blocker handling already covers this.
  - id: C-134
    title: Pause processing stops dispatch but keeps recording
    kind: mechanism
    statement: A global pause halts dispatch, new Evals, deliveries and replies while sources continue recording and running turns are not interrupted. In-progress Eval deadlines extend by the pause length, and waiting messages to ended Tickets resume them afterward if the Mandate still holds.
    origins:
      - *a39
    position: merged
    merged_into: C-019
  - id: C-135
    title: Router and worker role separation
    kind: mechanism
    statement: A main session only routes, forwarding the original event with routing facts in a short note, batching several decisions in one tool call with per-item refusal. It never waits or makes technical decisions. The worker reads the originals, judges scope and implements, with tools for asking people, UI or spawning sessions withheld.
    origins:
      - *a40
      - *a41
      - *a42
    position: merged
    merged_into: C-015
  - id: C-136
    title: Mechanical guard against router blocking
    kind: mechanism
    statement: Code, not just prompt text, refuses sleep, long shell timeouts and long job waits in the router session, because a blocked step delays incoming candidates. Presets carry short foreground-to-background limits.
    origins:
      - source: S002
        locator: docs/004-prompts.md#principles-of-the-built-in-text
      - *a43
    position: merged
    merged_into: C-015
  - id: C-137
    title: Prompt precedence with enforced facts on top
    kind: mechanism
    statement: Instructions are layered from host-enforced facts down through built-in text, matched-rule text, team sections and team skills, with outside message content last as data that never alters rules. Editing prompts cannot change gate, Mandate, tool checks or account wrappers.
    origins:
      - *a44
    position: merged
    merged_into: C-014
  - id: C-138
    title: Policy section last, regenerated each request
    kind: mechanism
    statement: The generated policy section (version, mode, enabled rules) is placed at the end of the system prompt and rebuilt on every model request, so a policy change leaves the preceding prompt text untouched.
    origins:
      - source: S002
        locator: docs/004-prompts.md#assembly-and-precedence
    position: rejected
    reason: Prompt assembly belongs to the standard harness, which runs unmodified.
  - id: C-139
    title: Three team prompt sections plus skills; everything overridable
    kind: interface
    statement: Teams customize behaviour through three prose sections (communication, ticket scope, delivery requirements) and loadable skills, and may override any built-in prompt part. Tool descriptions, notices and cards stay in code.
    origins:
      - source: S002
        locator: docs/004-prompts.md#what-a-team-writes
    position: rejected
    reason: Instruction files already serve this; no prompt-editing surface is needed.
  - id: C-140
    title: Versioned prompt configuration with default-drift detection
    kind: mechanism
    statement: Every prompt save is an immutable version naming its base revision, with conflicting saves refused. An override records the built-in text it was based on, so an upgrade that changes the default is flagged and shown beside the team's text. Sessions pick up the newest version on each model request and record which revisions they used.
    origins:
      - source: S002
        locator: docs/004-prompts.md#built-in-parts-and-templates
      - source: S002
        locator: docs/004-prompts.md#versions
    position: rejected
    reason: Instruction files in Git already give versions and review.
  - id: C-141
    title: Review and delivery honesty rules
    kind: requirement
    statement: An open pull request is not readiness, drafts are marked unfinished, and a UI change needs a genuine before screenshot. Fixed review comments are resolved silently, declined ones get one sentence, automated reviewers are capped at three rounds, and the agent closes its own PR when a person's already covers the change.
    origins:
      - source: S002
        locator: docs/004-prompts.md#principles-of-the-built-in-text
    position: merged
    merged_into: C-011
  - id: C-142
    title: Bounded, resource-addressed read surface per role
    kind: interface
    statement: Sessions read state through one resource-style read tool with paged lists and character caps, normalizing source records into one compact message shape. Every id shown is readable, internal hashes are hidden, and a worker can read only its own Ticket and the material that reached it.
    origins:
      - *a45
    position: merged
    merged_into: C-007
  - id: C-143
    title: Panel design principles
    kind: requirement
    statement: The supervision panel orders content by three questions (need me now, is it healthy, what is the history), shows healthy states with no space, gives mutually exclusive checkable categories, makes every count equal the list it links to, and keeps one place per concept.
    origins:
      - *a46
      - *a47
    position: merged
    merged_into: C-010
  - id: C-144
    title: Rejected, no person or cross-source identity entity
    kind: constraint
    statement: The domain deliberately has no person or membership concept and no mapping of identities across sources. An actor is event metadata, allowed lists are per-source policy, and the link between one human's accounts is prompt text.
    origins:
      - *a48
      - *a49
    position: merged
    merged_into: C-013
  - id: C-145
    title: Rejected, Eval scheduling its own delayed work
    kind: constraint
    statement: Eval never waits or schedules follow-up checks; a condition that needs time is modelled as a Source that waits and emits an event, keeping Eval free of any dependency on Sources and removing waiting or revoked Eval states.
    origins:
      - *a50
      - *a51
    position: merged
    merged_into: C-018
  - id: C-146
    title: Rejected, one live Ticket per Thread
    kind: constraint
    statement: A Thread may carry several independent Tickets, with duplicate avoidance left to the assessment's view of existing Tickets rather than a structural limit. Likewise appending to a Ticket is subscription fan-out, not a Decision.
    origins:
      - *a52
    position: merged
    merged_into: C-017
  - id: C-147
    title: Unsolved, trust of event fields
    kind: risk
    statement: The source admits it has not settled which event fields are trusted (such as the source-reported actor and thread membership) versus untrusted (body text and quotes), leaving the gate's input trust boundary open.
    origins:
      - *a53
    position: merged
    merged_into: C-013
  - id: C-148
    title: Unsolved, deployment isolation and pinning
    kind: risk
    statement: How to give the agent its own pinned host-runtime installation, so upgrading that runtime elsewhere cannot break it, is recorded as an open question.
    origins:
      - source: S002
        locator: docs/007-architecture.md#open-questions
    position: rejected
    reason: The standard harness rule and the guarded broker install cover this.
  - id: C-300
    title: Operator thread first, silent observer second
    kind: claim
    statement: Build one continuous operator thread before anything else, then extend it to watch group channels as a silent observer that reports only to the operator.
    origins:
      - *a54
    position: merged
    merged_into: C-027
  - id: C-301
    title: No group speech without a separate Decision
    kind: constraint
    statement: The system may speak in a group channel only after a separate Decision permits it; the existing Decision 0084 covers only pings to the operator.
    origins:
      - *a55
      - *a56
    position: merged
    merged_into: C-021
  - id: C-302
    title: Two layers, one thread over many channels
    kind: claim
    statement: Separate the operator's experience (a single continuous thread with sessions hidden) from event intake (many source conversations filtered down to authorized work), so one thread fronts many channels.
    origins:
      - *a57
    position: merged
    merged_into: C-004
  - id: C-303
    title: Source and Trigger normalization
    kind: mechanism
    statement: Each channel event (Web/PWA, Discord DM or group) is normalized into one immutable, deduplicated record before anything else happens.
    origins:
      - *a58
      - *a59
    position: merged
    merged_into: C-012
  - id: C-304
    title: Deterministic gate before any model
    kind: mechanism
    statement: Code, with no model, checks who sent a message and whether it addressed the agent; a model judges only what passes the gate.
    origins:
      - *a60
      - *a61
    position: merged
    merged_into: C-013
  - id: C-305
    title: Allowlist fails closed
    kind: requirement
    statement: An empty sender allowlist must admit no one, replacing the current behaviour where the bot accepts any member of the configured channel.
    origins:
      - *a62
      - *a63
    position: merged
    merged_into: C-013
  - id: C-306
    title: Mandate record for allowed work
    kind: mechanism
    statement: Work records why it is allowed and how far it may go; the plan treats Agent Asks, Decisions and Grants as already stronger than this mechanism.
    origins:
      - source: S003
        locator: The concept in the abstract
    position: rejected
    reason: Agent Asks, Decisions and Grants already record why work is permitted, and more strictly.
  - id: C-307
    title: Subscription of follow-ups to linked work
    kind: mechanism
    statement: Later messages reach existing work without mentioning the agent again, but attach only by explicit reference such as replying to a card, receipt, Decision or Artifact, never by topic similarity.
    origins:
      - *a64
      - *a65
      - *a66
    position: merged
    merged_into: C-017
  - id: C-308
    title: Observe mode records without acting
    kind: mechanism
    statement: An unaddressed message becomes an observe record noting what would have been accepted, with no action taken; per-channel policy is off or observe.
    origins:
      - *a67
      - *a68
      - *a69
    position: merged
    merged_into: C-019
  - id: C-309
    title: Attention rule for speaking
    kind: requirement
    statement: The system speaks to the operator only when someone must act or can use a result, rather than narrating activity.
    origins:
      - *a70
    position: merged
    merged_into: C-010
  - id: C-310
    title: Append-only conversation record as evidence, not authority
    kind: mechanism
    statement: One new append-only conversation table holds only new facts and is evidence rather than authority; old replies stay as written while current status is displayed separately.
    origins:
      - *a71
    position: merged
    merged_into: C-005
  - id: C-311
    title: Outbox delivering to one thread with cards
    kind: interface
    statement: An outbox delivers all output to a single thread, using cards (Decision, Artifact, Continue, candidate Capture or Dismiss) built on existing controls, and feed items appear as messages.
    origins:
      - *a72
      - *a73
      - *a74
    position: merged
    merged_into: C-009
  - id: C-312
    title: Routing by message type
    kind: mechanism
    statement: After the gate, a Decision answer takes the existing path, an explicit-reference follow-up reaches the linked work, a message from an allowed person addressing the agent reaches the thread agent, and anything else is observe-only.
    origins:
      - source: S003
        locator: Architecture proposed
    position: merged
    merged_into: C-013
  - id: C-313
    title: Thread agent limited to read and propose
    kind: constraint
    statement: The thread agent may only read and propose; its sole write tools are arcadia ask, agent-ask preview and arcadia learn.
    origins:
      - *a75
    position: merged
    merged_into: C-014
  - id: C-314
    title: Cheapest-answer-first escalation
    kind: mechanism
    statement: Answer with code first, then a local model through LiteLLM with citations, then a bounded read-only coding agent; code-answered status questions are part of the first phase.
    origins:
      - *a76
      - *a77
    position: merged
    merged_into: C-016
  - id: C-315
    title: Observed group messages go only to the local model
    kind: constraint
    statement: Messages merely observed in group channels are assessed only by the local model, in batches, with a read position that survives restarts.
    origins:
      - source: S003
        locator: Architecture proposed
      - source: S003
        locator: Phases proposed
    position: merged
    merged_into: C-019
  - id: C-316
    title: Operator-sent draft replies
    kind: mechanism
    statement: For observed group messages the system proposes a draft reply for the operator to send, rather than sending it, until a Decision permits participation.
    origins:
      - *a78
    position: merged
    merged_into: C-020
  - id: C-317
    title: Phased delivery sequence
    kind: claim
    statement: "Deliver in four phases: the Thread, Follow the work (Discord DM joins the thread), Silent observer, then Participant (short read-only replies when addressed and rule-based automatic capture, Decision required)."
    origins:
      - *a79
    position: merged
    merged_into: C-027
  - id: C-318
    title: Five named gaps in current Arcadia
    kind: claim
    statement: Arcadia today lacks a server-side conversation, returns receipts not answers, keeps proactive updates in a feed rather than a conversation, does not route follow-ups to work beyond receipt and Decision replies, and has no safe way to observe a channel.
    origins:
      - *a80
    position: merged
    merged_into: C-027
  - id: C-319
    title: Client message storage needs retention and consent Decision
    kind: constraint
    statement: Persisting client messages requires a Decision on retention and consent before it happens.
    origins:
      - *a81
    position: merged
    merged_into: C-022
  - id: C-320
    title: Deferred executor ownership and hand-back
    kind: claim
    statement: Left out until follow-ups regularly reach the wrong work, at which point executor ownership and hand-back is revived.
    origins:
      - source: S003
        locator: Left out, with revival conditions
    position: parked
    revival: Follow-ups regularly reach the wrong work.
  - id: C-321
    title: No automatic resume on a person's message
    kind: constraint
    statement: Left out because resuming work automatically on a message conflicts with the gate-per-Action model.
    origins:
      - source: S003
        locator: Left out, with revival conditions
    position: parked
    revival: A Decision changes the gate-per-Action model.
  - id: C-322
    title: Deferred policy versioning and fan-out
    kind: claim
    statement: Left out until more than one operator shares a workspace.
    origins:
      - source: S003
        locator: Left out, with revival conditions
    position: parked
    revival: More than one operator shares a workspace.
  - id: C-323
    title: No prompt-editing UI
    kind: claim
    statement: Left out because instruction files already serve that purpose.
    origins:
      - source: S003
        locator: Left out, with revival conditions
    position: rejected
    reason: Instruction files already serve this; no prompt-editing surface is needed.
  - id: C-324
    title: Unapproved worker commands never allowed
    kind: constraint
    statement: Worker commands without approval are excluded permanently, with no revival condition.
    origins:
      - *a82
    position: merged
    merged_into: C-014
  - id: C-325
    title: Slack, Feishu and iMessage deferred
    kind: claim
    statement: Additional channel connectors are left out until the first real client needs each.
    origins:
      - source: S003
        locator: Left out, with revival conditions
    position: parked
    revival: The first real client needs a channel other than Discord.
  - id: C-326
    title: Overlap with existing draft Plans and active milestone
    kind: risk
    statement: Two draft Plans (persistent Go conversation and Ask superpower) overlap this work, and unattended production remains the active milestone it competes with.
    origins:
      - *a83
    position: merged
    merged_into: C-027
  - id: C-400
    title: Conversation as the primary surface
    kind: requirement
    statement: "Operator direction: the main interaction is familiar messaging, with text, voice, images and attachments in one thread. Designer prose adds that the composer is immediately available."
    origins:
      - *a84
    position: merged
    merged_into: C-004
  - id: C-401
    title: Contextual views appear inside or beside the conversation
    kind: mechanism
    statement: Operator requested that relevant dashboard views, menus and protocols come into the conversation; the designer proposes review cards, consequence menus, progress/evidence views and creation previews, revealing only the controls needed and reusing dashboard capabilities contextually rather than reproducing the whole dashboard.
    origins:
      - *a85
    position: merged
    merged_into: C-009
  - id: C-402
    title: Open views keep dialogue readable and reflect the current record
    kind: requirement
    statement: "Designer proposal: the dialogue stays readable while a contextual view is open, work is preserved when the view is dismissed, and a reopened view shows the current underlying record rather than a stale copy."
    origins:
      - source: S004
        locator: The foreground is a conversation
    position: merged
    merged_into: C-009
  - id: C-403
    title: Navigation establishes conversational scope
    kind: mechanism
    statement: "Operator's central idea: context loads because the person navigates to it. Designer proposal: deliberate selection sets scope while free camera movement stays exploratory; this distinction needs prototype validation."
    origins:
      - *a86
    position: merged
    merged_into: C-006
  - id: C-404
    title: Visible, inspectable scope path
    kind: interface
    statement: "Designer proposal: a compact readable scope path that the person can inspect and change, so a reference like 'add a step before this one' resolves to the selected Action and 'what should happen next' uses the Project's records."
    origins:
      - source: S004
        locator: Navigation establishes conversational scope
      - *a87
    position: merged
    merged_into: C-006
  - id: C-405
    title: Scope changes preserve the conversation and clarify ambiguity
    kind: requirement
    statement: "Designer proposal: changing scope keeps the conversation and makes the new reference clear; a request ambiguously spanning Projects gets a concise clarification before any work is affected."
    origins:
      - source: S004
        locator: Navigation establishes conversational scope
    position: merged
    merged_into: C-006
  - id: C-406
    title: Bounded context loading
    kind: constraint
    statement: "Designer proposal: loading context means selecting relevant records within a bounded context budget, never putting the whole portfolio, or all old history, into every model request."
    origins:
      - *a88
      - *a89
    position: merged
    merged_into: C-007
  - id: C-407
    title: Minimize threads; navigate the work structure
    kind: requirement
    statement: "Operator-endorsed principle: minimize conversation threads and keep history immediately accessible; primary navigation follows Project, Plan, Action and their relationships, with conversation as a continuous surface and internal model sessions not exposed as the user's organizing system."
    origins:
      - *a90
    position: merged
    merged_into: C-004
  - id: C-408
    title: Per-entity History control with search and broadening
    kind: interface
    statement: "Designer proposal (not implemented): a compact History control beside the scope path shows earlier exchanges for the selected entity, with search that starts in that entity and widens deliberately to parent or portfolio; results show date, source scope and context, and open the original exchange with a route back."
    origins:
      - *a91
      - *a92
    position: merged
    merged_into: C-008
  - id: C-409
    title: One exchange linked from many entities, no duplicates
    kind: mechanism
    statement: "Designer proposal: an exchange relating to several entities is referenced from each rather than copied, and each message keeps the scope in which it was sent even after the selection changes."
    origins:
      - source: S004
        locator: History belongs within reach of the work
      - *a93
    position: merged
    merged_into: C-005
  - id: C-410
    title: Past messages are evidence, not record state
    kind: constraint
    statement: "Designer proposal: conversation and recorded work state stay distinct; a past message shows what was said, not that the present record has that state, and an original reply is never rewritten as if it knew later results."
    origins:
      - *a94
      - *a95
    position: merged
    merged_into: C-005
  - id: C-411
    title: Continuation summary instead of forced transcript reading
    kind: mechanism
    statement: "Designer proposal: a lightweight continuation summary orients the person on entering an entity while original exchanges stay reachable, so nobody must read a long transcript, and history need not be injected into the active model context."
    origins:
      - source: S004
        locator: History belongs within reach of the work
    position: merged
    merged_into: C-007
  - id: C-412
    title: Draft, attachment and reading-position continuity across scope changes
    kind: requirement
    statement: "Designer proposal: a draft and its unsent attachments survive a scope change, keep their original scope explicit if retargeting would be ambiguous, and returning to an entity restores or offers to resume the prior reading position; historical artifact references name the version discussed where available."
    origins:
      - *a96
    position: merged
    merged_into: C-006
  - id: C-413
    title: Separate conversation is an exceptional choice
    kind: constraint
    statement: "Designer proposal: creating a distinct conversation is a deliberate exception with a use case still to be designed, never the default result of navigating."
    origins:
      - *a97
    position: merged
    merged_into: C-004
  - id: C-414
    title: Spatial hierarchy layer shows orientation and state honestly
    kind: mechanism
    statement: Operator requested a lightweight vector hierarchy suggesting depth (SVG preferred start); designer proposals include Action to Plan to Project to portfolio zoom, distinct treatments for containment, sequence and dependency, summaries at distance, non-colour selection cues, and proposal appearance that reflects recorded state only, never implying approval or execution.
    origins:
      - source: S004
        locator: The background carries orientation
      - source: S004
        locator: Design direction established in this session
    position: parked
    revival: The thread works and the operator wants spatial navigation next.
  - id: C-415
    title: Proposal-to-Action settling follows the real acceptance path
    kind: requirement
    statement: "Designer proposal: a proposal appears softly near the discussed work, becomes more definite on clarification, and settles into the hierarchy as an Action only through the actual proposal process; 'Accept Plan' must use that path and not silently approve execution or publication, and status labels must map to underlying record states."
    origins:
      - *a98
      - *a99
    position: merged
    merged_into: C-009
  - id: C-416
    title: Expanded branch versus selected scope must be distinguishable
    kind: risk
    statement: "Designer proposal flagged as an open risk: in the iPhone concept the browsing branch and the explicit conversation scope differ visibly and confusingly, so a clearer treatment or a single selection rule is needed and selecting an Action must make the resulting scope unmistakable."
    origins:
      - *a100
    position: merged
    merged_into: C-006
  - id: C-417
    title: Four-view MVP journey with fixture-first previews
    kind: mechanism
    statement: "Designer proposal, with the operator approving the four-view direction: Capture, Review, Work and Orient phases of one workspace (shared shell of wordmark, scope path, conversation, composer, sky), with proposal and artifact states initially fixtures and no promise of a universal editor, automatic publication or every dashboard view. The images are hypothetical concept art, not implemented features."
    origins:
      - *a101
      - *a102
    position: merged
    merged_into: C-027
  - id: C-418
    title: Cross-device portability goal
    kind: claim
    statement: "Operator ambition: the same navigate, select context, then converse model should translate to phone, VR, AR, XR and future interaction; this is a portability goal, not a compatibility claim or MVP commitment, and spatial media need their own equivalents rather than a floating phone layout."
    origins:
      - source: S004
        locator: Mobile navigation and continuity across devices
    position: parked
    revival: The first surface other than phone and desktop is planned.
  - id: C-419
    title: Composer offered as Ask must be the real Ask loop
    kind: requirement
    statement: "Operator non-negotiable requirement: if the bottom composer is presented as Arcadia Ask, it must use real Ask routines and results through the whole experience (submit, understand, open related work, continue in context); a notebook with staged replies is superseded and does not qualify, and decorative previews must stay clearly staged."
    origins:
      - *a103
      - *a104
    position: merged
    merged_into: C-011
  - id: C-420
    title: Honest request-state vocabulary and response contract
    kind: requirement
    statement: "Designer proposal: sending shows a pending receipt rather than a claim of work started; replies summarise the receipt with actual destination and state; captured, queued, running or awaiting review are stated only when supported; decisions point to the existing governed view and do not imply chat approved them; absence of Runs or Artifacts is said plainly."
    origins:
      - *a105
    position: merged
    merged_into: C-011
  - id: C-421
    title: Related work exposed as navigation destinations, not new chats
    kind: mechanism
    statement: "Designer proposal: every returned related item, Run, review or Decision and available Artifact gets a compact contextual link or card, Artifacts appear later through the same request and entity with version and producing-work route, and the trail is reopenable from entity history with original timestamps and scope."
    origins:
      - *a106
      - *a107
    position: merged
    merged_into: C-008
  - id: C-422
    title: Failure and ambiguous-delivery recovery
    kind: requirement
    statement: "Designer proposal: keep the text and request correlation on failure, distinguish failed submission from failure after capture, offer a recoverable next step, and verify retry and idempotency semantics before enabling automatic resend."
    origins:
      - source: S004
        locator: Response and navigation contract
    position: merged
    merged_into: C-011
  - id: C-423
    title: Replies render existing summaries, no extra model call
    kind: constraint
    statement: "Designer proposal: first implementation shows Ask's existing summary and state-derived follow-ups in a calm, concise voice (understood, what happened, where next) without another model call to narrate; richer synthesis is deferred until it proves valuable."
    origins:
      - *a108
    position: merged
    merged_into: C-016
  - id: C-424
    title: Safe scope-to-Ask routing and canonical state reads
    kind: constraint
    statement: "Designer proposal: navigation may claim to select Ask's destination only through a validated routing contract, and the record of what is routed must stay honest. The spec's note that Ask takes only text and requestId predates the optional projectId now on the route."
    origins:
      - *a109
    position: merged
    merged_into: C-006
  - id: C-425
    title: Verified status separates shipped scaffold from concept
    kind: claim
    statement: "Status record as of 2026-10-15: only the routing and React sky scaffold and an Ask API scenario suite are merged; Ask submission and conversation history are not yet supplied, deployed latency and worker execution are unproven, and the concept images are not shipped features."
    origins:
      - *a110
      - *a111
    position: merged
    merged_into: C-011
  - id: C-426
    title: Shared contract then parallel build, with forecast caveat
    kind: mechanism
    statement: "Designer proposal: agree the request/result contract first, build experience and Ask adapter in parallel with disjoint ownership and one integrating owner, accept only through the real submission path, and treat the one-to-two-day target as uncalibrated pending inspection of context field, trail coverage and refresh path."
    origins:
      - *a112
    position: merged
    merged_into: C-027
  - id: C-427
    title: Mission Control sky and identity material
    kind: constraint
    statement: Operator required reuse of Mission Control's animated sky verbatim, adapting only React lifecycle with the hierarchy as a separate SVG/DOM layer, readability over transparency, and a reduced-motion mode (designer proposal). Operator liked the lowercase wordmark, rejected the orbit symbol and prefers a simple friendly dot-and-curve mark; typeface and logo remain unresolved.
    origins:
      - source: S004
        locator: One sky and one workspace
      - source: S004
        locator: Identity
    position: parked
    revival: The thread works in the workspace; the sky already exists there.
  - id: C-600
    title: Intent interface with minimal ceremony
    kind: claim
    statement: The system is the operator's intent interface; the operator states what should become true in minimal ceremony and the system, not the operator, chooses and proposes the project-management structure (Outcome, Milestone, Action, Artifact, Decision, CLI sequence) that carries it.
    origins:
      - *a113
    position: merged
    merged_into: C-003
  - id: C-601
    title: Ask is not unconstrained autonomy
    kind: constraint
    statement: The promise is natural expression, understood implications and risks, and sufficient approval for the system to act through existing foundations; it is explicitly not a promise of unconstrained autonomous execution.
    origins:
      - *a114
    position: merged
    merged_into: C-014
  - id: C-602
    title: PM-only requests need no implementation ceremony
    kind: requirement
    statement: Planning and project-management requests must produce governed records without requiring the operator to create worktrees, branches or pull requests, and without implying implementation has begun. Where managed documents need a Git transition, the system owns the exact preview and governed persistence while the operator supplies only judgment and authority.
    origins:
      - source: S006
        locator: Product thesis
    position: merged
    merged_into: C-003
  - id: C-603
    title: Ingress as live, corrigible provenance session
    kind: mechanism
    statement: Each input in Ingress opens into a real-time working session exposing the immutable original input and provenance, state transitions, routing evidence, model choices, interpretation, proposed records, produced Artifacts, validation evidence, approval gates and side effects, with a trace from request to every resulting record and effect.
    origins:
      - *a115
    position: merged
    merged_into: C-003
  - id: C-604
    title: Least-costly sufficient intelligence
    kind: mechanism
    statement: The system decides what interpretation an input needs and uses deterministic processing first, then a local-preferred model, escalating to a stronger model only when it adds material value. Safe raw input first yields an explicit working representation (summary, intent, destination, candidate structures, ambiguity, confidence, risk, approval boundaries).
    origins:
      - *a116
    position: merged
    merged_into: C-016
  - id: C-605
    title: Model suggestions never replace original capture or facts
    kind: constraint
    statement: Model-derived suggestions must stay labelled as such and never supersede the original captured input or deterministic facts; the working representation exists to be inspected, corrected and approved.
    origins:
      - *a117
    position: merged
    merged_into: C-005
  - id: C-606
    title: Project routing by lightweight prefix, explicit over inferred
    kind: mechanism
    statement: A recognizable Project name at the start of a request is enough to route it; explicit routing beats inference, original wording is preserved, the reason for the destination is shown, and the system asks only when the answer would materially change routing, safety or committed records.
    origins:
      - *a118
    position: merged
    merged_into: C-003
  - id: C-607
    title: Translate vague contributions into the smallest useful structure
    kind: mechanism
    statement: Anything loosely shaped like project progress is accepted and mapped to the smallest useful structure (Outcome, Milestone, Actions, Decision, plan amendment, Artifact, clarification question, deferral with a reactivation trigger, or authorized execution), which the operator may correct before it becomes durable truth.
    origins:
      - *a119
    position: merged
    merged_into: C-003
  - id: C-608
    title: Agent Ask convention for coding agents without extra authority
    kind: interface
    statement: Coding agents submit a conventional Agent Ask (desired result, likely Project and intent kind, acceptance evidence, dependencies) that is normalized into the same corrigible proposal an operator input would yield. The convention aids intent extraction only; agents cannot approve their own Decisions, claim operator agreement, or turn attachment imperatives into execution authority.
    origins:
      - *a120
    position: merged
    merged_into: C-003
  - id: C-609
    title: Single operator-owned execution order as projection
    kind: mechanism
    statement: All approved Actions sit in one operator-owned portfolio execution order that is a projection over canonical Actions, not a separate task store. Blocked and waiting Actions keep their position and show why they are ineligible, and the operator can reorder directly with a reversible receipt.
    origins:
      - *a121
    position: merged
    merged_into: C-016
  - id: C-610
    title: Always-know-next-action semantics
    kind: requirement
    statement: The system must name the first eligible Action in the explicit order and explain each higher skipped item, or name the single concrete condition preventing selection. It must never invent work to fill an empty queue or let a model-derived score silently set priority.
    origins:
      - source: S006
        locator: Accepted work has one explicit order
    position: merged
    merged_into: C-016
  - id: C-611
    title: Eight-step authority loop
    kind: mechanism
    statement: Ask processing follows an ordered loop - preserve original intent, interpret with deterministic evidence and cheapest sufficient intelligence, show interpretation and risks in a corrigible session, ask only materially relevant questions, present the exact commit or execution boundary, act only within understood granted authority, produce and validate Artifacts, then trace results and report what is next, deferred, refused or blocked.
    origins:
      - *a122
    position: merged
    merged_into: C-003
  - id: C-612
    title: Operator-answerable transparency questions
    kind: requirement
    statement: At every point the operator must be able to learn what was heard, why a Project, structure, processor or model was chosen, what is happening now, what will be created, changed, deferred, skipped or refused, what authority is required and its consequence, what evidence proves the result, and what the next Action is.
    origins:
      - source: S006
        locator: The authority contract
    position: merged
    merged_into: C-003
  - id: C-613
    title: Spare model capacity as scheduling signal only
    kind: constraint
    statement: Otherwise-expiring included model allowance may signal when to schedule safe Back Burner work, but the system must distinguish included allowance, banked resets, purchased credits and API spend, never treat unknown capacity as free, and never let an opportunity grant execution or spending authority.
    origins:
      - source: S006
        locator: Spare capacity as a planning resource
    position: rejected
    reason: Scheduling spare capacity does not serve any Relay requirement.
  - id: C-700
    title: Prove Go delivery from a real coding-agent caller first
    kind: requirement
    statement: S007's REQ-001. Before building a conversation, retain live evidence of one real end-to-end `arcadia go` delivery invoked inside an actual coding-agent session (caller directory, provider/model/effort, selected versus assigned work, claim/candidate/Session identities, whether continuation resumes or starts a Session). Dashboard-only calls, host-terminal substitutes, stub agents and manual assembly do not count.
    origins:
      - *a123
    position: merged
    merged_into: C-029
  - id: C-701
    title: Reuse existing proof on the cheapest eligible disposable task
    kind: constraint
    statement: The live proof uses one eligible isolated disposable task with a trivial change and the least costly suitable agent. Existing claims and prior probe records are checked first and a qualifying proof is reused with provenance; missing setup or authority stops with an exact refusal and no inferred workspace, pointer move, attempt reset or duplicate owner.
    origins:
      - *a124
    position: merged
    merged_into: C-029
  - id: C-702
    title: Delivery counts only with a full, layered evidence chain
    kind: mechanism
    statement: S007's REQ-009. Delivery is complete only when the same Go flow yields change, validation, commit, accessible draft PR, independent current-head review and required-check results, with operator interventions recorded. The delivery Artifact keeps source revision/checks, installed revision/adoption receipt and live request/Session/PR receipts as separate layers; missing, failed or unknown stages stay explicit, and agent exit or source tests alone never count.
    origins:
      - *a125
    position: merged
    merged_into: C-011
  - id: C-703
    title: Read-only What-is-next orientation in a Project conversation
    kind: mechanism
    statement: S007's REQ-002. A Project-scoped conversation accepts "What is next" and shows Go's current Action or exact gate, observation time and selected versus assigned work when they differ, using the existing resolver with zero pointer, queue, claim or Session mutations. Fixtures cover ready, gated, empty, missing, stale and assigned-B-versus-selected-A cases.
    origins:
      - *a126
    position: merged
    merged_into: C-016
  - id: C-704
    title: Project-isolated persistent conversation history
    kind: requirement
    statement: S007's REQ-003. User messages and canonical record references survive reload under the correct Project, using an existing persistence capability or a minimal addition after inspection. Switching Projects never exposes or submits against the previous Project, and Action status and approval truth stay in their canonical stores.
    origins:
      - source: S007
        locator: action implement-project-go-conversation, criterion 2
    position: rejected
    reason: S012 kept one conversation record, with each message keeping its scope.
  - id: C-705
    title: Accessible composer with numbered text options
    kind: requirement
    statement: The composer acknowledges each received request and renders questions as numbered text options with stated consequences, optionally with buttons. Desktop and narrow/mobile keyboard and screen-reader checks must show the current response reachable without hidden native pickers or forced scroll away from history being read.
    origins:
      - *a127
    position: merged
    merged_into: C-009
  - id: C-706
    title: Bounded interpretation, no model for routine status
    kind: constraint
    statement: Unsupported or ambiguous input shows its interpretation limit and one clarification and neither executes nor silently amends scope. Routine orientation and status invoke zero models; free-text interpretation reuses the configured bounded route and cannot authorize effects.
    origins:
      - *a128
    position: merged
    merged_into: C-016
  - id: C-707
    title: Go and Continue only through protected preview and browser confirmation
    kind: mechanism
    statement: S007's REQ-004. Go or Continue fetches a fresh existing protected preview (target, owner, provider/model/effort, limits, stable request identity, consequences), and only the existing explicit browser confirmation may commit; a first message, generic yes, copied approval prose or model-generated confirmation launches nothing.
    origins:
      - *a129
    position: merged
    merged_into: C-014
  - id: C-708
    title: Adapter binds to existing resolver and gates, no new launch policy
    kind: constraint
    statement: The adapter binds Project, Plan, Action, resolution identity and preview fingerprint without a second resolver or launch policy. Changed facts, expired authority and non-dispatchable states return the existing refusal with a fresh-read path before effects; browser-origin and provider/custody/production gates stay enforced.
    origins:
      - *a130
    position: merged
    merged_into: C-014
  - id: C-709
    title: Truthful launch outcome states
    kind: requirement
    statement: S007's REQ-005. Confirmation displays launched, reused, refused or unknown per the protected response; "started" appears only with a durable Session receipt and a working inspection link. Preview, confirmation and result remain visible and operable on desktop, mobile and with accessibility tools.
    origins:
      - *a131
    position: merged
    merged_into: C-011
  - id: C-710
    title: Session progress projected only from canonical receipts
    kind: mechanism
    statement: S007's REQ-006. Status and re-entry read the bound Session without interrupting it and show recorded stages (preparation, running, agent exit, validation, accepted completion, PR created, review readiness). Only canonical receipts yield claims, so stale host evidence or agent exit alone never reads as working or delivered; updates are deterministic, deduplicated, time-stamped and add no model watcher, notification or separate Action-state authority.
    origins:
      - *a132
    position: merged
    merged_into: C-011
  - id: C-711
    title: Scope-change and stop requests cannot act silently
    kind: risk
    statement: Questions stay usable while work runs, but scope-change and stop requests must not silently amend the assignment or claim a stop without a supported receipt. The conversation points to the governed route or states the missing capability.
    origins:
