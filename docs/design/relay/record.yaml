choices:
  - id: CH-01
    question: One conversation record, or one per Project?
    options:
      - concept: C-004
        consequence: One conversation follows the operator everywhere, and each message keeps its scope.
      - concept: C-704
        consequence: History is isolated per Project, and the operator has a conversation per Project.
    chosen: C-004
    decided_by: operator
    decision_ref: S012
  - id: CH-02
    question: What gets built first? Every option competes for the same capacity as the active unattended-production milestone.
    options:
      - concept: C-028
        consequence: A first-timer can get cited answers soon through Relay mode, at low cost and with a measured result, if the probe holds; otherwise the guidance gets fixed first. It stays in a coding-agent chat, so there is no messaging experience or synced thread yet, and each session still needs a developer tool.
      - concept: C-027
        consequence: The messaging experience you asked for comes first, on a phone, with status answers and local-model answers with citations. Way knowledge stays unmeasured until a graded set exists, and it needs new server and interface work.
      - concept: C-029
        consequence: One real delivery from a conversation comes first, reusing a draft Plan. It shows building through conversation, helps a first-timer least, and depends on a Go flow that isn't proved yet. Its per-Project history would need amending to match CH-01.
    chosen: C-028
    decided_by: operator
    decision_ref: S012
  - id: CH-03
    question: What is Relay made of? R1-F2 found the session option conflicts with the Constitution's spending order, and S012's silence did not settle it.
    options:
      - concept: C-039
        consequence: Code answers first and a coding agent runs only for code, which fits the spending order and gives the interface a real caller. It can't serve as the default coding shell by itself, and answers need new work at the Ask surface.
      - concept: C-030
        consequence: No new runtime, and it works today as Relay mode. Every question costs a coding-agent turn, which conflicts with the spending order, a model reads every message first so routing can't be fast or enforced, and restricting its tools is unproved on all three hosts.
      - concept: C-031
        consequence: Tighter control and cheaper turns on a service that already runs. It's new conversational code, and doesn't by itself lead to the default shell.
    chosen: C-039
    decided_by: operator
    decision_ref: S022
  - id: CH-04
    question: Which decision engine does Relay start with?
    options:
      - concept: C-033
        consequence: No per-call cost and nothing new to run, and likely the fastest path, though unmeasured. It only handles what rules can decide, so more falls through to clarification or a slower model.
      - concept: C-034
        consequence: Local, with no per-call cost and data staying home. It's another model to run on every install, and its claims need testing on our own routing set.
      - concept: C-035
        consequence: Needs no local setup, and its capability claims are unverified here. Each call has a cost, small per token by S009's figure, and sends text to a provider, so it needs a Decision, and it can't see observed group messages.
    chosen: C-033
    decided_by: operator
    decision_ref: S012
  - id: CH-05
    question: May the operator's words move the view?
    options:
      - concept: C-063
        consequence: Fluid and honest, with Back. A wrong match moves the screen, though it never changes anything.
      - concept: C-064
        consequence: The most predictable. One more tap each time, and less like what the operator described.
      - concept: C-065
        consequence: The most fluid. The screen changes after a plain question, which breaks Downlink's rule.
    chosen: C-063
    decided_by: operator
    decision_ref: S029
  - id: CH-06
    question: How far does always available reach in the first build?
    options:
      - concept: C-071
        consequence: Smaller, and touches no production page. Relay is left behind on control pages, just when the operator may want to ask about what they see.
      - concept: C-072
        consequence: Truly everywhere sooner. More to test, and it touches production pages while production is the priority.
    chosen: C-071
    decided_by: operator
    decision_ref: S029
