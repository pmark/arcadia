schema: arcadia-design-record-v1
design: relay
project: arcadia
authors:
  - Claudia Atlas
frame:
  status: confirmed
  outcome: The operator goes from idea to planned project work that is autonomously produced by talking to Relay, using Arcadia Design, scaffolding, templates, continuous integration and Cloudflare deployments, with much of the conversation at zero cost and nothing exceeding the authority granted.
  milestone: The operator sends arbitrary text to Relay and gets an immediate conversation at zero cost, then turns an idea into an approved, planned Project that unattended production builds and deploys to staging.
  experience_target: I should be able to just go from idea to planned project work that is autonomously produced.
  mission:
    - id: M1
      file: PROJECT.md
      quote: Arcadia is the operator's execution system.
    - id: M2
      file: PROJECT.md
      quote: asking for a decision only when one is genuinely needed
    - id: M3
      file: CONSTITUTION.md
      quote: must stay useful when the operator has almost no time
    - id: M4
      file: CONSTITUTION.md
      quote: Operator attention is a budget.
    - id: M5
      file: CONSTITUTION.md
      quote: Capability never grants authority.
  requirements:
    - id: REQ-001
      statement: An operator who knows nothing about Arcadia can ask Relay how to do anything in the Way and get a correct, practical answer that cites the checked-in guidance it used, and says plainly when it does not know.
      mission:
        - M1
        - M3
      proof: "A held-out set of first-time-operator questions written by someone other than the author, ideally real first-timers, with an answer key, one fresh session per question, and a larger safety block, judged separately. Pass mark, by operator default in S012: at least 90% fully correct, with none wrong on authority, spending, merging or stopping."
    - id: REQ-002
      statement: The operator can carry out the Way's operations by talking to Relay, without knowing commands, paths or document formats.
      mission:
        - M1
        - M3
      proof: A first-time operator walkthrough on a real project, counting every moment they had to leave Relay or type a command.
    - id: REQ-003
      statement: One continuous conversation, with an experience like rich text messaging, follows the operator across devices, and surviving a restart loses nothing they said or were told.
      mission:
        - M1
      proof: A test that sends from one client, restarts services, and reads the same history from another.
    - id: REQ-004
      statement: Relay reaches the operator only when they must act or can use a result, and everything it needs from them is one clear choice with its consequence.
      mission:
        - M2
        - M4
      proof: A count of messages per real workday, graded by the operator as useful or noise, against a threshold the operator sets.
    - id: REQ-005
      statement: What matters in the group conversations around the operator's work reaches them, and nothing from a group is lost, sent or acted on without their authority.
      mission:
        - M4
        - M5
      proof: A record-only run on a real channel, with candidates graded by the operator, and a test that no outbound message or state change results.
    - id: REQ-006
      statement: Relay can never do more than the operator authorized, whatever a message, document or channel tells it, and this limit is enforced by tools rather than by its prompt.
      mission:
        - M5
      proof: An adversarial test suite of hostile messages and documents, showing no effect beyond a recorded proposal.
    - id: REQ-007
      statement: Until Relay v1.0 exists, any coding agent can simulate the experience in Relay mode, and the operator can always tell what Arcadia really did from what the agent improvised.
      mission:
        - M1
        - M5
      proof: A label audit of real Relay mode sessions, where a separate judge checks each claimed Arcadia action against its receipt and each improvised behavior is marked as improvised.
    - id: REQ-008
      statement: Eventually, every default coding-agent session is prepared for operator interaction as Relay, consistent with every other Relay interaction, replacing Rowan as the default shell.
      mission:
        - M1
        - M4
      proof: A fresh session in each of Codex, Claude Code and OpenCode opens as Relay with no setup, and the same operator questions get equivalent experiences across them and Relay's own surface.
    - id: REQ-009
      statement: In a group conversation, Relay can be addressed directly as a participant, once a Decision allows it to speak there.
      mission:
        - M1
        - M5
      proof: A test on a real channel where an allowed person addresses Relay and gets an answer, and everyone else's messages get none.
    - id: REQ-010
      statement: Relay is blazing fast and responsive. Version 1 is as fast as it can be made, through an interface that keeps routing and every process behind it fast.
      mission:
        - M3
        - M4
      proof: Measured latency per route on a real message set, against budgets the operator sets, with the slowest routes named.
    - id: REQ-011
      statement: Any agent that consults the Arcadia Way can always find the exact information it needs very quickly without bloating its context, and needs only minimal context to adhere to the Way.
      mission:
        - M3
        - M4
      proof: Separate held-out sets for agent operations and first-timer questions, one fresh session per question on all three hosts, counting standing load as well as retrieved context, against targets the operator sets. The route for changing the rule that agents read a whole procedure first is named.
    - id: REQ-012
      statement: Completely arbitrary text sent to Relay immediately begins what seems like a traditional chatbot conversation, and changes no state by itself.
      mission:
        - M3
        - M5
      proof: Sending arbitrary messages from the dashboard yields a streamed reply, with first-word time measured against a budget the operator sets, and a test that no record other than the conversation changes.
    - id: REQ-013
      statement: Much of Relay's conversation costs nothing, with paid models used only when they add value.
      mission:
        - M3
        - M4
      proof: The share of turns answered by code or a local model is measured over real use, with the spend per turn.
    - id: REQ-014
      statement: From a conversation, the operator can use Arcadia Design and create a Project with scaffolding, templates, continuous integration and Cloudflare deployment, reaching planned work that is autonomously produced.
      mission:
        - M1
        - M2
      proof: One real idea reaches an approved Plan and a deployed staging result, with every operator touch counted.
    - id: REQ-015
      confirmed_ref: S029
      statement: From every Workspace view, the operator can tell how the system is doing at a glance, can check the same reading in words, and is never told all is clear when production is off, stalled or unread.
      mission:
        - M3
        - M4
      proof: A Playwright test across every Workspace route showing the same reading and words, covering each production state in the design's table, first load and a stale read, plus the operator judging a glance test on a real phone.
    - id: REQ-016
      confirmed_ref: S029
      statement: What is on screen is what Relay takes "this" to mean, every answer says which scope it used, and the view moves only as CH-05 decides, never from a status change or a model's choice.
      mission:
        - M1
        - M4
        - M5
      proof: A Playwright test where status changes move nothing, each answer names the scope the server used, and the view moves only as CH-05's chosen option says. A hostile message cannot move the view.
    - id: REQ-017
      confirmed_ref: S029
      statement: Relay is available from every Workspace context, including when the view failed to load, an earlier send is uncertain, or an Artifact is open, without weakening the gates on anything that writes.
      mission:
        - M1
        - M3
      proof: A Playwright test sending from each route with the view's read failing, with an uncertain exchange pending, and with the Stage open, with no message lost or resent, and a direction refused for an unverified target.
    - id: REQ-018
      confirmed_ref: S029
      statement: The interface works first on a phone, also on a tablet, laptop and several monitors, and nothing built now blocks headsets or AR glasses.
      mission:
        - M1
        - M3
      proof: Playwright at phone, keyboard-height and desktop sizes, the operator using it on their phone, and a schema test that answers, blocks and cues carry no layout, markup or URL fields.
  non_goals:
    - Replacing governance. Decisions, Agent Asks and approval gates remain the only path to changing state.
    - Speaking in a group or to a client before a Decision allows it.
    - Copying DeepSeek's implementation, or integrating any OpenAI product.
  confirmed_ref: S022
