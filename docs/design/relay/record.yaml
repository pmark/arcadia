concepts:
  - id: C-001
    title: Way-grounded answers with citations
    kind: mechanism
    statement: Relay answers questions about the Arcadia Way by retrieving the checked-in guidance, cites what it used, and says when the guidance does not answer. Only the operator asked for this; no other source addresses it.
    origins:
      - source: S001
        locator: The name and the first-time operator
    fit:
      status: partial
      evidence:
        - docs/agent-guidance/index.json
        - src/projects/agentGuidance.ts
        - docs/notes-to-self.md
        - START_HERE.md
    position: chosen
    serves:
      - REQ-001
    load_bearing: true
    verification:
      status: untested
    reason: The corpus, its index and Relay mode's instruction exist. Outside a coding-agent simulation nothing answers from them, and accuracy has never been measured.
  - id: C-002
    title: Graded question set for Way knowledge
    kind: mechanism
    statement: A checked-in set of first-time-operator questions, judged by a separate grader against the cited guidance, with a pass mark the operator sets, makes Way knowledge measurable instead of asserted.
    origins:
      - source: S001
        locator: The name and the first-time operator
      - &a1
        source: S005
        locator: whole file
    fit:
      status: partial
      evidence:
        - src/ask/goldenCases.ts
        - .agents/skills/next-action-grader/SKILL.md
    position: chosen
    serves:
      - REQ-001
    reason: The golden-set and separate-grader patterns exist for other judgments.
  - id: C-003
    title: Operate the Way through conversation
    kind: mechanism
    statement: The operator states what should become true and Relay chooses the smallest governed structure, showing what it heard and why, so that nobody needs commands, paths or document formats.
    origins:
      - &a113
        source: S006
        locator: Product thesis
      - &a115
        source: S006
        locator: One request begins a visible working session
      - &a118
        source: S006
        locator: Project assignment needs almost no syntax
      - &a119
        source: S006
        locator: The operator asks for progress, not schema
      - &a120
        source: S006
        locator: Coding agents use the same intent interface
      - &a122
        source: S006
        locator: The authority contract
      - source: S001
        locator: The name and the first-time operator
    fit:
      status: partial
      evidence:
        - apps/dashboard/app/api/ask/route.ts
        - src/ask/agentAsk.ts
        - src/ask/captureEnvelope.ts
    position: leaning
    serves:
      - REQ-002
    reason: Ask and Agent Ask carry this, but they return receipts and need an operator who can read them.
  - id: C-004
    title: One continuous thread over many channels
    kind: mechanism
    statement: The operator has one conversation, with internal sessions hidden and navigation following the work rather than a list of chats. Many channels and sessions sit behind it, and a separate conversation is a deliberate exception whose use case is undesigned.
    origins:
      - &a57
        source: S003
        locator: The concept in the abstract
      - &a84
        source: S004
        locator: The foreground is a conversation
      - &a90
        source: S004
        locator: Unified UX with flexible context navigation
      - &a97
        source: S004
        locator: Interaction requirements for the prototype
      - source: S001
        locator: The request
      - *a1
    fit:
      status: partial
      evidence:
        - apps/dashboard/components/workspace/workspace-ask.tsx
        - apps/dashboard/components/workspace/workspace-view.tsx
    position: chosen
    serves:
      - REQ-003
  - id: C-005
    title: Append-only conversation record
    kind: mechanism
    statement: One server-side append-only record holds only new facts, namely what was said and pointers to records, each message keeping the scope it was sent in. It is evidence, never authority, and old replies stay as written while current status shows separately.
    origins:
      - &a71
        source: S003
        locator: Architecture proposed
      - &a94
        source: S004
        locator: History belongs within reach of the work
      - &a95
        source: S004
        locator: Brief replies that hold the experience together
      - &a117
        source: S006
        locator: Arcadia chooses the least costly sufficient intelligence
      - &a93
        source: S004
        locator: Interaction requirements for the prototype
    fit:
      status: missing
      evidence:
        - apps/dashboard/components/workspace/workspace-ask.tsx
        - src/db/schema.ts
    position: leaning
    serves:
      - REQ-003
    reason: The workspace exchange lives in browser localStorage today, so it does not follow the operator between devices.
  - id: C-006
    title: Explicit, visible scope
    kind: mechanism
    statement: Deliberately selecting work sets the conversation's scope, which stays visible and inspectable, and survives with its draft when the selection changes. Ambiguity across Projects gets one clarification, and routing is never done by hiding instructions in the operator's text.
    origins:
      - &a86
        source: S004
        locator: Navigation establishes conversational scope
      - &a87
        source: S004
        locator: The first prototype story
      - &a96
        source: S004
        locator: Interaction requirements for the prototype
      - &a100
        source: S004
        locator: Mobile navigation and continuity across devices
      - &a109
        source: S004
        locator: Context and safe integration
    fit:
      status: partial
      evidence:
        - apps/dashboard/lib/workspace-scope.ts
        - apps/dashboard/app/api/ask/route.ts
    position: leaning
    serves:
      - REQ-003
      - REQ-002
    reason: Project scoping exists on Ask; Plan and Action context is display only.
  - id: C-007
    title: Bounded context with continuation summaries
    kind: constraint
    statement: Each turn loads only relevant records within a budget, using a short summary to orient, with originals reachable. Reads go through a bounded, addressable surface rather than dumping history or the portfolio into a model.
    origins:
      - &a88
        source: S004
        locator: Navigation establishes conversational scope
      - &a89
        source: S004
        locator: History belongs within reach of the work
      - &a45
        source: S002
        locator: docs/007-architecture.md#read-resources
    fit:
      status: missing
      evidence:
        - src/commands/goContext.ts
    position: leaning
    serves:
      - REQ-001
      - REQ-003
    reason: Needed as soon as answers use a model.
  - id: C-008
    title: Related work reachable from the exchange
    kind: interface
    statement: Every related Action, Run, Decision and Artifact appears as a destination from the exchange, and earlier exchanges are reachable from the work they concern, rather than creating further chats.
    origins:
      - &a91
        source: S004
        locator: History belongs within reach of the work
      - &a92
        source: S004
        locator: Interaction requirements for the prototype
      - &a106
        source: S004
        locator: Response and navigation contract
      - &a107
        source: S004
        locator: One complete feature
    fit:
      status: partial
      evidence:
        - apps/dashboard/components/workspace/workspace-ask.tsx
        - apps/dashboard/components/workspace/workspace-artifact-viewer.tsx
    position: leaning
    serves:
      - REQ-003
    reason: Receipt cards exist; per-entity history does not.
  - id: C-009
    title: Rich cards built on existing controls
    kind: interface
