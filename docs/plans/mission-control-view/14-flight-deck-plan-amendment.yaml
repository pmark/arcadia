request_id: flight-deck-built-by-managed-production-2026-09-05
project: arcadia
intent: plan
target_ref: plan/flight-deck-board-carries-the-whole-portfolio-on-one-surface
requested_authority: propose
desired_result: Build Flight Deck through the proven Managed Production system, then make it the operator production home.
rationale: Operator explicitly requires bootstrap-first sequencing and Flight Deck itself as real dogfood. This amendment contains presentation/integration and real self-hosted production proof; production engine implementation belongs solely to the separate bootstrap Plan. Earlier unsettled single-plan proposals must not also be applied. Do not activate this consumer Plan before the bootstrap proof and approved single-pointer transition.
