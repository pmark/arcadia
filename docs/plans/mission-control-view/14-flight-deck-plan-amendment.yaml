    desired_result: Verify the complete Flight Deck loop and failure recovery with deterministic end-to-end evidence.
    acceptance:
      - Execute the scenario matrix in document 15 against isolated fixtures, including both provider selections, stale previews, duplicate launch, no packet, lost response and old active execution.
