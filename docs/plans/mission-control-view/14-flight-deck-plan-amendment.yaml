    target_ref: action/project-plan-lanes-and-pipeline-columns
    desired_result: Render the Flight Deck route with a truthful portfolio projection and bounded independent source states.
    acceptance:
      - Render /flight-deck with Project and Plan lanes, Milestone context and typed Action, Decision, Run and Artifact identities; preserve distinct Session references.
      - Deduplicate projections of the same entity and retain unknown, unattached, waiting-for-pointer and flagged states with named reasons; fixture coverage accounts for every input identity exactly once.
      - Separate stage from who owes the next move; unresolved QA judgment remains visible in Proving and Artifact existence never implies Landed.
      - Expose loaded coverage, source observation times and partial failures; a stalled source yields a recoverable status within 12 seconds and does not block independent content.
      - Reuse queue/snapshot contracts and shared UI; browsing creates no governed writes, queue changes or model calls.
      - "Preserve the proof Artifact: Projection/state fixtures and first route desktop screenshot; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
      - Include unsettled Agent Ask proposals in the Needs operator inventory through a canonical read projection; the current snapshot omits this store. Give each proposal a stable direct review URL and show missing coverage explicitly until supported.
      - This is admitted by the frozen proven Managed Production runtime after the approved bootstrap-to-Flight-Deck Plan transition; preserve Session/policy/runtime evidence proving real dogfood.
