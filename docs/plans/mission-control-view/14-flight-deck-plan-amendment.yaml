      - Preserve deterministic integration evidence and an exact operator procedure/target in the PR; distinguish simulated provider or capacity behavior from real proof.
      - Reuse the bootstrap Work Queue production control and same persisted policy; toggling on either screen is reflected on the other and launches no duplicate scheduler.
