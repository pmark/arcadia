    references:
      - docs/plans/mission-control-view/17-managed-production-contract.md
      - docs/plans/mission-control-view/18-bootstrap-then-dogfood.md
    acceptance:
      - Link the production policy, frozen controller revision, queue/pointer receipts, provider selections, Sessions, commits and validation for the actual board and orientation Actions.
      - Prove the controller launched the first Action and automatically admitted the dependent second Action after its required evidence/authority gates; a toy fixture or manual launch does not satisfy this Action.
      - Record every operator intervention and classify it as required product/merge authority or a production defect. Manual session creation, packet copying or pointer bookkeeping is a defect to repair.
      - Exercise Off and subsequent explicit reactivation through the independent existing Work Queue control while Flight Deck is incomplete; preserve work and prevent duplicate execution.
      - Keep controller repairs on the stable-runtime upgrade procedure; the Flight Deck Candidate must not overwrite the supervisor building it. Preserve the real dogfood report as the proof Artifact.
  - id: reuse-queue-steering-controls
    desired_result: Embed the existing queue order and Make next controls in Flight Deck.
    acceptance:
      - Extract the working Work Queue move, arrange, preview, apply and undo interaction for use by both routes without duplicating order logic.
      - Make next preserves the exact pointer fingerprint flow and is separate from order changes and launch.
      - Display canonical nextActionKey and every higher skipped Action reason before and after an operation; invalid initial order has an explicit repair path.
      - Concurrent revisions are refused, pending edits preserved, cancellation writes nothing and durable receipts drive refreshed state.
      - Reordering explains that it changes future selection and does not interrupt the current Session.
      - "Preserve the proof Artifact: Two-route queue parity, conflict and undo tests; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
