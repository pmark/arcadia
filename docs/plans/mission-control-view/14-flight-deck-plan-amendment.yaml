  - id: reuse-contextual-decision-controls
    desired_result: Resolve operator Decisions from Flight Deck using the existing consequence and receipt flows.
    acceptance:
      - Reuse approve/reject/defer/reply/reassess/flag-agent and clarification capabilities where valid for the selected Decision; do not replace them with generic approve commands.
      - Present each option consequence and required artifact context before confirmation; recommendation remains non-binding.
      - Require a named trigger for deferral and preserve rejection feedback and user text on errors.
      - Refresh affected Decision, Action and queue state after resolution; show what became eligible or the remaining blocker.
      - QA judgments stay in global Needs operator even while shown in Proving; deduplication does not erase obligations.
      - "Preserve the proof Artifact: Decision journey parity with rejection, deferral and conflict cases; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
      - "Expose pending Agent Ask proposal review and exact settlement using the existing settlement core: summary, affected Project/Plan/Actions, before/after effects, options with consequences, authority scope, and prerequisite queue repair. Proposal approval is not review approve against an unrelated Decision id."
      - The operator can accept or reject the exact proposal from its direct link; a changed preview requires renewed judgment, failures preserve the pending obligation, and success leaves a canonical receipt and resulting next move. Proposal capture must return this link; do not require finding YAML, CLI ids or this chat.
