  - id: reuse-queue-steering-controls
    desired_result: Embed the existing queue order and Make next controls in Flight Deck.
    acceptance:
      - Extract the working Work Queue move, arrange, preview, apply and undo interaction for use by both routes without duplicating order logic.
      - Make next preserves the exact pointer fingerprint flow and is separate from order changes and launch.
      - Display canonical nextActionKey and every higher skipped Action reason before and after an operation; invalid initial order has an explicit repair path.
      - Concurrent revisions are refused, pending edits preserved, cancellation writes nothing and durable receipts drive refreshed state.
      - Reordering explains that it changes future selection and does not interrupt the current Session.
      - "Preserve the proof Artifact: Two-route queue parity, conflict and undo tests; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
