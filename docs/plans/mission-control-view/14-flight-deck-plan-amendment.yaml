agent_ask: v1
request_id: flight-deck-managed-production-2026-09-05
project: arcadia
intent: plan
target_ref: plan/flight-deck-board-carries-the-whole-portfolio-on-one-surface
requested_authority: propose
desired_result: "Deliver Flight Deck as the prioritized Plan production console: Active/Inactive control, automatic capacity-aware coding-agent execution, proven reconciliation and automatic continuation, with answerable operator review."
rationale: "The operator explicitly prioritized continuously managed production ASAP: turn production on once, advance queued approved Actions across configured coding agents whenever supported capacity permits, and expose an off switch. This materially expands the previously approved manual-launch proposal and awaits review; it does not enable a worker, grant real provider execution or merge authority. Reuse existing worker, Session, queue, availability telemetry and overlapping capacity/orchestration plans. Prove a two-Action unattended loop before broad UI polish. Off defaults to stopping new launches while current work finishes unless the operator selects a different supported behavior."
references:
  - docs/plans/mission-control-view/11-existing-surfaces-audit.md
  - docs/plans/mission-control-view/12-flight-deck-operations-contract.md
  - docs/plans/mission-control-view/13-flight-deck-delivery-sequence.md
  - docs/plans/mission-control-view/15-flight-deck-acceptance-matrix.md
  - docs/plans/mission-control-view/17-managed-production-contract.md
actions:
  - id: project-plan-lanes-and-pipeline-columns
    target_ref: action/project-plan-lanes-and-pipeline-columns
    desired_result: Render the Flight Deck route with a truthful portfolio projection and bounded independent source states.
    acceptance:
      - Render /flight-deck with Project and Plan lanes, Milestone context and typed Action, Decision, Run and Artifact identities; preserve distinct Session references.
      - Deduplicate projections of the same entity and retain unknown, unattached, waiting-for-pointer and flagged states with named reasons; fixture coverage accounts for every input identity exactly once.
      - Separate stage from who owes the next move; unresolved QA judgment remains visible in Proving and Artifact existence never implies Landed.
      - Expose loaded coverage, source observation times and partial failures; a stalled source yields a recoverable status within 12 seconds and does not block independent content.
      - Reuse queue/snapshot contracts and shared UI; browsing creates no governed writes, queue changes or model calls.
      - "Preserve the proof Artifact: Projection/state fixtures and first route desktop screenshot; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
      - Include unsettled Agent Ask proposals in the Needs operator inventory through a canonical read projection; the current snapshot omits this store. Give each proposal a stable direct review URL and show missing coverage explicitly until supported.
    dependencies: []
    references:
      - apps/dashboard/app/api/work-queue/route.ts
      - apps/dashboard/app/api/snapshot/route.ts
      - src/dashboard/snapshot.ts
      - apps/dashboard/lib/work-queue-types.ts
  - id: define-managed-production-policy
    desired_result: Persist a bounded Active/Inactive production policy and admission authority in the existing workspace.
    acceptance:
      - Activation previews included Projects/Plans, ordered Action scope, providers, concurrency and permitted mechanical validation/acceptance/pointer transitions; new scope and consequential authority require explicit judgment.
      - Persist desired state, revision/epoch and authority receipt; default Inactive on first setup, preserve valid Active state across restart and never resurrect revoked policy.
      - Off fences new admissions and queued-but-unlaunched production work before confirmation; default lets committed running work finish/reconcile, with exact displayed consequence.
      - Policy state remains accessible when queue/provider reads or execution block; race tests define the cutoff for already-committed launches.
      - Preserve deterministic integration evidence and an exact operator procedure/target in the PR; distinguish simulated provider or capacity behavior from real proof.
    dependencies:
      - project-plan-lanes-and-pipeline-columns
    references:
      - docs/plans/mission-control-view/17-managed-production-contract.md
      - src/commands/worker.ts
      - src/sessions/index.ts
      - src/db/schema.ts
  - id: prove-provider-capacity-admission
    desired_result: Prove and reuse existing Codex and Claude telemetry for unattended included-capacity admission.
    acceptance:
      - Reuse availability.ts observers and the provider-capacity-harvesting receipt contract; record real supported windows, source, observed age, reset, account scope and included/paid/unknown policy.
      - Unattended admission rejects unknown/stale capacity and unknown paid mode with a visible reason; an explicit bounded manual receipt is labeled and is not indefinite unattended proof.
      - Refresh with deadlines/backoff and no model calls; after an observed reset, automatically refresh and readmit while Active. Do not redeem resets, buy credits or enable paid fallback.
      - Reuse compliant provider selection after admission filters; a limited provider permits a different eligible configured provider, without weaker substitution or replaying partial work blindly.
      - Prove supported host telemetry for each configured provider during authorized rehearsal; unavailable fields remain explicit and do not require invented comparable daily/weekly metrics.
      - Preserve deterministic integration evidence and an exact operator procedure/target in the PR; distinguish simulated provider or capacity behavior from real proof.
    dependencies:
      - define-managed-production-policy
    references:
      - docs/plans/mission-control-view/17-managed-production-contract.md
      - src/codingAgents/availability.ts
      - src/codingAgents/providerAdapters.ts
      - docs/plans/provider-capacity-harvesting.md
      - docs/plans/agent-advance-queue.md
  - id: carry-the-dispatch-command
    target_ref: action/carry-the-dispatch-command
    desired_result: Preview execution with automatic coding-agent selection and an exact bounded launch contract.
    acceptance:
      - Reuse selectCompliantCodingAgent and portable execution requirements; automatic selection shows agent, model, effort, rationale and binding provenance without an operator provider choice.
      - Bind Action/doc_ref, current documents, queue revision, packet hash, authorizing Decisions, repository/base and binding to a launch preview and request id.
      - Selection accounts for launch-adapter availability, rejects unsatisfied requirements without downgrade, and never silently changes an immutable packet provider.
      - Preview starts no process and performs no Git mutation; expose missing packet, stale pointer, unavailable provider and conflicting execution as named prerequisites.
      - Generate any advanced copyable command from the supported server contract; the primary required outcome is browser-triggered launch, superseding the original copy-only acceptance criteria.
      - "Preserve the proof Artifact: Selection and launch-preview contract fixtures including both providers; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
    dependencies:
      - define-managed-production-policy
    references:
      - src/codingAgents/providerAdapters.ts
      - src/execution/profiles.ts
      - src/commands/go.ts
      - src/sessions/index.ts
  - id: connect-action-to-launch-packet
    desired_result: Connect a dispatchable Action to its existing preparation and approval path before launch.
    acceptance:
      - Handle no packet, planning required, planning approval pending, build packet ready and stale packet as separate states with one usable existing remedy.
      - Reuse planning preparation, immutable packet authorization and accepted-plan promotion; no second packet format or approval store is introduced.
      - Preserve the exact Action and selection provenance through preparation; no planning-only approval becomes implementation authority.
      - Prepare isolated work through extracted canonical mechanics and never invoke generic go/apply reconciliation as an implicit launch side effect.
      - "Preserve the proof Artifact: Packet lifecycle and authority-boundary integration fixtures; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
    dependencies:
      - carry-the-dispatch-command
    references:
