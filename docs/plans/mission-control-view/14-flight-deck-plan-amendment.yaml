      - "Preserve the proof Artifact: Cold-open orientation fixture and visible/hidden count evidence; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
      - The first operational view includes prioritized Plan segments, production desired state, actual activity, current provider capacity and next admission/reason; distinguish Active but waiting from Inactive.
