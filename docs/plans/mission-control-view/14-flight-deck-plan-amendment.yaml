  - id: dogfood-flight-deck-as-operations-home
    desired_result: Rehearse Flight Deck as the operator entry point for a real week and record remaining gaps.
    acceptance:
      - Provide reachable Candidate and preserved Stable with exact revision, host/URL, recovery command and operator procedure before requesting rehearsal.
      - Collect real operator evidence of orienting, inspecting planned work, changing priority, resolving judgment, launching an automatically selected agent and reviewing its result.
      - Record each required detour with its cause; specialist deep inspection is allowed, routine-loop archaeology is a failure requiring repair before acceptance.
      - Exercise live Codex and Claude only within separately authorized bounded Sessions; fixture proof is never labeled live success.
      - When elapsed use or operator feedback is missing, record one precise review question/external condition rather than mark done; accept only with explicit operator judgment.
      - "Preserve the proof Artifact: Dated real-week operator rehearsal and acceptance record; include exact runnable target and operator QA steps in the PR, or state why no runnable surface exists."
      - Use Active production to progress multiple Actions without manual session launches, observe capacity waiting/recovery, and exercise Off. Accept only after the multi-provider production proof passes.
    dependencies:
      - verify-flight-deck-operational-loop
    references:
      - docs/operator-demo-and-release-contract.md
      - docs/plans/mission-control-view/17-managed-production-contract.md
