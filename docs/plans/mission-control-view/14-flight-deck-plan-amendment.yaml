  - id: control-plan-production-from-flight-deck
    desired_result: Control prioritized Plan production with a persistent Active/Inactive switch and truthful activity status.
    acceptance:
      - Show included Plans in explicit priority order with Action dependencies and resulting queue order; reuse Plan segment/make-next previews and receipts, never a second priority store.
      - Provide scoped activation preview and one obvious Off control usable on phone and desktop; read desired state separately from Building, waiting capacity, blocked, finishing and worker unavailable.
      - Display selected/next Action and agent, why higher work is skipped, provider observation age/reset, approval obligations and exact next automatic check.
      - Browser closure does not pause production; two tabs and stale activation previews cannot overwrite policy; confirmed Off has a receipt and never silently interrupts existing native work.
      - Preserve deterministic integration evidence and an exact operator procedure/target in the PR; distinguish simulated provider or capacity behavior from real proof.
