<style>
/* Layout: Context | Work (feed rail + crafting table) | Direction over a dusk sol sky. Phone: one focused work area, compact trail, pinned composer. */
:root {
  --sky-top: #1d2140; --sky-mid: #4a3f66; --sky-low: #b98479;
  --panel: rgb(16 20 38 / .84); --panel-2: rgb(26 30 54 / .9); --glass: rgb(255 255 255 / .05);
  --line: rgb(255 255 255 / .13); --line-strong: rgb(255 255 255 / .26);
  --text: #f3efe9; --soft: rgb(243 239 233 / .72); --faint: rgb(243 239 233 / .5);
  --ember: #e58f6f; --ember-ink: #2a1610; --focus: #ffd9aa;
  --ok: #8fe0b0; --warn: #f6c065; --bad: #ff8a8a; --info: #9fc4ff; --sim: #c9b6ff;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 var(--ui); color: var(--text); background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 60%, var(--sky-low)) fixed; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mono { font-family: var(--mono); }
.muted { color: var(--soft); }
.faint { color: var(--faint); }

/* header */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: rgb(12 15 30 / .9); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
.mark { font-size: 20px; font-weight: 500; letter-spacing: -.5px; }
.mark b { font-weight: 600; color: var(--ember); margin-left: 4px; }
.trail { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow: hidden; white-space: nowrap; font-size: 13px; }
.trail button { all: unset; cursor: pointer; padding: 3px 6px; border-radius: 6px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; max-width: 22ch; }
.trail button:hover { background: var(--glass); color: var(--text); }
.trail button[aria-current="page"] { color: var(--text); font-weight: 500; }
.trail button:focus-visible { outline: 2px solid var(--focus); }
.trail .sep { color: var(--faint); }
.simbadge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--sim); color: var(--sim); font-size: 12px; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--glass); color: var(--text); font-size: 13px; text-align: left; }
.btn:hover { background: rgb(255 255 255 / .1); }
.btn.primary { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); font-weight: 600; }
.btn.primary:hover { background: #ee9e80; }
.btn.quiet { border-color: transparent; background: none; color: var(--soft); }
.btn.quiet:hover { color: var(--text); background: var(--glass); }
.btn.danger { border-color: rgb(255 138 138 / .6); color: #ffd0d0; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* three concepts */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 330px; gap: 14px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); max-width: 1680px; margin: 0 auto; align-items: start; }
.concept { min-width: 0; display: grid; gap: 12px; align-content: start; }
.concept > h2.concept-title { margin: 0 2px; font: 600 11px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.panel h3 .faint { font-weight: 400; }
.context { position: sticky; top: 64px; max-height: calc(100vh - 78px); overflow: auto; padding-bottom: 4px; }
/* Direction: moves scroll; the composer stays put at the bottom of the column. */
.direction { position: sticky; top: 64px; height: calc(100vh - 78px); display: flex; flex-direction: column; gap: 12px; }
.direction > .moves { flex: 1; min-height: 0; overflow: auto; align-content: start; }
.work-grid { display: grid; grid-template-columns: minmax(230px, 280px) minmax(0, 1fr); gap: 12px; align-items: start; }
.table { container-type: inline-size; }
@media (max-width: 1280px) { .layout { grid-template-columns: 250px minmax(0, 1fr) 330px; } .work-grid { grid-template-columns: minmax(0, 1fr); } .feed-panel { max-height: 300px; overflow: auto; } }
@media (max-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; }
  .context { display: none; }
  .context.sheet-open { display: grid; position: fixed; inset: 56px auto 0 0; width: min(340px, 92vw); max-height: none; z-index: 30; padding: 12px; background: rgb(12 15 30 / .97); border-right: 1px solid var(--line); }
  .only-wide { display: none !important; }
}
.only-narrow { display: none !important; }
@media (max-width: 1060px) { .only-narrow { display: inline-flex !important; } }

/* outline + map */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 12px; border-left: 1px solid var(--line); margin-left: 7px; }
.tree li { margin: 1px 0; }
.node { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 6px; align-items: baseline; width: 100%; padding: 3px 6px; border-radius: 6px; color: var(--soft); font-size: 13px; }
.node:hover { background: var(--glass); color: var(--text); }
.node[aria-current="true"] { background: rgb(229 143 111 / .18); color: var(--text); box-shadow: inset 2px 0 0 var(--ember); }
.node:focus-visible { outline: 2px solid var(--focus); }
.kind { font: 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); flex: none; min-width: 3.2em; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; border: 1px solid var(--line); background: var(--glass); }
.seg button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 7px; font-size: 12px; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--text); color: #1b1726; }
.seg button:focus-visible { outline: 2px solid var(--focus); }
.map { position: relative; min-height: 220px; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.map svg path { fill: none; stroke: rgb(255 255 255 / .28); stroke-width: 1.2; }
.map svg path.cross { stroke-dasharray: 4 3; stroke: rgb(201 182 255 / .55); }
/* The lens reads top to bottom: ancestors, the selected node, then its children and cross-links. */
.map-rows { position: relative; display: grid; gap: 22px; padding: 4px 0; }
.map-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.map-node { all: unset; box-sizing: border-box; cursor: pointer; display: block; max-width: 100%; flex: 0 1 auto; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel-2); font-size: 12px; line-height: 1.25; text-align: center; overflow-wrap: break-word; }
.map-node .kind { display: block; min-width: 0; }
.map-node.self { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.map-node.cross { border-style: dashed; border-color: rgb(201 182 255 / .6); }
.map-node:focus-visible { outline: 2px solid var(--focus); }

/* journey */
.track { display: flex; gap: 4px; margin: 8px 0 6px; }
.leg { flex: 1; height: 7px; border-radius: 4px; background: rgb(255 255 255 / .12); position: relative; }
.leg.arrived { background: var(--ok); } .leg.review { background: var(--info); } .leg.needs { background: var(--warn); } .leg.blocked { background: var(--bad); }
.leg.current::after { content: ""; position: absolute; right: -3px; top: -5px; width: 15px; height: 15px; border-radius: 5px 5px 3px 3px; background: #f0d6c2; box-shadow: inset 0 -3px 0 #8f6450; }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 6px 0 0; font-size: 12.5px; }
dl.facts dt { color: var(--faint); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }

/* feed */
.feed-panel { padding: 10px 10px 12px; }
.feed-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 6px; }
.newpill { all: unset; cursor: pointer; display: block; margin: 4px 0 8px; padding: 6px 10px; border-radius: 999px; text-align: center; font-size: 12px; background: rgb(159 196 255 / .14); border: 1px solid rgb(159 196 255 / .5); color: #dbe8ff; }
.newpill:focus-visible { outline: 2px solid var(--focus); }
.fsec { margin: 10px 4px 4px; font: 600 10.5px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.feed-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.fitem { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 2px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.fitem:hover { background: var(--glass); }
.fitem[aria-current="true"] { background: rgb(229 143 111 / .14); border-color: rgb(229 143 111 / .45); }
.fitem:focus-visible { outline: 2px solid var(--focus); }
.fitem .t { font-size: 13.5px; font-weight: 500; }
.fitem .d { font-size: 12px; color: var(--soft); }
.fitem .meta { display: flex; gap: 8px; font-size: 11px; color: var(--faint); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line-strong); color: var(--soft); white-space: nowrap; }
.tag.needs { border-color: rgb(246 192 101 / .7); color: #ffe4b5; }
.tag.ok { border-color: rgb(143 224 176 / .6); color: #cff5dd; }
.tag.bad { border-color: rgb(255 138 138 / .7); color: #ffd0d0; }
.tag.info { border-color: rgb(159 196 255 / .6); color: #dbe8ff; }
.tag.sim { border-style: dashed; border-color: var(--sim); color: var(--sim); }
.tag.stale { border-color: rgb(246 192 101 / .7); color: #ffe4b5; border-style: dashed; }
.notice { padding: 8px 10px; border-radius: 10px; font-size: 12.5px; background: rgb(255 255 255 / .05); border: 1px solid var(--line); }
.notice.warn { border-color: rgb(246 192 101 / .6); background: rgb(246 192 101 / .1); }
.notice.bad { border-color: rgb(255 138 138 / .6); background: rgb(255 138 138 / .1); }
.notice.info { border-color: rgb(159 196 255 / .5); background: rgb(159 196 255 / .08); }
.notice.sim { border-style: dashed; border-color: var(--sim); background: rgb(201 182 255 / .07); }

/* crafting table */
.table { padding: 14px 16px 18px; }
.table-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 14px; }
.table-head h1 { margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25; flex: 1; min-width: 14ch; text-wrap: balance; }
.table-head h1:focus { outline: none; }
.table-head h1:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.ladder-steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 4px; }
.ladder-steps span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--faint); }
.ladder-steps span.on { color: var(--text); border-color: var(--line-strong); background: var(--glass); }
details.section { border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
details.section > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; font-weight: 600; font-size: 14px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary::before { content: "▸"; color: var(--faint); font-size: 11px; transition: transform .15s; }
details.section[open] > summary::before { transform: rotate(90deg); }
details.section > summary .lvl { font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 400; }
.sbody { padding: 8px 0 4px; display: grid; gap: 10px; }
.rec { border-radius: 12px; border: 1px solid rgb(229 143 111 / .55); background: rgb(229 143 111 / .08); padding: 10px 12px; display: grid; gap: 6px; }
.rec .why { color: var(--soft); font-size: 13px; }
.alts { display: grid; gap: 6px; }
.alt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); }
.alt .c { grid-column: 1; font-size: 12px; color: var(--soft); }
.alt.blocked { border-style: dashed; opacity: .8; }
.compare { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
@container (max-width: 600px) { .compare { grid-template-columns: minmax(0, 1fr); } }
.copycard, .evcard { border-radius: 12px; border: 1px solid var(--line); background: rgb(255 255 255 / .03); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.field-label { font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.copytext { font-size: 16px; line-height: 1.4; margin: 2px 0 0; }
.claims { display: flex; flex-wrap: wrap; gap: 5px; }
.claim { font-size: 11.5px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--line); }
.claim.ok { border-color: rgb(143 224 176 / .5); }
.claim.none { border-color: rgb(255 138 138 / .7); background: rgb(255 138 138 / .08); }
.claim.contested { border-color: rgb(246 192 101 / .7); background: rgb(246 192 101 / .08); }
.ev { display: grid; gap: 2px; padding: 7px 9px; border-radius: 9px; background: rgb(255 255 255 / .03); border: 1px solid var(--line); }
.ev.new { border-color: rgb(159 196 255 / .6); }
.ev q { font-style: italic; quotes: "“" "”"; }
.ev .src { font-size: 11.5px; color: var(--faint); }
.evref { font: 600 11px var(--mono); color: #ffe0bd; }
ins { text-decoration: none; background: rgb(143 224 176 / .2); border-radius: 3px; padding: 0 2px; }
del { color: #ffc0c0; background: rgb(255 138 138 / .14); border-radius: 3px; padding: 0 2px; }
.revs { display: grid; gap: 6px; }
.rev { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 12.5px; }
.rev[aria-current="true"] { border-color: var(--line-strong); background: var(--glass); }
.audit pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 11.5px/1.5 var(--mono); color: var(--soft); max-height: 260px; overflow: auto; }
.preview { border-radius: 14px; overflow: hidden; border: 1px solid var(--line-strong); background: #f6f1ea; color: #2c2420; }
.preview .bar { display: flex; gap: 6px; padding: 7px 10px; background: #e7dfd3; font: 11px var(--mono); color: #6b5d52; }
.preview .hero { padding: 26px 22px 16px; }
.preview .hero h4 { margin: 0 0 8px; font: 600 24px/1.2 Georgia, "Iowan Old Style", serif; color: #2c2420; }
.preview .hero p { margin: 0; color: #5a4b42; }
.preview .recog { margin: 0 22px 22px; padding: 12px 14px; border-left: 3px solid #c9876c; background: #efe6db; font-size: 14px; }
.form { display: grid; gap: 8px; }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--soft); }
.form input, .form textarea { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line-strong); background: rgb(0 0 0 / .2); font-size: 14px; }
.form textarea { min-height: 96px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
.cmp2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@container (max-width: 560px) { .cmp2 { grid-template-columns: minmax(0, 1fr); } }
.choice { border-radius: 12px; border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.choice.picked { border-color: var(--ember); }

/* direction */
.moves { display: grid; gap: 12px; }
.nextmove { display: grid; gap: 8px; }
.nextmove .scope { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.receipts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.receipt { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: grid; gap: 6px; font-size: 12.5px; }
.receipt .text { color: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 5.5em; overflow: hidden; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
.steps li { font-size: 10.5px; text-align: center; padding: 3px 2px; border-radius: 6px; border: 1px solid var(--line); color: var(--faint); overflow-wrap: anywhere; }
.steps li.done { color: var(--text); border-color: rgb(143 224 176 / .55); background: rgb(143 224 176 / .1); }
.steps li.now { color: var(--text); border-color: var(--warn); background: rgb(246 192 101 / .1); }
.steps li.no { color: #ffd0d0; border-color: rgb(255 138 138 / .6); }
.composer { flex: none; display: grid; gap: 8px; background: rgb(18 22 42); border-color: var(--line-strong); }
.composer, .composer > *, .composer .target { min-width: 0; }
.composer .target { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; }
.composer .chip { min-width: 0; flex: 1 1 12ch; }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--ember); background: rgb(229 143 111 / .12); font-size: 12.5px; overflow: hidden; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer textarea { width: 100%; min-height: 84px; resize: vertical; padding: 9px 11px; border-radius: 11px; border: 1px solid var(--line-strong); background: rgb(0 0 0 / .25); font-size: 14px; line-height: 1.45; }
.composer select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel-2); font-size: 12.5px; }
.quick { display: flex; flex-wrap: wrap; gap: 4px; }

/* simulation console + sheets */
.console { position: fixed; z-index: 40; top: 56px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 70px); overflow: auto; background: rgb(14 16 32 / .98); border: 1px dashed var(--sim); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 18px 48px rgb(0 0 0 / .45); }
.console[hidden] { display: none; }
.console h2 { margin: 0; font-size: 14px; color: var(--sim); }
.console .grp { display: grid; gap: 6px; }
.console .grp h3 { margin: 4px 0 0; font: 600 10.5px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.console label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgb(6 8 18 / .5); }
.scrim[hidden] { display: none; }

/* phone */
.phonebar { display: none; }
@media (max-width: 760px) {
  body { font-size: 14px; }
  .top { gap: 8px; padding-block: 8px; }
  .mark .full { display: none; }
  .simbadge .long { display: none; }
  .trail { font-size: 12px; }
  .trail button { max-width: 14ch; }
  .layout { grid-template-columns: minmax(0, 1fr); padding-top: 10px; padding-bottom: 230px; }
  .concept > h2.concept-title { display: none; }
  .work-grid { grid-template-columns: minmax(0, 1fr); }
  .feed-panel { max-height: none; }

  .direction { position: static; height: auto; display: block; }

  .trail { order: 5; flex: 1 1 100%; overflow-x: auto; }

  .direction.sheet-open .moves { display: grid; position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 78vh; overflow: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgb(12 15 30 / .98); border-top: 1px solid var(--line-strong); border-radius: 16px 16px 0 0; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; border-radius: 16px 16px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .composer textarea { min-height: 52px; font-size: 16px; }
  .phonebar { display: flex; gap: 6px; }

  .context.sheet-open { top: 50px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

function select(id, { fromBack = false } = {}) {
  if (!OBJ[id] || id === S.selected) { if (phone()) { S.phone = "work"; render(); } return; }
  if (!fromBack) { S.back.push(S.selected); if (S.back.length > 20) S.back.shift(); }
  S.selected = id;
  // An empty draft may follow the selection; a written draft never changes target silently.
  if (!S.draft.text.trim() && RECIPIENTS.has(id) && S.draft.mode === "direction") S.draft.target = id;
  if (phone()) S.phone = "work";
  closeSheets();
  render();

}
function seeRec() { S.recSeen = recommendation().v; }
function schedule(fn, ms) { setTimeout(() => { fn(); render(); }, ms); }

function sendDirection(force) {
  const text = S.draft.text.trim(); if (!text) { say("Write a direction first."); $("draft").focus(); return; }
  const target = S.draft.target, warn = $("send-warn");
  const flying = inFlight(target);
  if (!force) {
    const dup = S.sends.find(s => s.target === target && s.text.trim().toLowerCase() === text.toLowerCase() && !["superseded", "duplicate", "verified"].includes(s.status));
    if (dup) { warn.hidden = false; warn.className = "notice warn"; warn.innerHTML = `This matches direction #${dup.n} (${statusWord(dup.status)}). <div class="row" style="margin-top:6px"><button class="btn small" type="button" data-act="dup-keep">Keep one</button><button class="btn small" type="button" data-act="send-anyway">Send again anyway</button></div>`; return; }
    if (flying.length && target === "A3") { const f = flying[0]; warn.hidden = false; warn.className = "notice warn"; warn.innerHTML = `Direction #${f.n} to this Action is ${statusWord(f.status)} and not yet acted on. Your new direction may contradict it. <div class="row" style="margin-top:6px"><button class="btn small" type="button" data-act="send-follow">Send as a follow-up (both apply)</button><button class="btn small" type="button" data-act="send-replace" data-send="${f.id}">Replace #${f.n}</button><button class="btn small quiet" type="button" data-act="send-cancel">Cancel</button></div>`; return; }
  }
  warn.hidden = true;
  tick(2);
  const s = { id: `s${++S.seq}`, n: S.seq, target, mode: S.draft.mode, text, status: "submitted", at: S.clock, rev: null };
  S.sends.push(s);
  log(`Direction #${s.n} submitted to ${target} (${s.mode}).`);
  S.draft.text = ""; $("draft").value = "";
  if (S.flaky) { S.flaky = false; s.status = "unknown"; log(`Direction #${s.n}: connection lost; outcome unknown; not resent.`); say(`Direction #${s.n}: we can't confirm it arrived. It was not resent.`); render(); return; }
  if (target === "A3" && (S.recipient === "stopped" || S.pause === "paused")) { s.status = "held"; log(`Direction #${s.n} held: recipient ${S.recipient === "stopped" ? "stopped" : "paused"}.`); say(`Direction #${s.n} is held until A3 resumes.`); render(); return; }
  say(`Direction #${s.n} submitted to ${OBJ[target].title}.`);
  render();
  if (S.auto) advanceLater(s);
}
function advanceLater(s) {
  const next = { submitted: 1200, delivered: 1600, acknowledged: 2600 }[s.status];
  if (next) setTimeout(() => { if (advance(s.id)) { render(); advanceLater(S.sends.find(x => x.id === s.id)); } }, next);
}
function advance(id) {
  const s = S.sends.find(x => x.id === id); if (!s) return false;
  if (s.target === "A3" && (S.recipient === "stopped" || S.pause === "paused") && ["submitted", "delivered"].includes(s.status)) { s.status = "held"; return true; }
  if (s.status === "submitted") { s.status = "delivered"; tick(); log(`#${s.n} delivered.`); return true; }
  if (s.status === "delivered") { s.status = "acknowledged"; tick(); log(`#${s.n} acknowledged by the simulated agent (no result yet).`); say(`Direction #${s.n} acknowledged. No revision yet.`); return true; }
  if (s.status === "acknowledged") {
    tick(3);
    if (s.target === "A3") {
      const lib = Math.min(REV_LIBRARY.length - 1, Math.max(2, latest().lib + 1));
      const n = latest().n + 1;
      S.revs.push({ n, lib, by: "agent", at: S.clock, dir: s.n });
      if (S.manual && S.manual.conflict === s.n) S.manual.conflict = null;
      s.status = "acted"; s.rev = n;
      log(`#${s.n} acted on: simulated agent produced r${n}.`); say(`r${n} is ready to compare.`);
      retireReviewItems(`superseded by r${n}`);
      addFeed({ sec: "Your next move", obj: "A3", t: `r${n} of the Hero/Recognition copy is ready`, d: `Produced for your direction #${s.n}. Compare it with the evidence.`, tags: [["needs", "needs you"]] }, false);
      if (S.autoEvents && !S.autoStaleDone && n === 3) { S.autoStaleDone = true; schedule(() => addEvidence(true), 6000); }
    } else { s.status = "acted"; log(`#${s.n} acted on (simulated note recorded on ${s.target}).`); }
    return true;
  }
  return false;
}
// Review items for A3 leave "Your next move" once a newer revision or an acceptance answers them.
function retireReviewItems(why) {

}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (el.tagName === "BUTTON" && el.type === "submit") return;
  switch (act) {
    case "select": select(el.dataset.id); break;
    case "back": { const id = S.back.pop(); if (id) select(id, { fromBack: true }); break; }
    case "lens": S.lens = el.dataset.lens; render(); break;
    case "map-wide": S.mapWide = !S.mapWide; render(); break;
    case "phone": S.phone = el.dataset.view; render(); break;
    case "toggle-console": { const c = $("console"); c.hidden = !c.hidden; document.querySelectorAll('[data-act="toggle-console"]').forEach(b => b.setAttribute("aria-expanded", String(!c.hidden))); if (!c.hidden) c.querySelector("button, input").focus(); break; }
    case "toggle-context": { const c = $("context"); const open = !c.classList.contains("sheet-open"); closeSheets(); if (open) { c.classList.add("sheet-open"); $("scrim").hidden = false; el.setAttribute("aria-expanded", "true"); c.querySelector("button").focus(); } break; }

    case "close-sheets": closeSheets(); break;
    case "show-unseen": S.feed.push(...S.unseen); S.unseen = []; render(); break;
    case "focus-composer": if (!S.draft.text.trim()) S.draft.target = "A3"; if (phone()) closeSheets(); render(); $("draft").focus(); break;
    case "approve": approve(); render(); break;
    case "ack-rec": seeRec(); render(); break;
    case "see-choices": S.open.understand = true; select("A3"); if (S.selected === "A3") render(); document.querySelector('[data-sec="understand"]')?.scrollIntoView({ block: "start" }); break;
    case "retarget": S.draft.target = S.selected; log(`Draft retargeted to ${S.selected} by the operator.`); say(`Draft now addressed to ${OBJ[S.selected].title}.`); render(); break;
    case "cite": { const t = $("draft"); const ins = `[${el.dataset.ev}] `; const p = t.selectionStart ?? t.value.length; t.value = t.value.slice(0, p) + ins + t.value.slice(p); S.draft.text = t.value; t.focus(); t.selectionStart = t.selectionEnd = p + ins.length; render(); break; }
    case "dup-keep": $("send-warn").hidden = true; tick(); S.sends.push({ id: `s${++S.seq}`, n: S.seq, target: S.draft.target, mode: S.draft.mode, text: S.draft.text.trim(), status: "duplicate", at: S.clock }); log(`Duplicate direction kept as one; not sent.`); S.draft.text = ""; $("draft").value = ""; render(); break;
    case "send-anyway": sendDirection(true); break;
    case "send-follow": sendDirection(true); break;
    case "send-replace": { const f = S.sends.find(x => x.id === el.dataset.send); if (f) { f.status = "superseded"; log(`#${f.n} replaced by the operator.`); } sendDirection(true); break; }
    case "send-cancel": $("send-warn").hidden = true; break;
    case "check-receipt": { const s = S.sends.find(x => x.id === el.dataset.send); if (s) { tick(); s.status = "delivered"; log(`#${s.n}: receipt check found it recorded; continuing without resending.`); say(`Direction #${s.n} was recorded. It was not sent twice.`); render(); if (S.auto) advanceLater(s); } break; }
    case "copy-back": { const s = S.sends.find(x => x.id === el.dataset.send); if (s) { S.draft.text = s.text; S.draft.target = s.target; render(); $("draft").focus(); } break; }
    case "advance": if (advance(el.dataset.send)) render(); break;
    case "pause": S.pause = "pause-requested"; tick(); log("Pause requested for A3."); say("Pause requested. A3 is still running until its next checkpoint."); render(); setTimeout(() => { if (S.pause === "pause-requested") { S.pause = "paused"; S.pauseAt = S.clock; S.pauseEvidence = S.evidence.length; tick(); log("A3 paused at a checkpoint."); say("A3 is paused."); render(); } }, S.auto ? 2400 : 50); break;
    case "resume": { const changed = S.evidence.length !== S.pauseEvidence; S.pause = "running"; tick(); log(`A3 resumed${changed ? " with new evidence E4" : "; no evidence changed since the pause"}.`); say(changed ? "Resumed. Evidence changed while paused: E4 was added." : "Resumed. Nothing changed while paused."); releaseHeld(); render(); break; }
    case "resume-recipient": S.recipient = "running"; tick(); log("A3 session resumed with current evidence (simulated)."); say("A3 resumed. Held directions are delivered now."); releaseHeld(); render(); break;
    case "preview-continuation": select("ppn-plan"); break;
    case "pick-cont": S.preview = el.dataset.cont; render(); break;
    case "launch": { tick(); const scope = (S.preview || "one") === "one" ? "A3 only" : "A3 → A5, stopping at the A4 gate"; if (S.continuation && S.continuation.includes(scope)) { S.continuation = `Already running for ${scope}. No second writer was created; this launch was not repeated.`; log("Repeated launch refused: same scope already running (simulated)."); } else { S.continuation = `Simulated launch recorded for ${scope} at ${clockLabel(S.clock)}. Nothing started for real.`; log(`Simulated continuation launched: ${scope}.`); } render(); break; }
    case "adopt-preview": { const txt = $("adopt-text").value; const title = (txt.match(/^#\s*(?:Plan:\s*)?(.+)$/m) || [, "Untitled plan"])[1].trim(); const items = [...txt.matchAll(/^\s*[-*]\s+(.+)$/gm)].map(m => m[1].trim()); S.adoptPreview = { title, items }; render(); break; }
    case "adopt-go": if (S.adoptPreview) { S.adopted.push({ n: S.adopted.length + 1, title: S.adoptPreview.title }); log(`External plan adopted as a proposal: ${S.adoptPreview.title}.`); S.adoptPreview = null; render(); } break;

    case "d04-refresh": S.d04Refreshed = true; log("Feed snapshot refreshed: D-04 already answered."); render(); break;
    case "manual-keep": S.manual.conflict = null; log("Operator kept the direct edit; agent told to build on it."); render(); break;
    case "manual-apply": S.manual.conflict = null; log("Operator let the pending direction apply on top of the edit."); render(); break;
    case "sim": simulate(el.dataset.sim); break;
    case "reset": try { localStorage.removeItem(KEY); } catch {} S = initial(); $("draft").value = ""; $("send-warn").hidden = true; render(); say("Demo reset."); break;
  }
});
function releaseHeld() { S.sends.filter(s => s.status === "held" && s.target === "A3").forEach(s => { s.status = "submitted"; if (S.auto) advanceLater(s); }); }
function closeSheets() {
  $("context").classList.remove("sheet-open"); $("direction").classList.remove("sheet-open"); $("scrim").hidden = true;
  document.querySelectorAll('[data-act="toggle-context"], [data-act="toggle-moves"]').forEach(b => b.setAttribute("aria-expanded", "false"));
}
function simulate(kind) {
  if (kind === "arrive") arrive();
  if (kind === "evidence") addEvidence(false);
  if (kind === "stop") { S.recipient = "stopped"; tick(); log("A3 agent session stopped (simulated)."); inFlight("A3").filter(s => ["submitted", "delivered"].includes(s.status)).forEach(s => { s.status = "held"; }); }
  if (kind === "flaky") { S.flaky = true; log("Next send will lose its connection."); }
  if (kind === "prs") { S.prs = S.prs === "down" ? "ok" : "down"; log(`Pull request source ${S.prs === "down" ? "unavailable" : "restored"}.`); }
  if (kind === "empty") { S.emptyFeed = !S.emptyFeed; }
  if (kind === "manual") {
    tick(); const base = revCopy(latest()); const pending = inFlight("A3")[0];
    const manual = { hero: "Fewer no-shows. A calmer private practice.", recog: base.recog, claims: [["Fewer no-shows", ["E1"]], ["calmer practice", ["E3"]], ...base.claims.filter(c => !/no-shows|calmer|Evenings|after-hours|overnight|growth|proven|Grow/i.test(c[0]))] };
    const n = latest().n + 1; S.revs.push({ n, lib: latest().lib, manual, by: "operator", at: S.clock });
    S.manual = { rev: n, at: S.clock, conflict: pending ? pending.n : null };
    log(`Operator edited hero.md directly (simulated); comparison re-based on r${n}.`);
  }
  if (kind === "reload") {
    // With a draft, submit it and reload before any confirmation arrives; otherwise just reload to show the draft survives.
    if (S.draft.text.trim()) { const auto = S.auto; S.auto = false; sendDirection(true); S.auto = auto; }
    save(); location.reload(); return;
  }
  render();
}

$("auto").addEventListener("change", e => { S.auto = e.target.checked; render(); if (S.auto) S.sends.filter(s => ["submitted", "delivered", "acknowledged"].includes(s.status)).forEach(advanceLater); });
$("auto-events").addEventListener("change", e => { S.autoEvents = e.target.checked; save(); });
document.addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details.section") && S.open[d.dataset.sec] !== d.open) { S.open[d.dataset.sec] = d.open; if (d.dataset.sec === "understand" && d.open) seeRec(); save(); const steps = document.querySelector(".ladder-steps"); if (steps) renderTable(); } }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("console").hidden) { $("console").hidden = true; document.querySelector('[data-act="toggle-console"]').focus(); } closeSheets(); } });
addEventListener("resize", () => { renderTable(); if (S.lens === "map") drawMap(); });

// ---------- boot ----------
S = load();
// A send that was only submitted when the page reloaded has no confirmation: it becomes unknown, never resent.
S.sends.forEach(s => { if (s.status === "submitted") { s.status = "unknown"; S.log.push(`${clockLabel(S.clock)} Reload interrupted #${s.n} before confirmation; marked unknown and not resent.`); } });
render();
S.sends.filter(s => ["delivered", "acknowledged"].includes(s.status)).forEach(s => { if (S.auto) advanceLater(s); });
seeRec();
})();
</script>
