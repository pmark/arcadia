{"agent_ask":"v1","request_id":"design-agent-ask-discovery-2026-09-13","project":"arcadia","intent":"action","desired_result":"Design and build the mechanism that discovers unprocessed .arcadia/asks/ files whenever a real Arcadia workspace becomes available, regardless of which command or environment triggered that availability.","rationale":"agent-ask draft (PR #232) made filing an Ask cheap and reliable from any environment, including a cloud container with no local Arcadia workspace, and settle now archives a files source file automatically once its disposition is terminal. But nothing yet notices a freshly-filed Ask that arrived from an environment with no workspace (e.g. committed from a cloud coding-agent session) once a workspace-having environment finally touches the repo. A prior idea of hooking discovery into arcadia go specifically does not work: go can itself run in a cloud container with no workspace present, so it is not a reliable proxy for workspace availability. The right hook point is inside whichever agent-ask command (draft or preview) already successfully resolves a workspace, since that is the only place this can ever actually happen.","acceptance":["A design is written down (in the Action, a Decision, or a short doc) naming exactly where discovery hooks in and why, given that arcadia go is not a reliable trigger.","Every .arcadia/asks/*.yaml file whose request_id the database does not yet know is previewed automatically the next time any agent-ask command successfully resolves a real workspace in that repository, with no separate command required.","A file that fails validation during automatic discovery is reported clearly (e.g. in that commands own output) rather than silently swallowed or left to repeatedly fail on every future command.","Test coverage proves discovery fires from more than one entry point (e.g. both draft and preview), not only from a single hardcoded command."],"dependencies":[]}
