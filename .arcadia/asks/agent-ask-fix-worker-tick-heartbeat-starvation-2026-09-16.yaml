{"agent_ask":"v1","request_id":"fix-worker-tick-heartbeat-starvation-2026-09-16","project":"arcadia","intent":"action","desired_result":"Keep the go/preservation transport heartbeat fresh while the managed-production worker tick runs, and cut the tick's per-iteration cost so the ~85s synchronous iteration stops starving the 15s freshness window that arcadia go and preservation requests require.","rationale":"Diagnosed 2026-09-16: each runManagedProductionIteration takes 83-86s per tick (discoverDocs repo walks, YAML parsing and spawnSync across every active Project), while preservationTransportReady requires a heartbeat younger than 15s and the heartbeat is only written at tick start. The transport flaps READY/NOT READY and the go-broker launchers usually refuse with the misleading remedy to start the worker. The 5s interval in runWorkerStartCommand only refreshes worker.heartbeat, not preservation.heartbeat.","actions":[{"id":"refresh-preservation-heartbeat-off-tick","desired_result":"Preservation transport heartbeat stays fresh during a long worker tick without lying about its routes.","acceptance":["The 5s worker loop re-stamps the existing preservation heartbeat projection (schema arcadia-preservation-transport-v1) with an updated at timestamp and unchanged routes while a tick is in progress, so a concurrent arcadia go-broker status reports both transports READY continuously across a multi-minute runManagedProductionIteration.","A deterministic test covers heartbeat freshness during a simulated long tick, and the existing go-request transport tests still pass."],"dependencies":[]},{"id":"cut-managed-production-tick-cost","desired_result":"The managed-production tick stops repeating per-Project whole-tree document discovery, YAML parsing and spawnSync every iteration, and the living-songbook tick failure is not re-observed every tick.","acceptance":["The per-tick managed-production iteration no longer re-walks and re-parses unchanged Project trees every tick (observed cost drops from ~85s to seconds in a profiled run, with a before/after measurement recorded as evidence), and per-Project detection semantics are unchanged.","A determinism-failing base-branch observation such as the living-songbook one is logged once and retried only when its inputs could have changed, rather than every ~70s tick, with an existing named failure log line retained.","pnpm test and the core, Discord, and Dashboard builds pass, and codex/claude launch, refusal, and reconciliation behavior is unchanged."],"dependencies":["refresh-preservation-heartbeat-off-tick"]}],"requested_authority":"propose"}
