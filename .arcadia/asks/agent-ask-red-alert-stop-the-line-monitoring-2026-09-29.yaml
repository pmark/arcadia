{"agent_ask":"v1","request_id":"red-alert-stop-the-line-monitoring-2026-09-29","project":"arcadia","intent":"action","requested_authority":"propose","desired_result":"Surface every stop-the-line failure in managed production as a red alert with evidence, then run one bounded diagnosis so a fix can be put in place immediately.","rationale":"A failed Session must not depend on an operator reading a status list or an agent choosing to notify. The operator wants excellent session monitoring and a red alert that leads straight to diagnosis and a fix.","actions":[{"id":"raise-red-alert-on-stop-the-line-failures","desired_result":"Detect stop-the-line failures deterministically in the worker tick and record a red alert with evidence and a Discord post.","acceptance":["docs/arcadia-semantics.md defines a red alert as a managed-production failure that meets the Stop the line test, and lists the triggers: an admission refused on consecutive ticks, a Session past its stall window, a failed reconcile, and a failure repeating after the repair budget.","The worker tick detects each trigger with no model call and records one red alert per distinct failure, with the Project, Action, Session id, trigger, first-seen time, and the log or artifact path that shows the cause; a repeat of the same failure updates the alert instead of creating another.","Each new red alert posts once to the configured notification channel with its request id, the Action, the trigger and a link to the evidence, and production status lists open red alerts before every other section.","Deterministic tests cover each trigger raising exactly one alert, a repeat updating it, and an alert clearing when the failure resolves; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":[]},{"id":"diagnose-red-alerts-and-propose-the-fix","desired_result":"Run one bounded diagnosis per red alert that files the Issue and proposes the fix Action, never merging changes to safety gates.","acceptance":["An open red alert starts at most one bounded diagnosis with a declared token budget, which reads the alert evidence, files or updates one bug Issue with file:line evidence, and records a proposed fix Action through an Agent Ask.","A diagnosis whose fix touches the concurrency gate, admission policy, approval boundaries or credentials stops at an open pull request for the operator and is never merged automatically.","A diagnosis that exceeds its budget or finds no cause records that fact on the alert and leaves it open and visible; it does not retry.","Deterministic tests cover the single-diagnosis limit, the budget stop, and the safety-gate refusal; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":["raise-red-alert-on-stop-the-line-failures"]},{"id":"prove-red-alert-with-injected-failures","desired_result":"Prove the red alert and diagnosis path fire end to end by injecting failures into the hermetic rehearsal harness.","acceptance":["tests/rehearsal-two-action.test.ts or a sibling suite injects a stalled Session, a refused admission on consecutive ticks and a failed reconcile through tests/helpers/rehearsalHarness.ts, and asserts each raises its red alert with evidence.","The suite asserts the alert posts one notification and starts one bounded diagnosis, and that resolving the failure clears the alert.","The suite runs in the standard pnpm test run with no live production grant and no network; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":["diagnose-red-alerts-and-propose-the-fix"]}]}
