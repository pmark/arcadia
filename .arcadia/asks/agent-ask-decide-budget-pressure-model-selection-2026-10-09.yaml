{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-budget-pressure-model-selection-2026-10-09","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide what deterministic model and effort selection does when a task's required capability and the remaining budget conflict.","rationale":"The operator wants a just-in-time, deterministic model and effort decision that weighs every relevant factor and picks the most cost-effective model for the task and role. The plan treats determinism and the input set as given: role defaults, the task's capability, effort and escalation triggers, provider availability and hard evidence, capacity and reserve state, costRank, review independence, and prior attempts. The one open judgment is behavior under budget pressure. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Queue, and never under-provision. The selector never goes below the task's required capability. Under pressure it picks the cheapest compliant model, and if none fits outside the reserve, the request queues until capacity frees and is then declined","consequence":"Quality never drops below what the task needs, and the reserve is untouched. Under pressure, work slows down instead of getting worse, and 24/7 throughput stretches across resets.","recommended":true},{"label":"Drop one capability tier with a recorded underpowered risk, and require an independent review of the output","consequence":"Work keeps moving under pressure. Expect more repair attempts and review cost, and a real risk of poor results on hard tasks."},{"label":"Draw from the emergency reserve automatically for the current Action's work","consequence":"Flow continues, but it uses up the reserve the operator asked to keep for urgent issues, which defeats its purpose."}],"references":["src/codingAgents/providerAdapters.ts","config/defaults/provider-adapters.json","src/execution/profiles.ts","docs/model-selection.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
