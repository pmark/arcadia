{"agent_ask":"v1","request_id":"amend-ready-set-admission-actions-after-review-2026-09-25","project":"arcadia","intent":"plan","desired_result":"Amend the ready-set admission Actions per the adversarial review: hold the settlement and current_action change behind the sequential proof, close the unknown-dependency and touches: holes, and make the concurrency proof runnable and able to observe what it claims to test.","rationale":"The adversarial review (docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md) found that the concurrency gate (admit-ready-set-across-repositories AC6) holds back maxConcurrentSessions > 1 but not AC2/AC3, which retire the settlement-advanced current_action on merge, the exact mechanism the operator wanted proven sequentially first (F1). AC3 names Decision 0070 host settler as sole writer, but that settler is held behind prove-two-action-unattended-production, so B2 cannot satisfy AC3 without bypassing that hold or stalling pointer-driven dispatch (F2). The gate sits in a pure validation function that activateProduction and issueAdmission never call, is checked once, and keys on the active Plan (F5); split marks a narrowed Action done, opening the gate and releasing dependents early (F4); B1 names only canonicalOrder while collectUnmetDependencies and the parser also treat unknown ids as satisfied or dangling (F6, F7); prove-concurrent-ready-set-admission cannot run against a gate with no exception and cannot observe a pointer race across two repositories (F3); touches: absent-vs-empty can invert the pipelining safe default (F10); a stalled Session silently holds a portfolio-wide host slot (F9). Filed as intent action with target_ref amendments, not intent plan, so the queue is not reflowed.","actions":[{"target_ref":"action/resolve-cross-plan-dependency-ids","desired_result":"Unknown or ambiguous depends_on ids block the Action in both ordering and dispatch readiness, resolving cross-Plan references by plan/<slug>#<action-id>, and a long-unresolved id escalates to the operator.","acceptance":["A depends_on id resolves first within the same Plan, then across the same Project's Plans as plan/<slug>#<action-id>; an id naming another Project must carry that Project; an id that resolves to a done Action on the base branch is satisfied; an id that matches more than one Action is reported as dependency_unresolved (ambiguous) and never resolved to either.","An id that does not resolve produces a dependency_unresolved wait reason and keeps the Action out of the ready set in every readiness path: collectUnmetDependencies (src/docs/dispatch.ts) and deriveStatus (src/scheduling/schedule.ts) as well as canonicalOrder (src/scheduling/order.ts), whose cycle fallback can never emit such an Action as runnable.","The plan parser (src/docs/parse.ts) accepts plan/<slug>#<action-id> dependency ids without reporting them as dangling, still reports ids that resolve nowhere, and detects dependency cycles that span Plans.","A dependency on a deferred Action is reported with a deferral wait reason, not dependency_unresolved.","An Action that stays dependency_unresolved for more than one worker tick is surfaced as an operator escalation naming the unresolved id, instead of waiting silently.","Deterministic tests cover: a same-Plan dependency, a cross-Plan dependency, a dependency that lands after being unresolved on an earlier tick, an id that never resolves (and is escalated), an ambiguous id, a cross-Plan cycle, and a dependency on a deferred Action; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":[],"references":["src/scheduling/order.ts","src/docs/dispatch.ts","src/docs/parse.ts","src/scheduling/schedule.ts","src/production/tick.ts","docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md","docs/proposals/portfolio-parallel-execution.md","docs/production-scheduling.md"]},{"target_ref":"action/admit-ready-set-across-repositories","desired_result":"Replace current_action as a settlement-advanced pointer with ready-set admission, after the sequential proof has validated the pointer it retires: the production tick admits Actions from the portfolio ready set in canonicalOrder across repositories, and Decision 0070 host settler becomes the pointer's only writer.","acceptance":["The production tick (src/production/tick.ts) computes the ready set from every in-scope Plan of every active Project -- status not done/deferred/needs_operator, every depends_on landed on the base branch, no live claim -- and launches in canonicalOrder up to host and per-repository lane limits, per docs/proposals/portfolio-parallel-execution.md section 3.","settleAgentAsk (src/ask/settlement.ts) stops calling selectNextAfterCompletion and stops writing current_action; a completion records its evidence and releases its claim only.","current_action becomes a derived projection -- the highest-priority claimed Action, or the highest-priority ready Action if nothing is claimed -- with exactly one writer, the host settler built by settle-squash-merged-completion-drafts and sweep-merged-completions-before-dispatch; settlement, deferral, advance, the scheduler's alignPointer (src/scheduling/scheduler.ts) and the arcadia go preflight all stop writing it, and a projection computed before the most recent settlement is refused rather than written.","A read-only status surface reports one wait reason per in-scope Action that did not launch this tick (dependency, dependency_unresolved, claimed, host_full, needs_operator, ...), recomputed every tick and never stored as truth.","A Session flagged stalled is named in the host_full wait reason of every Action it keeps from launching, so a stalled Session holding a host slot is visible instead of silently starving other repositories.","Deterministic tests cover: two ready Actions in different repositories launching in the same tick, an Action correctly excluded by a live claim, current_action reflecting the highest-priority claim with no settlement write, a projection computed before a later settlement being refused, and the #505/#507 race scenarios each closed; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":["resolve-cross-plan-dependency-ids","enforce-concurrency-gate-at-admission","rewire-dependents-on-split","prove-two-action-unattended-production","sweep-merged-completions-before-dispatch"],"references":["docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md","docs/decisions/0071-decide-whether-to-reopen-decision-0023-and-adopt-ready-set-admission-for.md","docs/decisions/0070-decide-whether-an-action-s-completion-settles-after-its-pr-merges-applied.md","docs/decisions/0066-record-when-arcadia-should-widen-beyond-one-coding-agent-session-per-repository.md","src/production/tick.ts","src/ask/settlement.ts","src/scheduling/scheduler.ts","src/scheduling/order.ts","src/production/policy.ts","docs/proposals/portfolio-parallel-execution.md"]},{"target_ref":"action/pipeline-independent-actions-while-pr-unmerged","desired_result":"Let an independent, non-overlapping Action start in a repository whose previous candidate PR is still unmerged, up to a per-repository review limit, using declared touches: scope to prevent overlap.","acceptance":["Plan Actions may declare touches: <paths>; an Action whose touches: is absent, empty, or not a list of paths (including a single scalar string) is treated as touching the whole repository and never pipelines.","Admission may start a new Action in a repository with an unmerged candidate only when the ready Action's declared touches: do not overlap the unmerged candidate's actual changed paths, and the repository's unmerged-candidate count is below the operator's configured review limit; otherwise it records scope_overlap or review_backlog as the wait reason.","Overlap is rechecked against both candidates' actual changed paths whenever either is pushed or preserved; a new candidate whose actual diff leaves its declared touches:, or an overlap that appears after admission, stops pipelining for that repository and is reported as scope_overlap.","Pipelining is available only once admit-ready-set-across-repositories, settle-squash-merged-completion-drafts and sweep-merged-completions-before-dispatch are all built, since the host settler must already be the sole current_action writer and merged completions must settle serially on main before a second unmerged candidate in one repository is safe.","Deterministic tests cover: a non-overlapping Action pipelining while the prior PR is unmerged, an overlapping Action refused with scope_overlap, a repository at its review limit refused with review_backlog, an empty or scalar touches: never pipelining, and an overlap introduced by a later push to the prior candidate being caught; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":["admit-ready-set-across-repositories","settle-squash-merged-completion-drafts","sweep-merged-completions-before-dispatch"],"references":["src/production/tick.ts","src/ask/settlement.ts","docs/proposals/portfolio-parallel-execution.md","docs/decisions/0071-decide-whether-to-reopen-decision-0023-and-adopt-ready-set-admission-for.md","docs/decisions/0070-decide-whether-an-action-s-completion-settles-after-its-pr-merges-applied.md","docs/decisions/0066-record-when-arcadia-should-widen-beyond-one-coding-agent-session-per-repository.md","docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md"]},{"target_ref":"action/prove-concurrent-ready-set-admission","desired_result":"Prove that two independent Actions in two different repositories launch and complete correctly from the same production tick under ready-set admission, with no settlement or pointer-projection race, before real concurrent admission is ever allowed.","acceptance":["Provide or reuse two disposable or explicitly approved real Projects/repositories, each with at least one ready Action that does not depend on the other, and a reachable existing production control (CLI or dashboard), before requesting live execution.","Under bounded rehearsal authority, with a policy scope activated at maxConcurrentSessions 2 or more through the expiring rehearsal exception defined by enforce-concurrency-gate-at-admission (the only path that lifts the concurrency cap before both proofs are done), one production tick admits and launches Sessions for both independent Actions in their separate repositories with no per-launch operator confirmation in between.","Both Sessions run to completion holding disjoint resources throughout: each Action's claim, worktree, and repository lease belong only to that Session, and neither Session's admission, launch, or settlement observably blocks or interferes with the other.","Both completions settle correctly in either order: each repository's current_action projection reflects that repository's correct highest-priority ready or claimed Action after each settlement, and the workspace-database state the two Sessions share (production admissions, the host-slot count, Action claims) shows no lost, duplicated or misattributed row; record which order happened live and cover the other order with a deterministic test against the new projection writer, not the removed selectNextAfterCompletion path.","Turn the standing policy Off while both Sessions are in flight; prove no new launch occurs, both in-flight Sessions reconcile visibly, and no duplicate or reactivated Session appears after Off.","Record exact revisions, hosts, providers, Action/Session identities, and receipts for both repositories; missing real authorization or input remains one precise review, never fixture-as-live success, and any deferred gap (same-repository pipelining, provider-account slots, review headroom) is named rather than implied proven.","This proof activates only once prove-two-action-unattended-production is status: done and admit-ready-set-across-repositories has shipped; preserve deterministic integration evidence and an exact operator procedure/target in the PR."],"dependencies":["admit-ready-set-across-repositories","prove-two-action-unattended-production"],"references":["docs/proposals/portfolio-parallel-execution.md","docs/decisions/0071-decide-whether-to-reopen-decision-0023-and-adopt-ready-set-admission-for.md","docs/decisions/0066-record-when-arcadia-should-widen-beyond-one-coding-agent-session-per-repository.md","docs/decisions/0051-decide-whether-sequential-coding-agent-sessions-for-the-same-governed-action-may.md","docs/operator-demo-and-release-contract.md","src/production/tick.ts","src/ask/settlement.ts","src/production/policy.ts","docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md"]}],"target_ref":"plan/bootstrap-managed-production-to-build-flight-deck"}
