{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"plan-governed-agent-roles-2026-10-09-r2","intent":"plan","desired_result":"Governed agent roles: one real Action and one interactive session each run as a light-tier session-start role that requests delegates through Arcadia, gets a deterministic model and effort or a recorded queue or decline, reports through its supervisor chain, stays inside the burn budget and operator reserve, and appears on /agents.","rationale":"Outcome: every Arcadia Session runs as a small governed team that starts on the smallest sufficient model in one named role, delegates only through Arcadia-admitted roles at a deterministic model and effort, reports through a supervisor chain ending at the operator, and keeps token burn inside a budget that always preserves an operator emergency reserve, visible on /agents. All eleven Decisions must be answered before this draft is activated: decide-session-start-role-name-2026-10-09-r2, decide-agent-role-taxonomy-2026-10-09, decide-which-roles-may-delegate-2026-10-09-r2, decide-delegation-admission-semantics-2026-10-09-r2, decide-supervisor-chain-2026-10-09-r2, decide-inter-agent-channel-2026-10-09, decide-burn-rate-and-emergency-reserve-2026-10-09-r2, decide-operator-reserve-size-2026-10-09, decide-budget-pressure-model-selection-2026-10-09-r2, decide-agents-page-scope-2026-10-09, decide-interactive-session-crutch-mapping-2026-10-09. The smallest usable slice ships first: the role registry, arcadia role brief (which says delegation is not live yet and points to an Agent Ask) and interactive role receipts work before the broker, reserve, supervisors or /agents exist. The selector and broker read capacity through a CapacityAdmission interface over today's capacity decision; reserve-operator-emergency-capacity later supplies the reserve-aware implementation, so there is no broker-reserve cycle. Every selection, admission, queue, reserve and burn-rate step is deterministic and makes zero model calls; models are spent only by each Action's own Session and admitted delegates. Real token_impact is large (15 bounded Sessions), but plan-intent settlement writes medium; propose-plan-ask-token-fields-2026-10-09 records that. Each Action names its recommended role in its text until add-action-role-field adds the field. Rationale: docs/reviews/2026-10-09-governed-agent-roles-design.md. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Create as an inactive draft only; activation, pointers and queue order stay with the operator.","references":["docs/reviews/2026-10-09-governed-agent-roles-design.md"],"actions":[{"id":"define-governed-role-registry","desired_result":"Add a checked-in governed role registry and a read-only arcadia roles command that lists each role's charter, attempt role, mutation right, delegation right, supervisor and default model tier and effort. Recommended role: implementer, standard tier. Waits on Decisions decide-session-start-role-name-2026-10-09-r2, decide-agent-role-taxonomy-2026-10-09 and decide-which-roles-may-delegate-2026-10-09-r2.","acceptance":["config/defaults/agent-roles.json (schema arcadia-agent-roles-v1) defines every role the answered taxonomy Decision names, each with id, purpose, attempt_role (a SESSION_ATTEMPT_ROLES value or null), identity_role (builder or critic), mutates, may_delegate, allowed_delegate_roles, max_delegation_depth, supervisor, default_tier and default_effort, and marks exactly one role as the session-start role under the answered name.","The session-start role's attempt_role follows the answered name Decision: development for Lead (or Foreman), or null for Coordinator (or Dispatcher), in which case the registry also names the single implementer delegate role that holds the development attempt; a test asserts that exactly one role per Action can hold development.","A loader under src/agentRoles/ validates the registry and refuses, naming the offending role and field, an unknown attempt_role, a mutating role whose attempt_role is not development, a critic-identity role that mutates, a delegate role missing from the registry, and a delegation depth above the answered delegator Decision's limit; a workspace config/agent-roles.json override merges the same way config/coding-agent-models.json does.","Tests prove every SESSION_ATTEMPT_ROLES value maps to at least one registry role, that the code-review and qa roles require independent lineage, and that the bundled registry loads byte-stably.","arcadia roles --json (schema arcadia-roles-v1) and arcadia roles show <id> print the registry with zero model calls and no workspace writes."],"dependencies":[],"references":["src/sessions/enrollment.ts","src/sessions/roleLineage.ts","src/codingAgents/agentIdentity.ts","src/codingAgents/modelTiers.ts"]},{"id":"render-role-brief","desired_result":"Add arcadia role brief so any interactive or launched Session can print the governed brief for its role today, and add that role block to the Action brief. Recommended role: implementer, standard tier.","acceptance":["arcadia role brief --role <id> --agent <codex|claude|opencode> --tier <light|standard|heavy> prints the role's charter, what it may and may not do, its supervisor, its delegation rights, the Identity block from renderIdentityBlock, and the resolved start and escalation models; --json emits schema arcadia-role-brief-v1.","Until the arcadia delegation command exists, the delegation section says exactly that delegation is not live yet and that a delegate is requested through an Agent Ask (intent proposal, requested_authority propose); once the command exists, it prints the exact request command instead, and a test covers both states.","With --action <plan-slug>#<action-id> the brief also quotes that Action's next action and acceptance criteria verbatim, and refuses with a named error when the Action is missing or declares no criteria, as renderActionBrief does.","renderActionBrief adds a Role section for the session-start role with the same text, and the existing actionBrief tests pass with updated snapshots.","The command makes zero model calls and writes nothing; a snapshot test pins one brief per agent."],"dependencies":["define-governed-role-registry"],"references":["src/sessions/actionBrief.ts","src/qa/prReview.ts","src/codex/packets.ts"]},{"id":"record-interactive-role-sessions","desired_result":"Let an interactive coding-agent session record its role start and end from day one, so it is reported the same way as managed Sessions. Recommended role: implementer, light tier. Waits on Decision decide-interactive-session-crutch-mapping-2026-10-09.","acceptance":["Under the recommended option, arcadia role start --role <id> --agent <a> --tier <t> --label <title> [--action <plan-slug>#<action-id>] records an idempotent activity receipt and prints the role brief, and arcadia role end <receipt-id> --state <done|handed_off|needs_input> closes it; under the enrollment option the same is done through native-adopt enrollment.","arcadia role list --json shows open and recent receipts with role, agent, tier, label, Action and start time, so interactive sessions are visible before any broker or page exists.","A role start makes zero model calls, grants no claim or lease, and refuses an Action that another live Session claims.","Tests cover start, end, replay, list and claimed-Action refusal; the receipt id is the handle later delegation requests cite."],"dependencies":["define-governed-role-registry","render-role-brief"],"references":["src/sessions/hostEnrollment.ts","docs/agent-guidance/operator-directed-work.md","docs/harness-engineering.md"]},{"id":"add-action-role-field","desired_result":"Add an optional role field to Plan Actions and to Agent Ask action children so a Plan records each Action's recommended role, validated against the registry. Recommended role: implementer, standard tier.","acceptance":["The plan parser reads role on an Action into PlanActionDoc, and document validation refuses an unknown role id with the Plan, Action and field named; an Action without role stays valid.","arcadia agent-ask contract lists role among action fields, preview validates it against the registry, settling a plan or action Ask writes role into each created Action, and a target_ref amendment changes it.","arcadia roles --unassigned lists, per draft or active Plan, the open Actions that declare no role, with zero model calls.","Tests cover create, amend, unknown-role refusal and a legacy Action without role."],"dependencies":["define-governed-role-registry"],"references":["src/docs/types.ts","src/ask/settlement.ts","docs/managed-documents.md","docs/agent-guidance/agent-asks.md"]},{"id":"teach-planners-divide-and-conquer-roles","desired_result":"Update the Staff Planning Architect prompt and the planner packet prompt so every planned Action names its recommended role and is sized for one Session in that role. Recommended role: implementer, light tier.","acceptance":["docs/planning-process.md's Phase 2 prompt requires each Action to carry role, to split work needing two roles' authority into separate Actions, and lists role in its Deliverable.","The planner packet prompt rendered by src/codex/packets.ts carries the same requirement, and a test asserts the text.","The Phase 2 prompt names arcadia roles --unassigned as the check a planner runs before submitting its plan Ask."],"dependencies":["add-action-role-field"],"references":["docs/planning-process.md","src/codex/packets.ts"]},{"id":"select-model-for-delegated-task","desired_result":"Build the deterministic just-in-time model and effort selector for a role and task, reading capacity through an admission interface, with a dry-run command and a golden table. Recommended role: implementer, standard tier, with a plan-critic review of the golden table. Waits on Decision decide-budget-pressure-model-selection-2026-10-09-r2.","acceptance":["selectDelegateModel takes the role's registry defaults, the task's capability, effort and escalation triggers in src/execution/profiles.ts vocabulary, provider enablement and hard evidence, a capacity admission result, costRank, review-independence exclusion and prior attempt outcomes, and returns provider, model, effort, every rejected candidate with its reason, and a sha256 of its normalized inputs.","Capacity reaches the selector only through a CapacityAdmission interface whose first implementation wraps the existing capacity admission decision unchanged (src/codingAgents/capacity.ts); a test proves a fake implementation can refuse a provider, so a reserve-aware implementation can be swapped in later without changing the selector.","It extends selectCompliantCodingAgent rather than replacing it, and config/defaults/provider-adapters.json gains c1_bounded bindings for the light-tier models already pinned in src/codingAgents/modelTiers.ts.","It never selects below the task's required capability, never draws on any operator reserve, behaves under budget pressure as the answered Decision says, and raises the next selection by one tier after a failed attempt at a tier, capped at heavy.","A checked-in golden table of at least 12 cases, including capacity refused, provider excluded and after a failure, passes, and identical inputs produce byte-identical output; arcadia delegation plan --role <id> --capability <tier> --effort <level> --json prints the selection with zero model calls and no writes."],"dependencies":["define-governed-role-registry"],"references":["src/codingAgents/providerAdapters.ts","config/defaults/provider-adapters.json","src/execution/profiles.ts","src/codingAgents/capacity.ts","docs/model-selection.md"]},{"id":"enforce-smallest-model-session-start","desired_result":"Make every Session launch start on the selector's smallest compliant model for the session-start role, record its start tier, and refuse a heavier start without a recorded reason. Recommended role: implementer, standard tier.","acceptance":["arcadia go --launch, arcadia session launch, the dashboard launch and the managed-production tick choose the start model with selectDelegateModel for the session-start role, and record start tier, model, effort, selector input hash and any start reason on the Session or enrollment row.","A start above that choice, through an explicit --model, a sessionStartTier override above the selector's tier or the plan's tier, is refused unless --start-reason <text> is given; the reason is recorded and printed by arcadia go and in the Action brief.","arcadia session show --json reports start tier, model and reason, and a Session without a recorded start tier reads as unknown, never light.","Tests cover the default light start, an explicit heavier start refused without a reason, the same start admitted with a reason, and the managed-production path."],"dependencies":["select-model-for-delegated-task"],"references":["src/codingAgents/modelTiers.ts","src/commands/go.ts","src/sessions/actionBrief.ts","docs/model-selection.md"]},{"id":"broker-delegation-requests","desired_result":"Build the delegation broker: arcadia delegation request admits, queues or declines a subagent request with a recorded receipt and lease, and arcadia delegation finish closes it. Recommended role: implementer, standard tier. Waits on Decisions decide-which-roles-may-delegate-2026-10-09-r2 and decide-delegation-admission-semantics-2026-10-09-r2.","acceptance":["A migration adds a delegation_requests store; each row records request id, the requester's agent, tier, role and Session id or role-start receipt, the Project and Action when known, requested role, one-line task, requested capability and effort, verdict (admitted, queued, declined, finished or expired), reason code, the provider, model and effort from selectDelegateModel, supervisor, lease expiry and timestamps; replaying a request id returns the original receipt and changed content under it is refused.","Admission is deterministic: it declines a role the registry does not let the requester delegate to, a depth above the limit, and a code-reviewer or qa request made as an in-process child of the mutating Session (returning the existing independent review path instead); it queues when the per-lead or per-provider concurrency cap is reached or the CapacityAdmission interface refuses.","Queued requests are re-evaluated in FIFO order, deterministically, on every delegation finish, on every lease expiry and on arcadia delegation poll <id>, which the waiting requester runs; one still not admissible when its bounded wait (default 30 minutes) ends is declined as queue_timeout.","Every admitted receipt carries a lease (default TTL 60 minutes, renewable once per arcadia delegation renew <id>); an unfinished lease past its TTL is marked expired and frees its capacity, so a crashed lead cannot hold capacity.","The broker fails closed: when it cannot read or write its store, or any check errors, it returns no admission with reason broker_unavailable and the caller is told to continue without the delegate; arcadia delegation finish <id> --outcome <done|failed|abandoned> and arcadia delegation list --json work as described, and tests cover admit, each decline reason, queue, promotion on finish, expiry and poll, queue timeout, lease expiry, broker unavailable, replay and refused changed replay, with zero model calls."],"dependencies":["select-model-for-delegated-task","record-interactive-role-sessions"],"references":["src/db/schema.ts","src/sessions/roleLineage.ts","src/qa/prReview.ts"]},{"id":"route-subagent-spawns-through-broker","desired_result":"Make every Session brief and the headless Claude settings route subagent spawns through the delegation broker, replacing the prose-only Calling in help path. Recommended role: implementer, standard tier. Waits on Decision decide-delegation-admission-semantics-2026-10-09-r2 for the enforcement mechanism.","acceptance":["renderCallingInHelp is replaced by a section telling the agent to run arcadia delegation request first and to spawn only an admitted delegate with the returned model and effort; on queued it continues other work and polls, on declined or broker_unavailable it proceeds without the delegate or files an Agent Ask.","The headless Claude per-Session allow list widens by exactly the delegation request, poll, renew and finish commands (and the hook command if a hook is chosen); the change is called out in the brief and in START_HERE.md, and the headlessPermissions tests prove nothing else is widened.","If the answered Decision chooses hook enforcement, the Arcadia-written headless Claude settings add a PreToolUse rule on the Agent tool that permits a spawn only when an admitted, unexpired, unspawned receipt exists for that Session and the Agent call's model equals the admitted model; the hook marks the receipt spawned, so a second spawn on one receipt is denied, and a missing broker denies the spawn. Tests cover each case.","The Codex and opencode briefs state the convention and say plainly that spawns outside the broker are neither prevented nor detected afterwards for those providers.","The existing actionBrief and headlessPermissions tests pass with updated snapshots."],"dependencies":["render-role-brief","broker-delegation-requests"],"references":["src/sessions/actionBrief.ts","src/sessions/headlessPermissions.ts","docs/model-selection.md","START_HERE.md"]},{"id":"reserve-operator-emergency-capacity","desired_result":"Supply a reserve-aware CapacityAdmission implementation with an operator emergency reserve that no agent can spend or shrink without an operator-verified receipt. Recommended role: implementer, standard tier. Waits on Decisions decide-burn-rate-and-emergency-reserve-2026-10-09-r2 and decide-operator-reserve-size-2026-10-09.","acceptance":["config/defaults/token-budget.json (schema arcadia-token-budget-v1) sets the reserve per provider window at the answered size and replaces the fixed reserveMarginPercentage (src/codingAgents/capacity.ts:164); a workspace config/token-budget.json may only raise the reserve, and an override that would lower it is ignored, reported by arcadia production capacity, and leaves the effective reserve unchanged.","Releasing reserve or lowering its size requires an operator receipt produced only by a one-shot kind grant /runs operator script under docs/agent-guidance/operator-actions.md, pinning provider, window, amount and expiry; arcadia production capacity attest is not accepted as that receipt.","Any agent-invoked reserve use or reserve change without a valid, unexpired, unconsumed operator receipt is refused with reason operator_receipt_required, and tests prove refusal for a CLI call, a workspace-file edit and a replayed or expired receipt.","Every consumer of the CapacityAdmission interface (production admission, the selector and the delegation broker) refuses or queues work on a window that has reached the reserve, with reason operator_reserve, and a stale or missing observation never counts as available capacity.","arcadia production capacity shows each window's reserve, its remaining non-reserve allowance and any active operator release receipt."],"dependencies":["select-model-for-delegated-task"],"references":["src/codingAgents/capacity.ts","src/commands/capacity.ts","src/production/policy.ts","docs/agent-guidance/operator-actions.md","docs/plans/provider-capacity-harvesting.md"]},{"id":"project-token-burn-rate","desired_result":"Store capacity observations as history, compute each provider window's burn rate and projected time to the reserve, and throttle new delegations and then new Sessions when the reserve would be crossed before reset. Recommended role: implementer, standard tier.","acceptance":["Each capacity refresh appends its normalized observation to a bounded append-only history store, and burn rate per provider window is derived from it deterministically, with an explicit unknown state when samples are too few or stale.","When projected use reaches the reserve before the window resets, the reserve-aware CapacityAdmission queues new delegations with reason burn_rate; if the projection still crosses, production admission stops admitting new Sessions; both lift when the projection clears.","arcadia production capacity --json reports burn rate, projected reserve-crossing time, reset time and throttle state per window.","Tests with fixture observation series cover steady, spiking, too-few-samples and post-reset cases, with zero model calls."],"dependencies":["reserve-operator-emergency-capacity"],"references":["src/codingAgents/capacity.ts","src/production/policy.ts"]},{"id":"assign-supervisors-and-relay","desired_result":"Resolve a supervisor for every agent deterministically, give each role a relay path to it, and add a read-only team view. Recommended role: implementer, standard tier. Waits on Decisions decide-supervisor-chain-2026-10-09-r2 and decide-inter-agent-channel-2026-10-09.","acceptance":["supervisorFor returns, for any delegate, Session or role-start receipt, its supervisor as the answered supervisor-chain Decision defines, ending at operator, and every delegation receipt records it.","A relay to a supervisor uses the answered channel; under the reuse option it is an Agent Ask with intent proposal whose references cite the requester's delegation, Session or role-start id, and arcadia agents team --session <id> --json lists the team and its relays.","The role brief lists the duties the answered Decision assigns to each supervisor and maps each to an existing command, and states plainly any duty no agent performs (under the recommended option, team direction and cross-Session learning above the lead).","Tests prove the chain ends at the operator for every registry role, and that no relay can approve, settle or dispatch anything."],"dependencies":["render-role-brief","broker-delegation-requests"],"references":["docs/agent-guidance/agent-peer-watch.md","docs/agent-guidance/agent-comms.md","src/agentWatch/classify.ts","src/production/stallDetection.ts"]},{"id":"build-agents-overview-read-model","desired_result":"Build the read-only arcadia agents overview read model that joins Sessions, role-start receipts, delegations, supervisors and per-provider burn and reserve state. Recommended role: implementer, standard tier.","acceptance":["arcadia agents overview --json (schema arcadia-agents-overview-v1) returns a team tree per Session or role-start receipt with role, supervisor, delegates and their verdicts, provider, model and effort, start tier and reason, last activity and state, plus per-provider burn rate, reserve and throttle state.","States come only from governed rows and peer-watch classification; anything unreadable is unknown, never healthy, and stale data carries its age.","Fixture tests cover an active team, a queued and a declined delegation, an expired lease, an interactive session and a throttled provider, with zero model calls and no writes."],"dependencies":["record-interactive-role-sessions","assign-supervisors-and-relay","project-token-burn-rate","enforce-smallest-model-session-start"],"references":["src/timeline","src/agentWatch/classify.ts","docs/proposals/operator-timeline.md"]},{"id":"build-agents-page","desired_result":"Add the dashboard /agents page that renders the agents overview read model. Recommended role: implementer, standard tier, with a qa review. Waits on Decision decide-agents-page-scope-2026-10-09.","acceptance":["/agents renders arcadia agents overview without recomputing any state, showing each team tree and the per-provider burn rate, reserve and throttle state, with unknown and stale states labelled.","The page is read-only under the recommended option; any control the answered Decision adds calls an existing command and leaves a receipt, and no control can release or shrink the operator reserve.","START_HERE.md names the route, and a dashboard test renders the read model's fixtures."],"dependencies":["build-agents-overview-read-model"],"references":["apps/dashboard/app/production","START_HERE.md"]},{"id":"prove-governed-role-team-end-to-end","desired_result":"Prove the scheme on one Action and one interactive session: a light-tier session-start Session gets one admitted, one queued and one declined delegation, relays to its supervisor, stays outside the reserve, and appears on /agents. Recommended role: qa, standard tier, independent of the implementers; the interactive leg is an operator step.","acceptance":["An offline fast-rehearsal test drives a fixture Action through a light-tier launch in the session-start role with a recorded start tier, one admitted delegate whose model equals selectDelegateModel's choice, one queued-then-admitted delegate, one declined delegate, one expired lease, one supervisor relay and Session completion, asserting every receipt.","In an operator step, the operator starts one interactive session that runs arcadia role start, arcadia delegation request and arcadia role end; the QA Session records that session's receipt ids in the completion evidence and checks them.","arcadia agents overview --json and the /agents page show both teams with the correct roles, supervisors, verdicts, start tiers and reserve state.","No delegation in either run consumed the operator reserve, and the headless Claude Session shows no subagent spawn without an admitted receipt."],"dependencies":["route-subagent-spawns-through-broker","build-agents-page"],"references":["docs/harness-engineering.md"]}]}
