ync reports zero duplicate-id issues for these two pairs afterward, and pnpm test and the core, Discord, and Dashboard builds pass."], "dependencies": ["prove-two-action-unattended-production"], "references": []}, {"target_ref": "action/generate-operator-scripts-for-runs-approvals", "desired_result": "Extend the /runs approval queue to derive bounded operator scripts for scriptable approval steps, expose full descriptor detail, and cover the remaining acceptance criteria with tests.", "acceptance": ["For every bounded scriptable operator step Arcadia derives, it writes a short-lived script and an arcadia-operator-script-v1 descriptor only beneath artifacts/generated/operator-scripts/; /runs displays the descriptor's problem, desired effect, exact CLI invocation, checksum, prerequisites, authority boundary, success next step, and failure next step.", "A script failure writes a timestamped, immutable failure handoff and complete run log beneath that script's generated directory; /runs exposes both as the exact input for a coding agent to diagnose the first failed command and propose a narrower follow-up script.", "The /runs execute control sends only the selected fingerprinted script descriptor to the host-side service controller; it records output and a durable receipt, refuses when that controller is unavailable or the descriptor is stale, and never lets a browser execute an arbitrary command.", "Regression tests cover prioritization, minimal-versus-expanded rendering, stale-preview refusal, successful operator settlement, generated-script integrity, failure-handoff generation, unavailable-host refusal, and successful host-mediated execution."], "dependencies": ["surface-terminal-operator-approvals-in-runs", "prove-two-action-unattended-production"], "references": ["apps/dashboard/app/api/approvals", "apps/dashboard/components/approval-queue.tsx", "apps/dashboard/app/api/operator-script", "artifacts/generated/operator-scripts"]}]}
