{"agent_ask": "v1", "request_id": "gate-dispatch-to-production-critical-path-2026-09-25", "project": "arcadia", "intent": "plan", "target_ref": "plan/bootstrap-managed-production-to-build-flight-deck", "requested_authority": "propose", "desired_result": "Reactivate the bootstrap Plan and hold every Action off the automated-production critical path until prove-two-action-unattended-production is done, so arcadia go selects only critical-path work.", "rationale": "Operator instruction 2026-09-25: only Actions on the critical path to automated production should be chosen by arcadia go, since once automated production is live every other Plan can be built faster. Settling activate-mc-site-tooling-plan-2026-09-25 returned this Plan to draft, and cross-Plan Go then picked the agent-ask-execution-queue Plan. Adding the proof as a sequencing dependency (titles, acceptance and references restated verbatim, only depends_on extended) keeps these Actions ordered but ineligible; removing it is one amendment once the proof is done.", "actions": [{"target_ref": "action/add-segment-queue-arrange", "desired_result": "Add a batch queue operation that places an ordered list of keys at one position, keeping every other row's relative order, and make settle placement preserve the active Plan's existing relative order.", "acceptance": ["One `arcadia advance queue` invocation places an ordered list of existing approved keys at the top, or before or after an anchor, with preview, --apply, --request-id idempotency, and --revision optimistic concurrency; every key not listed keeps its relative order, and the whole move commits atomically as one queue revision.", "The command refuses, before writing, an order that puts an Action ahead of a dependency, naming the offending key and dependency.", "`agent-ask settle` with --top, --before, or --after inserts newly created Actions without changing the relative order of the active Plan's existing positioned rows, placing each new Action immediately after its latest dependency when no anchor is given.", "Deterministic tests cover the segment move, the dependency refusal, idempotent replay, a stale-revision refusal, and a settle insertion that leaves existing Plan order unchanged.", "START_HERE.md or docs/COMMANDS.md documents the command with one example."], "dependencies": ["prove-two-action-unattended-production"], "references": ["src/ask/settlement.ts", "src/commands/advance.ts", "docs/COMMANDS.md"]}, {"target_ref": "action/settle-commit-survives-gitignored-asks", "desired_result": "Make `arcadia agent-ask settle --apply` land its managed-document commit even when the Project gitignores `.arcadia/asks/`.", "acceptance": ["The archived Ask path is never added to the managed-document commit when `git check-ignore` reports it ignored, and the managed documents still commit regardless of the archived file's ignore status.", "When the Project tracks `.arcadia/asks/`, the archived Ask is still staged and committed alongside the managed documents.", "A deterministic test settles an Ask in a repository whose `.gitignore` excludes `.arcadia/asks/` and asserts the managed documents are committed with a clean working tree.", "A second test covers the tracked case and asserts the archived file is committed.", "`pnpm test` and the core, Discord and Dashboard builds pass."], "dependencies": ["prove-two-action-unattended-production"], "references": ["https://github.com/pmark/arcadia/issues/512", "src/ask/settlement.ts"]}, {"target_ref": "action/serialize-decision-deferral-pointer-write", "desired_result": "Put `applyDecisionDeferral`'s pointer read-modify-write inside the same workspace write interlock and compare-and-set discipline the settlement and `transitionActionPointer` already use.", "acceptance": ["`applyDecisionDeferral` reads PROJECT.md and the active Plan, applies its transforms, and writes the pair inside the same `writeTransaction` (BEGIN IMMEDIATE) the settlement path uses, re-reading the base under the lock.", "A compare-and-set failure, where the base changed since the Plan was resolved, refuses or retries against fresh state instead of overwriting the concurrent pointer move; the two documents never end up pointing at different `current_action` values.", "A regression test races a deferral apply against a concurrent settlement or pointer move and asserts one final `current_action` in both documents and no silently lost move.", "Existing deferral, reversal and `--dry-run` behavior is unchanged; `pnpm test` and the core, Discord and Dashboard builds pass."], "dependencies": ["prove-two-action-unattended-production"], "references": ["https://github.com/pmark/arcadia/issues/505", "src/dispatch/decisionDeferral.ts", "src/ask/settlement.ts"]}, {"target_ref": "action/treat-blocked-status-as-undispatchable", "desired_result": "Make `resolveDispatch`/`isDispatchable` treat a `status: blocked` Action as not dispatchable, consistent with `resolveReadySet` and `buildProjectSchedule`.", "acceptance": ["`resolveDispatch`/`isDispatchable` treats an Action with `status: blocked` as not dispatchable and pushes a named blocker, consistent with `resolveReadySet` and `buildProjectSchedule`.", "`arcadia next` no longer prints the coding-agent authorization for a blocked Action and `arcadia go` cannot prepare a worktree for it.", "`docs/managed-documents.md` states how `status: blocked` relates to `responsibility: blocked` and to dispatch readiness.", "A regression test reproduces the fixture (`status: blocked`, `responsibility: agent`) and asserts not dispatchable, while an unblocked Action stays dispatchable.", "`pnpm test` and the core, Discord and Dashboard builds pass."], "dependencies": ["prove-two-action-unattended-production"], "references": ["https://github.com/pmark/arcadia/issues/494", "src/docs/dispatch.ts", "src/scheduling/schedule.ts"]}, {"target_ref": "action/defect-bounded-triage-loop", "desired_result": "Add the automatic bounded defect triage loop approved by Decision 0049: the persistent worker periodically admits defect triage under one explicit token and attempt budget, performs deterministic reproduction and deduplication before any model call, reuses fresh included-capacity receipts, and leaves a durable disposition and evidence for each signal.", "acceptance": ["The existing persistent worker periodically admits defect triage under one explicit token and attempt budget, performs deterministic reproduction and deduplication before any model call, and reuses fresh included-capacity receipts when available; unknown capacity, purchased credits, and reset redemption never count as free.", "Each triage run leaves a durable disposition and evidence: close noise, enrich or link a duplicate, preserve a waiting item with a concrete trigger, promote a formal governed Action into the explicit queue, or perform a validated low-risk reversible repair within standing authority.", "A stop-the-line defect bypasses periodic cadence when it blocks unrelated work, requires a remembered human workaround, or blocks its own reporting or repair; promotion changes the queue and current pointer rather than merely adding an urgent label.", "Merge, deployment, publication, spending, credentials, messaging, production access, destructive changes, operator judgment, and any authority not already granted remain gated; automation reports the exact gate instead of treating urgency as permission.", "Deterministic tests cover periodic budget exhaustion, worker restart, stale or unknown capacity, Action promotion, safe repair, a refused consequential repair, and immediate stop-the-line escalation.", "The operator-facing QA plan includes the worker/recovery command, Back Burner and queue inspection steps, observable expected results, and whether the procedure is also the end-user procedure."], "dependencies": ["build-autonomous-defect-loop", "prove-two-action-unattended-production"], "references": ["docs/decisions/0049-add-a-one-line-defect-intake-whose-periodi