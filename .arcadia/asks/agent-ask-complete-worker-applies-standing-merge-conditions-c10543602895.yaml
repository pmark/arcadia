{"agent_ask":"v1","request_id":"complete-worker-applies-standing-merge-conditions-c10543602895","project":"arcadia","intent":"complete","target_ref":"action/worker-applies-standing-merge-conditions","candidate_revision":"c10543602895177d51b84e604691abc930b46157","evidence":[{"criterion":"Fixture tests cover a pass and a fail for each of C1-C5, and an unreadable input, which parks. They live in at most 8 test files in total, new plus modified, reusing tests/worker-merge.test.ts and tests/gate-set.test.ts where they fit; if the change adds a first-order import to src/production/workerMerge.ts, config/gate-set.json is updated in the same PR and tests/gate-set.test.ts passes.","status":"met","note":"Ran this Session: pnpm exec vitest run tests/worker-merge.test.ts tests/gate-set.test.ts -> Test Files 2 passed (2), Tests 141 passed (141). Only 2 test files changed (tests/worker-merge.test.ts, tests/gate-set.test.ts). The describe block standing in-run merge conditions C1-C5 has a pass case and parks for C1, C2, C3, C4 and C5, plus unreadable-input parks. workerMerge.ts adds a first-order import of ./standingMerge.js; config/gate-set.json registers src/production/standingMerge.ts and its imports in the same change, and the gate-set test passes. Not run this Session: pnpm pre-pr; the host runs this check, not this Session: pre-acceptance validation covers named tests and tests you add or change, and required CI covers lint, tsc and build."},{"criterion":"C1 passes only for an Action whose requirement content matches what the operator approved. Approval is the START card the operator pressed for the run: its id is the production policy's authority.requestId (set by scripts/start-run.sh `production activate --request-id`), and its pins are the startRun block of artifacts/generated/operator-scripts/<card id>.json in the operator-script library of the Project's main checkout (its registered repository path, not the candidate worktree or a production clone), read with validateStartRunPins (src/operatorActions/startRunPins.ts). The approved content of each Action in pins.actions is the sha256 of a canonical JSON object {\"next_action\", \"acceptance_criteria\", \"references\"}, keys in that order, built from the values of that Action's next_action, acceptance_criteria and references keys as parsed from the YAML front matter of the Plan file docs/plans/<pins.plan>.md at pins.reviewedRevision (the slug convention of src/commands/startRun.ts; quoting and YAML style do not matter); a missing acceptance_criteria or references is an empty list. Each text item (next_action, each acceptance criterion, each reference) has every run of whitespace (JavaScript /\\s+/) collapsed to one space and is trimmed, with no other Unicode normalization; acceptance_criteria keeps its order, and references is sorted by UTF-16 code-unit order (the default JavaScript sort), keeping duplicates. The object is serialized compactly with JSON.stringify (keys in the stated order) and its UTF-8 bytes are hashed with sha256, compared as lowercase hex. The worker computes it and compares it with the same fields of the same Action at merge-time main; title, expected_artifact, depends_on, decisions, execution, responsibility and effort are deliberately not hashed (dependency changes are ordering-only and do not void approval), a pinned Action with no next_action field parks, and no new pin is written. A card whose pins carry a delegation block (a card Rowan or the standing-grant timer pressed) records no operator-pressed content for its Actions (the standing-grant card carries no Action list or revision), so on such a run C1 parks. Added scope (an Action not in pins.actions), any change to the text of next_action, acceptance_criteria or references, or a reordering of acceptance_criteria (a newly named authority path shows up as a references change) voids that approval and parks the Action until the operator re-approves; whitespace-only edits, reordering references, and queue-order or ordering-only dependency changes do not. Tests cover each case, including a delegated card, and an unreadable library, card, pins or revision parks.","status":"met","note":"Ran this Session: pnpm exec vitest run tests/worker-merge.test.ts -> passed within the 2 files, 141 tests passed. The C1 describe block covers a match pass, added scope, text changes, acceptance reorder, whitespace-only and reference-reorder passes, a delegation-block card parking, a missing next_action parking, and an unreadable library, card, pins or revision parking. Implementation is in src/production/standingMerge.ts."},{"criterion":"A PR whose diff touches the shared gate set or a hard class parks for the operator; a test covers each.","status":"met","note":"Ran this Session: pnpm exec vitest run tests/worker-merge.test.ts tests/gate-set.test.ts -> 141 passed. Tests C4 parks a diff touching a gate module, the spend path, a gate-set hard class and a batch-merge hard class, and parks on an unreadable diff or gate set; the merge-level test parks a PR touching the gate set even with a matching Decision."},{"criterion":"The receipt comment (card or run id, head sha, review marker URL, 'Loosens a gate' line, check conclusions, merge state, classes, release sha) is posted before the merge call; a test with injected GitHub dependencies records the call order and shows the receipt post precedes the merge call, with no live merge required.","status":"met","note":"Ran this Session: pnpm exec vitest run tests/worker-merge.test.ts -> 141 passed across the 2 files. The test posts the receipt comment before the merge call asserts call order with injected GitHub dependencies and every receipt field; a second test parks without a merge when the receipt cannot be posted. No live merge was performed."},{"criterion":"The worker applies these only while an operator Decision authorizing in-run merges for that run is answered on main: an approved Decision with a recorded answer whose question or answer names the run's START card id (as in criterion 2), read-only from the Decision documents on main (discoverDocs). With no such Decision, behavior is unchanged (authority-adjacent PRs wait); a test covers a matching Decision, a Decision naming another card and none. This adds no authority: the Decision is the authority.","status":"met","note":"Ran this Session: pnpm exec vitest run tests/worker-merge.test.ts tests/gate-set.test.ts -> 141 passed. The authorizing Decision tests cover an approved answered Decision naming the card authorizing, a Decision naming another card parking, none parking and unreadable Decisions parking; a merge-level test shows that without a matching Decision the authority-adjacent PR waits and nothing is posted or merged."}],"desired_result":"Mark worker-applies-standing-merge-conditions complete."}
