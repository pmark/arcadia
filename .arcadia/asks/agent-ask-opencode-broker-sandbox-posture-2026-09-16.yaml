{"agent_ask":"v1","request_id":"opencode-broker-sandbox-posture-2026-09-16","project":"arcadia","intent":"decision","desired_result":"Choose how the protected broker enforces opencode\u0027s trust posture, given opencode has no OS-level sandbox and cannot mirror Codex\u0027s and Claude\u0027s network and filesystem isolation through configuration alone.","rationale":"add-opencode-go-broker-launcher requires the installer to establish and verify an opencode trust posture that denies command network access and never grants unrestricted command execution, mirroring the Codex and Claude profiles. opencode\u0027s published config schema exposes only per-tool permission rules (read/edit/bash/external_directory/webfetch/websearch) with no sandbox or network control, so those two guarantees cannot both hold while an unattended session still runs builds and tests. The launcher set itself is implemented and does not depend on this answer.","options":[{"label":"Wrap opencode in the host seatbelt profile","consequence":"Launches run under /usr/bin/sandbox-exec with a profile that denies network and limits writes to the candidate worktree and shared Git metadata, truly mirroring Codex and Claude. macOS-only; adds a launch wrapper and a managed profile artifact, and go-broker status verifies it.","recommended":true},{"label":"Policy-only permission rules, documented as policy","consequence":"Arcadia writes a bounded opencode permission config (external_directory narrowed to the provider worktree roots, network commands denied, no unrestricted bash pattern) and documents that this is policy-enforced, not kernel-enforced. Portable, but a weaker guarantee than Codex/Claude."},{"label":"Defer the posture and ship the launcher only","consequence":"arcadia go --agent opencode and the full launcher set work now; the trust-posture acceptance criterion remains open, revived by this Decision."}]}
