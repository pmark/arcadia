{"agent_ask": "v1", "request_id": "relay-driven-loop-plan-20261107-v2", "project": "arcadia", "intent": "plan", "requested_authority": "apply_if_approved", "desired_result": "Relay use drives planned work that production performs", "rationale": "Operator, 2026-11-07: \"I want to be operating in Relay Mode exclusively so that we can constantly be filling the remaining gaps preventing my use of the Relay UI in the Arcadia Workspace. ... In a nutshell, my use of Relay drives planned work which is automatically performed.\" docs/relay-driven-operations.md is the operating model: use Relay, capture each gap as a signal, triage it into exactly one disposition, let production perform queued Actions under Decisions 0173, 0181 and 0187, and close the loop by telling the operator what to retry. Capture, Agent Asks and production already exist; these two Actions build the only missing pieces, and triage appends every later gap to this Plan as a small build Action citing its signal. The Plan is created inactive; it is meant to become the standing active Plan, and when to activate it is the operator's choice. Supersedes Agent Ask relay-driven-loop-plan-20261107 after an independent plan critique.", "references": ["docs/relay-driven-operations.md"], "actions": [{"id": "list-relay-gap-signals-for-triage", "desired_result": "List every Relay and production gap signal for one Project in one read-only triage view, unrouted signals first.", "why": "Every triage pass is hand-stitched from several commands today, which costs tokens and lets signals slip through, so the Relay-driven loop cannot run cheaply.", "execution": "build", "acceptance": ["`arcadia relay signals --project <slug>` prints one line per signal and `--json` prints the same records, each with source kind (`lesson` or `red_alert`), source id, text, first seen, last seen and occurrence count.", "Its only sources are that Project's lessons whose text starts with `Relay improvised:` or `Relay can't yet:`, with their occurrences, and that Project's open rows in `production_red_alerts`; it opens the workspace database read-only, calls no model and writes nothing, which a test proves on a fixture workspace database by comparing its contents before and after the command.", "A signal whose reference `signal:<kind>:<id>` appears in any Plan Action's `references` in that Project is listed as routed, with that Action's `plan/<slug>#<action-id>`, after every unrouted signal; unrouted signals are ordered by occurrence count descending, then by last seen descending. Action show-landed-and-recurred-relay-signals may add states ahead of unrouted signals.", "An Agent Ask child carrying `references: [\"signal:lesson:<id>\"]` previews and settles against a fixture repository with that string unchanged in the Plan Action's `references`, proved by a test; if settlement refuses or rewrites it, the Session reports that instead of changing settlement.", "Tests cover no signals, only routed signals and the ordering rule, and need no network, timer, child process or live service."], "dependencies": []}, {"id": "show-landed-and-recurred-relay-signals", "desired_result": "Show which routed Relay signals have landed and which recurred after their fix, so Relay can tell the operator what to try again.", "why": "Without it the loop cannot close: nobody sees that a fix landed, and a gap that returns after its fix looks already handled.", "execution": "build", "acceptance": ["In `arcadia relay signals`, a routed signal whose citing Action is done is listed as `landed`, with that Action's ref and its completion time: the `created_at` of the accepted `agent_ask_settlements` row whose intent is `complete` and whose target is that Action.", "A lesson signal with an occurrence recorded after that completion time is listed as `recurred`, ahead of every unrouted signal, with both the Action ref and that occurrence's time. Red-alert signals use only `unrouted` and `routed`, and an alert that is no longer open leaves the list.", "`--json` carries a state of `unrouted`, `routed`, `landed` or `recurred` on every record, and tests cover each state on a fixture workspace database with fixed timestamps and need no network, timer, child process or live service."], "dependencies": ["list-relay-gap-signals-for-triage"]}]}
