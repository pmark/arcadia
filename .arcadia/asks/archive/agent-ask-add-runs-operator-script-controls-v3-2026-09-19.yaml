r follow-up script.","The /runs execute control sends only the selected fingerprinted script descriptor to the host-side service controller; it records output and a durable receipt, refuses when that controller is unavailable or the descriptor is stale, and never lets a browser execute an arbitrary command.","Regression tests cover prioritization, minimal-versus-expanded rendering, stale-preview refusal, successful operator settlement, generated-script integrity, failure-handoff generation, unavailable-host refusal, and successful host-mediated execution."],"dependencies":[],"references":["apps/dashboard/app/runs","apps/dashboard/components","src/agentAsk","src/dashboard/snapshot.ts","src/commands/agentAsk.ts","docs/plans/mission-control-view/17-managed-production-contract.md","scripts/services.sh","src/commands/worker.ts","artifacts/generated/operator-scripts"]}]}
