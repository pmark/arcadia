  "desired_result": "Record the operator's answer to Decision 0063, including the restrictions that qualify it and the deferral of mid-session failover, and point at where each part now lives canonically.",
  "rationale": "The operator answered Decision 0063 as Option 1 with a hard-evidence restriction. The canonical sentence, in the operator's own words: 'Arcadia may substitute an equivalent-or-stronger permitted coding provider before packet binding when hard evidence shows the intended provider cannot presently execute the work; the substitution and reason must be recorded and surfaced. Advisory capacity evidence alone does not cause substitution, and Arcadia must not automatically switch providers after execution has begun.' Hard evidence is a closed set rather than prose: provider unavailable; model unavailable; authentication failure; explicit quota or rate-limit rejection; or another deterministic, launch-precluding condition. Advisory capacity estimates are excluded, because using them here 'would just rebuild the capacity gate indirectly, on the same shaky data the operator already ruled out as a gating input'. The boundary that stays fixed: provider identity is mutable scheduling state until packet binding and execution history after it, so a mid-session failure still terminates or suspends under the existing recovery rules with no automatic cross-provider retry; if no equivalent eligible provider exists, incapacity surfaces normally and the capability floor is never lowered to keep work moving. Option 2 (mid-session failover) is deferred and not folded in: it becomes its own future Action with its own resumability and idempotency guarantees, and feed-and-supervise-managed-production criterion 5 stays intact and unamended. Two implementation requirements accompany the decision: intended_provider, selected_provider and substitution_reason must be logged where an operator sees them in aggregate (session or plan log), not only in a per-launch preview that is easy to skim past; and the hard-evidence set must be enforced as a closed enum in code so it cannot drift back toward advisory heuristics under schedule pressure. Option 3 (stay passive) was rejected as creating operator toil with no added governance once Arcadia already has deterministic proof the intended provider cannot run. Where each part now lives: the answer field of docs/decisions/0063 carries the ratified option; the restrictions, the closed enum, the aggregate-logging requirement and the post-binding guarantee are the seven acceptance criteria of the new Action arcadia/substitute-unavailable-provider-before-binding; and mid-session failover remains unstarted, recorded here with its trigger rather than left as an open question. Recommended trigger for that deferral, subject to the operator's correction: reactivate when a managed Session has been lost to a mid-session provider failure in real use, or when the substitution Action has shipped and run clean, whichever comes first — a condition that will visibly happen or visibly not happen rather than a date. Nothing in this entry grants merge, deploy, publish, spend, credentials, messaging or production authority.",
