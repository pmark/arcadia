{"agent_ask":"v1","request_id":"choose-runs-page-information-architecture-2026-09-29","project":"arcadia","intent":"decision","requested_authority":"propose","gate_question":"reasonable_disagreement","desired_result":"Choose where Flight Deck evidence and the Production On/Off control belong in the phone-first dashboard redesign.","rationale":"The operator explicitly asked to decide these product choices before they are assumed. Inspection confirms Flight Deck is a read-only queue/evidence projection with a 1050px minimum grid, Work Queue holds unique mutation safeguards, and Runs currently hides the Production toggle in a disclosure that unmounts pending state (#809). Outcome and three-slice order are stated in docs/proposals/runs-page-information-architecture.md. This question precedes the Staff Planning Architect pass under docs/planning-process.md; it changes no Project pointer, queue, authority or production state.","references":["docs/proposals/runs-page-information-architecture.md","docs/planning-process.md","docs/decisions/0076-answer-decisions-through-discord-and-the-dashboard.md",".arcadia/asks/agent-ask-plan-single-decision-deep-link-2026-09-29.yaml","apps/dashboard/app/runs/page.tsx","apps/dashboard/app/flight-deck/page.tsx","apps/dashboard/app/work-queue/page.tsx"],"options":[{"label":"Evidence under Runs; On/Off visible on Runs","consequence":"Flight Deck becomes /runs/evidence with /flight-deck redirected; a persistent production status strip keeps the stop control beside active work and cannot forget a pending toggle. Queue steering moves to /runs/queue. The three build slices follow this architecture.","recommended":true},{"label":"Keep Flight Deck; On/Off visible on Runs","consequence":"Flight Deck keeps its standalone read-only portfolio page under More; Runs links to it without duplicating the evidence board. A persistent production strip keeps start/stop beside active work and fixes pending-toggle loss. Queue steering moves to /runs/queue."},{"label":"Evidence under Runs; dedicated Production page","consequence":"Flight Deck becomes /runs/evidence with /flight-deck redirected; Runs shows read-only production status and a link to /runs/production. Starting or stopping needs one additional navigation. Queue steering moves to /runs/queue."},{"label":"Keep Flight Deck; dedicated Production page","consequence":"Flight Deck keeps its standalone portfolio page under More. Runs links to that evidence board and shows read-only production status; start/stop lives at /runs/production, one extra navigation away. Queue steering moves to /runs/queue."}]}
