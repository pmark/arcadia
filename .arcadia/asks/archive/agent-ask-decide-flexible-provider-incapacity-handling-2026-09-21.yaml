  "desired_result": "How should Arcadia handle a provider that cannot run the work, given that capacity evidence is now advisory rather than a gate?",
  "rationale": "The operator directed on 2026-09-21 that capacity attestation should stop blocking execution because it is unreliable at best, and that a better solution is flexible handling of provider incapacity before or during a session. The first half is delivered as configuration: codingAgent.capacityGateEnabled: false with no provider named now exempts every configured provider, so admission waits on no receipt and a provider with no allowance is discovered when the work runs. That leaves the second half, and it is not a mechanics question. CapacityAdmittedSelection and selectCapacityAdmittedCodingAgent already exist in src/codingAgents/capacity.ts and implement exactly the advertised-substitution behaviour, but they have no production caller, and where they could be called is constrained: resolve-production-agent-and-launch-preview records that selection never silently changes an immutable packet provider, so substitution can only happen before a packet binds. Retrying on another provider after a session has started is a different thing again, and feed-and-supervise-managed-production's accepted criterion 5 explicitly forbids looping across providers to bypass a failure. Choosing between those is a judgment about spend, replay risk and where an operator learns what happened, and it changes accepted criteria of two completed Actions, so it needs the operator's answer rather than an agent's preference. The question is genuinely open: all three options leave the config change in place, and none of them widens merge, deploy, publish, credentials or messaging authority.",
