{"agent_ask":"v1","request_id":"plan-arcadia-loop-integrity-bug-burndown-2026-10-10","project":"arcadia","intent":"plan","desired_result":"Seven verified settlement, queue and preservation-integrity bugs are fixed and merged to main, one Action per merged PR, each with its regression test and a passing fast-rehearsal.","rationale":"Operator request 2026-10-10: run production for real on a Plan full of Arcadia most important bugs. Candidates were verified read-only against origin/main by four independent verifiers (24 Issues). Included: valid, small (S or M), no approval-boundary or agent-authority flag, on the unattended settlement path, ordered so earlier Actions land before later ones touch the same files. Excluded and why: #1177, #1155, #1114 and #823 need a supervised fix first (launch authority, credentials, security gate, approval binding); #1012, #953 and #1129 touch admission semantics or the freeze guard and need an operator Decision or are operator-owned; #548, #1032, #1041, #1034 and #1189 are already fixed in code and need only bookkeeping. This draft Plan is inactive; activating it and any production Grant are the operator calls.","actions":[{"id":"keep-claim-when-passed-attempt-receipt-is-unparseable","desired_result":"Keep a superseded candidate claim when a passed development attempt receipt cannot be parsed, so the Action is not handed to a second agent.","acceptance":["With a passed development row whose terminal receipt JSON is malformed plus a superseded row, developedForSupersededInput returns false and the claim is not released.","With only well-formed superseded rows it still returns true and releases the claim.","A focused regression test for the malformed-receipt case exists and the roleLineage and production-tick tests pass."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/960"],"why":"A malformed receipt currently lets the claim release and can launch a duplicate session for an Action that already has a passed candidate."},{"id":"settle-superseded-decision-ask-rejection","desired_result":"Match a Decision own Agent Ask by exact token so rejecting a superseded Ask is not refused as already written.","acceptance":["With an accepted <id>-r3 Decision on disk, rejecting the original Ask <id> applies without the already-wrote refusal.","A genuine prior commit of the same Ask id is still refused (the existing already-wrote test passes).","Ask ids that are prefixes of one another no longer cross-trigger in the Plan, Log or Decision checks, with a regression test."],"dependencies":["keep-claim-when-passed-attempt-receipt-is-unparseable"],"references":["https://github.com/pmark/arcadia/issues/1173"],"why":"Six superseded Decision rejections are stuck behind a substring match, which also threatens any Ask whose id prefixes another."},{"id":"amend-action-consumes-block-scalar-and-literal-ids","desired_result":"Make amendAction consume a block-scalar next_action and write instructions and request ids literally in every settlement writer.","acceptance":["Amending an Action whose next_action is a literal or folded block scalar yields a parsed nextAction exactly equal to the requested text, on the Action-amend and Plan-amend paths.","An instruction or request id containing $& or a backtick-dollar sequence is written literally by amendAction, setActionDependsOn, recordSplitInto and replaceTopLevelField.","A split Ask whose request_id contains $& leaves the Plan valid with only the intended fields changed (regression test).","Other fields, other Actions, refusals and idempotency are unchanged and the agent-ask settlement, split and complete test files pass."],"dependencies":["settle-superseded-decision-ask-rejection"],"references":["https://github.com/pmark/arcadia/issues/1031","https://github.com/pmark/arcadia/issues/1213"],"why":"Amendment can show an agent old and new instruction text concatenated, and a request id with replacement patterns can garble a Plan."},{"id":"keep-queue-positions-of-projects-not-visible-at-arrange","desired_result":"Keep the queue positions of Projects that are not visible when a queue is arranged, instead of silently deleting them.","acceptance":["arrangeActionOrder and moveActionOrder keep, or refuse to drop, position rows for keys absent from currentKeys, with the chosen design stated in the PR.","A settlement-time arrange while another Project is transiently blocked leaves that Project positions intact (regression test).","The receipt records the full position table before and after.","Done or dropped Action keys are still removed as before (schedule stale-key behaviour unchanged) and the action-order and settlement tests pass."],"dependencies":["amend-action-consumes-block-scalar-and-literal-ids"],"references":["https://github.com/pmark/arcadia/issues/1022"],"why":"A transient blocker on one Project can erase another Project order, leaving orderValid false and every make-next refused."},{"id":"refuse-hidden-renames-in-committed-completion-replay","desired_result":"Harden recordCommittedCompletionSettlement against renames into .arcadia/asks and clean up its scratch directory on timeout.","acceptance":["A candidate HEAD that renames a governed document into .arcadia/asks/ is refused by recordCommittedCompletionSettlement.","A commit that only adds .arcadia/asks/archive/agent-ask-<requestId>.yaml and removes .arcadia/asks/agent-ask-<requestId>.yaml is still recorded.","A forced source-control timeout inside the replay leaves no arcadia-settlement-replay-* scratch directory.","pnpm fast-rehearsal passes with the change."],"dependencies":["keep-queue-positions-of-projects-not-visible-at-arrange"],"references":["https://github.com/pmark/arcadia/issues/1011"],"why":"The deterministic completion proof can be passed by a candidate that hides the deletion of a governed record behind a rename."},{"id":"allocate-decision-numbers-from-origin-and-refuse-duplicates","desired_result":"Allocate Decision numbers from the local documents plus origin/main and refuse a new duplicate number, grandfathering the four existing pairs.","acceptance":["With origin/main holding Decision 0100 and a worktree whose documents stop at 0099, settlement and arcadia decision new both allocate 0101; offline they fall back to the local maximum with a warning.","A new Decision file that duplicates an existing number outside the grandfathered pairs 0004, 0005, 0079 and 0100 fails docs sync or the added check.","The existing pairs and slug-based Decision lookup are unchanged and the settlement, decision and docs-sync tests pass.","Renumbering the live second 0100 is not part of this Action and stays an operator-governed step."],"dependencies":["refuse-hidden-renames-in-committed-completion-replay"],"references":["https://github.com/pmark/arcadia/issues/1187","https://github.com/pmark/arcadia/issues/1176"],"why":"Parallel sessions allocate the same Decision number, so a bare Decision citation can resolve to the wrong authority record."},{"id":"write-yaml-scalars-that-round-trip-as-strings","desired_result":"Quote YAML scalars written by settlement and decision commands whenever the plain form would not parse back as the identical string.","acceptance":["Titles, next_action, acceptance criteria, source and Decision question, recommendation and options written by settlement and the decision commands round-trip as the identical string for the values true, null, 123, [x] done and {a}.","Ordinary prose and previously quoted values keep their current rendering (existing snapshot assertions pass).","The ask, decision and project test suites and pnpm fast-rehearsal pass."],"dependencies":["allocate-decision-numbers-from-origin-and-refuse-duplicates"],"references":["https://github.com/pmark/arcadia/issues/1160"],"why":"A title or criterion such as true or [x] done silently becomes a boolean or list in a validated Plan, and unattended agents will not notice."}]}
