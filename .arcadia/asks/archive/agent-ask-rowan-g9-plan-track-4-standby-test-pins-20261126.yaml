{"agent_ask":"v1","request_id":"rowan-g9-plan-track-4-standby-test-pins-20261126","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Track 4 standby test pins 20261126","rationale":"Rowan g9's planner helper (a read-only Claudia Atlas session) drafted this on 2026-11-26 against origin main 4e27b0d74. Operator direction, relayed by Signal 20 (transcript e1a83b65, line 4876; Rowan verifies the transcript before preview), verbatim: \"I want 24 hours a day of production every single day. Do what it takes to make that happen as soon as possible.\" Earlier operator direction, verbatim (quoted in Track 2's Ask): \"There should always be a Track 2, so let's get it drafted regardless.\" Track 3 (Plan track-3-standby-test-pins-20261125) is complete, all eight Actions done, so the test-only night lane has no queued work. Track 4 continues that lane with the same kind of work inside the proven envelope (Track 2 and Track 3 ran clean on this shape): one Action at a time, each adding one new test file under tests/ of at most 50 lines that pins existing behaviour of one pure exported function and changes no other path. Each path passes isWorkerMergeSafePath (src/production/workerMerge.ts:203-237) and classifyAuthorityPath names no authority boundary for it (both checked by running the repository code on all eight paths); tests are not engine paths, so the strategy freeze does not apply. Every pinned function is named by no test file anywhere on main (tests/ and colocated src tests), and none of the eight source files is touched by Plans A to D of 2026-11-26, by src/production/, src/coordinator*, src/scheduling/, src/codex/packets.ts or src/sessions/launch.ts, or by any open pull request. Partial overlaps, judged additive: Decision id clashes (tests/decision-id-allocation.test.ts, through findDecisionIdClashes), authority paths (tests/authority-classifier-coverage.test.ts, through the classifier), review attempts (tests/review-repair-loop.test.ts, through the loop), the JSON draft rewrite (tests/auto-settle-before-dispatch.test.ts, through auto-settle), stop-production wording (tests/way-lookup.test.ts, through ranking) and redaction (tests/validation-evidence.test.ts and others, through formatters). Each expected value was read from the source and confirmed by running the function at 4e27b0d74. Proposed START cards: card A is Actions 1 to 4 (merge, review and settlement guards) and card B is Actions 5 to 8 (pointer, activation, recorded output and the Way). Actions have no ordering edges, so every pinned Action is ready at once. This registers as an INACTIVE draft Plan: registration changes no active pointer, queue, production policy, spend or authority. Activating or queueing it needs the operator's one-word approval (Decision 0241 E covers the queue), and each START still needs his press.","acceptance":["An inactive draft Plan holds the eight independent test-only Actions below in this order, and no active pointer, queue or production policy changes on registration."],"actions":[{"id":"pin-pr-decision-id-clashes","desired_result":"Pin how a Decision file name gives its id and which ids a pull request would duplicate on main, with a new test file.","why":"decisionIdOfFile and findPullRequestDecisionIdClashes (src/decisions/decisionIds.ts:19-21, 68-76) decide which Decision ids a pull request adds and whether one duplicates an id on main (#3108 class), and no test file names either, so their exemptions are pinned only indirectly.","execution":"build","acceptance":["tests/pin-pr-decision-id-clashes.test.ts is a new test file that imports decisionIdOfFile and findPullRequestDecisionIdClashes from ../src/decisions/decisionIds.js (lines 14-21 and 49-76) and asserts decisionIdOfFile gives \"0241\" for \"0241-standing-grant.md\", \"9001\" for \"docs/decisions/9001-x.md\" (only the last path segment counts), and null for \"0241.md\", \"x-0241-y.md\" and \"0241-x.txt\".","The same test file asserts findPullRequestDecisionIdClashes reports exactly one clash, { id: \"9001\", files: [\"docs/decisions/9001-a.md\", \"docs/decisions/9001-b.md\"] }, when origin main holds 9001-a.md and the head adds 9001-b.md (a bare name gains the docs/decisions/ prefix and the files are sorted), and reports [] when the head adds 9002-b.md beside 9000-a.md, when both 9001 files are already on the merge base, and for the grandfathered id 0004 with exactly two files, while a third 0004 file that the head adds is reported with all three files.","No src/ change is made to make the test pass; if current behaviour differs from these assertions, the Session reports the mismatch instead of changing src/.","Apart from the settlement records Arcadia writes, the change touches only tests/pin-pr-decision-id-clashes.test.ts, a new test file of at most 50 lines that imports only vitest and src/decisions/decisionIds.ts; no src/, tests/helpers/, tests/fixtures/ or other test file changes, and the test needs no network, timer, child process, database or live service. Proof that this file passes and lints cleanly comes from the required CI jobs on the pull request's head, not from the Session, which cannot run them under headless validation."],"dependencies":[],"references":["src/decisions/decisionIds.ts","tests/pin-pr-decision-id-clashes.test.ts"]},{"id":"pin-authority-path-normalization","desired_result":"Pin how the authority classifier reduces a changed path before matching it, and which paths it refuses to reduce, with a new test file.","why":"normalizeAuthorityPath (src/decisions/batchMerge.ts:300-322) is the fail-closed first step of classifyAuthorityPath, which batch merges and card sources use to find authority-adjacent paths, and no test file names it, so its reductions and null for unsafe input are pinned only via the classifier.","execution":"build","acceptance":["tests/pin-authority-path-normalization.test.ts is a new test file that imports normalizeAuthorityPath from ../src/decisions/batchMerge.js (lin