{"agent_ask": "v1", "request_id": "close-completed-board-mirror-issues-2026-10-04", "project": "arcadia", "intent": "action", "desired_result": "Make the GitHub board projection close a governed Action's mirror Issue when that Action completes, so completed cards stop accumulating.", "rationale": "The 2026-10-04 triage closed 114 backlog Issues that only mirrored governed Actions already marked done. src/scheduling/github.ts (issueBody/reconcileBoard) creates one Issue per scheduled Action and updates card status, but nothing closes the mirror Issue when its Action leaves the scheduled set as done, so completed cards accumulate until a manual sweep. Governing the source fix prevents the backlog from regrowing.", "actions": [{"id": "close-completed-board-mirrors", "desired_result": "In src/scheduling/github.ts, close the mirror Issue for a governed Action that leaves the scheduled set with status done, matched by its stored githubIssueNumber/githubIssueUrl, idempotently.", "acceptance": ["When a scheduled Action transitions to done (or otherwise leaves the scheduled set completed), reconcileBoard closes its mirror Issue matched by the Action's stored githubIssueNumber/githubIssueUrl, not by rediscovering it.", "Closing is idempotent: when the mirror Issue is already closed, a re-projection issues no close call and does not error; a projection with no completed Actions is unchanged.", "A deterministic test with a stubbed board drives create -> done and asserts exactly one close, then re-projects and asserts a no-op; it also asserts an open Action's mirror is never closed.", "The behavior is documented in src/scheduling/github.ts and does not change Issue creation or status/push projection for live Actions.", "`pnpm test` and the core, Discord and Dashboard builds pass."], "dependencies": [], "references": ["src/scheduling/github.ts", "docs/decisions/0055-log-defects-with-github-issues.md", "https://github.com/pmark/arcadia/issues/490"]}]}
