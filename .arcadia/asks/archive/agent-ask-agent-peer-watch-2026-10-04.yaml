{"agent_ask":"v1","request_id":"agent-peer-watch-2026-10-04","project":"arcadia","intent":"action","requested_authority":"apply_if_approved",
"desired_result":"Let the different coding agents (Claude Code, Codex, OpenCode) watch each other's health, activity and evidence of changes so that work keeps moving forward, and another agent can pick up the slack when one is out of tokens or stalled, coordinating through Git commits and GitHub issue comments.",
"rationale":"Operator direction 2026-10-04 (captured idea, locked): all the coding agents should check on each other; Claude watches Codex and Codex watches Claude, monitoring health, activity and evidence of changes to the code base, so work is always moving forward and the other picks up the slack when one is out of tokens; and OpenCode should join, communicating through Git commits and issue comments. Evidence for need: the first live three-Action rehearsal needed three agents and an operator to notice stalls and conflicts by hand; the 2026-10-03 enrollment collision was caused by treating a coding turn ending or a missing process as release of ownership (session-friction capture capture_61f0b19c). Design stance: deterministic evidence first, agent-agnostic, never infer release from silence; takeover only through the existing governed claim/ownership recovery with proof (the #899 claim protocol), so a watcher that sees a stalled peer offers help and escalates but never steals a claim. Automatic posting to GitHub is outward messaging and needs an explicit operator Decision naming the repository and issue; without it the watcher writes only local evidence and drafts. No authority is added by this Ask.",
"actions":[
{"id":"define-agent-peer-watch-contract","desired_result":"Write the agent-agnostic peer-watch contract: what evidence each agent publishes, how stalls and exhaustion are classified, and how takeover is requested without stealing ownership.",
"acceptance":["A checked-in contract (docs/agent-guidance/ procedure registered in index.json plus a typed schema in code) defines the evidence an agent publishes and a watcher reads, using only channels every supported agent already has: Git commits on its candidate branch (a machine-readable trailer such as Arcadia-Agent, Arcadia-Action and Arcadia-Heartbeat on commits and on an optional empty heartbeat commit), GitHub issue comments on the coordination issue (one fenced machine-readable block per comment), the existing session/lease rows, and the coding-agent capacity telemetry; it names which of these each of Claude Code, Codex and OpenCode can produce today.","The contract classifies each watched agent as healthy, idle, stalled, exhausted (out of tokens or capacity), or unknown from that evidence with explicit freshness windows, and states in code and prose that a coding turn ending, a missing process, a preserved local head, or silence alone is never proof of released ownership; takeover is requested through the existing claim/ownership recovery with the old principal proven terminal or released, and a watcher may only offer help, escalate to the operator, or continue work the owner has released.","Tests cover the schema, trailer and comment-block parsing with malformed, forged and stale input, the classification table including the 2026-10-03 enrollment-collision case (turn ended, no process, local head preserved, orchestrator still owning) classified as not released, and the agent-guidance index and fingerprint checks pass."],
"dependencies":[],"references":["docs/agent-guidance/index.json","docs/agent-guidance/continuation.md","src/codingAgents/capacity.ts","src/sessions/","https://github.com/pmark/arcadia/issues/899"]},
{"id":"implement-agent-peer-watch-reader","desired_result":"Build the deterministic read-only watcher that gathers peer evidence and reports each agent's state.",
"acceptance":["A read-only command (for example arcadia agents watch) gathers the contract's evidence for every agent with an active claim, candidate or lease (candidate branch commits and their trailers, issue comments on a named coordination issue via the GitHub CLI with bounded polling and rate-limit awareness, session and lease rows, capacity telemetry), classifies each agent per the contract, and prints a typed status with the evidence and its age; it never mutates the workspace, repositories or GitHub, and unknown or unreadable evidence is reported as unknown, not healthy.","The production tick and the operator surfaces that already show escalations consume the classification: a stalled or exhausted owner of the current Action raises a deduplicated operator escalation with an accurate remedy, and nothing is dispatched to or taken from the owner.","Hermetic tests with fake Git history, fake issue comments and capacity fixtures cover healthy, idle, stalled, exhausted and unknown agents, forged or stale heartbeats, GitHub rate limiting, and the 2026-10-03 collision; focused suites, lint, tsc, build, check:agent-guidance and the preservation self-check pass."],
"dependencies":["define-agent-peer-watch-contract"],"references":["src/production/tick.ts","src/commands/workMonitor.ts","src/codingAgents/capacity.ts"]},
{"id":"publish-agent-peer-heartbeats-and-offers","desired_result":"Have agents publish heartbeats and peers post help offers through commits and issue comments, only under an explicit operator Decision.",
"acceptance":["Agent launch and exit paths add the contract's trailers to commits the agent already makes and can emit one bounded heartbeat (an empty commit or a fenced issue-comment block) at a finite interval while a Session is live, and a peer's watcher can read those heartbeats; no heartbeat is posted unless the owner's candidate is live.","Posting a heartbeat or help offer to GitHub is gated by an explicit operator Decision naming the repository and issue, a request-id replay guard, a rate budget and an Off fence; without the Decision the same text is written as a local draft only, never posted; an offer carries the observed evidence and the exact claim-release request a peer would need, and never takes over a claim.","Hermetic tests cover trailer injection on real commits, the heartbeat interval and rate budget, the Decision gate, replay, Off, a forged peer comment being ignored, and a handoff offer accepted by the owner through the existing claim-release path; focused suites, lint, tsc, build and check:agent-guidance pass."],
"dependencies":["implement-agent-peer-watch-reader"],"references":["src/sessions/launch.ts","src/sessions/reconciliation.ts","docs/agent-guidance/pull-requests.md"]},
{"id":"enroll-opencode-in-agent-peer-watch","desired_result":"Make OpenCode a full participant in peer watch through the same Git and issue-comment channels.",
"acceptance":["OpenCode sessions launched through the fixed OpenCode launcher publish the contract's commit trailers and heartbeats, are watched by the Claude Code and Codex peers, and can watch them, using only Git commits and GitHub issue comments plus the existing capacity telemetry; the contract's table lists what OpenCode can and cannot produce and degrades to unknown rather than healthy where it cannot.","A hermetic three-agent scenario (Claude Code, Codex, OpenCode fakes) shows one agent exhausting its capacity mid-Action, the others classifying it exhausted from commits, comments and telemetry, offering help through a comment draft (or a posted comment when the Decision exists), the owner releasing the claim through the existing recovery path, and a peer continuing the same Action with no duplicate candidate, claim or settlement; a stalled-but-owning agent is never taken over; the operator guide explains how to read the watch output and approve the posting Decision."],
"dependencies":["publish-agent-peer-heartbeats-and-offers"],"references":["scripts/arcadia-go-broker.ts","src/goBroker.ts","tests/rehearsal-three-action.test.ts"]}
