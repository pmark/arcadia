{"agent_ask":"v1","request_id":"ask-superpower-plan-2026-09-23","project":"arcadia","intent":"plan","desired_result":"Make Ask the superpower tool for planning, data access and retrieval, and reporting: anything the operator asks is captured, classified, routed to the right Project, turned into governed work or an answer, and always traceable, so no Action or other entity is ever lost after an Ask. \"Ask Arcadia\" and \"Ask an agent\" are the complement of the managed production system.","rationale":"Operator direction 2026-09-23: this is the next highest priority after Arcadia's semi-autonomous production system succeeds (it builds out plans 24/7). Activation trigger: the bootstrap-managed-production-to-build-flight-deck milestone is reached, i.e. managed production runs Plans unattended around the clock. Motivated by capture_20e52d3f-15bc-4d17-8769-0e576b653126, a concrete request that was shelved as an Idea and could not be traced by any command.","references":["https://github.com/pmark/arcadia/issues/589","https://github.com/pmark/arcadia/issues/591","docs/planning-process.md"],"actions":[{"id":"align-ask-superpower-outcome","desired_result":"Run the Outcome Alignment Interview for Ask as the planning, retrieval, and reporting complement to managed production, and record the ratified Outcome and scoped capability list.","acceptance":["An Outcome statement for Ask covering planning, data access/retrieval, and reporting is recorded and ratified by the operator.","The capability list names which Ask requests become governed work, which return answers or reports, and which surface Ask Arcadia versus Ask an agent handles."],"dependencies":[]},{"id":"trace-every-ask-to-its-outcome","desired_result":"Record the capture id on every entity an Ask produces and give one read command and dashboard view that shows an Ask's full trail.","acceptance":["Every ask request, Back Burner item, Action, Decision, and review item created from an Ask records its capture id.","One command given a capture or request id prints the capture, classification and reason, routed Project, and every resulting entity with its current status.","The dashboard Ask receipt links to that trail."],"dependencies":["align-ask-superpower-outcome"]},{"id":"route-execution-shaped-asks-to-planning","desired_result":"Classify imperative, execution-shaped Asks as work for their resolved Project instead of shelving them as Ideas when an incidental hedge word appears.","acceptance":["The input from capture_20e52d3f-15bc-4d17-8769-0e576b653126 is classified as an execution request for the Arcadia Project in a regression test.","Hedge words shelve an Ask only when they govern the request itself, with tests for both cases."],"dependencies":["align-ask-superpower-outcome"]}]}
