{"agent_ask":"v1","request_id":"amend-plan-add-batch-merge-card-2026-10-12","project":"arcadia","intent":"plan","target_ref":"plan/every-operator-decision-in-a-production-run-is-a-pinned-decision-card-on-a","desired_result":"Add the batch merge decision card Action so the operator merges every PR that needs them from /todo with one pinned button.","rationale":"Operator asked on 2026-10-12 to be pinged and then work from the /todo page alone: one button summarising why the merge needs the operator, what decisions it makes and what is consequential, merging several PRs at once. This is the merge verb of the decision-card contract made operational and moves to the front of the Plan.","actions":[{"id":"batch-merge-decision-card","desired_result":"Implement a /todo batch merge card that lists every pull request awaiting the operator with why it needs them, the decisions it makes and its consequences, and one button that merges them in stack order from pinned head shas.","acceptance":["Each listed pull request shows the authority boundary its diff touches from a path-based classifier, the independent review verdict, the required checks and a one-sentence consequence, and the card orders stacked pull requests base first.","The button posts only the card id and the pinned head sha of each pull request; it refuses the whole batch and names the reason when any head moved, any required check is not green or any independent review is missing.","The merge runs as an operator script whose descriptor is published for review and is never executed by an agent; it writes one receipt per pull request and is idempotent when re-run.","The Discord ping for a pending batch links the card and states the count, and a focused test with fixture pull requests covers the stale-head refusal, the stack order and the receipt."],"dependencies":["decision-card-contract"],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md"],"why":"One page and one button per decision round is the operator-effort target; merges are the largest remaining operator touch."}]}
