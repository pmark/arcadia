{"agent_ask":"v1","request_id":"plan-ask-intent-dispatch-20261008-r3","project":"arcadia","intent":"plan","requested_authority":"propose","target_ref":"plan/operator-to-do-list-with-ask-only-input","desired_result":"Apply the round-2 review refinements to three Ask-dispatch Actions.","rationale":"This applies the non-blocking findings A-E from round 2 of the independent review of PR 1091.\n- A. Slice 4 is retitled for asynchronous classification.\n- B. Model re-routes never become memos, so learning comes only from operator corrections.\n- C. Acknowledgement suppression uses a closed whole-message list and is reported separately from the vanish rate, so a real Ask is never dropped.\n- D. Degraded no-workspace output states that Ask items are unavailable.\n- E. Slice 1 adds arcadia todo --agents, the command that the 'Agents are doing' line names.\nDependencies and references are restated unchanged (Issue #1079).","actions":[{"target_ref":"action/stop-asks-vanishing","desired_result":"Make every operator Ask that is not explicitly an idea visible in arcadia todo, so no Ask vanishes into the Back Burner.","acceptance":["Behind a config flag ask.routing.v2, which defaults on and can be turned off to restore today's routing, an operator Ask that matches no execution pattern goes to Clarify First instead of the Back Burner. Clarify First means a review_item that arcadia todo lists, carrying an ask-origin answer command. The Back Burner still receives an Ask only when the intake classification is Idea or the operator passes --back-burner. A Review Response with no resolvable reference also goes to Clarify First. Agent-sourced Asks (agent.ask envelopes) keep today's routing. Only a whole message that exactly matches a closed acknowledgement list ('thanks', 'thank you', 'ok', 'okay', 'got it', 'ack', 'done', or emoji only), after trimming whitespace and punctuation and ignoring case, creates no new question. So does an exact duplicate of an open Ask question within 24 hours. Their receipts say why, and the report counts them as suppressed, apart from the vanish rate. A message such as 'ok, ship X' is never suppressed.","The intake patterns in src/intake/index.ts recognise 'I should be able to', 'I want (to be able) to', 'let me' and 'it would be good if'. With these, the operator's example 'I should be able to Ask Arcadia to schedule a recurring action' is captured as work. Intake also records two deterministic flags in extractedFields. recurrence is set when the text says every, daily, weekly, monthly, recurring or schedule. planning is set when the existing planningRecommended pattern matches. ask_requests stores both flags so the report can count them.","arcadia todo renders two section headers. 'Yours' holds the existing operator items and a 'Your Asks need one answer (N)' group: the newest 5 Ask-originated questions, with the full count always shown and never hidden by the other-items cap. 'Agents are doing' is one count line of in-flight agent work, naming arcadia todo --agents, which this Action adds to list that work. A counts line reads 'Back Burner: N incubating (M new in 7 days)'. The morning packet counts the Ask questions. Existing Back Burner items are not moved or changed. With no resolvable workspace, the degraded output states that Ask questions and Ask-origin tasks are unavailable.","Tests cover:\n- the routing change for each classification;\n- the review-reply fallback;\n- the new phrasings;\n- the recurrence and planning flags;\n- trivial-acknowledgement and duplicate suppression;\n- an agent-sourced Ask keeping its route;\n- the flag-off rollback;\n- both todo sections and the counts line.\nType, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":[],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/backBurner/surfacing.ts","src/orientation/operatorTodoLines.ts"]},{"target_ref":"action/ask-corrections-stick","desired_result":"Make a corrected Ask route correctly the next time it is sent, instantly and with no model call.","acceptance":["An additive migration creates ask_corrections with columns ask_request_id, normalized_text, text_hash, predicted_type, corrected_type, corrected_project, source and created_at, with no cascade delete. It also adds nullable confidence and corrected_type columns to ask_requests. Each correction row is written in the same transaction as the re-route, so a correction cannot exist without its memo.","A memo stage runs before the intake patterns. An operator Ask whose normalized text exactly matches a stored correction routes to the corrected type and Project, and its receipt says '(memo <date>)'. There is no fuzzy matching. An answer to an ask-origin clarification question also writes a correction row. Only operator corrections (source cli, discord or answer) are used as memos. Rows recorded from a model re-route are never used as memos. Raw Ask text stays in the workspace database and is never written to any repository.","Tests cover the transactional write, a memo hit on the identical Ask, a miss on different text, and the no-cascade guarantee. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-receipt-and-one-reply-correction"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/db/schema.ts"]},{"target_ref":"action/ask-local-model-tiebreaker","desired_result":"Give an unmatched operator Ask a typed interpretation from the local model asynchronously, falling back to one question.","acceptance":["The IntakeClassifier seam in src/intake/index.ts becomes injectable. A model-assisted classifier runs asynchronously through the same job and idempotency path the clarify engine uses, not inline in arcadia ask. It calls the local-preferred Intelligence route (operation arcadia.ask.classify, allowPaidUsage false) only for operator Asks that the deterministic rules and the memo left as Clarify First questions. Its output schema is an enum of work, task or unknown, plus actor, recurrence, planning and one question. It can never output idea, answer or status. Its extracted fields never set a Project, a Decision or authority.","A passing classification re-routes the Ask through the same governed writers as arcadia ask correct, recorded with source model (never used as a memo; see ask-corrections-stick), and updates its todo entry. When the model is unavailable, slow or unsure, the Ask stays the one Clarify First question, never an error and never the Back Burner. The classifier is behind a config flag that is off by default until prove-operator-request-to-started-work passes. Ask text that reaches a coding agent through a handoff Ask is marked untrusted.","Tests use a stubbed model to cover a pass, a timeout, an unavailable route, a forbidden output type and a malformed output. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-corrections-stick"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/clarify/engine.ts","src/intelligence/types.ts"]}]}
