agent_ask: v1
request_id: amend-bug-burn-plan-execution-build-20261106
project: arcadia
intent: plan
target_ref: plan/burn-down-three-small-verified-bug-issues-in-unattended-serial-production
requested_authority: propose
desired_result: 'Restore the declared build route on the three Actions of the bug-burn
  draft Plan, which draft-Plan creation dropped (Issue #2134), so unattended packets
  are build packets and not Decision-gated planning runs. Only the route changes;
  each Action keeps its next_action and acceptance verbatim.'
actions:
- target_ref: action/accept-canonical-roles-in-session-ledger
  desired_result: 'Make the Session ledger accept every role registered in config/defaults/agent-roles.json
    while keeping its legacy roles valid, fixing Issue #1366.'
  execution: build
  acceptance:
  - validateSessionLedgerRow in src/reports/sessionLedger.ts accepts a row whose role
    is any role id listed in config/defaults/agent-roles.json.
  - A row with each legacy role lead, driver, reviewer, replayer and opus-planner
    still validates, and a row with the unknown role wizard still fails with a field
    role error.
  - A regression test in tests/session-ledger.test.ts reads the role ids from config/defaults/agent-roles.json
    and covers those three cases; it fails before the fix and passes after.
  - Every other test in tests/session-ledger.test.ts passes unchanged.
  - Apart from the settlement records Arcadia writes, the change touches only src/reports/sessionLedger.ts
    and tests/session-ledger.test.ts. Proof that the tests, lint and tsc pass comes
    from the required CI jobs on the pull request's head, not from the Session, which
    cannot run them under headless validation.
- target_ref: action/truncate-torn-journal-tail-by-byte-offset
  desired_result: 'Make the tidy journal''s torn-tail repair truncate at the UTF-8
    byte offset of the last newline, not the JavaScript string index, fixing Issue
    #749.'
  execution: build
  acceptance:
  - After repairTornTail in src/git/quarantine.ts runs on a journal with a torn tail,
    the file's byte length equals the UTF-8 byte length of its content through the
    last newline.
  - A regression test in tests/tidy-journal-recovery.test.ts writes a complete journal
    record containing a non-ASCII branch or worktree path followed by a torn trailing
    record, triggers the repair before an append, and asserts the earlier record still
    parses as JSON and the torn tail is gone; it fails before the fix and passes after.
  - Every other test in tests/tidy-journal-recovery.test.ts passes unchanged.
  - Apart from the settlement records Arcadia writes, the change touches only src/git/quarantine.ts
    and tests/tidy-journal-recovery.test.ts. Proof that the tests, lint and tsc pass
    comes from the required CI jobs on the pull request's head, not from the Session,
    which cannot run them under headless validation.
- target_ref: action/report-cut-work-monitor-attention-lines
  desired_result: 'Make the work monitor''s attention lines say how many lines its
    limit cut and from which Projects, so no unsaved or local-only working copy disappears
    silently, fixing Issue #2011.'
  execution: build
  acceptance:
  - 'When formatWorkingCopySafetyLines in src/workMonitoring/scanner.ts has more lines
    than its limit, it returns the first limit lines unchanged followed by exactly
    one extra line of the form "3 more not shown: Alpha 1, Beta 2.", where the number
    is the count of cut lines and each Project''s cut count appears in Project-name
    order.'
  - When no line is cut, the output is unchanged and has no extra line.
  - A regression test in tests/work-monitor.test.ts on a hand-built snapshot proves
    both cases; it fails before the fix and passes after.
  - The existing limit-2 expectation in tests/work-monitor.test.ts changes only by
    gaining the new final line, and every other test in tests/work-monitor.test.ts
    and tests/work-monitor-failures.test.ts passes unchanged.
  - Apart from the settlement records Arcadia writes, the change touches only src/workMonitoring/scanner.ts
    and tests/work-monitor.test.ts. Proof that the tests, lint and tsc pass comes
    from the required CI jobs on the pull request's head, not from the Session, which
    cannot run them under headless validation.
