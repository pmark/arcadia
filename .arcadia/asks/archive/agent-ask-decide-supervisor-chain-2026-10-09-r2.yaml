{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-supervisor-chain-2026-10-09-r2","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide what a supervisor is and how the supervisor chain reaches the operator.","rationale":"The operator wants a supervisor assigned to every agent, responsible for monitoring, direction and learning for its team, and reporting up a chain that ends at the operator. src/briefSupervisor.ts already uses the word for a process watchdog. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"A deterministic assignment, not a running agent. A delegate's supervisor is its lead. A lead's supervisor is the Project supervisor function, carried out today by existing stall detection, peer watch and arcadia todo, with the operator on top","consequence":"It adds no standing model spend and works today. It does not deliver active direction or learning for the team. Above the lead, no one steers a team mid-flight or turns lessons from across Sessions into changes; each lead's own notes-to-self are the only learning. Every relay above a lead lands on the operator through arcadia todo and pings. A standing supervisor agent returns when a queued delegation outlives its bounded wait with no supervisor action twice in one week.","recommended":true},{"label":"A standing light-model supervisor agent for each Project, like a Comms session, that watches its teams, directs them, records lessons and reports to an operator-level supervisor","consequence":"Direction and learning are actually performed, and fewer relays reach the operator. It spends model tokens while running and brings a new long-lived lifecycle to manage and watch."},{"label":"Flat: every agent reports straight to the operator","consequence":"The simplest. Every relay costs operator attention, which goes against the Constitution's attention budget as the number of teams grows."}],"references":["docs/agent-guidance/agent-peer-watch.md","docs/agent-guidance/agent-comms.md","src/agentWatch/classify.ts","src/briefSupervisor.ts","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
