  "desired_result": "Settle whether coding-Run discovery may write governed Actions straight into the active Plan, or must route them through an Agent Ask like every other new Action.",
  "rationale": "AGENTS.md reserves creating Actions and touching the queue for an Agent Ask, and `arcadia schedule discover` does neither: it derives an Action id, writes the Action into the active Plan, commits it, and places it in the queue, unattended. That is a real departure and it currently lives only in a PR description and docs/production-scheduling.md, which is not where a Way change belongs. Routing discovery through an Ask is not merely inconvenient for the blocker case, it defeats it: a blocker exists to become the next runnable work inside the same Run, and an Ask waits for the operator to settle it, so the Run stalls on exactly the thing the blocker was raised to clear. Separately, settlement refuses queue placement from a candidate worktree, and a Run is always in one. The mitigations already in the code are that only blocker, corrective and follow_up classes can be created, each needs acceptance criteria, the write is committed and never pushed, every one is logged to the scheduling Log with its origin, and three circuit breakers (depth 2, three corrective descendants per root Action, eight correctives per Milestone) stop the branch and open a Decision instead. The operator's judgment is which of these boundaries is the right one, so this is a Decision rather than a documentation note.",
