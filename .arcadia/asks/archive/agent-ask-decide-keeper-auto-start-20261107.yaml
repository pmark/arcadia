{"agent_ask":"v1","request_id":"decide-keeper-auto-start-20261107","project":"arcadia","intent":"decision","requested_authority":"propose","gate_question":"reasonable_disagreement","desired_result":"Decide whether Arcadia may start a Momentum Keeper automatically whenever managed production turns Active, and stop it when production turns Off.","rationale":"Decision 0188 B registered the Momentum Keeper as a supervisor-class helper under Rowan and says Rowan or the operator starts each helper under Decision 0114; nothing starts one automatically. The registration merged in PR #2235 (the Momentum Keeper section of docs/agent-guidance/session-roles-and-briefs.md) repeats that sentence. PR #2233, now on main, added always-on idle and keeper-heartbeat alarms to the once-a-minute liveness timer: when no live keeper heartbeat exists in an open run window it pages MOMENTUM KEEPER NOT ACTIVE and starts nothing. A keeper therefore exists only while someone remembers to start one, so it is most likely to be missing overnight, in the operator's away windows and after a coordinator handoff, which are the windows it exists to cover. An automatic start needs a launcher: PR #2223 (Mira's coordinator-handoff design, not merged) describes a deterministic relay that launches sessions as CLI sessions under tmux through the existing launcher, and its probes P1 and P2 (Remote Control reachability and the background-host stop semantics) are not yet verified. This question is narrower than PR #2223's own launch Decision: it covers only starting and stopping one Momentum Keeper at production Active and Off, not coordinator successors or any other helper. It changes what Arcadia launches without a person, touches production state transitions and carries a recurring token spend, so a reasonable person could choose differently. The operator chose A, verbatim \"A\", in the Signal session at about 21:35Z on 2026-11-07; that answer is recorded through arcadia decision approve in a separate commit, not by this Ask. The pull requests carrying this Decision wait for the operator's merge and must not be agent-merged.","options":[{"label":"A. Start one Momentum Keeper automatically at Active and stop it at Off","consequence":"Arcadia starts exactly one Momentum Keeper when managed production turns Active and stops it when production turns Off, through the coordinator relay's launcher from PR #2223 (a CLI session under tmux) once that design's probes P1 and P2 pass; nothing starts automatically before then. The keeper is pinned to a light or standard tier, carries a per-run token cap and runs as a single instance (a second start is refused while one is live). It keeps every Decision 0188 B never: no merge, card press, spend, credentials or operator messaging, and a host refusal is reported, never routed around. This amends only 0188 B's sentence that nothing starts one automatically, and only for this helper; every other helper is still started by Rowan or the operator under Decision 0114. Until the launcher exists, the keeper-not-active alarm from PR #2233 remains the fallback and Rowan or the operator starts the keeper by hand. Cost: start-up tokens on every production run (the keeper's orientation and retrieval), the launcher and start/stop hook in their own reviewed pull requests, and no extra operator tap per run. Stays out, as separate Decisions: coordinator successor launch (PR #2223's own Decision), auto-start of any other helper, a multi-day standing grant and any merge permission.","recommended":true},{"label":"B. No automatic start; the keeper alarm carries a one-tap Start Keeper card","consequence":"Nothing starts a keeper automatically and Decision 0188 B stands unchanged. When the keeper-not-active alarm from PR #2233 fires, its page carries a one-tap Start Keeper card, and the operator's tap starts one keeper through a launcher. Cost: one operator tap per production run, a card surface and launcher to build, and critical-path idle minutes between the alarm and the tap, longest while the operator is away or asleep, which is the gap the keeper exists to close; start-up tokens only on runs the operator taps. Stays out: any automatic launch.","recommended":false},{"label":"C. Manual starts only, with the keeper alarm as the safety net","consequence":"Rowan or the operator starts each keeper by hand under Decision 0114, exactly as Decision 0188 B says today, and nothing new is built. The keeper-not-active alarm from PR #2233 pages whenever no keeper heartbeat is live in an open run window, and someone must then start one in a session. Cost: no new code and no automatic start-up tokens, but a keeper is missing whenever its starter is missing (overnight, away windows, after a coordinator handoff), so critical-path idle can grow until Rowan or the operator acts on the page. Stays out: any card or automatic launch.","recommended":false}]}
