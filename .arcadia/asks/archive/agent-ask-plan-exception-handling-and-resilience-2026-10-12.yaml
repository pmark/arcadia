{"agent_ask":"v1","request_id":"plan-exception-handling-and-resilience-2026-10-12","project":"arcadia","intent":"plan","desired_result":"Every situation class an unattended production run can hit has a registered deterministic response, a retry budget and a one-click escalation, and a lost orchestrator or a red main never needs the operator to notice first.","rationale":"Opus review of the program (2026-10-12), Track W2: resilience is the half of the goal that lets the system handle any situation on its own. Created as an inactive draft.","actions":[{"id":"define-situation-registry","desired_result":"Implement a situation registry that maps every platform stop reason and tick escalation to one deterministic response, a retry budget and an escalation card, and fails CI on an unregistered stop reason.","acceptance":["Every blocker kind and tick escalation kind appears in the registry with a response, retry budget and escalation trigger, extending the blocker remedy registry rather than duplicating it.","A test enumerates the emitted stop reasons from code constants and fails the build when one is unregistered.","The registry names the situation classes stuck Session, red main, CI flake, merge conflict, stale pin, spend breach, provider outage, wrong output, scope drift, poison Plan, reviewer disagreement, queue corruption and environment wall.","Focused tests pass."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"Without one registry each stop needs Lead judgment; with it the platform answers by lookup."},{"id":"main-health-watch","desired_result":"Implement a main-health watch that pauses admission when main goes red after a merge and opens a revert pull request for the offending merge within ten minutes.","acceptance":["A red required check on main after a merge pauses new admissions and records one named blocker.","When the red is attributable to the last merge the watch opens exactly one revert pull request and a pinned card, and never merges it itself.","An unattributable red raises a card and leaves admission paused; a green main clears the pause automatically.","A replay fixture covers attributable, unattributable and flaky reds; focused tests pass."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"A red main strands every later Action; the platform should contain it without the operator noticing first."},{"id":"plan-level-repair-budget","desired_result":"Implement a Plan-level repair budget that pauses the Plan and raises one anomaly card after two consecutive Actions stop or exceed two blocking review rounds.","acceptance":["The counter reads the session ledger and review round records and is scoped per Plan.","Two consecutive stopped or over-budget Actions pause the Plan, record one close-out anomaly and raise exactly one card with resume, re-plan and retire verbs.","A resumed Plan resets only its own counter; other Plans are untouched.","Focused tests and a replay fixture pass."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"A poison Plan should cost two attempts, not a night of relaunches."},{"id":"resume-from-state-brief","desired_result":"Implement a state brief generator and resume step so a lost orchestrator session is replaced from the pointer, ledger and open pull requests without operator input.","acceptance":["The generator writes a brief from the Project pointer, the active Plan current Action, open blockers, the last three ledger rows and open pull requests, using bounded reads.","A heartbeat-missed tick launches a replacement orchestrator session from that brief once and records a receipt; a second miss raises a card.","The brief is deterministic for identical inputs and contains no secrets.","Focused tests pass."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"The loop dies when the orchestrator dies; recovery must not need the operator."},{"id":"settle-from-candidate-and-publish","desired_result":"Implement settlement that runs in the candidate worktree and publishes its own governed pull request, removing the main-checkout requirement and the local-main divergence.","acceptance":["A queue-placing settlement runs from the candidate worktree with an ancestor candidate_revision and opens its own pull request.","The settle commit is authored as the resolved agent identity and the main checkout is never modified.","The pointer advance is staged in the same settlement when a queue reorder changes the first Action.","Focused settlement tests pass and no local-main divergence is produced in a replay of an activation."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"Each activation, split and reorder cost an extra governed pull request and left local main diverged (living notes frictions 2 to 6 and 14)."}]}
