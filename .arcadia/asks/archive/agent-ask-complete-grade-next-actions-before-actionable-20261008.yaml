{"agent_ask":"v1","request_id":"complete-grade-next-actions-before-actionable-20261008","project":"arcadia","intent":"complete","requested_authority":"apply_if_approved","target_ref":"plan/operator-to-do-list-with-ask-only-input#grade-next-actions-before-actionable","candidate_revision":"1e64e712286c859e66f82f0dff455cade65a326c","desired_result":"Mark grade-next-actions-before-actionable complete.","rationale":"Delivered across #1059, #1063 and #1064. Criterion 1 is as amended by the operator's choice on 2026-10-08 (amend-operator-todo-acceptance-to-shipped-design-20261008, r2). A read-only verifier checked each criterion on main. The Plan is inactive and no pointer moved. Refs #1044.","evidence":[{"criterion":"arcadia ask marks the work_items it creates unclarified, and the clarify generator schema gains a doneCondition field that is required on the clarified branch, enforced by normalizeVerdict and the deterministic lint rather than by schema validation (a schema-invalid reply would become a failed job that the idempotency key keeps reusing); normalizeVerdict (src/clarify/engine.ts) downgrades a clarified verdict lacking one to question_open with the existing gapType missing-success-criteria and exactly one question.","status":"met","note":"arcadia ask creates work_items unclarified (src/commands/ask.ts ~846; test tests/clarifyHandoff.test.ts 'creates the Action unclarified'). The generator schema has a doneCondition field (src/clarify/contract.ts). It is required on the clarified branch and enforced by normalizeVerdict (src/clarify/engine.ts ~112-119) and the deterministic lint (src/clarify/lint.ts), not by schema validation, because a schema-invalid reply would become a failed job reused by its idempotency key. normalizeVerdict downgrades a clarified verdict with no doneCondition to question_open, with gapType missing-success-criteria and exactly one question (tests/clarify.test.ts 'downgrades a clarified verdict with no done-condition to exactly one question'). Delivered in #1059 (e5309b4a3)."},{"criterion":"Before recording clarified, a deterministic lint (non-empty doneCondition; nextAction starts with a verb; every file path, Action or Decision id and command name it mentions appears in the source material, which includes the prior clarification answer) and then a separate grader run. The grader is its own instruction file .agents/skills/next-action-grader/SKILL.md (symlinked from .claude/skills, reported as an external boundary if the sandbox blocks the link, and listed in docs/using-arcadia-skills.md) executed as its own local-preferred Intelligence call with a different prompt that never receives the generator's confidence, using a distinct model profile when one is configured and otherwise documenting that only prompt independence is claimed. It checks: concrete verb; first physical step startable by the named actor in under 15 minutes; observable done-condition; no invented facts; and when information is missing, a request for exactly that one item. Only a pass records clarified; a fail records question_open through the existing clarify --apply path (an ActionClarification review_item), so the single question appears in arcadia todo.","status":"met","note":"Before recording clarified, src/commands/clarify.ts runs the deterministic lint (src/clarify/lint.ts): non-empty doneCondition, a verb-first nextAction, and every path, Action or Decision id and command name present in the source material, including the prior answer. It then runs the separate grader. The grader is .agents/skills/next-action-grader/SKILL.md, listed in docs/using-arcadia-skills.md. It is its own local-preferred Intelligence call with a different prompt, allowPaidUsage false, and it never receives the generator's confidence (tests/clarifyGrader.test.ts). Only prompt independence is claimed, because the fast and standard profiles map to one alias by default. The .claude/skills symlink is reported as an external boundary in #1063 and #1064 because the sandbox blocked it (tracked in #1066). A pass records clarified. A fail records question_open through the existing clarify --apply path as an ActionClarification review_item, which arcadia todo lists (#1072). Delivered in #1063 (b9fad8251)."},{"criterion":"When the operator answers an ActionClarification at the CLI with review approve <id> --answer <text> --clarify or review resolve-reply <reply> --id <id> --clarify (a new opt-in flag that arcadia todo prints in its answer command), the answer is made durable and then clarify --work <id> --apply runs once; without the flag, and on the Discord and dashboard paths (which re-clarify themselves), no clarification is triggered, so nothing runs twice. When a passing verdict's actor is a coding agent and the work_item has a capture_id, clarify --apply drafts one strict v1 Agent Ask (intent action, request_id handoff-<work_item_id>-<first 12 hex of sha256(nextAction + doneCondition)>, rationale naming the capture envelope and work_item ids, acceptance from the done-condition) into the Project repository's .arcadia/asks/ through the existing draft writer (runAgentAskDraftCommand). Drafting is skipped, with the reason reported, when the work_item's Project has no repo_path or a proposal with that request_id already exists, including one already settled and archived. That draft is the file handoff; it appears in arcadia todo as a pending proposal, and clarify itself writes no Action status, pointer or queue.","status":"met","note":"--clarify is an opt-in on review approve and review resolve-reply (src/cli.ts; src/commands/reviewClarify.ts). It makes the answer durable, then runs clarify --work <id> --apply once. Without the flag, and on the Discord and dashboard paths, nothing is triggered. arcadia todo prints the --clarify answer command for ActionClarification items (src/commands/todo.ts, #1072). When a passing verdict's actor is a coding agent and a capture_id exists, src/clarify/handoff.ts drafts one strict v1 Agent Ask