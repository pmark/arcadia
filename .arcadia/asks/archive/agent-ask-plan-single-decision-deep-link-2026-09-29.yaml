{"agent_ask":"v1","request_id":"plan-single-decision-deep-link-2026-09-29","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Let the operator answer any Decision in one step from a Discord ping that links straight to a dashboard page showing only that Decision (Decision 0076).","rationale":"Decision 0076 makes Discord and the dashboard the way Decisions are answered, preferably through a direct link to a single-Decision page. Today /review lists every item and the Discord requires-review notification only says to run /arcadia review, so the operator has to hunt for the Decision. Filed as an inactive draft Plan so it does not reorder the active managed-production Plan; the operator decides when to activate it.","references":["docs/decisions/0076-answer-decisions-through-discord-and-the-dashboard.md","apps/dashboard/app/review/page.tsx","apps/dashboard/app/api/review-action","apps/discord-bot/src/formatters/requiresReviewFormatter.ts","apps/discord-bot/src/config.ts"],"actions":[{"id":"add-single-decision-dashboard-page","desired_result":"Add a dashboard page that shows one Decision and lets the operator answer it there.","acceptance":["The dashboard serves a page at /review/<decision-ref> for one Decision, where <decision-ref> is its governed number (for example 0076) or its database id.","The page shows that Decision's question, every option with its consequence, the recommendation, and the same answer controls /review offers for its kind, reusing the existing review-action endpoint.","Answering from the page records exactly what answering the same Decision from /review records, and a test proves it.","An unknown or already-answered reference shows a clear not-found or already-answered state instead of an error, and a test covers each."],"dependencies":[]},{"id":"link-discord-decision-pings-to-their-page","desired_result":"Make every Discord ping about a Decision link straight to that Decision's dashboard page.","acceptance":["Each Discord notification that names a specific Decision includes a link to /review/<decision-ref> built from the configured ARCADIA_DASHBOARD_URL.","The requires-review summary lists one link per pending Decision instead of only telling the operator to run /arcadia review.","Formatter tests cover a single Decision, several Decisions, and a non-default ARCADIA_DASHBOARD_URL.","START_HERE.md's Answering Decisions section describes following the Discord link to answer a Decision."],"dependencies":["add-single-decision-dashboard-page"]}]}
