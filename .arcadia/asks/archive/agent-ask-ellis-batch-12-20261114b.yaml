desired_result: Draft an inactive batch 12 Plan of six bounded Actions that build the Field Notes writer identity system for Decisions 0234 and 0235 (writer registry and shared token mapping, build-time writer validation, post layout furniture, index chip and feed attribution, Clara's style, Flynn's style held reserved) without pulling any cadence, reviewer, ping, retire or imitation behaviour into this batch
rationale: "Batch 12 draft, revision b (Ellis, Claudia Mason, 2026-11-14; the operator accepted batch 12 with one change, splitting the layout Action in two), shape of batches 9 to 11. Creates an inactive draft Plan only; no pointer, queue, dispatch, production or Decision changes and no authority is granted. Source designs: Iris's feed and writer identity system, Clara's identity and implementation outline (allowed-file list), and Flynn's v4 style spec (read-only, outside the repository). Decision 0234 (A: automatic multi-writer publishing to one combined Field Notes feed) and Decision 0235 (Defaults: the operator accepted all six clarifications) are both approved on origin/main (verified after fetch). Premises verified on origin/main: site/stage.mjs exists and gates posts on status, type, channels, not_done and a receipt whose last Independent review Verdict is PASS, but reads no `writer`, `operator_suggestion` or `author` field (author passes through unchanged inside the copied front matter); site/_layouts/default.html loads only style.css (cache token ?v=ride-matched-margins) and topics.css; post.html line 8 prints `{{ page.author | escape }}`, which would print a hash badly, so the layout must be made hash-safe before stage writes one; index.html has one `<li>` per post inside `<article>` and no writer markup; rg for data-writer, --w- and writer under site/ finds nothing; style.css defines the tokens on :root with light-dark() (lines 26 to 39) and has one forced-colors block at line 264; _config.yml exclude lists only README.md and stage.mjs, so a new site/writer-check.mjs would be published as a static file unless excluded; blog.yml has no install step (checkout, stage, jekyll-build-pages only), so stage.mjs and writer-check.mjs must import only node: built-ins and the registry must be JSON, not YAML (deliberate deviation from Iris's writers.yml; Jekyll reads _data/*.json); no test, script, lint config or docs front-matter check enumerates site/ files (git grep of tests, scripts, src and eslint.config.mjs finds only the large-files allowlist entry for the flac); `pnpm lint` does not cover site/; the tracked tree is 54.99 MiB of the 62 MiB cap and this Plan adds only a few KB of text. Two design hazards found and handled inside the Actions: (a) Iris's mapping block `[data-writer] { --fg: var(--w-fg) }` together with a writer file `[data-writer=x] { --w-fg: var(--fg) }` on the same element is a custom-property cycle that invalidates both (inferred from the CSS custom-property rules, not run), so the mapping must target children of the carrier; (b) Flynn's draft stylesheet uses `.row`, `.closing`, `.haiku` and `.section-label` classes that no layout provides, and the layout's Receipt link must not use the 🧾 that belongs to Clara's set. Inferred, not verified here (no Jekyll on this host): that jekyll-feed on the pinned jekyll-build-pages image emits a hash `author` as `<author><name>`; the Action that depends on it records the result or states it unverified. Deferred to batch 13, deliberately NOT in this batch although Decision 0235 now answers each point: (1) one per-site combined post ceiling with Flynn's digests as their own post type capped at four a day, which is cadence enforcement plus the digest type; (2) the non-author fact-checker recorded as a `- Reviewer:` line and checked by the gate; (3) Atom counts as the RSS feed, so no RSS 2.0 build is planned and this batch only keeps the single /feed.xml; (4) one daily roll-up publish ping replacing Decision 0120's per-publish ping; (5) a retired writer's posts skipped instead of failing the build; (6) no style may imitate a named real person, with its check. Batch 13 must read these from Decisions 0234 and 0235 rather than hard-code them, and the flip of Flynn to active belongs with it. Until then no Decision 0120 or 0165 gate, receipt or cadence rule changes: `writer:` is additive, every existing check still runs first, a writer post that fails any gate is skipped or fails exactly as before, and the existing cadence stays as unenforced as it is today. Flynn's registry entry therefore stays `reserved` in this Plan (stage keeps rejecting `writer: flynn`, the pre-launch slot guard and not the retire behaviour of Decision 0235); flipping it to active belongs with the cadence work in batch 13. No Clara or Flynn post is authored here; Clara's sample stays a draft in the design notes."
acceptance:
  - "An inactive draft Plan holds the six Actions below in this order, and no active pointer, queue or production policy changes on registration."
