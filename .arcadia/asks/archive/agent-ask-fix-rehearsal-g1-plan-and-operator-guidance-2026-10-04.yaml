"rationale":"A smoke of G1/G6/G7/G8 against real host output (scratch reproduction, nothing run) found: (1) prepare-three-action-rehearsal-fixture-2026-10-04.sh:266 writes the acceptance criterion as `- \"$VALIDATION_COMMAND\" passes.`, which is invalid YAML (a quoted scalar followed by text); Arcadia's own discoverDocs rejects the Plan ('Invalid YAML ... line 22, column 44'), docs sync then reports errorCount>0 and G1 refuses at register_project (line ~361) after it has already created and pushed the private repo, imported the Project and written .git/arcadia-three-action-project-id; a rerun cannot repair it (genesis already holds the broken plan) and a new repo name refuses at line ~351 because the Project slug already exists. The test hid it by faking docs sync (tests/three-action-rehearsal-operator-scripts.test.ts:907 returns errorCount 0). (2) G1's next-step text and the recover descriptor do not say that recover-arcadia-host-services must run with ARCADIA_WORKSPACE set INLINE to the absolute workspace path (/Users/pmark/Dev/MR/Arcadia/workspaces/martianrover): the restart implementation defaults to a nonexistent workspaces/arcadia path (earlier receipts runs/20261003T041921Z-30918 and runs/20261003T223622Z-53402 failed this way), and exporting the variable in the shell makes G1/G6/G7/G8 refuse because workspace resolve then reports source 'environment variable' instead of 'user config'. (3) Cosmetic: G6 lines ~306/317 CHECKS_STATE can become 'none\\nnone' after a gh api HTTP error; G6 line ~288 `.codex.availability != \"unavailable\"` can never fail because the enum has no such value. None of this grants authority.",
