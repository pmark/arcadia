{"agent_ask":"v1","request_id":"plan-ux-dashboard-ask-correction-and-map-2026-10-11","project":"arcadia","intent":"plan","target_ref":"plan/ux-improvements-make-every-operator-interaction-fast-phone-first-and-self","desired_result":"Add three Actions that give the Dashboard Ask capture screen immediate intent correction, an evidence panel, and a secondary relationship map.","rationale":"Operator Ask on 2026-10-11 landed as a Clarify First question with no Action, no Plan placement and no on-screen correction; arcadia ask correct exists but apps/dashboard has no UI for it. Operator asked for the correction menu and the relationship map to be logged in a UX plan. Receipt: proposal dashboard-ask-capture-intent-correction-and-relationship-map-2026-10-11.","actions":[{"id":"dashboard-ask-heard-receipt-and-correction-menu","desired_result":"After a Dashboard Ask submit, show the Heard receipt and a one-tap menu of alternative next steps that re-route the Ask through arcadia ask correct.","why":"An unmatched Ask must be correctable at the moment of capture, not found later in arcadia todo.","acceptance":["The Ask capture result shows the Heard line (type, confidence, source, what was created and where) before any other detail.","A menu offers work in a chosen Project, idea, status question, answer to a named pending Decision, and operator task; choosing one calls the same writers as arcadia ask correct and shows the superseding receipt.","An answer correction requires an explicit pending Decision reference and is refused otherwise.","The menu works with the relationship map absent or failing.","Tests cover each correction target and the refusal; type, lint and build pass; a pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":[],"references":["src/commands/askCorrect.ts","src/ask/heard.ts","src/ask/corrections.ts","apps/dashboard/app/capture","docs/plans/operator-to-do-list-with-ask-only-input.md"]},{"id":"dashboard-ask-evidence-panel","desired_result":"Show on the Ask capture screen what the Ask created or did not create and where it sits in which Project Plan and queue position.","why":"The operator needs evidence that an Ask became prioritized work, or a plain statement that it did not.","acceptance":["The panel shows the ask-trail result for the capture: each Action, Decision or Back Burner item produced, its Project, Plan and queue position, or an explicit statement that nothing was created.","An Ask that produced only a question says so and links the open question.","Tests cover the produced and not-produced cases; type, lint and build pass; a pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["dashboard-ask-heard-receipt-and-correction-menu"],"references":["src/commands/askTrail.ts","apps/dashboard/lib/arcadia-cli.ts"]},{"id":"dashboard-ask-relationship-map","desired_result":"Draw a relationship map of a just-submitted Ask and its connected topics, Projects, Plans, Actions, services, agents and Sessions, after choosing between a Markmap mindmap and a D3 force-directed graph.","why":"The map shows the Ask in context and aids routing; it is secondary to the correction menu.","acceptance":["A short recorded comparison of Markmap and a D3 force-directed graph, judged on non-hierarchical links, phone legibility and bundle cost, names the chosen renderer.","The map renders immediately after submit from deterministic data only, with no model call, and nodes link to their Project, Plan, Action or Session pages.","The correction menu stays usable when the map is slow, empty or errors.","Tests cover rendering with and without connections; type, lint and build pass; a pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["dashboard-ask-heard-receipt-and-correction-menu"],"references":["docs/plans/mission-control-view/03-urgency-and-force-model.md","apps/dashboard/app/capture"]}]}
