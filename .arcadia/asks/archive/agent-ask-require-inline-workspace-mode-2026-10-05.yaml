"rationale":"Operator direction 2026-10-05: ship the inline-required mode, then end the multi-workspace trial. The Decision 0082 trial tripped its stop condition when an uninlined `config get defaultWorkspace` wrote one activity row into the live workspace (issue #940, friction #947); #948 stopped workspace-independent commands from recording, but any command that resolves a workspace (for example `status`) run with no inline workspace still resolves the user-config default and acts on the live workspace. Cody (Codex) recommended making resolution mandatory; this narrows it to an opt-in mode set for agent sessions: with ARCADIA_REQUIRE_INLINE_WORKSPACE set, a command that would resolve its workspace from the user-config default (or the dogfood marker) refuses with a named error and the exact fix, while --workspace, the ARCADIA_WORKSPACE variable and the cwd config walk-up keep working, so live services and operator scripts (which do not set the variable) are unaffected. No authority is added.",
