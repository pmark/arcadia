{"agent_ask":"v1","request_id":"amend-build-operator-todo-list-fixture-blocking-20261008","project":"arcadia","intent":"plan","requested_authority":"apply_if_approved","target_ref":"plan/operator-to-do-list-with-ask-only-input","desired_result":"Clarify build-operator-todo-list criterion 3 so the blocking items of fixture and no-repo Projects are still listed, consistent with criterion 1.","rationale":"This resolves a conflict between two of the Action's own criteria. Criterion 1 requires that a stalled production loop appear (escalations are always blocking). Criterion 3 said fixture and no-repo_path Projects appear only as a counts line, and that hid such Projects' blocking escalations. The independent review of #1081 rated this BLOCK, and the fix kept blocking items listed. This is the recommended reading, and no reasonable alternative would hide a blocking escalation. Applied by the release manager and reported to the operator. Text-only: dependencies and references are restated unchanged.","actions":[{"target_ref":"action/build-operator-todo-list","desired_result":"Give the operator one derived to-do list of everything Arcadia needs from him: arcadia todo.","acceptance":["arcadia todo [--json] [--all] [--stale] [--project <slug>] is a read-only derived view with no new store and never mutates anything. Per Project it computes the selected Action and ready set the way arcadia next does (resolveDispatch, resolveReadySet and resolveOperatorGate under a read-only database), then composes: open Decisions and pending Agent Ask proposals classified blocking or alert by the existing classifyOperatorItems/resolveOperatorGate; open and deferred review_items (covering ActionClarification); waiting operator-task ledger items; production_operator_escalations rows read-only (one item per Action, kind escalation:<kind>, title from message, answer from remedy, always blocking, createdAt from first_detected_at, deduped against a listed Decision named in the message), so a stalled production loop appears even when no Decision or Ask exists; non-done work_items with clarification_status unclarified, a capture_id and no open review_item, as alert items of kind clarify whose answer is arcadia clarify --work <id> --apply; and Plan Actions only when requires_review, question_open or a readiness blocker names an operator step, excluding Project-pause states. It dedupes review_items by work_item_id and by doc_ref against open Decision documents, ledger items and Actions against the Decision or review_item that already represents them.","Blocking is true only for an item that is the selected Action's operator gate (a blockingDecisionId, a requiredDecisionId or deferringDecisionId of a ready-set candidate, the selected Action's own operator reason, or a review_item or ledger item linked to one of these); everything else is an alert. Each item carries key <kind>:<source-id>, kind, title from the source's own field (nothing synthesized), project, blocking, origin, createdAt, staleReason when stale, and answer: the exact existing canonical command (for an Agent Ask, the two-phase settle preview command) and, where one exists, the existing Discord reply or dashboard path. --json output carries schema 'arcadia-todo-v1' and asOf (ISO timestamp and workspace name), and every item carries sourceRef (the canonical file path, or table and id). Blocking comes from resolveOperatorGate or the escalation row and is never recomputed. Decision and Agent Ask items also carry gateQuestion, options with consequences, and evidence. The doneWhen rule per kind is documented in help and START_HERE.md, not stored.","Stale means positive evidence only: an Agent Ask of intent complete, split, or action with a target_ref is stale when every Action it targets exists in a Plan of its Project with status done; an Ask naming only absent Actions is an un-adopted proposal and never stale; supersession counts only through an explicit line 'Supersedes: <proposal ids>' in the rationale of an Agent Ask, read from its stored proposal; a Decision is stale when its action is done; a review_item is stale when its work_item is done or its doc_ref names an answered Decision. The default view prints a counts line (blocking, other, stale hidden, per kind), every blocking item, then at most 5 other items ordered with open Decisions first, newest first, then every other item oldest first; --all and --stale show the rest, and the default view ends with 'N more: --all'. Projects without a repo_path and fixture Projects whose slug contains 'rehearsal' or whose repo_path lies under the OS temp directory or ~/tmp appear only as a counts line, except that their blocking items are still listed and counted, so a stalled production loop is never hidden. With no resolvable workspace it prints the repo-local sources plus one explicit 'workspace sources unavailable: <remedy>' line, never a silently partial list; Decisions raised only on unmerged candidate branches are a documented limit.","Fixture tests cover one item per kind (including one operator_gate_pending and one repair_budget_exhausted escalation, and an escalation whose gate is also a listed Decision shown once), all dedup rules, positive-evidence staleness including an un-adopted proposal that stays visible, the blocking rule, ordering and cap, fixture-Project grouping, the degraded no-workspace output and a JSON golden; type, lint and build pass; START_HERE.md documents arcadia todo. A pushed PR with exact-head independent review and all required checks is the delivered Artifact; LOCAL ONLY or an unresolved blocker is labelled explicitly."],"dependencies":[],"references":["CONSTITUTION.md","docs/managed-documents.md","docs/planning-process.md","docs/agent-guidance/index.json","docs/plans/bootstrap-managed-production-to-build-flight-deck.md","https://www.anthropic.com/engineering/harness-design-long-running-apps","src/ask/operatorGate.ts","src/docs/operatorGate.ts","src/docs/operatorTasks.ts","src/commands/operatorTasks.ts","src/commands/review.ts","src/commands/decision.ts","src/commands/agentAsk.ts","src/scheduling/schedule.ts","src/db/repositories.ts","apps/dashboard/lib/needs-you.ts","START_HERE.md","src/commands/next.ts","src/ask/settlement.ts","src/production/tick.ts"]}]}
