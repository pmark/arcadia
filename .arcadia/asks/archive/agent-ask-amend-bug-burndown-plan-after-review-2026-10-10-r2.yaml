Ask Decision document, with a regression test.","pnpm fast-rehearsal passes with the change."]},{"target_ref":"action/amend-action-consumes-block-scalar-and-literal-ids","desired_result":"Make amendAction consume a block-scalar next_action and write instructions and request ids literally in every settlement writer.","acceptance":["Amending an Action whose next_action is a literal or folded block scalar yields a parsed nextAction exactly equal to the requested text, on the Action-amend and Plan-amend paths.","An instruction or request id that contains a dollar sign followed by an ampersand, a backtick or an apostrophe is written literally by amendAction, setActionDependsOn, recordSplitInto and replaceTopLevelField.","A split Ask whose request_id contains a dollar sign followed by an ampersand leaves the Plan valid with only the intended fields changed (regression test).","Other fields, other Actions, refusals and idempotency are unchanged; the agent-ask settlement, split and complete test files and pnpm fast-rehearsal pass."]},{"target_ref":"action/keep-queue-positions-of-projects-not-visible-at-arrange","desired_result":"Keep the queue positions of Projects that are not visible when a queue is arranged, instead of silently deleting them.","acceptance":["arrangeActionOrder and moveActionOrder keep every position row for a key absent from currentKeys unless the caller names that key as retired (done or dropped); the PR states how callers pass retired keys.","A settlement-time arrange while another Project is transiently blocked leaves that Project positions intact (regression test).","A key the caller names as retired, as the scheduler does for done Actions, is still removed, and undo restores the full position table from the receipt.","The receipt records the full position table before and after; the action-order and settlement tests and pnpm fast-rehearsal pass."]},{"target_ref":"action/refuse-hidden-renames-in-committed-completion-replay","desired_result":"Harden recordCommittedCompletionSettlement against renames into .arcadia/asks and clean up its scratch directory on timeout.","acceptance":["A candidate HEAD that renames a governed document into .arcadia/asks/ is refused by recordCommittedCompletionSettlement.","A commit that only adds .arcadia/asks/archive/agent-ask-<requestId>.yaml and removes .arcadia/asks/agent-ask-<requestId>.yaml is still recorded; an archive under any other name is refused, and the PR says so.","A forced source-control timeout inside the replay leaves no arcadia-settlement-replay-* scratch directory.","pnpm fast-rehearsal passes with the change."]},{"target_ref":"action/allocate-decision-numbers-from-origin-and-refuse-duplicates","desired_result":"Allocate Decision numbers from the local documents plus origin/main and refuse a new duplicate number, grandfathering the four existing pairs.","acceptance":["With origin/main holding Decision 0100 and a worktree whose documents stop at 0099, settlement and arcadia decision new both allocate 0101; offline they fall back to the local maximum with a warning.","A new Decision file that duplicates an existing number outside the grandfathered pairs 0004, 0005, 0079 and 0100 fails a check that runs in pnpm lint, so CI catches two unmerged branches that allocated the same number when the second one runs; the PR states the residual race because branch protection is not strict.","The existing pairs and slug-based Decision lookup are unchanged and the settlement, decision and docs-sync tests and pnpm fast-rehearsal pass.","Renumbering the live second 0100 is not part of this Action and stays an operator-governed step."]}]}
