{"agent_ask":"v1","request_id":"complete-build-operator-todo-list-20261008","project":"arcadia","intent":"complete","requested_authority":"apply_if_approved","target_ref":"plan/operator-to-do-list-with-ask-only-input#build-operator-todo-list","candidate_revision":"e71bee31914f2c44a047a6527fe6e57e904a3da8","desired_result":"Mark build-operator-todo-list complete.","rationale":"Delivered across #1054, #1058, #1069, #1072, #1076, #1081, #1083 and #1085. A read-only verifier checked each criterion against main. The remaining gaps (origin, the documented limit, post-merge reviews of #1054/#1058, and the criterion-3 fixture wording) were closed, the last by amend-build-operator-todo-list-fixture-blocking-20261008. Operator-directed, 2026-10-08. The Plan is inactive and no pointer moved. Refs #1043, #1044.","evidence":[{"criterion":"arcadia todo [--json] [--all] [--stale] [--project <slug>] is a read-only derived view with no new store and never mutates anything. Per Project it computes the selected Action and ready set the way arcadia next does (resolveDispatch, resolveReadySet and resolveOperatorGate under a read-only database), then composes: open Decisions and pending Agent Ask proposals classified blocking or alert by the existing classifyOperatorItems/resolveOperatorGate; open and deferred review_items (covering ActionClarification); waiting operator-task ledger items; production_operator_escalations rows read-only (one item per Action, kind escalation:<kind>, title from message, answer from remedy, always blocking, createdAt from first_detected_at, deduped against a listed Decision named in the message), so a stalled production loop appears even when no Decision or Ask exists; non-done work_items with clarification_status unclarified, a capture_id and no open review_item, as alert items of kind clarify whose answer is arcadia clarify --work <id> --apply; and Plan Actions only when requires_review, question_open or a readiness blocker names an operator step, excluding Project-pause states. It dedupes review_items by work_item_id and by doc_ref against open Decision documents, ledger items and Actions against the Decision or review_item that already represents them.","status":"met","note":"arcadia todo [--json] [--all] [--stale] [--project <slug>] (src/commands/todo.ts, src/cli.ts) is a read-only derived view.\n- It opens the DB only through withReadOnlyDatabase, has no new store, and never writes.\n- Per Project it computes the selected Action and ready set through resolveDispatch, resolveReadySet and resolveOperatorGate.\n- Sources: open Decisions and pending Agent Asks (classified by classifyOperatorItems/resolveOperatorGate; #1054); open and deferred review_items, covering ActionClarification (#1072); waiting operator-task ledger items (#1076); production_operator_escalations, read-only (#1076).\n- Escalations: one item per Action (action_key is the PK), kind escalation:<kind>, title from message, answer from remedy, always blocking, createdAt from first_detected_at. An escalation whose gate is a listed Decision is shown once; the match is anchored to the 'held by pending Decision <id>:' template.\n- Unclarified captured work_items with no open review_item become alert items of kind clarify, answered by arcadia clarify --work <id> --apply (#1081).\n- Plan Actions are included only when requires_review, question_open or an operator readiness blocker applies, with Project-pause states excluded (#1081).\n- Dedupe: review_items by work_item_id and by doc_ref against open Decisions; ledger items and Actions against the Decision or review_item that represents them.\n- Tests in tests/todo-command.test.ts: 'dedupes by work_item_id and by doc_ref', 'dedupes a ledger task...', 'dedupes an Action against...', and the pause-state test."},{"criterion":"Blocking is true only for an item that is the selected Action's operator gate (a blockingDecisionId, a requiredDecisionId or deferringDecisionId of a ready-set candidate, the selected Action's own operator reason, or a review_item or ledger item linked to one of these); everything else is an alert. Each item carries key <kind>:<source-id>, kind, title from the source's own field (nothing synthesized), project, blocking, origin, createdAt, staleReason when stale, and answer: the exact existing canonical command (for an Agent Ask, the two-phase settle preview command) and, where one exists, the existing Discord reply or dashboard path. --json output carries schema 'arcadia-todo-v1' and asOf (ISO timestamp and workspace name), and every item carries sourceRef (the canonical file path, or table and id). Blocking comes from resolveOperatorGate or the escalation row and is never recomputed. Decision and Agent Ask items also carry gateQuestion, options with consequences, and evidence. The doneWhen rule per kind is documented in help and START_HERE.md, not stored.","status":"met","note":"Blocking comes only from the selected Action's operator gate (resolveOperatorGate) or from an escalation row, and is never recomputed. Tests: 'is blocking only when linked...' and 'blocking only for the selected Action'. The blocking link matches plan/<plan>#<action> (#1076).\nEvery item carries:\n- key <kind>:<project>/<source-id>, kind, title from the source's own field, project, blocking, createdAt and staleReason when stale;\n- origin from a stored source field, always present as string|null (#1085);\n- answer: the exact canonical command. For an Agent Ask that is the two-phase settle preview command.\n- answerVia: the existing Discord reply or dashboard path where one exists. A Decision gets the Discord requires-review reply and the review resolve-reply path from its linked review item (#1083).\n--json carries schema 'arcadia-todo-v1', asOf (ISO timestamp and workspace name), and sourceRef on every item. Decision and Agent Ask items also carry gateQuestion, options with consequences, and evidence taken only from source fields (#1083).\nThe doneWhen rule per kind is documented in arcadia todo --help (src/cli.ts) and in START_HERE.md ('Done when'); it is not stored."},{"criterion":"Stale means positive evidence only: an Agent Ask of intent complete, split, or action with a target_ref is stale when every Action it targets exists in a Plan of its Project with status done; an Ask naming only absent Actions is an un-adopted proposal and never stale; supersession counts only through an explicit line 'Supersedes: <proposal ids>' in the rationale of an Agent Ask, read from its stored proposal; a Decision is stale when its action is done; a review_item is stale when its work_item is done or its doc_ref names an answered Decision. The default view prints a counts line (blocking, other, stale hidden, per kind), every blocking item, then at most 5 other items ordered with open Decisions first, newest first, then every other item oldest first; --all and --stale show the rest, and the default view ends with 'N more: --all'. Projects without a repo_path and fixture Projects whose slug contains 'rehearsal' or whose repo_path lies under the OS temp directory or ~/tmp appear only as a counts line, except that their blocking items are still listed and counted, so a stalled production loop is never hidden. With no resolvable workspace it prints the repo-local sources plus one explicit 'workspace sources unavailable: <remedy>' line, never a silently partial list; Decisions raised only on unmerged candidate branches are a documented limit.","status":"met","note":"Stale requires positive evidence only (#1058):\n- an Agent Ask of intent complete, split or action with target_ref is stale when every targeted Action is done in a Plan of its Project;\n- an Ask naming only absent Actions stays visible (test: agent_ask:demo/unadopted stays listed);\n- supersession counts only through an explicit 'Supersedes:' line in a stored rationale;\n- a Decision is stale when its Action is done;\n- a review_item is stale when its work_item is done or its doc_ref names an answered Decision.\nThe default view prints:\n- a counts line (blocking, other, stale hidden, per kind);\n- every blocking item, escalations first;\n- at most 5 other items, open Decisions first newest first, then the rest oldest first (#1069, as amended);\n- 'N more: --all'.\n--all and --stale show the rest.\nFixture Projects (slug contains 'rehearsal', or repo_path under the OS temp dir or ~/tmp) and Projects without a repo_path appear only as a counts line, except that their blocking items are still listed and counted (#1081, as amended).\nWith no resolvable workspace, todo prints the repo-local sources plus exactly one 'workspace sources unavailable: <remedy>' line. The limit that Decisions on unmerged candidate branches are not listed is documented in START_HERE.md and todo --help (#1085).\nFollow-up: Issue #1084 (supersession cycles longer than 2)."},{"criterion":"Fixture tests cover one item per kind (including one operator_gate_pending and one repair_budget_exhausted escalation, and an escalation whose gate is also a listed Decision shown once), all dedup rules, positive-evidence staleness including an un-adopted proposal that stays visible, the blocking rule, ordering and cap, fixture-Project grouping, the degraded no-workspace output and a JSON golden; type, lint and build pass; START_HERE.md documents arcadia todo. A pushed PR with exact-head independent review and all required checks is the delivered Artifact; LOCAL ONLY or an unresolved blocker is labelled explicitly.","status":"met","note":"tests/todo-command.test.ts has 56+ tests, passing on main 8d28e10ec, covering:\n- one item per kind;\n- every dedup rule;\n- positive-evidence staleness, including an un-adopted proposal that stays visible;\n- one operator_gate_pending and one repair_budget_exhausted escalation;\n- an escalation whose gate is also a listed Decision, shown once;\n- the blocking rule, ordering and cap;\n- fixture and no-repo grouping;\n- degraded no-workspace output;\n- the JSON golden