  "desired_result": "Unblock the first real unattended managed-production run on Arcadia by delivering the Action brief to a launched Session and by closing the preserve-on-exit and candidate-integration seam.",
  "rationale": "Diagnosis of 'what blocks automated production with real sessions today', from the current revision. (1) The keystone: a managed Session is launched with the literal prompt `arcadia advance --session <id>` (src/sessions/index.ts:600), and that command prints only session metadata (src/commands/advance.ts:48-62) - no Action, no acceptance criteria, no completion or preservation instructions. The human/`arcadia go` path gets the full dispatch brief; the guarded-launch path does not. An independent review already graded this a Blocker (docs/reports/planning-agent-route-review-2.md:427-437) and no governed Action covers it; captured as GitHub Issue #292. (2) The seam: preservation fires only while the live Session requests it (src/sessions/preservationTransport.ts:214), a Session that dies leaves an uncommitted candidate the tick reconciles as incomplete_resumable but never commits (src/sessions/reconciliation.ts:205-206), and the worker never integrates a preserved candidate into the base branch - it defers one tick 'for its merge to land' (src/production/tick.ts:154-166; tests/production-tick.test.ts:222-225). Action B therefore waits for an operator merge, which is the babysitting this batch exists to remove. The operator has authorized bounded auto-integration for this rehearsal: a host-side mechanism may fast-forward/merge only agent-owned branches it created for a grant whose scope names the Project, Plan and Action, and it must stop and report on any conflict, non-agent branch, divergent base, or out-of-scope candidate. Merge, deploy, publish, spend, credentials, messaging and destructive operations keep their existing gates. (3) Related defects already governed in the same plan are not duplicated here: clean-up-preserve-transport-request (#272, the current pointer), bind-candidate-revision-in-action-settle (#278), translate-reasoning-effort-at-launch (#280), preserve-projects-with-dependencies (#273) and let-agent-preserve-its-candidate.",
