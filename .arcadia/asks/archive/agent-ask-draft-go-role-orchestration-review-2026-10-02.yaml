n activation, messaging, native durable supervision or branch removal.\",\"actions\":[{\"id\":\"persist-revision-bound-role-orchestration\",\"desired_result\":\"Persist bounded role requirements and compliant model selections through the existing orchestration path.\",\"acceptance\":[\"A workspace migration records each required role's Project/Plan/Action, input or candidate revision, policy epoch, configuration revision, principal/helper and reviewer identity, selected provider/model/effort, attempt/token bound, outcome and evidence references without replacing governed work documents.\",\"Before immutable packet creation, reuse compliant provider selection and configured cost ranking with role capability, effort, independence, locality and availability floors; planning and adversarial planning retain the required high-reasoning floor, and an approved packet is never silently rebound.\",\"Repeated, concurrent and lost-response role requests return the existing revision-bound attempt or receipt; at most one live mutation-owning principal is admitted, helpers remain within declared scope, and managed inference is included in configured account/capacity and attempt bounds.\",\"Unknown roles, exhausted bounds, missing current authority, unsupported native supervision and unsatisfied configuration refuse before launch. Off blocks new autonomous role admissions. Focused migration, selection, replay, race and refusal tests and required checks pass.\"],\"dependencies\":[\"enroll-session-through-governed-host-request\",\"persist-inactive-production-configuration\"],\"references\":[\"src/production/policy.ts\",\"src/production/tick.ts\",\"src/sessions/launchPreview.ts\",\"src/codingAgents/providerAdapters.ts\",\"docs/model-selection.md\",\"docs/planning-process.md\",\"START_HERE.md\"]},{\"id\":\"route-missing-requirements-through-reviewed-planning\",\"desired_result\":\"Route a genuine missing requirement through planner and independent adversarial review before canonical pr