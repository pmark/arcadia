{"agent_ask":"v1","request_id":"plan-ratify-decisions-by-pr-merge-2026-09-29","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Enforce and automate decide-by-merge (Decision 0075): Arcadia verifies that an approved Decision was ratified by the operator's own merge of the PR that produced it, records the answer on merge, and lets managed production open Decision PRs instead of leaving open Decisions for the CLI.","rationale":"Decision 0075 made decide-by-merge the default, but it works only through agent instructions: docs sync cannot tell an operator-ratified Decision from one an agent wrote and merged, and managed production still stops at `decision approve`. This turns docs/proposals/ratify-decisions-by-pr-merge.md into governed work. Filed as an inactive draft Plan so it does not reorder the active managed-production Plan; the operator decides when to activate it.","references":["docs/proposals/ratify-decisions-by-pr-merge.md","docs/decisions/0075-decide-by-merging-a-pull-request.md","docs/agents-context.md"],"actions":[{"id":"verify-decision-ratified-by-merge","desired_result":"Add a `ratified_by` field to Decision documents and make docs sync verify it against the ratifying pull request.","acceptance":["A Decision document may declare `ratified_by: <owner>/<repo>#<number>`, and the parser accepts and exposes it.","docs sync accepts an approved Decision carrying `ratified_by` only when that pull request was merged by the configured operator GitHub identity, not an agent identity.","docs sync accepts it only when the document on the base branch is byte-for-byte the version the ratifying merge produced, or matches a content fingerprint recorded at merge.","An approved Decision without `ratified_by` is accepted only when it was decided before this Action ships (the legacy set, listed by id in the change) or its answer was recorded through `arcadia decision approve`, the operator's command-line fallback; any other approved Decision without `ratified_by` is refused or flagged.","A Decision that fails any of these checks is refused or flagged with the failing check named, and tests cover an operator merge, an agent merge, an unrelated PR, a post-merge edit, a legacy Decision, a `decision approve` fallback, and an approved Decision with neither."],"dependencies":[],"references":["docs/proposals/ratify-decisions-by-pr-merge.md"]},{"id":"record-decision-answer-on-merge","desired_result":"Record a Decision PR's answer deterministically when it merges, and unblock Actions waiting on it.","acceptance":["When a Decision PR that passes the `ratified_by` check merges, Arcadia records the Decision as answered with no coding-agent session and no LLM call.","An Action whose dependency or blocker is that Decision becomes dispatchable after the record, and a test proves it."],"dependencies":["verify-decision-ratified-by-merge"],"references":["src/ask/autoSettleBeforeDispatch.ts"]},{"id":"open-decision-prs-from-managed-production","desired_result":"Let managed production turn a decision Ask into a Decision PR ballot instead of leaving an open Decision for the CLI.","acceptance":["When a managed-production session settles a `decision` Ask, it writes the Decision document on its own branch with the recommended option as `answer` and opens a Decision PR whose body starts with \"Merging accepts: <recommended option>\", lists every other option numbered with its consequence, and says to comment with a number and wait for the updated ballot and green checks before merging.","The session sends the `decision-answer` ready notification only after CodeRabbit and the required checks are clear on the Decision PR's current head, then continues with work that does not depend on the answer.","No managed-production code path merges a Decision PR, and a test proves it."],"dependencies":["verify-decision-ratified-by-merge"],"references":["docs/agents-context.md"]}]}
