{"agent_ask":"v1","request_id":"plan-ask-intent-dispatch-20261008-r2","project":"arcadia","intent":"plan","requested_authority":"propose","target_ref":"plan/operator-to-do-list-with-ask-only-input","desired_result":"Correct the six Ask-dispatch Actions per the independent review of PR 1091.","rationale":"This is a corrective follow-up to plan-ask-intent-dispatch-20261008 (asksettle_68c504b46ab44e8b87), made in response to the independent review of PR 1091.\n\nBlocking findings:\n- (4) slice 2 relied on an operator-task origin that does not exist yet. The 'task' correction target now moves to slice 5, and slice 5 depends on slice 2.\n- (5) slice 5 conflicted with Decision 0028 and the no-raw-text rule. Ask-origin operator tasks now live in the workspace database and are projected into todo, not written to the checked-in ledger.\n- (7) the operator's two-section todo and the Plan and Schedule flags were not built. Slice 1 now renders 'Yours' and 'Agents are doing' and records deterministic recurrence and planning flags, so the Schedule trigger can fire without the model.\n\nNon-blocking findings applied:\n- slice 1 sits behind a rollback flag, and suppresses trivial acknowledgements and duplicates;\n- the 'answer' correction goes through the review writer and requires a verified Discord author;\n- slice 4 classifies asynchronously through the clarify job path, and its enum no longer includes idea;\n- the proof now depends only on slice 1;\n- vanish rate is defined (1 hour after capture);\n- golden-case approval is the reviewed merge.\n\nAll lists are restated in full (Issue #1079).","actions":[{"target_ref":"action/stop-asks-vanishing","desired_result":"Make every operator Ask that is not explicitly an idea visible in arcadia todo, so no Ask vanishes into the Back Burner.","acceptance":["Behind a config flag ask.routing.v2, which defaults on and can be turned off to restore today's routing, an operator Ask that matches no execution pattern goes to Clarify First instead of the Back Burner. Clarify First means a review_item that arcadia todo lists, carrying an ask-origin answer command. The Back Burner still receives an Ask only when the intake classification is Idea or the operator passes --back-burner. A Review Response with no resolvable reference also goes to Clarify First. Agent-sourced Asks (agent.ask envelopes) keep today's routing. Trivial acknowledgements (for example 'thanks', 'ok', 'got it', or emoji only) and exact duplicates of an open Ask question within 24 hours create no new question; their receipts say why.","The intake patterns in src/intake/index.ts recognise 'I should be able to', 'I want (to be able) to', 'let me' and 'it would be good if'. With these, the operator's example 'I should be able to Ask Arcadia to schedule a recurring action' is captured as work. Intake also records two deterministic flags in extractedFields. recurrence is set when the text says every, daily, weekly, monthly, recurring or schedule. planning is set when the existing planningRecommended pattern matches. ask_requests stores both flags so the report can count them.","arcadia todo renders two section headers. 'Yours' holds the existing operator items and a 'Your Asks need one answer (N)' group: the newest 5 Ask-originated questions, with the full count always shown and never hidden by the other-items cap. 'Agents are doing' is one count line of in-flight agent work, naming the command that lists it. A counts line reads 'Back Burner: N incubating (M new in 7 days)'. The morning packet counts the Ask questions. Existing Back Burner items are not moved or changed.","Tests cover:\n- the routing change for each classification;\n- the review-reply fallback;\n- the new phrasings;\n- the recurrence and planning flags;\n- trivial-acknowledgement and duplicate suppression;\n- an agent-sourced Ask keeping its route;\n- the flag-off rollback;\n- both todo sections and the counts line.\nType, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":[],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/backBurner/surfacing.ts","src/orientation/operatorTodoLines.ts"]},{"target_ref":"action/ask-receipt-and-one-reply-correction","desired_result":"Make every Ask reply state what Arcadia heard and where it put it, and let the operator correct it with one reply.","acceptance":["Every arcadia ask result, from the CLI and in the Discord bot's reply, opens with one line before any detail: 'Heard: <type> (<confidence>, <rule|memo|model>) -> <what was created and where> . wrong? reply type: work|idea|answer|status'. The stewardship detail stays available with --verbose or --json.","arcadia ask correct <ask_id> --type <work|idea|answer|status> [--project <slug>] re-routes the Ask only through the existing governed writers: create a work_item, create a review_item, or promote or archive a Back Burner item. It links the new record to the old as superseded and never deletes the original capture or record. In Discord, a reply to an Ask receipt that starts with 'type:' or 'project:' calls the same command. A correction to 'answer' requires an explicit reference to a pending item. That reference goes through the existing review resolve-reply writer and its validation, and from Discord is accepted only when DISCORD_ALLOWED_USER_IDS is configured and includes the author. Otherwise the correction is refused, so a correction never answers a Decision by inference or for an unverified author. The 'task' target is added by ask-do-for-me-operator-tasks.","ask-trail (arcadia ask show) displays the supersession. Tests cover each correction target, the refusal of an answer correction with no reference or an unverified author, and the Discord reply path. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["stop-asks-vanishing"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","apps/discord-bot/src/events/messageCreate.ts","src/commands/askTrail.ts"]},{"target_ref":"action/ask-corrections-stick","desired_result":"Make a corrected Ask route correctly the next time it is sent, instantly and with no model call.","acceptance":["An additive migration creates ask_corrections with columns ask_request_id, normalized_text, text_hash, predicted_type, corrected_type, corrected_project, source and created_at, with no cascade delete. It also adds nullable confidence and corrected_type columns to ask_requests. Each correction row is written in the same transaction as the re-route, so a correction cannot exist without its memo.","A memo stage runs before the intake patterns. An operator Ask whose normalized text exactly matches a stored correction routes to the corrected type and Project, and its receipt says '(memo <date>)'. There is no fuzzy matching. An answer to an ask-origin clarification question also writes a correction row. Raw Ask text stays in the workspace database and is never written to any repository.","Tests cover the transactional write, a memo hit on the identical Ask, a miss on different text, and the no-cascade guarantee. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-receipt-and-one-reply-correction"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/db/schema.ts"]},{"target_ref":"action/ask-local-model-tiebreaker","desired_result":"Give an unmatched operator Ask a typed interpretation from the local model within seconds, falling back to one question.","acceptance":["The IntakeClassifier seam in src/intake/index.ts becomes injectable. A model-assisted classifier runs asynchronously through the same job and idempotency path the clarify engine uses, not inline in arcadia ask. It calls the local-preferred Intelligence route (operation arcadia.ask.classify, allowPaidUsage false) only for operator Asks that the deterministic rules and the memo left as Clarify First questions. Its output schema is an enum of work, task or unknown, plus actor, recurrence, planning and one question. It can never output idea, answer or status. Its extracted fields never set a Project, a Decision or authority.","A passing classification re-routes the Ask through the same governed writers as arcadia ask correct, recorded with source model, and updates its todo entry. When the model is unavailable, slow or unsure, the Ask stays the one Clarify First question, never an error and never the Back Burner. The classifier is behind a config flag that is off by default until prove-operator-request-to-started-work passes. Ask text that reaches a coding agent through a handoff Ask is marked untrusted.","Tests use a stubbed model to cover a pass, a timeout, an unavailable route, a forbidden output type and a malformed output. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-corrections-stick"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/clarify/engine.ts","src/intelligence/types.ts"]},{"target_ref":"action/ask-do-for-me-operator-tasks","desired_result":"Make an Ask for something only the operator can do land in the Yours part of arcadia todo as an operator task.","acceptance":["An operator Ask classified as task, or as work whose clarified actor is operator (RESPONSIBILITY_FOR_ACTOR), becomes an Ask-origin operator task stored in the workspace database. It is not written to the checked-in operator-task ledger, so Decision 0028's ledger rules and the no-raw-Ask-text-in-repositories rule are unchanged. arcadia todo lists it in 'Yours' as kind operator_task with origin ask:<ask_id> and an answer command that marks it done or declined, with operator attestation as for ledger tasks. An Ask with no resolvable Project still becomes a task, unscoped; no Project is guessed.","arcadia ask correct gains the 'task' target, and the Discord 'type: task' reply now works. Tests cover the database store, the todo projection, done and declined, the correction target, and the unscoped case. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-receipt-and-one-reply-correction"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/docs/operatorTasks.ts","src/clarify/contract.ts"]},{"target_ref":"action/ask-golden-set-and-vanish-report","desired_result":"Prove Ask routing keeps improving: a checked-in golden set guards it and a weekly report shows the vanish rate.","acceptance":["tests/fixtures/ask-golden.jsonl holds paraphrased cases, never raw Ask text, each with an expected type. They are proposed by an agent in a PR, and a reviewed merge is their approval. A test replays every case through the pure intake, memo and stewardship functions and fails CI on any regression.","arcadia ask report [--since <window, default 7d>] [--json] prints these metrics per operator source:\n- vanish rate: operator Asks that, 1 hour after capture, have no open record listed by arcadia todo and no acted, answered or operator-filed Idea outcome; target zero;\n- corrected ÷ classified;\n- questions ÷ Asks;\n- Back Burner arrivals;\n- memo hits;\n- counts of Asks flagged recurrence (the Schedule revival trigger: 3 or more) and planning;\n- corrections not yet backed by a golden case.","When 3 or more memos share a corrected type and a token pattern, the report says so. An agent may then propose a deterministic rule and a golden case in a reviewed PR; no rule is generated automatically. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-corrections-stick"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/commands/askCoverage.ts"]},{"target_ref":"action/prove-operator-request-to-started-work","desired_result":"Prove a real operator request travels through Ask to graded work that a fresh session starts, with the operator touching only Ask, the to-do list and arcadia go.","acceptance":["The operator sends one genuine request for real work, phrased as work to create, through an existing Ask or Ingress surface (Discord message, dashboard Ask or iCloud Ingress); an agent never writes or posts it. The receipt binds the capture envelope, ask request and resulting work_item. A request that lands only in Back Burner or a review_item without a work_item is reported as a failed attempt, not a pass.","The work_item is graded by the delivered generator and grader, triggered by the arcadia clarify --work <id> --apply command that arcadia todo lists for the new work_item: either a passing next action with actor and done-condition, or exactly one question shown in arcadia todo that the operator answers through its listed CLI command or Discord reply, after which automatic re-grading passes. A passing coding-agent verdict yields the handoff Agent Ask, which appears in arcadia todo.","The operator settles that Agent Ask from arcadia todo, placing the new Action in the active Plan's queue, then starts a new session with only arcadia go; that session works the resulting Plan Action by id without relay and produces a commit or PR naming both the Action id and the work_item id. A gate receipt, launched process or approval request alone never satisfies this. The working session's commits carry the Session protocol trailers, and the evidence index cites the commit paragraph with Arcadia-Agent and Arcadia-Action.","An evidence index records one verdict and receipt per criterion pinned to the envelope, work_item, Agent Ask, Action id, candidate revisions and PR heads, the arcadia todo and arcadia plans --plan outputs before and after, and the coverage report for the window; missing or stale proof blocks a success claim, and no production acceptance threshold or unfinished Action status of other Plans changed. If any supervised session in the proof stops without completion, the evidence index includes its inactivity ping (id, link and message); the proof does not pass without it."],"dependencies":["grade-next-actions-before-actionable","capture-operator-decision-replies-as-asks","point-operator-surfaces-at-todo","render-plan-progress-as-todo","stop-asks-vanishing"],"references":["CONSTITUTION.md","docs/managed-documents.md","docs/planning-process.md","docs/agent-guidance/index.json","docs/plans/bootstrap-managed-production-to-build-flight-deck.md","https://www.anthropic.com/engineering/harness-design-long-running-apps","src/commands/ask.ts","src/commands/go.ts","apps/discord-bot/src/events/messageCreate.ts"]}]}
