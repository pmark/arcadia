{"agent_ask":"v1","request_id":"plan-decision-cards-and-plan-handoff-2026-10-12","project":"arcadia","intent":"plan","desired_result":"Every operator decision in a production run is a pinned decision card on a remote surface, and Plan-to-Plan handoff runs through a deterministic close-out record and next-Plan selector.","rationale":"Operator asked on 2026-10-12 for a strategy and Plan toward Plan-to-Plan autonomous production with decisions rendered through PR merges, /actions buttons and /todo Decisions. An independent Opus review validated the direction, reframed the unit as policies not instances, and proposed the card contract and these Actions. Created as an inactive draft: an agent does not author and activate a Plan in one stretch.","actions":[{"id":"decision-card-contract","desired_result":"Implement the arcadia-decision-card-v1 schema and validator in src/decisions/card.ts so every operator touch is one pinned card with a verb, consequence, evidence and receipt.","acceptance":["The validator rejects a card with a missing consequence, missing pins or an unknown verb, and rejects a stale pin (state hash, head sha or preview fingerprint) at use time.","Fixtures exist for the merge, run and answer verbs and each validates.","A card carries a policy_match field that is null or a policy id and an expiry that the validator enforces.","Focused tests pass and the dashboard import graph has no containerAuditTransport or commander edge."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"One contract for PR merges, /actions buttons and /todo Decisions is what lets a deterministic engine replace the Lead class by class."},{"id":"cards-from-existing-sources","desired_result":"Implement card generation from open Decisions, operator-script descriptors and pull requests that need the operator, as a read-only module with fixtures.","acceptance":["Each of the three sources yields a valid decision card and the generator never mutates a Decision, script or PR.","A pull request card names which authority boundary the diff touches using a path-based classifier with a documented list.","The pinned fingerprint on a card changes when its source state changes.","Focused tests pass."],"dependencies":["decision-card-contract"],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"The operator already decides through these three surfaces; cards give them one evidence format readable in under a minute."},{"id":"todo-actions-render-cards","desired_result":"Implement /todo and /actions rendering of decision cards with the consequence and evidence visible and one verb button that posts only the pinned fingerprint.","acceptance":["A card shows its consequence and evidence links on /todo or /actions and one verb button.","The button request carries only the card id and pinned fingerprint and a stale card shows a refusal with the reason.","An end-to-end dashboard test covers a run card and an answer card and the dashboard build passes.","Existing /todo and /actions behaviour is unchanged for items with no card."],"dependencies":["cards-from-existing-sources"],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"The operator wants decisions rendered through buttons and Decisions on the pages they already use."},{"id":"delegation-policy-records","desired_result":"Write the delegation-policy record format as a standing-grant extension and implement a pure evaluator that returns match or no-match with a reason.","acceptance":["A policy record has a class, scope, expiry and evidence requirements and the evaluator is a pure function with no I/O.","A credentials, Grant, spend or Constitution class can never match and tests enumerate every excluded class.","An expired or revoked policy never matches.","Policies are proposed by agents only and the record has no approval path outside the existing Decision flow; tests pass."],"dependencies":["decision-card-contract"],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"Approving policies instead of instances is how operator clicks per Plan fall without widening authority."},{"id":"plan-close-out-record","desired_result":"Implement arcadia plan close-out writing a deterministic docs/plans/PLAN/close-out.json from the session ledger and Plan state, and backfill one record for the hardening Plan.","acceptance":["The schema validates and the same inputs produce the same hash.","The record lists Actions with outcome and PRs, open remainders, open blockers, ledger aggregates, frictions with test ids and a successor recommendation.","A backfilled record exists for the autonomous-production hardening Plan and a validator rejects a malformed record in CI.","Focused tests pass."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"The close-out record is the baton that makes handing off the next Plan safe and auditable."},{"id":"next-plan-selector","desired_result":"Implement a deterministic next-Plan selector and preflight that emits a decision card and is preview-only.","acceptance":["The selector follows Decisions 0116 and 0122 and returns the chosen Plan with the reasons.","It refuses a Plan authored in the same run and a Plan the operator has not approved.","A preflight failure names the blocker and the one-click remedy; no state is mutated.","Focused tests pass and the preview matches the card contract."],"dependencies":["decision-card-contract","plan-close-out-record"],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"Plan-to-Plan handoff is a loop; selection and preflight are its deterministic first half."},{"id":"blocker-reset-script","desired_result":"Write an operator script and descriptor that resets an environment_wall or budget_exhausted blocker from a card, with a pinned blocker id and a receipt.","acceptance":["The script pins the blocker id and fingerprint, is idempotent and leaves a receipt.","It appears on /actions as a run card and never resets a real repair budget it was not pinned to.","A rehearsal test replays an environment_wall stop and clears it through the script.","Focused tests pass and no terminal command is shown to the operator."],"dependencies":["decision-card-contract"],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"Clearing these blockers is CLI-only today, a standing host touch (living notes friction 12)."},{"id":"friction-to-test-guard","desired_result":"Implement a CI check that every friction row marked Fixed in the living notes cites a test or rule id, and a Replayer fixture template for new frictions.","acceptance":["CI fails when a Fixed row has no test or rule citation.","The existing Fixed rows are updated to cite their tests.","A template and one worked example turn a recorded receipt into a failing fast-rehearsal fixture.","Focused tests pass."],"dependencies":[],"references":["docs/strategy/autonomous-production-strategy.md","docs/reports/production-simulation-living-notes.md","https://github.com/pmark/arcadia/issues/1284"],"why":"A friction is not closed until a test or rule would catch its return."}]}
