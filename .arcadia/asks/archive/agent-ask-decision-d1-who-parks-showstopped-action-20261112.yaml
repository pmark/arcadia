{"agent_ask":"v1","request_id":"decision-d1-who-parks-showstopped-action-20261112","project":"arcadia","intent":"decision","gate_question":"reasonable_disagreement","requested_authority":"propose","desired_result":"D1: Who may park a showstopped Action during an unattended production run?","rationale":"Production went Off on 11-11 because one held Action idled the run. The three review-repair held kinds already skip to independent work (src/production/terminalCandidates.ts, src/scheduling/scheduler.ts). This decision picks how far that skip extends. Sources: proposal agentask_93d0170cd186a88db7 (Fable, Mira) and agentask_b99a3e8db0ae4c862f (Codex, Cody Atlas). Codex base supersedes where they differ. This decision grants no START and preserves Constitution gates: merge, deploy, spend, credentials and production stay with the operator.","options":[{"label":"A","recommended":true,"consequence":"Extend the existing held-candidate skip to named Action-local classes only: repair-budget exhaustion and validation-environment holds. Candidate, counters and evidence are kept; dependents do not launch; global, unknown or shared failures (sign-in, authority, STOP, storage, custody) still hold the run. The tick parks the Action with an Issue and revival trigger; you see parked Actions in the digest and can reinstate any. Independent authorized work continues while it waits. Grants no START."},{"label":"B","recommended":false,"consequence":"Keep the three existing review-repair held kinds only. No new policy and no immediate change, but other stop classes can still idle the scope until you act. Grants no START."},{"label":"C","recommended":false,"consequence":"Require an operator disposition for every additional stop class. Strongest individual judgment, with a recurring operator wait at each stop. Grants no START."}]}
