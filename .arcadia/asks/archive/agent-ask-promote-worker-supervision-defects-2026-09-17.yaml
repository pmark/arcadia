{"agent_ask":"v1","request_id":"promote-worker-supervision-defects-2026-09-17","project":"arcadia","intent":"action","desired_result":"Record the two worker-supervision defects found while clearing the launchd spam as governed Actions in the active plan, each bound to its GitHub Issue.","rationale":"Found 2026-09-17 while diagnosing martianrover/.arcadia/worker.log spamming Worker already running (PID 50194). The immediate cause was a duplicate launchd agent and it is already removed, but two code-level defects remain: (1) arcadia worker install writes a KeepAlive agent whose benign already-running path is exit 1, so any second agent targeting one workspace becomes a permanent respawn loop that pollutes the workspace log (issue 303); (2) openDatabase sits outside the tick error boundary in src/commands/worker.ts:118, so a transient SQLITE_BUSY there kills the worker uncaught instead of being logged as a tick error, confirmed in worker.err.log at 15:42:44 (issue 305). Both are captured as Issues and are signals only; this Ask promotes them to work.","actions":[{"id":"fix-tick-database-open-error-boundary","desired_result":"A transient SQLITE_BUSY while opening the workspace database no longer kills the worker process; it is reported as a tick error and the tick loop retries on its next interval.","acceptance":["openDatabase in tick() (src/commands/worker.ts:118) runs inside the same error boundary as runWorkerIteration, so a throw is logged as Worker tick error: and setTimeout(tick, POLL_INTERVAL_MS) still reschedules.","No uncaught synchronous throw in the tick path can end the loop without a log line: either the moved try covers it or a process-level uncaughtException handler logs and reschedules.","A deterministic test forces openDatabase to throw SQLITE_BUSY and asserts the process does not exit, the failure is logged, and a subsequent tick still runs.","Existing worker tests pass unchanged, and the happy path issues no additional log output."],"references":["https://github.com/pmark/arcadia/issues/305","src/commands/worker.ts","src/db/connection.ts"]},{"id":"stop-keepalive-worker-crash-loop","desired_result":"An installed worker launch agent stops respawning forever when a worker already holds the workspace pidfile, and a duplicate agent for one workspace is detected instead of silently reinstalled.","acceptance":["arcadia worker install no longer produces an agent that crash-loops on the benign already-running path: worker start exits 0 there, or the generated plist uses KeepAlive with SuccessfulExit false, and a test asserts the generated plist shape.","After a fresh install with a second worker already running for the same workspace, .arcadia/worker.log gains no repeated already-running lines over a sustained interval.","The launch-agent audit (src/runtime/launchAgents.ts) reports when two installed agents resolve to the same workspace, and its remedy names the correct command rather than a reinstalling one.","Deterministic tests cover the already-running exit path and the duplicate-workspace audit; existing runtime-pinning tests pass."],"references":["https://github.com/pmark/arcadia/issues/303","src/commands/worker.ts","src/runtime/launchAgents.ts"]}],"requested_authority":"propose"}
