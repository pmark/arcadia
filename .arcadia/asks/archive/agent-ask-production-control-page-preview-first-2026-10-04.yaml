{"agent_ask":"v1","request_id":"production-control-page-preview-first-2026-10-04","project":"arcadia","intent":"action","requested_authority":"propose","desired_result":"Add a dedicated Production page that shows the exact current managed-production state and exposes only the next reviewed, bounded operator action with a preview-first, replay-safe interaction.","rationale":"The operator requested a real Production control that can be tested independently while the three-Action rehearsal stays isolated. Reuse existing production status, saved-configuration preview, worker health, operator-script library and durable receipts. Do not create a second governance store, new scheduler, direct dashboard activation path, new Grant, restart, deployment, credential use or change to the rehearsal fixture. A click invokes only an existing reviewed /runs action whose descriptor pins scope and authority, after the page presents exact effect, preconditions, replay behavior and what it never does. If no compatible action exists, disable the control and name the gate.","references":["https://github.com/pmark/arcadia/issues/899","apps/dashboard/app/runs/page.tsx","apps/dashboard/components/production-control-panel.tsx","apps/dashboard/app/api/production-control/route.ts","apps/dashboard/app/api/operator-script/route.ts","src/production/reactivation.ts","docs/agent-guidance/operator-actions.md","docs/managed-production-readiness.md"],"actions":[{"id":"build-production-control-page-preview-first","desired_result":"Build a dedicated Production page that makes current production state, next safe action and exact post-click evidence legible without bypassing production authority.","acceptance":["The dashboard has a dedicated responsive Production page that derives state solely from existing production status, saved-configuration preview, worker observation, operator-action descriptors and durable receipts; it shows desired state, policy/configuration identity and expiry, worker health, live admissions, current Action/candidate evidence when available, and the first unmet gate. Missing or stale data is unknown or unavailable, never safe or complete.","Exactly one primary control is displayed at a time. Before press, it states the selected existing reviewed /runs action or read-only preview, exact effect, preconditions, authority.does, authority.never_does, replay behavior and expected receipt. A click uses the audited operator-action launch path with a stable result identity and displays its durable terminal receipt or refusal; it never shells out from the browser or invokes an undeclared command.","When no reviewed compatible action exists, or a Decision, fresh Grant, stale preview, drift, running operation or unknown state blocks progress, the control is disabled and names the first unmet gate and bounded recovery. The page never activates production, consumes a Grant, restarts a service, merges, deploys, publishes, spends, uses credentials or creates an Action by itself.","The prior ambiguous direct dashboard activation interaction is removed from the Production interaction or made preview-first and replay-safe under the same authority contract; no UI label or test treats a click as authority by itself.","Focused route, component and API tests cover active, inactive-with-saved-configuration, unknown/stale, compatible action, no compatible action, conflict/refusal, duplicate/replayed click and receipt rendering. Dashboard build, relevant focused tests, lint/type checks, operator-script contract checks and preservation self-check pass; START_HERE.md explains the flow and limits."],"dependencies":[]}]}
