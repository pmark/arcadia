n within the same Project produces a dependency_unresolved wait reason instead of being treated as satisfied, and the Action does not enter the ready set.","Deterministic tests cover: a same-Plan dependency, a cross-Plan dependency, a dependency that lands after being unresolved on an earlier tick, and an id that never resolves; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":[]}]}
