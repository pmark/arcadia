  - criterion: "C1 passes only for an Action whose requirement content matches what
      the operator approved. Approval is the START card the operator pressed for
      the run: its id is the production policy's authority.requestId (set by
      scripts/start-run.sh `production activate --request-id`), and its pins are
      the startRun block of artifacts/generated/operator-scripts/<card id>.json
