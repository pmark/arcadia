      registered repository path, not the candidate worktree or a production
      clone), read with validateStartRunPins
      (src/operatorActions/startRunPins.ts). The approved content of each Action
      in pins.actions is the sha256 of a canonical JSON object {\"next_action\",
      \"acceptance_criteria\", \"references\"}, keys in that order, built from
      the values of that Action's next_action, acceptance_criteria and
      references keys as parsed from the YAML front matter of the Plan file
      docs/plans/<pins.plan>.md at pins.reviewedRevision (the slug convention of
      src/commands/startRun.ts; quoting and YAML style do not matter); a missing
      acceptance_criteria or references is an empty list. Each text item
      (next_action, each acceptance criterion, each reference) has every run of
      whitespace (JavaScript /\\s+/) collapsed to one space and is trimmed, with
      no other Unicode normalization; acceptance_criteria keeps its order, and
      references is sorted by UTF-16 code-unit order (the default JavaScript
      sort), keeping duplicates. The object is serialized compactly with
      JSON.stringify (keys in the stated order) and its UTF-8 bytes are hashed
      with sha256, compared as lowercase hex. The worker computes it and
      compares it with the same fields of the same Action at merge-time main;
      title, expected_artifact, depends_on, decisions, execution, responsibility
      and effort are deliberately not hashed (dependency changes are
      ordering-only and do not void approval), a pinned Action with no
      next_action field parks, and no new pin is written. A card whose pins
      carry a delegation block (a card Rowan or the standing-grant timer
      pressed) records no operator-pressed content for its Actions (the
      standing-grant card carries no Action list or revision), so on such a run
      C1 parks. Added scope (an Action not in pins.actions), any change to the
      text of next_action, acceptance_criteria or references, or a reordering of
      acceptance_criteria (a newly named authority path shows up as a references
      change) voids that approval and parks the Action until the operator
      re-approves; whitespace-only edits, reordering references, and queue-order
      or ordering-only dependency changes do not. Tests cover each case,
      including a delegated card, and an unreadable library, card, pins or
      revision parks."
