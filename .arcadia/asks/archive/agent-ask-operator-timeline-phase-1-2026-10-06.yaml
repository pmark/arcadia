{"agent_ask": "v1", "request_id": "operator-timeline-phase-1-2026-10-06", "project": "arcadia", "intent": "action", "requested_authority": "apply_if_approved", "desired_result": "Give the operator one unified, real-data event stream across the whole workspace (git, Sessions, Asks, Decisions, Actions, Plans, Milestones, Missions, Projects, production activity) labelled by agent tool and kind of work, so the operator can see what every agent is doing now and rewind through what happened (Phase 1: collect and stream; Phase 2: UX).", "rationale": "The operator (Mark Anderson, 2026-10-06) often feels disoriented navigating many session histories across many projects and three native coding agent tools (OpenCode, Claude Code, Codex) and wants to know what type of work any agent or subagent is performing in order to sustain understanding, presence and flow. He asked for monitoring of all active project work and for rewind and playback of significant events across a whole workspace and all its Projects, sourced from actual git activity and from Sessions, Asks, Decisions and every Action, Plan, Milestone, Mission and Project activity. Phase 1 proves the data can be collected and presented as a stream; Phase 2 iterates on a tasteful, practical, striking UX.", "actions": [{"id": "operator-timeline-phase-1", "desired_result": "Design and prove a unified workspace event stream (schema, collectors, command, point-in-time read model) on real data, with Phase 2 UX options for the operator.", "acceptance": ["A written design (docs/proposals/operator-timeline.md) states the operator problem in the operator's words (disorientation across multiple session histories, projects and three native agent tools: OpenCode, Claude Code, Codex; wanting to know what kind of work any agent or subagent is doing; monitor everything active; rewind and play back significant events for a whole workspace and all its Projects), inventories the REAL event sources that exist today in this repository and workspace (verified by reading the code and the data: git activity across the main checkout, every agent worktree under ~/.claude, ~/.codex and ~/.opencode, fixture repositories and PR/branch activity; the Sessions and role-attempt tables; Agent Asks, proposals and settlements; Decisions; Actions, Plans, Milestones, Missions and Projects as checked-in records and their commits; the events table; managed-production policy, admissions and escalations; operator-script run receipts; Discord pings), defines ONE unified event schema (stable id, UTC time, source, kind, subject refs for workspace/project/plan/action/session/ask/decision/PR/commit, actor identity with agent tool (opencode, claude-code, codex, operator, host worker) and semantic name and tier where derivable, a controlled `work_kind` taxonomy answering 'what kind of work is this' (for example plan/design, implement, review, verify, integrate, govern, operate, observe), a short human summary, evidence pointers, and provenance of how it was derived), explains how each field is derived (including how an agent tool and a semantic name are recovered from worktree paths, commit author emails and Session rows), and records the open questions that need the operator.", "Phase 1 is proven on real data: a collector layer and a command (for example `arcadia timeline`, with `--since`, `--until`, `--project`, `--tool`, `--kind`, `--json` / NDJSON, and a `--follow` mode that streams new events) in this repository read the live workspace and repositories READ-ONLY and emit the unified stream, merged and deterministically ordered across all Projects, de-duplicated, with provenance per event, tolerant of missing or unreadable sources (a collector failure is reported as a stream event and never aborts the stream), and fast enough to be practical (the design records measured timings on this workspace); at least these collectors exist: git (commits, branches, merges and worktrees across the repositories the workspace knows), sessions and role attempts, Agent Asks and settlements, Decisions, Actions/Plans/Milestones/Projects record changes, the events table, managed-production activity, and operator-script receipts; a point-in-time query shows the workspace's recent history as of a past timestamp (the 'rewind' read model; interactive playback is Phase 2). The command writes nothing to any repository or database.", "Tests (fixtures built in temp repositories and temp workspaces, no live data committed) cover each collector, the schema and `work_kind` classification including agent tool and semantic-name recovery from a worktree path, a commit author email and a Session row, ordering and de-duplication, source failure tolerance, the time-window and `--follow` behaviour; a short sample of real stream output from this workspace (sanitised, bounded, no secrets) is attached to the design as evidence that the data can be collected and presented as a stream; a Phase 2 section of the design offers two or three UX directions (a live 'what is happening now' view by project and agent tool, a scrubbable timeline for replay, an at-a-glance 'what kind of work' lens) with the practical data each needs from Phase 1, as options for the operator to choose, without building UI; lint, tsc, check:agent-guidance, the preservation self-check and the focused suites pass; an independent authority review of the design and the code is recorded on the pull request."], "dependencies": [], "references": ["docs/autonomous-production-rehearsal-runbook.md", "docs/agent-guidance/index.json", "src/sessions/", "src/ask/", "src/production/", "src/workspace/"]}]}
