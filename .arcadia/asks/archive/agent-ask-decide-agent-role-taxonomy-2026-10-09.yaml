{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-agent-role-taxonomy-2026-10-09","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide which governed roles the Arcadia role registry defines.","rationale":"The operator wants every subagent type specified by Arcadia governance and modeled on traditional software-engineering organization. Arcadia already enforces five attempt roles (planner, critique, development, code-review, qa) through actor lineage. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Seven roles built on the existing lineage: the session-start role, planner, plan-critic, implementer, code-reviewer, qa and researcher (read-only investigation). Supervisor is a relationship, not a role","consequence":"Every role maps onto an attempt role that already exists, or is read-only, so lineage enforcement carries over unchanged. Each role has an executor today. A new role needs a planned Action that no existing role can own.","recommended":true},{"label":"A full organization chart: product manager, architect, tech lead, engineer, reviewer, QA, SRE, technical writer and release manager","consequence":"This mirrors a real organization more closely. But roughly half these roles have no Arcadia executor or attempt role, so they would be names without behavior, and the registry, briefs and tests all grow."},{"label":"Minimal: the session-start role plus one generic helper, keeping only the builder/critic identity split","consequence":"The cheapest to build. But there are no role-scoped permissions or model defaults, independent review keeps depending on separate tooling, and supervisors cannot tell a reviewer from an implementer."}],"references":["src/sessions/enrollment.ts","src/sessions/roleLineage.ts","src/codingAgents/agentIdentity.ts","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
