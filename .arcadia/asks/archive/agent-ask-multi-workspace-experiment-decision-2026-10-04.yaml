{"agent_ask":"v1","request_id":"multi-workspace-experiment-decision-2026-10-04","project":"arcadia","intent":"decision","desired_result":"Decide whether coding agents may run a bounded experiment using additional experiment workspaces, separate from the exclusive live martianrover workspace, to gain freedom of movement.","rationale":"Operator direction 2026-10-04: experiment with multiple workspaces to give coding agents much more freedom of movement and start when idle. AGENTS.md says the exclusive live workspace is martianrover and forbids guessing a path or substituting a dogfood workspace, so a bounded exception needs a governed record. A read-only design study (main 828d32714) found: shared-workspace contention is real (7-day activity baseline: agent-ask.settle 110 errors / 550 ok, agent-ask.preview 17/40, advance.queue.make-next 7/48; dirty-main refusals, one portfolio queue revision, one PROJECT.md pointer, SQLITE write denial for sandboxed agents); one workspace per agent platform over the SAME repos would fork queue and revision state while settlements still commit the same files (rejected); the recommended topology is one experiment workspace per agent platform registering only disposable no-remote fixture repositories under the experiment root, so no governed state forks and the whole experiment is deletable; host-global state (user config defaultWorkspace used by all four launchd services, ~/.arcadia telemetry, the single go-broker trust list in ~/.codex/config.toml and ~/.claude.json) means a guard is needed so an experiment workspace can never activate production, create Grants, install the broker or services, post to GitHub or Discord, or become the default workspace. Stop condition: any leak-check change or write to martianrover attributable to the experiment, or 14 days.","options":[{"label":"Experiment workspaces on disposable fixtures, guard first","consequence":"Agents get contention-free sandboxes (one per platform, under /Users/pmark/Dev/MR/Arcadia/workspaces/exp-<agent>-<date>) for exercising Asks, queue, pointer, settlement, docs sync and brokerless flows on fixture repositories with no remote. A code guard lands first and makes production activation, Grants, broker/services installs, messaging, GitHub posting and a default-workspace switch impossible in a workspace flagged experimental; martianrover stays the sole authority for every real Project. AGENTS.md gains a bounded exception. Cost: one guard PR before the first trial; runs for 14 days or until the stop condition.","recommended":true},{"label":"Experiment workspaces with documented rules only","consequence":"Starts sooner (no guard code): agents follow written rules and inline workspace addressing. Nothing technically stops an experiment workspace from activating production, trusting fixture repositories in the global broker config or posting to GitHub, so one mistaken command can touch host-global state. Cheaper now, riskier."},{"label":"Keep one exclusive workspace","consequence":"No experiment; agents keep contending on the single martianrover queue, pointer and PROJECT.md, and rehearsal fixtures keep accumulating as unremovable Projects in the live workspace (8 already). Safest and slowest; nothing changes."}]}