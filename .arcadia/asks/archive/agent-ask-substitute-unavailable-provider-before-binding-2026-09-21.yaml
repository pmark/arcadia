  "desired_result": "Substitute an equivalent-or-stronger permitted provider before packet binding when hard evidence shows the intended provider cannot execute the work, record and surface the substitution, and never switch providers once execution has begun.",
  "rationale": "Implements Decision 0063, ratified 2026-09-21, whose answer accepts Option 1 with the operator's hard-evidence restriction. The distinction the operator drew is the whole point: provider identity is mutable scheduling state before packet binding and execution history after it. Advisory capacity evidence cannot cause substitution, because using it here would rebuild the capacity gate indirectly on exactly the data the operator ruled out as a gating input; only a closed set of deterministic, launch-precluding conditions may. Two implementation requirements come from the operator's answer and are recorded as acceptance criteria: intended_provider, selected_provider and substitution_reason must appear where an operator sees them in aggregate rather than only in a per-launch preview, and the hard-evidence set must be a closed enum in code so it cannot drift back toward advisory heuristics under schedule pressure. Option 2 (mid-session failover) is deliberately not folded in: it stays its own future Action, and feed-and-supervise-managed-production criterion 5 (no cross-provider retry) remains intact and unamended. Nothing here widens merge, deploy, publish, spend, credentials, messaging or production authority; the substitution only ever chooses among providers the standing policy already permits.",
