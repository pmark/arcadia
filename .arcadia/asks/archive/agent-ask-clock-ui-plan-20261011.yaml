{"agent_ask":"v1","request_id":"clock-ui-plan-20261011","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"The operator can see, change timing and enable or pause existing recurring schedules on the dashboard at /clock, preserving receipt history, deduplication and approval gates. Token impact medium; budget one bounded Opus High UX consultation, one repository-aware planning pass, one implementation session and independent review; all normal runtime behavior and validation are deterministic.","rationale":"Confirmed operator outcome, registered proposal clock-ui-outcome-20261011 and Opus High UX consultation session 5ec5bd00-67b9-493f-9a2c-b6e0f9c72ada. Vital few: one mobile card list with timing, enabled state, next/last and pending link, plus safe pause/enable and timing edit. Existing stable schedule ID already owns deduplication/backpressure; retain immutable original definition and add a timing override instead of new series/version machinery. Refuse timing edit while any occurrence is unsettled or retrying; save under writer lock with expected fingerprint and future cutoff, no retroactive proposals. No auth layer exists; use current dashboard same-origin guard. Defer creation wizard until a request for new schedules through UI, history/audit UI until current card receipts prove insufficient, search/bulk controls until more than twelve schedules, manual tick until explicitly requested. No new runner, publication, service restart or governance-pointer change.","actions":[{"id":"build-clock-scheduler-ui","desired_result":"Add /clock mobile card list and safe existing-schedule controls. Recommended role implementer, standard tier, size M, session effort; operator gate none for implementation/PR, live runtime update remains release-manager-owned. Reuse existing scheduler/CLI and dashboard boundaries.","acceptance":["GET /api/clock and /clock enumerate schedules with friendly daily/weekly/monthly timing and timezone, enabled state, next calendar occurrence, last receipt and pending proposal link; missing schema, empty, loading and read failures are legible.","Pause/enable from /clock uses existing core scheduler state and same-origin guarded POST; receipts remain unchanged and paused schedules submit nothing.","Timing edit validates cadence, weekday 1–7 or monthly day 1–28, HH:MM and IANA timezone; writer-lock expected fingerprint refuses stale changes and any unsettled/retrying occurrence; immutable original JSON and occurrence receipts remain unchanged.","Tests prove changed timing/cadence/timezone starts only at a future eligible slot, preserves same-date deduplication across edits/restart, refuses stale UI and invalid input without partial writes, and leaves approval/execution/publication state untouched.","Mobile browser route flow opens /clock, enables/pauses, edits timing, observes resulting status/next time and pending/error states without shell or cron controls; START_HERE documents route and truthful local reachability."],"dependencies":[],"references":["src/recurring/scheduler.ts","src/recurring/store.ts","src/commands/recurringSchedule.ts","apps/dashboard/lib/arcadia-cli.ts","apps/dashboard/lib/originGuard.ts","apps/dashboard/components/mobile-shell.tsx","docs/strategy/recurring-scheduler.md","https://github.com/pmark/arcadia/issues/1231"]}]}
