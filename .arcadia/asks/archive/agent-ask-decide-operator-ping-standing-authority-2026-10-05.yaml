{"agent_ask":"v1","request_id":"decide-operator-ping-standing-authority-2026-10-05","project":"arcadia","intent":"decision","gate_question":"reasonable_disagreement","requested_authority":"propose","desired_result":"Decide whether agents may send the operator read-only Discord pings (arcadia ping) on their own judgment, to the default channel or an operator-configured channel alias, for look-at-this and FYI items.","rationale":"Messaging is an approval boundary. Existing standing pings fire only on fixed events (PR opened, PR ready, CI blocked). arcadia ping lets an agent decide when something merits the operators attention, so the trigger set is open-ended. The ping is read-only, reaches only the operator on Discord, only channels the operator listed in DISCORD_PING_CHANNELS, is capped at 30 per hour, and grants no authority.","options":[{"label":"Authorize standing read-only pings (Recommended)","consequence":"Agents may run arcadia ping for look-at-this and FYI items without asking, to the default channel or a listed alias. Cannot approve, answer, spend, or reach anyone but you. Cap of 30 per hour and 10-minute dedup bound the noise. Revocable by answering a later Decision.","recommended":true},{"label":"Authorize only to the default channel","consequence":"Agents may ping on judgment but never name a channel; --channel is ignored and the alias map is unused. Less routing, less risk of a misrouted nudge."},{"label":"Do not authorize","consequence":"The command ships but agents must not run it unprompted; they may use it only when you explicitly ask in chat. Today only fixed-event pings reach you."}]}
