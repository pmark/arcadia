{"agent_ask":"v1","request_id":"plan-ux-improvements-2026-09-29","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"UX improvements: make every operator interaction fast, phone-first, and self-updating, so the operator never waits on or hunts through a page.","rationale":"The operator works from a phone and is moving toward not using a coding agent. /runs loads every open Decision up front and is slow; each Decision and each run deserves its own instantly-loading, live-updating view; Discord is one noisy root channel where the operator cannot tell whether a message was sent. Kept as its own Plan so it can be built concurrently with, or switched to and from, the production-bootstrap Plan.","actions":[{"id":"lazy-decisions-on-runs","desired_result":"Load Decisions on /runs only when the operator opens them.","acceptance":["The initial /runs render performs no Decision loading.","Opening the Decisions area loads them on demand and shows them."]},{"id":"per-decision-view","desired_result":"Give each Decision its own instantly loading page with its state and answer controls.","acceptance":["A Decision has a stable URL that renders only that Decision without loading others.","The page shows current state and updates it without a manual reload after the operator answers."],"dependencies":["lazy-decisions-on-runs"]},{"id":"per-run-view","desired_result":"Give each run its own instantly loading page with live state updates.","acceptance":["A run has a stable URL that renders only that run without loading others.","State changes for that run appear on the page without a manual reload."]},{"id":"discord-channel-routing","desired_result":"Route Discord notifications to purpose-specific channels instead of only the root Arcadia channel.","acceptance":["Each notification class (PR lifecycle, Decisions, blockers) posts to a configured channel.","The operator can tell from the channel whether a PR-opened ping was delivered.","Delivery status in receipts reads as queued until sent, not pending indefinitely."]},{"id":"operator-ux-audit","desired_result":"Audit every operator-facing interaction against phone-first speed and clarity and list the fixes.","acceptance":["Every operator page, button, and notification is timed or reviewed on a phone-width viewport.","Each finding is filed as a governed Action or GitHub Issue."]}]}
