{"agent_ask":"v1","request_id":"add-mp3-delivery-to-intelligence-narration-2026-10-06-r2","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Add governed follow-on work that lets Arcadia Intelligence narrations be delivered as validated MP3 artifacts while retaining WAV as the deterministic synthesis and concatenation master.","rationale":"The open narration candidate in PR #977 deliberately emits WAV only. The operator requested portable MP3 delivery. This follow-on must preserve local-only speech routing, avoid automatic media-tool installation or a new provider, and cannot dispatch MP3 work until the governed WAV narration base has landed and is verified.","references":["https://github.com/pmark/arcadia/pull/977","docs/proposals/podcast-from-issue-commentary.md","docs/intelligence/SPEECH_SMOKE.md"],"actions":[{"id":"verify-intelligence-narration-wav-base","desired_result":"Verify that the governed WAV narration capability required for MP3 delivery is present in the candidate base before MP3 implementation can begin.","acceptance":["The candidate base contains the reviewed and merged `arcadia intelligence narrate` WAV capability represented by PR #977 or its landed successor, including deterministic chunk synthesis, WAV concatenation, and a narration manifest; the exact landed commit and verification command are recorded in the implementation evidence.","If that governed base capability is absent, the Action remains blocked with the missing merge or governing Plan/Action named; no MP3 encoder code, artifact schema change, or delivery claim is started from this Plan."],"dependencies":[],"references":["https://github.com/pmark/arcadia/pull/977","docs/proposals/podcast-from-issue-commentary.md"]},{"id":"encode-intelligence-narration-wav-to-mp3","desired_result":"Extend Arcadia Intelligence narration with an explicit MP3 delivery option that performs one bounded final conversion from the completed WAV master and records a durable, validated delivery artifact.","acceptance":["`arcadia intelligence narrate` retains WAV as its default and accepts an explicit MP3 delivery selection with a documented bitrate; per-chunk speech synthesis and concatenation remain WAV, so MP3 is encoded exactly once after the complete master exists.","The encoder uses a dedicated, argument-array subprocess seam for an already installed FFmpeg-compatible executable, with bounded runtime and output, private temporary paths, atomic final publication, and no shell interpolation; Arcadia never downloads, installs, or silently substitutes a media tool.","A missing executable, unsupported MP3 codec, nonzero encoder exit, timeout, undecodable output, or a duration difference beyond the documented codec-aware tolerance fails with a named error and leaves no partial final artifact; WAV-only narration remains usable when MP3 encoding is unavailable.","The final MP3 is stored and served as a durable Intelligence audio artifact with correct MIME type, format, SHA-256, byte size, validated duration, source-WAV hash, codec/bitrate, encoder-version provenance, and a documented encoder-delay/padding tolerance; the narration manifest links ordered speech chunks to that delivery artifact.","Deterministic tests use a controlled fake encoder to cover successful conversion, codec-delay/padding tolerance, and every refusal path without requiring FFmpeg in CI; a separately labelled optional live smoke may verify a real host encoder when it is installed.","The implementation receives an independent exact-head review and its focused tests, lint, TypeScript check, full test suite, and required CI checks pass."],"dependencies":["verify-intelligence-narration-wav-base"],"references":["src/intelligence/speech/wavMeta.ts","src/intelligence/artifacts/store.ts","src/commands/narrate.ts","docs/proposals/podcast-from-issue-commentary.md"]}]}
