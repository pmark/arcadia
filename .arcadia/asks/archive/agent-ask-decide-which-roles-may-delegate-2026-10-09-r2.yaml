{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-which-roles-may-delegate-2026-10-09-r2","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide which governed roles may request subagents, and how deep delegation may go.","rationale":"The operator said certain roles can delegate to subagents. Depth sets how far token burn can fan out, and how long supervisor chains get. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Only the session-start role may request delegates, and delegates may not delegate further (depth 1). Requests for code-reviewer and qa are met as separate independent Sessions, never as in-process children","consequence":"Fan-out stays bounded and simple to budget, and every chain is delegate, then lead, then operator. Independence holds because a reviewer is never the lead's child. A delegated planner cannot spawn its own plan-critic. The lead has to request planner and plan-critic as siblings, one after the other, which is how this plan was made: the coordinating session ran the planner, then the critic. A delegate that needs help hands back to its lead.","recommended":true},{"label":"The session-start role and planner may delegate, to depth 2, with Arcadia admitting each level","consequence":"A delegated planner can call its own plan-critic and researchers without going back to the lead. This adds a second admission level, longer supervisor chains and more burn per Session."},{"label":"Any role may request, and admission alone bounds it (depth cap 3)","consequence":"The most flexible. Trees get deep, burn is hard to predict, and the supervisor relationship gets hard to read on /agents."}],"references":["src/sessions/headlessPermissions.ts","src/execution/profiles.ts","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
