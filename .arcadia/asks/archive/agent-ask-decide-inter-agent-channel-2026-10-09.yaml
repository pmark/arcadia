{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-inter-agent-channel-2026-10-09","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide which channel agents use to relay information and requests to their supervisors and teammates.","rationale":"The operator wants inter-agent communication facilitated. Existing channels are Agent Asks, file handoffs, delegation return values, pings and GitHub coordination Issues (Comms). Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Reuse what exists. A delegate returns its result in-process to its lead, a relay to a supervisor is an Agent Ask (intent proposal) citing the delegation or Session id, and the delegation receipt carries the request and verdict. No new channel","consequence":"No new transport or schema. Relays are durable, cannot approve anything, and show on /agents. A delegate can reach only its own lead, and a new channel comes back only on that trigger.","recommended":true},{"label":"A new typed agent-message log in the workspace (an agent_messages store and an arcadia agents message command), bound to sender role, recipient and Action","consequence":"A real channel that is easy to audit and show. It needs a schema migration and a rule that messages stay signals, so they never become a second store of decisions."},{"label":"GitHub coordination Issues, the Comms pattern, for every relay","consequence":"Already proven across platforms. But each round needs a posting Decision because it is outward messaging, it is public, and it is slow for relays inside one Session."}],"references":["docs/agent-guidance/agent-asks.md","docs/agent-guidance/agent-comms.md","docs/agent-guidance/standard-harness.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
