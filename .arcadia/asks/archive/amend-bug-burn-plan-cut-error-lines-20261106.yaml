actions:
- target_ref: action/report-cut-work-monitor-attention-lines
  desired_result: 'Make the work monitor''s attention lines say how many lines its
    limit cut and from which Projects, so no unsaved or local-only working copy disappears
    silently, fixing Issue #2011.'
  execution: build
  acceptance:
  - 'When formatWorkingCopySafetyLines in src/workMonitoring/scanner.ts has more lines
    than its limit, it returns the first limit lines unchanged followed by exactly
    one extra line of the form "3 more not shown: Alpha 1, Beta 2.", where the number
    is the count of cut lines, each cut line (a repository error line or a working-copy
    line) counts under its Project name, and the Projects appear in Project-name order.'
  - When no line is cut, the output is unchanged and has no extra line.
  - A regression test in tests/work-monitor.test.ts on a hand-built snapshot proves
    both cases; it fails before the fix and passes after.
  - The existing limit-2 expectation in tests/work-monitor.test.ts changes only by
    gaining the new final line, and every other test in tests/work-monitor.test.ts
    and tests/work-monitor-failures.test.ts passes unchanged.
  - Apart from the settlement records Arcadia writes, the change touches only src/workMonitoring/scanner.ts
    and tests/work-monitor.test.ts. Proof that the tests, lint and tsc pass comes
    from the required CI jobs on the pull request's head, not from the Session, which
    cannot run them under headless validation.
