{"agent_ask":"v1","request_id":"one-session-completes-one-action-2026-09-13","project":"arcadia","intent":"action","requested_authority":"apply_if_approved","desired_result":"A single arcadia go session fully completes one Action and leaves the pointer on the next, with the operator merge as the only required touch.","rationale":"Operator-reported friction: one Action currently costs an Ask, a settle commit on main, a Decision answered in the slow web UI, a PR, a separate complete Ask, and a new session before the pointer advances. The Constitution already says gate judgment not mechanics (Decision 0052 is an agent-answerable criterion interpretation that reached the operator). Operator chose to queue these ahead of the current Ask-discovery Action (design-and-build-the-mechanism-that); place them at the top of the queue in the order listed. Phone one-tap answering is deferred until a post-triage judgment question actually arrives.","actions":[{"id":"settle-onto-candidate-branch","desired_result":"Settlement commits produced during an arcadia go session land on the Action candidate branch and ship in its PR, never as loose commits on main.","acceptance":["Running agent-ask settle --apply inside a candidate worktree commits to that candidate branch.","A test proves a session that settles and opens a PR leaves main with no new local-only commits."],"dependencies":[]},{"id":"merge-completes-the-action","desired_result":"The Action PR carries its completion evidence and pointer advance, so merging it marks the Action done without a separate complete Ask or session.","acceptance":["arcadia go can stage a complete settlement (evidence per acceptance criterion, pointer advance) into the candidate PR before merge.","After the PR merges, PROJECT.md current_action names the next governed Action with no further command run.","A stale or failed criterion still refuses completion, as the complete intent does today."],"dependencies":["settle-onto-candidate-branch"]},{"id":"triage-decisions-before-opening","desired_result":"A Decision opens only when the Constitution gate test holds (a reasonable person could choose differently, or the move resists reversal or reaches outside the work); otherwise the agent applies its recommendation and reports it in the PR.","acceptance":["Decision-intent settlement records which gate question fired, and refuses to open a Decision when neither fires and the move is reversible, converting it into a PR-reported assumption.","Approval boundaries (merge, deploy, publish, spend, credentials, production, messaging) always open a Decision regardless of triage.","A fixture shaped like Decision 0052 is reported, not opened."],"dependencies":[]},{"id":"divide-instead-of-stall","desired_result":"A session that cannot finish its Action ends by completing the finishable slice and queueing the remainder as new Actions in the same PR, so the pointer always advances.","acceptance":["arcadia go refuses to end a session with the current Action unchanged unless it records an operator question or external blocker.","A split settlement marks the finished slice done and places remainder Actions immediately after it in the queue."],"dependencies":["merge-completes-the-action"]}]}
