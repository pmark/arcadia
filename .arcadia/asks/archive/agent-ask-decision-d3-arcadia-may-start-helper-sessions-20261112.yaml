{"agent_ask":"v1","request_id":"decision-d3-arcadia-may-start-helper-sessions-20261112","project":"arcadia","intent":"decision","gate_question":"reasonable_disagreement","requested_authority":"propose","desired_result":"D3: May Arcadia start helper sessions beyond the two conditional launch Decisions?","rationale":"Helpers and registered reviewer or QA sessions currently need a person to paste a prompt. Decisions 0191 and 0190 cover only coordinator successors and the keeper. Sources: agentask_93d0170cd186a88db7 and agentask_b99a3e8db0ae4c862f. Codex base supersedes. This decision grants no START and preserves Constitution gates: helpers gain no authority, reviewer and QA stay separate independent sessions, and launch boundaries still need operator merge.","options":[{"label":"A","recommended":true,"consequence":"The designated custodian may request registered specialist types through the standard role and launch route. Lowest tier first. At most two launch attempts per assignment, a daily cap, no nested delegation, and autonomous replacement only for the bound assignment. Requires an approved finite spend envelope; a missing envelope refuses. First proof targets the currently used provider; other providers follow after native tests. Removes the paste dependency. Helpers still have no authority. Grants no START."},{"label":"B","recommended":false,"consequence":"Ship only the already-authorized coordinator and keeper routes and explicitly assigned helper launches. Useful today, but a helper that goes absent does not replace itself. Helpers stay background subagents of a coordinator. Grants no START."},{"label":"C","recommended":false,"consequence":"Keep automatic helper launches disabled. Fails the unattended lifecycle outcome and leaves each launch call with a person. Grants no START."}]}
