{"agent_ask": "v1", "request_id": "canonical-agent-behavior-term-20261014", "project": "arcadia", "intent": "decision", "requested_authority": "propose", "desired_result": "Choose the canonical umbrella term for named procedural contracts used by existing agent roles, such as supervision and Hacker recovery.", "rationale": "The operator approved retaining Hacker as existing-role recovery and asked: i want a canonical term for these semantics. Should they be Modes, or possibly Rails style Acts as or Behaviors? Recommend Behavior: role identifies governed responsibility, lineage and eligibility; behavior describes a named procedural contract that existing eligible roles may follow. A behavior names its trigger, duties, permitted scope, evidence, bounded allowance and stop condition without granting authority. Mode describes when a behavior is active, while Supervisor retains its precise meaning as an assigned relationship and duty. A shared umbrella must not collapse those distinctions. Acts as can be descriptive syntax rather than a canonical noun. This is a documentation vocabulary choice, not a new primary Arcadia work object, registry, executor, automatic invocation, allowance or runtime implementation. Implementation and installed adoption remain separately evidenced.", "gate_question": "reasonable_disagreement", "options": [{"label": "Behavior", "consequence": "Use Behavior as the canonical supporting term for a named procedural contract carried out by existing roles. Keep mode for an active operating state and supervision for the assigned relationship and duty. Update relevant semantics and guidance after approval without introducing a role or runtime registry.", "recommended": true}, {"label": "Mode", "consequence": "Use Mode as the canonical umbrella and describe entry, operation and exit for each named procedure. This emphasizes temporary operating state; supervision still needs an explicit assigned-relationship definition and concurrent modes need clear composition rules."}, {"label": "Acts as", "consequence": "Use Acts as as the shared composition idiom, for example a Lead acts as Supervisor. This emphasizes reusable duties and is familiar to developers, but operator-facing prose still needs a noun and activation/assignment semantics."}], "references": ["docs/arcadia-semantics.md", "docs/agent-guidance/hacker-recovery.md", "docs/agent-guidance/session-roles-and-briefs.md", "docs/decisions/0100-decide-which-governed-roles-the-arcadia-role-registry-defines.md", "docs/decisions/0113-decide-what-a-supervisor-is-and-how-the-supervisor-chain-reaches-the-operator.md", "docs/decisions/0121-decide-whether-and-how-arcadia-sessions-get-a-supervisor-that-watches-for.md"]}
