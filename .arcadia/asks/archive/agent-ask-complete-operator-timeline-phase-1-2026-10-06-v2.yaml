% of events have an unknown actor and are shown as unknown, never guessed."},{"criterion":"Phase 1 is proven on real data: a collector layer and a command (for example `arcadia timeline`, with `--since`, `--until`, `--project`, `--tool`, `--kind`, `--json` / NDJSON, and a `--follow` mode that streams new events) in this repository read the live workspace and repositories READ-ONLY and emit the unified stream, merged and deterministically ordered across all Projects, de-duplicated, with provenance per event, tolerant of missing or unreadable sources (a collector failure is reported as a stream event and never aborts the stream), and fast enough to be practical (the design records measured timings on this workspace); at least these collectors exist: git (commits, branches, merges and worktrees across the repositories the workspace knows), sessions and role attempts, Agent Asks and settlements, Decisions, Actions/Plans/Milestones/Projects record changes, the events table, managed-production activity, and operator-script receipts; a point-in-time query shows the workspace's recent history as of a past timestamp (the 'rewind' read model; interactive playback is Phase 2). The command writes nothing to any repository or database.","status":"met","note":"Phase 1 is proven on real data: src/timeline/ (schema, identity, classify, merge, rewind, follow, time, render and collectors for context, git, governed, sessions, asks, decisions, events, production, pings, operator scripts, pull requests) and `arcadia timeline` (src/commands/timeline.ts, registered in src/cli.ts, documented in docs/COMMANDS.md) with --since, --until (ISO or 30m/6h/1d/2w), --as-of (rewind), --project, --tool, --kind, --limit, --json, --ndjson, --follow (poll every 15 s, 10-minute overlap, --interval) and opt-in --pull-requests (gh api GET only, non-GET refused in code); strictly read-only (database opened readonly with fileMustExist, Git under GIT_OPTIONAL_LOCKS=0 and never status/fetch/gc/checkout, `timeline` exempt from activity recording like the other pure read commands with a guard test); a collector failure or unreadable source becomes a source_error event and the stream continues (seen twice on live data and fixed/handled). Measured in-process with a read-only handle on the live workspace: 1h 1.9 s cold, 24h 1.2-1.4 s (228 MB), 7d 1.9 s, 30d 2.6-2.7 s (545 MB); the database file and every repository's index and refs were unchanged. A sanitised real sample (rehearsal run 5) and the rewind view as of 03:31Z are in section (i) of the design."},{"criterion":"Tests (fixtures built in temp repositories and temp workspaces, no live data committed) cover each collector, the schema and `work_kind` classification including agent tool and semantic-name recovery from a worktree path, a commit author email and a Session row, ordering and de-duplication, source failure tolerance, the time-window and `--follow` behaviour; a short sample of real stream output from this workspace (sanitised, bounded, no secrets) is attached to the design as evidence that the data can be collected and presented as a stream; a Phase 2 section of the design offers two or three UX directions (a live 'what is happening now' view by project and agent tool, a scrubbable timeline for replay, an at-a-glance 'what kind of work' lens) with the practical data each needs from Phase 1, as options for the operator to choose, without building UI; lint, tsc, check:agent-guidance, the preservation self-check and the focused suites pass; an independent authority review of the design and the code is recorded on the pull request.","status":"met","note":"tests/timeline-model.test.ts and tests/timeline-collectors.test.ts (fixtures in temp repositories and workspaces, no live data committed) cover each collector, the schema and work_kind classification including tool and semantic-name recovery from a worktree path, a commit author email and a Session row, ordering and de-duplication, source failure tolerance, the time window and --follow, JSON/NDJSON shape; tests/activity-no-record-commands.test.ts runs `timeline` uninlined and asserts it opens the live-like database only read-only and records nothing; 78 focused tests pass; tsc, full-repo lint, check:agent-guidance and the preservation self-check (1861 files) pass; the design offers three Phase 2 UX directions (a live 'what is happening now' view by project and agent tool, a scrubbable replay timeline, a 'what kind of work' lens) with the data each needs and what is cheap versus hard, without building UI; the leak of dead test worktrees was filed as Issue #998; an independent authority review of the pull request head follows and is recorded on the pull request."}]}
