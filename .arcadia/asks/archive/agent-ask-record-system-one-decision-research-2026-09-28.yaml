{"agent_ask":"v1","request_id":"record-system-one-decision-research-2026-09-28","project":"arcadia","intent":"log","requested_authority":"propose","desired_result":"Record the System-One decision-model research conclusion: extend Arcadia Intelligence through a provider-neutral, Jev-compatible typed-decision API; begin with one local, advisory, read-only evaluation slice; keep MCP as a later adapter; and preserve Arcadia's deterministic authority and publication gates.","rationale":"Research distinguished TypeSafe Jev (hosted), Laya (small local decision model), OpenJev model/server variants, and Claude plugins. The enduring design conclusion is a stable typed-decision contract with receipts, versioned thresholds, provider selection by deterministic routing, and no decision-model authority to create governed state, approve publication, execute destructive work, or replace deterministic safeguards.","references":[".arcadia/asks/agent-ask-jev-compatible-intelligence-decision-api-2026-09-27.yaml","docs/architecture.md","docs/proposals/site-copy-and-seo-capability-modules.md","docs/decisions/0073-adopt-seo-audit-and-copywriting-capability-modules.md","docs/capabilities-blogging-v1-plan.md"]}
