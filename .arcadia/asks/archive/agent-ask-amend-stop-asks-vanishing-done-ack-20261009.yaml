{"agent_ask":"v1","request_id":"amend-stop-asks-vanishing-done-ack-20261009","project":"arcadia","intent":"plan","requested_authority":"apply_if_approved","target_ref":"plan/operator-to-do-list-with-ask-only-input","desired_result":"Drop bare 'done' from stop-asks-vanishing's closed acknowledgement list.","rationale":"The round-3 review of PR 1091 (nit b) recommended this, and PR 1098 implemented and disclosed it: a bare 'done' may be an operator's completion report, so it must not be suppressed. Text-only. Dependencies and references are restated unchanged (Issue #1079).","actions":[{"target_ref":"action/stop-asks-vanishing","desired_result":"Make every operator Ask that is not explicitly an idea visible in arcadia todo, so no Ask vanishes into the Back Burner.","acceptance":["Behind a config flag ask.routing.v2, which defaults on and can be turned off to restore today's routing, an operator Ask that matches no execution pattern goes to Clarify First instead of the Back Burner. Clarify First means a review_item that arcadia todo lists, carrying an ask-origin answer command. The Back Burner still receives an Ask only when the intake classification is Idea or the operator passes --back-burner. A Review Response with no resolvable reference also goes to Clarify First. Agent-sourced Asks (agent.ask envelopes) keep today's routing. Only a whole message that exactly matches a closed acknowledgement list ('thanks', 'thank you', 'ok', 'okay', 'got it', 'ack', or emoji only; a bare 'done' is not suppressed because it may be a completion report), after trimming whitespace and punctuation and ignoring case, creates no new question. So does an exact duplicate of an open Ask question within 24 hours. Their receipts say why, and the report counts them as suppressed, apart from the vanish rate. A message such as 'ok, ship X' is never suppressed.","The intake patterns in src/intake/index.ts recognise 'I should be able to', 'I want (to be able) to', 'let me' and 'it would be good if'. With these, the operator's example 'I should be able to Ask Arcadia to schedule a recurring action' is captured as work. Intake also records two deterministic flags in extractedFields. recurrence is set when the text says every, daily, weekly, monthly, recurring or schedule. planning is set when the existing planningRecommended pattern matches. ask_requests stores both flags so the report can count them.","arcadia todo renders two section headers. 'Yours' holds the existing operator items and a 'Your Asks need one answer (N)' group: the newest 5 Ask-originated questions, with the full count always shown and never hidden by the other-items cap. 'Agents are doing' is one count line of in-flight agent work, naming arcadia todo --agents, which this Action adds to list that work. A counts line reads 'Back Burner: N incubating (M new in 7 days)'. The morning packet counts the Ask questions. Existing Back Burner items are not moved or changed. With no resolvable workspace, the degraded output states that Ask questions and Ask-origin tasks are unavailable.","Tests cover:\n- the routing change for each classification;\n- the review-reply fallback;\n- the new phrasings;\n- the recurrence and planning flags;\n- trivial-acknowledgement and duplicate suppression;\n- an agent-sourced Ask keeping its route;\n- the flag-off rollback;\n- both todo sections and the counts line.\nType, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":[],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/backBurner/surfacing.ts","src/orientation/operatorTodoLines.ts"]}]}
