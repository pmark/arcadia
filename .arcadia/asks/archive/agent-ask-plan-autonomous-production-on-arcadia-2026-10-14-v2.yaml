{"agent_ask": "v1", "request_id": "plan-autonomous-production-on-arcadia-2026-10-14-v2", "project": "arcadia", "intent": "plan", "requested_authority": "propose", "desired_result": "Arcadia runs production unattended on its own repository on the Claude provider: the worker launches a Session, preserves a reviewed PR, merges it through the PR when it is not authority-adjacent, and continues to the next Action within a spend bound, with operator touches limited to authority-adjacent merges.", "rationale": "Operator directed exclusive focus on autonomous production (2026-10-14). The last production attempt (2026-10-11, one Action, codex-cli) never launched: tmux could not start the Session, 2 attempts, red alert ra-2bcf88b68759 repeated 155 times, and the underlying cause was not retained. Codex is dormant. docs/managed-production-readiness.md (2026-10-10) records the remaining unattended gaps: the worker never merges (Decision 0097's review-and-merge is unbuilt), no per-window spend budget (Decisions 0103/0111), and no preflight for an unrefreshable credential (#1155). Activation, packet approvals, spend bounds and merges of authority-adjacent PRs stay the operator's.", "actions": [{"id": "launch-failure-keeps-cause", "desired_result": "Make a Session launch failure keep its underlying cause in the red-alert evidence and in production status.", "why": "The 2026-10-11 run failed 155 times with only a wrapper message; nobody can fix a launch failure whose cause is discarded.", "acceptance": ["When tmux or the provider launch fails, the red-alert evidence file and arcadia production status --json carry the underlying error text (stderr or exception message), bounded in length.", "A hermetic test makes the tmux launch fail with a known stderr and asserts that text appears in the red-alert evidence and in production status.", "Focused tests, lint, tsc and pnpm build pass."], "dependencies": []}, {"id": "claude-worker-launch-replay", "desired_result": "Replay one production