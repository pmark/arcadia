ory on the claude-code provider, one Action, ending in a merged PR.", "why": "No production run has completed an Action on a non-disposable repository; this is the first proof on the real repository.", "acceptance": ["reconcile-completed-governance-overlap is either proposed for retirement with evidence that main already satisfies it, or re-scoped to claude-code, through an Agent Ask.", "A production preview scoped to claude-code, one Action, concurrency 1 and remote preservation is published with its fingerprint, and the operator's activation is presented as one card; agents do not activate.", "After the operator activates, the run's Session reaches a draft PR, an independent review of its head is recorded, and the PR merges through the batch-merge card or the operator.", "docs/managed-production-readiness.md is refreshed under its Refresh contract with the run's observed stages, failures and operator touches."], "dependencies": ["claude-capacity-evidence"]}, {"id": "worker-review-and-merge", "desired_result": "Build the worker's automated review-and-merge (Decision 0097): merge a candidate PR through GitHub only when an independent review of its exact head passes, required checks are green and it is not authority-adjacent.", "why": "The worker never merges today, so every Action needs a supervisor; this is the step from supervised to unattended.", "acceptance": ["The worker merges only through the pull request, never by a local fast-forward or base-branch push, and only after a recorded independent review of the exact head has no blocking finding and every required check on that head passed.", "A PR the blast-radius assessment marks authority-adjacent is never merged by the worker and appears on the batch-merge card with its reason.", "A moved head, a failed check or a missing review refuses the merge with a named reason, each covered by a hermetic test, and the fast-rehearsal chain merges a fixture PR end to end.", "Focused tests, lint, tsc, pnpm build and the fa