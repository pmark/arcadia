{"agent_ask":"v1","request_id":"decision-design-advice-assurance-hybrid-2026-10-31","project":"arcadia","intent":"decision","requested_authority":"propose","gate_question":"reasonable_disagreement","desired_result":"What should Arcadia promise about the quality of design advice?","rationale":"Supersedes Decision 0155, whose options did not include the operator's answer given in Claude Code on 2026-10-31. The recommended option is that answer, with refinements the operator accepted. Gates add-design-route-to-consultation and create-portable-design-facilitation-skill in Plan unify-how-arcadia-agents-identify-themselves-and-their-teammates-and-make.","options":[{"label":"Reviewed guides first, never limited","consequence":"Reviewed field guides are the main value: an answer claims conformance only within a reviewed guide's scope. In any field without one, design help still works, with visible provenance and disclosed exploratory advice. Every answer states which mode it is in, so the operator can tell checked advice from exploratory advice. Its value grows as reviewed guides are written; who writes and reviews them is still open.","recommended":true},{"label":"Visible provenance only","consequence":"Every answer shows its guide, sources, confidence and gaps, with no conformance claims even where a reviewed guide exists. Simpler; makes no use of reviewed guides as a mark of quality."}]}
