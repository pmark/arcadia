{"agent_ask":"v1","request_id":"propose-go-workspace-ui-actions-20261027","project":"arcadia","intent":"plan","target_ref":"plan/make-arcadia-go-orient-one-caller-truthfully-before-authorized-work","requested_authority":"propose","desired_result":"Give the operator a real Go workspace that renders Go's own resolution and lets them direct and continue work through it, by adding the three Actions the Go Plan does not yet hold: an operator-scoped read-only orientation, receipts for operator directions, and governed continuation from the workspace with one bounded real assisted delivery.","rationale":"Operator direction 2026-10-27: use the actual Go UI in its minimal form as soon as possible and iterate while the backend is built. The selected Plan (PR 1821) states that later live UI and real-run scope must be governed separately; this Ask is that proposal and changes nothing until settled. UI-1 (Issue 1822) is operator-directed work that renders the existing continuation read and adds no control. Three gaps remain, found by reading main: (1) Go's orientation is resolved per caller worktree, and the only operator-scoped read is the continuation GET, which runs arcadia next and journals every read, so the UI must avoid polling it; (2) the state-signals Action covers an agent announcing its own state, not a receipt for an operator's direction, and native mail is pull-only, so storage must never be shown as delivery; (3) no Action offers continuation from the workspace. The UI renders Go output and never selects work or keeps its own execution state, as Cody Mason asked on PR 1820. Deferred: Uplink Watch/Talk and the map lens; revival trigger: continue-from-go-in-the-workspace is done.","actions":[{"id":"project-go-orientation-for-the-operator","desired_result":"Serve Go's resolution to the operator workspace per Project, and as a portfolio summary, as a read-only and journal-free read from the existing resolver.","acceptance":["A read-only route returns, per Project, Go's selected Plan and Action, its dispatchable verdict, the operator question or first blocker with its remedy, and ongoing claims and Sessions with source and observed time, using the existing dispatch and gate resolution rather than a second resolver.","Read-only adapter spies and before/after snapshots prove zero dispatch-journal, Project, queue, claim, admission, Git and worktree writes and zero provider calls; identical pinned inputs give identical output, and an unreadable Project is listed with its exact error, never dropped.","The workspace reads this route instead of the journaled continuation GET; the existing workspace end-to-end suite passes unchanged in intent."],"dependencies":["resolve-go-caller-context"]},{"id":"show-receipts-for-operator-directions","desired_result":"Record and show an operator direction's receipts as distinct evidence-backed states: submitted, delivered, acknowledged, continued and verified, plus unknown and held.","acceptance":["An operator direction addressed to an explicit Project, Plan or Action carries a stable request id; exact replay returns the same receipt and changed input under the same id refuses.","Each state is set only by its own evidence: delivered when a native checkpoint that the recipient reads records it, acknowledged from the recipient's compact acknowledgment, continued from a subsequently observed state change; storage alone never implies delivered or acknowledged.","A stopped or paused recipient leaves the direction held, and an uncertain submission shows as unknown and is never resent automatically; the workspace renders every state with end-to-end coverage for held and unknown."],"dependencies":["reuse-go-context-through-authorized-continuation","project-go-context-as-compact-state-signals"]},{"id":"continue-from-go-in-the-workspace","desired_result":"Offer Go's next permitted move as a Continue control in the workspace through the existing protected continuation, and complete one bounded real operator-assisted delivery through it.","acceptance":["Continue appears only when Go's resolution for the shown Action is dispatchable, previews target, owner, provider and limits before commitment, and invokes the existing protected Go continuation with a stable request id so that repeated or concurrent presses produce at most one claim, candidate and Session.","A resolution that changed after it was shown refuses with the changed facts and offers a fresh read; no approval, credential or production gate is bypassed, and Production stays Off unless separately started.","One bounded real operator-assisted delivery through the workspace is recorded with its receipts and pull request, with source, installed adoption and live proof recorded as separate stages."],"dependencies":["reuse-go-context-through-authorized-continuation","project-go-orientation-for-the-operator","show-receipts-for-operator-directions"]}]}
