{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-budget-pressure-model-selection-2026-10-09-r3","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide what deterministic model and effort selection does when a task's required capability and the remaining budget conflict.","rationale":"The operator wants a just-in-time, deterministic model and effort decision that weighs every relevant factor and picks the most cost-effective model for the task and role, and wants an emergency reserve kept for the operator. The plan treats determinism and the input set as given: role defaults, the task's capability, effort and escalation triggers, provider availability and hard evidence, capacity and reserve state, costRank, review independence, and prior attempts. The reserve is never drawn automatically. The open judgment is behavior under budget pressure. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Queue, and never under-provision. The selector never goes below the task's required capability and picks the cheapest compliant model outside the reserve. If none fits, the request queues. Queued means it waits in strict first-in, first-out order per provider, so a later request on the same provider is never admitted ahead of an earlier queued one. It is promoted only when its own requester runs arcadia delegation poll. A requester that does not poll within 5 minutes loses the request (poll_lapsed), and one still not admissible after its bounded wait (default 30 minutes) is declined as queue_timeout, and the lead then continues without the delegate","consequence":"Quality never drops below what the task needs, and the reserve is untouched. Under pressure, work slows down rather than getting worse, and 