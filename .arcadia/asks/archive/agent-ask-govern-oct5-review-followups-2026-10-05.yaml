{"agent_ask": "v1", "request_id": "govern-oct5-review-followups-2026-10-05", "project": "arcadia", "intent": "action", "desired_result": "Govern the six new ungoverned follow-up and defect Issues from the 2026-10-05 review/experiment round as Actions in the active Plan.", "rationale": "Live curation on #940 found six Issues filed since the 2026-10-04 batch with no governed Action: the reviewer verdict-name defect (#937), peer-watch contract follow-ups (#939), Identity-block fail-soft (#942), experiment-guard leak-check attribution (#945), experiment-workspace friction (#947), and activity-leak fix follow-ups (#949). Each carries observed evidence (file:line or a live receipt). Promoting them keeps the checked-in queue authoritative.", "actions": [{"id": "fix-reviewer-verdict-name-echo", "desired_result": "The code reviewer's verdict parser accepts the prompt's 'Name: description' criterion line when a model echoes it into the check `name`, instead of rejecting the verdict shape.", "acceptance": ["When the reviewer's `name` field contains the criterion's full 'Name: description' line, Arcadia matches it to the declared criterion (by name prefix) rather than recording `reviewerUnavailable`.", "A malformed verdict that matches no criterion still fails closed as before; the model's own statuses are preserved.", "A deterministic test feeds a verdict whose `name` echoes the criteria line and asserts it is accepted and mapped.", "`pnpm test` passes."], "dependencies": [], "references": ["src/qa/prReview.ts", "https://github.com/pmark/arcadia/issues/937"]}, {"id": "harden-peer-watch-ownership-join", "desired_result": "Close the peer-watch contract follow-ups: claim-after-session ownership join, `hasOwn`, and `releaseRef` from the reader.", "acceptance": ["`deriveOwnership` does not yield `principal_terminal` when a claim was created after the Session it is joined to; the join is by claim/session identity, not worktree+branch only (src/agentWatch/classify.ts ~543-549).", "`hasOwn` uses the correct prototype-safe check, and the reader can return `releaseRef`.", "Regression tests cover the claim-after-session case and the ownership gate.", "`pnpm test` passes."], "dependencies": [], "references": ["src/agentWatch/classify.ts", "docs/agent-guidance/agent-peer-watch.md", "https://github.com/pmark/arcadia/issues/939"]}, {"id": "fix-identity-block-fail-soft", "desired_result": "The Identity block fails soft and is printed everywhere it should be: reviewer prompt, `go`, packets, and advance.", "acceptance": ["An invalid `config/coding-agent-models.json` does not make the independent QA/code review refuse for a cosmetic reason; `loadModelTierRegistry` in the reviewer prompt (src/qa/prReview.ts:421-427) is wrapped to fall back to the default display name.", "An empty packet directory no longer suppresses the Identity block, and `arcadia advance` prints it.", "Deterministic tests cover the fail-soft registry, empty packet dir, and advance output.", "`pnpm test` passes."], "dependencies": [], "references": ["src/qa/prReview.ts", "https://github.com/pmark/arcadia/issues/942"]}, {"id": "harden-experiment-guard-leak-check-attribution", "desired_result": "Close the experiment-guard review follow-ups: leak-check attribution guidance and `--record` clobber.", "acceptance": ["Leak-check output distinguishes ordinary live operation (broker manifest rewrite on a services restart, operator production transitions, admissions growth) from a real leak, in guidance and in attributed fields.", "`leak-check --record` does not clobber a prior baseline unexpectedly; overwrite is explicit or preserved.", "Focused tests or fixtures cover the attribution cases and the record behavior.", "`pnpm test` passes."], "dependencies": [], "references": ["docs/agent-guidance/", "https://github.com/pmark/arcadia/issues/945"]}, {"id": "fix-experiment-workspace-friction", "desired_result": "Fix the experiment-workspace friction: uninlined commands reaching live activity, unpositioned fresh Actions, and the Ask `--dir` default.", "acceptance": ["A command run without an inline workspace cannot write an `activity_events` row into the live workspace from an experiment context (or the guard/require-inline mode makes that refusal explicit).", "A freshly imported/created fixture Action is positioned so `advance`/`make-next` works without a manual `queue arrange`, or the setup path does it.", "`agent-ask draft/preview` does not default `--dir` to the Arcadia checkout when run inside a fixture; cost is documented.", "Deterministic tests cover the activity isolation and fresh-Action positioning.", "`pnpm test` passes."], "dependencies": [], "references": ["src/scheduling/github.ts", "https://github.com/pmark/arcadia/issues/947"]}, {"id": "harden-activity-leak-fix-followups", "desired_result": "Close the activity-leak review follow-ups: operator-task ledger audit and leak-check snapshot size.", "acceptance": ["`operator-task raise|evidence|close|decline` writes to the repository ledger by design and is either recorded there only or documented as intentionally outside `activity_events`.", "`leak-check --json` does not embed an unbounded `liveRefs` map; the snapshot is bounded or summarized.", "Focused tests cover the operator-task ledger and the bounded snapshot.", "`pnpm test` passes."], "dependencies": [], "references": ["https://github.com/pmark/arcadia/issues/949"]}]}
