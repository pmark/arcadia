{"agent_ask":"v1","request_id":"amend-operator-todo-acceptance-to-shipped-design-20261008","project":"arcadia","intent":"plan","requested_authority":"apply_if_approved","target_ref":"plan/operator-to-do-list-with-ask-only-input","desired_result":"Align two acceptance criteria with the operator-approved shipped design: doneCondition is enforced by normalizeVerdict and lint, and the todo default view puts Decisions first, newest first.","rationale":"The operator chose both amendments in chat on 2026-10-08 (Mark, Claude Code session: \"Amend criterion\" and \"Amend to Decisions-first\"). (1) grade-next-actions-before-actionable criterion 1: doneCondition is deliberately not schema-required (src/clarify/contract.ts) so that a reply missing it does not become a failed job reused silently by its idempotency key. normalizeVerdict and the lint enforce it instead, as both independent reviews of #1059 recommended. (2) build-operator-todo-list criterion 3: the operator directed a Decisions-first, newest-first default order (#1069) after Decision 0094 was hidden behind older items. Text-only change to two criteria; no other change in scope.","actions":[{"target_ref":"action/grade-next-actions-before-actionable","desired_result":"Make a next action count as actionable only when it states a done-condition and passes a separate grader; otherwise the operator gets exactly one question in arcadia todo.","acceptance":["arcadia ask marks the work_items it creates unclarified, and the clarify generator schema gains a doneCondition field that is required on the clarified branch, enforced by normalizeVerdict and the deterministic lint rather than by schema validation (a schema-invalid reply would become a failed job that the idempotency key keeps reusing); normalizeVerdict (src/clarify/engine.ts) downgrades a clarified verdict lacking one to question_open with the existing gapType missing-success-criteria and exactly one question.","Before recording clarified, a deterministic lint (non-empty doneCondition; nextAction starts with a verb; every file path, Action or Decision id and command name it mentions appears in the source material, which includes the prior clarification answer) and then a separate grader run. The grader is its own instruction file .agents/skills/next-action-grader/SKILL.md (symlinked from .claude/skills, reported as an external boundary if the sandbox blocks the link, and listed in docs/using-arcadia-skills.md) executed as its own local-preferred Intelligence call with a different prompt that never receives the generator's confidence, using a distinct model profile when one is configured and otherwise documenting that only prompt independence is claimed. It checks: concrete verb; first physical step startable by the named actor in under 15 minutes; observable done-condition; no invented facts; and when information is missing, a request for exactly that one item. Only a pass records clarified; a fail records question_open through the existing clarify --apply path (an ActionClarification review_item), so the single question appears in arcadia todo.","When the operator answers an ActionClarification at the CLI with review approve <id> --answer <text> --clarify or review resolve-reply <reply> --id <id> --clarify (a new opt-in flag that arcadia todo prints in its answer command), the answer is made durable and then clarify --work <id> --apply runs once; without the flag, and on the Discord and dashboard paths (which re-clarify themselves), no clarification is triggered, so nothing runs twice. When a passing verdict's actor is a coding agent and the work_item has a capture_id, clarify --apply drafts one strict v1 Agent Ask (intent action, request_id handoff-<work_item_id>-<first 12 hex of sha256(nextAction + doneCondition)>, rationale naming the capture envelope and work_item ids, acceptance from the done-condition) into the Project repository's .arcadia/asks/ through the existing draft writer (runAgentAskDraftCommand). Drafting is skipped, with the reason reported, when the work_item's Project has no repo_path or a proposal with that request_id already exists, including one already settled and archived. That draft is the file handoff; it appears in arcadia todo as a pending proposal, and clarify itself writes no Action status, pointer or queue.","Each grader verdict is stored as a receipt in the existing clarification record (no new table) with grader identity (model profile id or agent reference), prompt sha256, input sha256 and verdict, and the golden set's README states it is the contract any deterministic replacement grader must pass. A checked-in golden set of at least 10 hand-written cases (next action, done-condition, source, expected pass or fail with reason) runs in tests against the lint and a stubbed grader; tests also cover ask marking unclarified, missing done-condition, grader fail-with-question, grader-unavailable leaving the item unclarified, CLI answer re-clarify, and idempotent handoff Ask drafting. Dry run stays the default and grading never escalates to a paid model. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact; LOCAL ONLY or an unresolved blocker is labelled explicitly."]},{"target_ref":"action/build-operator-todo-list","desired_result":"Give the operator one derived to-do list of everything Arcadia needs from him: arcadia todo.","acceptance":["arcadia todo [--json] [--all] [--stale] [--project <slug>] is a read-only derived view with no new store and never mutates anything. Per Project it computes the selected Action and ready set the way arcadia next does (resolveDispatch, resolveReadySet and resolveOperatorGate under a read-only database), then composes: open Decisions and pending Agent Ask proposals classified blocking or alert by the existing classifyOperatorItems/resolveOperatorGate; open and deferred review_items (covering ActionClarification); waiting operator-task ledger items; production_operator_escalations rows read-only (one item per Action, kind escalation:<kind>, title from message, answer from remedy, always blocking, createdAt from first_detected_at, deduped against a listed Decision named in the message), so a stalled production loop appears even when no Decision or Ask exists; non-done work_items with clarification_status unclarified, a capture_id and no open review_item, as alert items of kind clarify whose answer is arcadia clarify --work <id> --apply; and Plan Actions only when requires_review, question_open or a readiness blocker names an operator step, excluding Project-pause states. It dedupes review_items by work_item_id and by doc_ref against open Decision documents, ledger items and Actions against the Decision or review_item that already represents them.","Blocking is true only for an item that is the selected Action's operator gate (a blockingDecisionId, a requiredDecisionId or deferringDecisionId of a ready-set candidate, the selected Action's own operator reason, or a review_item or ledger item linked to one of these); everything else is an alert. Each item carries key <kind>:<source-id>, kind, title from the source's own field (nothing synthesized), project, blocking, origin, createdAt, staleReason when stale, and answer: the exact existing canonical command (for an Agent Ask, the two-phase settle preview command) and, where one exists, the existing Discord reply or dashboard path. --json output carries schema 'arcadia-todo-v1' and asOf (ISO timestamp and workspace name), and every item carries sourceRef (the canonical file path, or table and id). Blocking comes from resolveOperatorGate or the escalation row and is never recomputed. Decision and Agent Ask items also carry gateQuestion, options with consequences, and evidence. The doneWhen rule per kind is documented in help and START_HERE.md, not stored.","Stale means positive evidence only: an Agent Ask of intent complete, split, or action with a target_ref is stale when every Action it targets exists in a Plan of its Project with status done; an Ask naming only absent Actions is an un-adopted proposal and never stale; supersession counts only through an explicit line 'Supersedes: <proposal ids>' in the rationale of an Agent Ask, read from its stored proposal; a Decision is stale when its action is done; a review_item is stale when its work_item is done or its doc_ref names an answered Decision. The default view prints a counts line (blocking, other, stale hidden, per kind), every blocking item, then at most 5 other items ordered with open Decisions first, newest first, then every other item oldest first; --all and --stale show the rest, and the default view ends with 'N more: --all'. Projects without a repo_path and fixture Projects whose slug contains 'rehearsal' or whose repo_path lies under the OS temp directory or ~/tmp appear only as a counts line. With no resolvable workspace it prints the repo-local sources plus one explicit 'workspace sources unavailable: <remedy>' line, never a silently partial list; Decisions raised only on unmerged candidate branches are a documented limit.","Fixture tests cover one item per kind (including one operator_gate_pending and one repair_budget_exhausted escalation, and an escalation whose gate is also a listed Decision shown once), all dedup rules, positive-evidence staleness including an un-adopted proposal that stays visible, the blocking rule, ordering and cap, fixture-Project grouping, the degraded no-workspace output and a JSON golden; type, lint and build pass; START_HERE.md documents arcadia todo. A pushed PR with exact-head independent review and all required checks is the delivered Artifact; LOCAL ONLY or an unresolved blocker is labelled explicitly."]}]}
