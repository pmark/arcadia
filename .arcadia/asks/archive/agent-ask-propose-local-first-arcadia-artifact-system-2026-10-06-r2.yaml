{"agent_ask":"v1","request_id":"propose-local-first-arcadia-artifact-system-2026-10-06-r2","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Create a local-first Arcadia Artifact System that gives agent- and app-created assets durable identity, safely loopback-served access, verifiable optional replication, and a controlled handoff to later site or podcast publication.","rationale":"Arcadia Intelligence narration is the concrete first use case: its WAV and eventual MP3 should be usable immediately by local apps, retain provenance and range-aware streaming, and later be mirrorable or publishable without turning a speech job into a hosting system. The vital first slice is a local Asset Service with an enforceable local-only boundary; real cloud credentials, public access, and a chosen blog/podcast host remain outside this Plan until an operator Decision selects them.","references":["src/intelligence/artifacts/store.ts","src/intelligence/api/server.ts","src/intelligence/speech/wavMeta.ts","docs/proposals/podcast-from-issue-commentary.md","https://github.com/pmark/arcadia/pull/977","https://github.com/pmark/arcadia/pull/979"],"actions":[{"id":"define-local-arcadia-asset-contract","desired_result":"Define and implement the smallest durable Arcadia Asset contract and loopback-only local Asset Service for binary outputs, preserving stable identity, provenance, and safe playback without exposing workspace paths.","acceptance":["A versioned Asset reference has an immutable asset id, SHA-256 content hash, MIME type, byte size, owner/provenance references, lifecycle/access state, and a stable local URI; it distinguishes a Domain Artifact, an Intelligence job artifact, and an Asset rather than renaming or conflating existing records.","The Asset Service stores bytes atomically under the configured workspace, serves a named asset only through a stable local endpoint with correct content type and HTTP Range behavior for audio, rejects traversal/unknown assets, and never returns a raw workspace path or provider URL.","An Asset may report `private` or `local-ready` only when its serving endpoint is bound to loopback; an Asset endpoint on a non-loopback listener refuses until a separately authorized access-control design exists, and tests prove no non-loopback binding can be labelled private.","Assets are local/private by default; creating or serving one neither mirrors it to a cloud provider nor makes it public, and the API/result explicitly reports local-ready with mirror and publication state not requested.","Deterministic migration/adoption rules let an existing Intelligence artifact become an Asset reference without copying bytes unless a content hash differs; tests prove idempotence, hash integrity, range behavior, loopback-only refusal, access refusal, and crash-safe writes."],"dependencies":[],"references":["src/intelligence/artifacts/store.ts","src/intelligence/api/server.ts","src/intelligence/types.ts","docs/AGENT_ORIENTATION.md"]},{"id":"verify-governed-narration-base","desired_result":"Verify that the governed WAV narration capability needed by the Asset System is landed and usable before narration-asset integration can dispatch.","acceptance":["The candidate base contains the reviewed and merged `arcadia intelligence narrate` WAV capability represented by PR #977 or its landed successor, including deterministic chunk synthesis, WAV concatenation, and a narration manifest; the exact landed commit and verification command are recorded in implementation evidence.","If that governed narration capability is absent, this Action remains blocked with the missing merge or governing Plan/Action named; no narration-asset integration is started or claimed from this Plan."],"dependencies":[],"references":["https://github.com/pmark/arcadia/pull/977","docs/proposals/podcast-from-issue-commentary.md"]},{"id":"make-narration-a-first-class-asset-use-case","desired_result":"Use the local Asset Service for completed Arcadia Intelligence narrations so an agent or local app receives a stable playable asset reference and auditable source manifest.","acceptance":["The narration flow records its completed delivery audio as an Asset reference while retaining the ordered Intelligence chunk/job artifacts and source snapshot in a manifest; local clients can retrieve the final audio through the loopback-only Asset Service URI.","The result distinguishes the canonical delivery Asset from the component speech artifacts and reports the source hash, selected format, voice/cast metadata when present, and local/mirror/publication lifecycle states.","The use case creates no cloud copy, public URL, blog post, feed entry, or external message; tests prove narration delivery remains local-only unless a later explicitly requested distribution workflow runs."],"dependencies":["define-local-arcadia-asset-contract","verify-governed-narration-base"],"references":["src/commands/narrate.ts","src/intelligence/artifacts/store.ts","docs/proposals/podcast-from-issue-commentary.md"]},{"id":"define-verifiable-asset-mirroring-contract","desired_result":"Add a target-neutral, fail-closed mirror lifecycle for Assets that can be exercised with a deterministic fake target before any real cloud storage is selected.","acceptance":["A mirror request names one asset and one configured target profile, records queued/succeeded/failed state with immutable source hash and receipt, and never changes the Asset canonical local identity or local availability.","A mirror succeeds only when the target receipt proves the expected content hash and byte size; interrupted, mismatched, or unknown outcomes remain visible and retryable without claiming availability or deleting the local asset.","The initial implementation includes only a deterministic fake/test target and target-neutral interface; it adds no cloud SDK, credential, automatic upload, public ACL, or provider-specific configuration.","Tests cover idempotent requests, retry after interruption, mismatch refusal, concurrent duplicate requests, and local playback while mirror state is failed or pending."],"dependencies":["define-local-arcadia-asset-contract"],"references":["src/intelligence/artifacts/store.ts","src/intelligence/api/server.ts","CONSTITUTION.md"]},{"id":"define-site-and-podcast-publication-handoff","desired_result":"Define the governed handoff by which a selected site or podcast publisher may reference a verified Asset without coupling publication to asset creation.","acceptance":["A publication request references an existing Asset id and carries title, description, visibility intent, and target-specific metadata separately from the binary; it refuses assets that are not local-ready or whose requested distribution state is not authorized.","The contract makes clear that generating an Asset, mirroring an Asset, and publishing an Asset are separate state transitions; no Action in this Plan deploys, publishes, creates a public feed, or selects a hosting provider.","Deterministic tests cover a local preview/reference path and refusals for missing asset, failed mirror, and unapproved public visibility; documentation names the Decision required before implementing a real site, podcast-feed, or cloud-host adapter."],"dependencies":["define-local-arcadia-asset-contract","define-verifiable-asset-mirroring-contract"],"references":["CONSTITUTION.md","docs/proposals/podcast-from-issue-commentary.md"]}]}
