"desired_result":"Build the guard that makes experiment workspaces safe, then run the first bounded multi-workspace trial on disposable fixture repositories.",
"rationale":"Operator direction 2026-10-04 (start the multi-workspace experiment when idle) and the read-only design study (scratchpad ws-experiment/design.md, main 828d32714): topology C, one experiment workspace per agent platform registering only disposable no-remote fixture repos under the experiment root; host-global state (user config defaultWorkspace used by all four launchd services, ~/.arcadia telemetry, the single go-broker trust list in ~/.codex/config.toml and ~/.claude.json) means a code guard must make production activation, Grants, broker/services/ingress installs, GitHub and Discord posting and a default-workspace switch impossible in a workspace flagged experimental before agents are handed one. Decision 0082 (open) asks the operator to approve the experiment; the guard is safe to build regardless because it only adds refusals. The trial Action must not start until Decision 0082 is answered with an option that permits it. No authority is added.",
