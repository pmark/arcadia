{"agent_ask": "v1", "request_id": "decision-start-binds-worker-and-checks-sign-in-20261031", "project": "arcadia", "intent": "decision", "requested_authority": "propose", "gate_question":"resists_reversal", "desired_result": "May a per-run START card also install a bound worker and run one bounded Claude sign-in renewal and worker usage check before starting production?", "options": [{"label": "Yes: START binds the worker and checks sign-in itself (recommended)", "consequence": "Widens the Decision 0156 press. After go-broker ensure installs the pinned sha, the card installs the worker launch agent from that compiled release and restarts it, so the worker is bound to the pinned release and handler. The card no longer requires the pre-restart worker to be bound: it requires that worker only to be live and fresh. After the bound restart, if no fresh retained receipt from that bound worker exists (a receipt from the previous unbound worker never counts), the card runs the Decision 0143 sequence exactly once, with 0143's bounds unchanged: one Haiku one-turn call with no tools, an allowlisted environment and at most 60 seconds, which may rotate the shared sign-in (0139's concurrent-login limitation still applies) and uses small included usage; then, only on success, one usage check of at most 30 seconds by the bound worker under a fresh nonce grant of at most 5 minutes. START proceeds only if that check succeeds, the credential expires more than 5 minutes later, and both usage windows are below 100%. This replaces the retained pre-press sign-in receipt. The sequence counts against Decision 0141's one-per-America/Los_Angeles-day ceiling and is not a new allowance; if today's sequence is already used, by Rowan or an earlier attempt, the card, which reads the ledger read-only in preflight, refuses before any mutation and cannot be pressed until the next day. If the protected install or restart fails, the worker may be down or still source-run; production stays Off and no renewal runs. A renewal or check failure comes after the install and restart: the runtime stays upgraded, the card and that day's sequence are consumed, the sign-in may have rotated and there is no START or retry, so the next attempt needs a new card on a later day. Every other Decision 0156/0157 gate is kept. The mechanism is implemented only after independent review. No other 0143 exclusion is lifted beyond the runtime adoption and START that 0156/0157 already allow for this card. No paid fallback, credential export or interactive sign-in."}, {"label": "No: bind the worker with a separate card first", "consequence": "No widening. A separate pinned adoption card installs the bound worker (one extra press). Rowan then runs a reviewed Decision 0143 sequence against it, which uses that day's 0141 sequence just as option A would, and the START card pins that installed revision and the retained receipt as today. Two presses now, then one press per run unless main moves, provided the worker launch agent stays on a protected release."}], "rationale": "The live worker launches from source, so its diagnostic binding is null (Issue #1950). No Decision 0143 worker check can run against it, and the START executor's binding gates refuse. Only an install binds the worker, and only the card installs, so a single press needs the card itself to run the renewal and check. That widens what one press does, so the operator decides. Answering gates implementation only; no install, renewal, restart or START follows from the answer itself.", "references": ["https://github.com/pmark/arcadia/issues/1950", "docs/decisions/0141-record-standing-daily-claude-renewal-and-verification-approval.md", "docs/decisions/0143-record-already-given-standing-approval-for-bounded-small-usage-claude-renewal.md", "docs/decisions/0156-may-a-per-run-start-card-also-install-its-pinned-reviewed-main-revision-and.md", "scripts/start-run.sh"]}
