options with consequences as well as optional buttons. Desktop and narrow/mobile keyboard and screen-reader checks prove that the current response is reachable without hidden native pickers or forced scrolling away from history the operator is reading.","Unsupported or ambiguous input displays its interpretation limit and one relevant clarification; it does not execute or silently amend scope. Routine orientation and status rendering invoke zero models; any free-text interpretation reuses the configured bounded route and cannot authorize effects. Focused conversation tests, TypeScript and Dashboard build pass."]},{"id":"connect-conversation-to-protected-continue","desired_result":"Implement Go and Continue in the conversation through the existing protected preview and browser confirmation. Recommended role: implementer, standard tier; size M; source work only, no new launch authority.","why":"Make the authorized next step actionable while preserving the existing confirmation boundary.","dependencies":["implement-project-go-conversation"],"references":["https://github.com/pmark/arcadia/issues/1894","apps/dashboard/lib/go-continue.ts","apps/dashboard/components/workspace/workspace-continue.tsx","apps/dashboard/app/api/projects/[id]/go-continue/route.ts","apps/dashboard/app/api/projects/[id]/session-launch/route.ts","apps/dashboard/lib/operator-launch-consequence.ts"],"acceptance":["Requirement REQ-004; Issue AC3. Go or Continue obtains a fresh existing protected preview and shows target, owner, configured provider/model/effort, limits, stable request identity and exact launch consequences. Only the existing explicit browser confirmation may commit; tests prove zero Session launch from the initial message, a generic yes, copied approval prose or model-generated confirmation.","The adapter binds Project, Plan, Action, resolution identity and preview fingerprint without inventing a second resolver or launch policy. Changed-facts, expired/invalid authority and non-dispatchable fixtures return the existing refusal with a fresh-read path before effects; browser-origin and provider/custody/production gates remain enforced.","Requirement REQ-005; Issue AC4. Confirmation displays launched, reused, refused or unknown according to the protected response. Started appears only with the actual durable Session receipt and a working Session inspection link. Reuse the feedback correction from PR1890; desktop/mobile and accessibility checks prove preview, confirmation and result remain visible and operable.","Focused preview/confirmation integration tests, TypeScript and Dashboard build pass. No automatic next Action, merge, installation, Production activation or direct text approval is introduced."]},{"id":"project-session-evidence-into-conversation","desired_result":"Implement Session progress and result messages from canonical evidence in the conversation. Recommended role: implementer, standard tier; size M; source work only after named assignment.","why":"Make ongoing work and its outcome understandable without guessing from a spinner or process exit.","dependencies":["connect-conversation-to-protected-continue"],"references":["https://github.com/pmark/arcadia/issues/1894","apps/dashboard/components/workspace/workspace-continue.tsx","apps/dashboard/lib/arcadia-cli.ts","src/sessions/index.ts"],"acceptance":["Requirement REQ-006; Issue AC6. Status and conversation re-entry read the bound request/Session and display recorded progress without interrupting its execution. Fixtures distinguish preparation, running, agent exit, validation success/failure, accepted completion, PR created and review readiness; unavailable or stale host evidence never becomes working or done.","Only canonical receipts can produce Session, validation, commit, PR and review claims. A result message includes actual available evidence links and identifies each missing or pending stage; tests prove a successful agent exit without accepted completion or PR cannot render delivery success.","Routine progress updates use deterministic projections and existing observation mechanisms, deduplicate the same recorded transition and retain historical messages with their source time. No new persistent model watcher, external notification or separate Action-state authority is introduced.","Questions remain usable while work runs. Scope-change and stop requests cannot silently amend the assignment or claim stopped without a supported receipt; the conversation points to the existing governed route or states the missing capability. Focused lifecycle tests, TypeScript and Dashboard build pass."]},{"id":"reconcile-conversation-retries-and-reconnects","desired_result":"Implement request reconciliation for duplicate messages, interrupted launch responses and conversation reconnects. Recommended role: implementer, standard tier; size M; source work only, preserve existing request identities.","why":"A lost response or repeated message must not create a second writer or a false success.","dependencies":["project-session-evidence-into-conversation"],"references":["https://github.com/pmark/arcadia/issues/1894","apps/dashboard/lib/go-continue.ts","apps/dashboard/app/api/projects/[id]/go-continue/route.ts","apps/dashboard/components/workspace/workspace-continue.tsx"],"acceptance":["Requirement REQ-007; Issue AC5. Behavioral integration tests submit duplicate and concurrent messages, repeated confirmation and reload/reconnect for one bound launch request and prove at most one claim, candidate and Session through the existing protected identity. Unsupported or unverifiable reuse refuses instead of creating a new identity.","A timeout or lost launch response renders outcome unknown, preserves the original identity and reconciles existing durable evidence before offering another start. Fixtures cover a launch that succeeded before its response was lost, an in-progress request, an actual refusal and unavailable reconciliation; none turns uncertainty into a fresh launch.","Reconnect restores Project/message/request bindings and current canonical evidence, retains prior receipts, labels stale observations and rejects changed input under an existing identity. Two-tab and two-Project tests prove no cross-target confirmation or receipt leakage.","Focused recovery tests, TypeScript and Dashboard build pass; existing sandbox, ownership, approval, attempt and budget fences remain unchanged."]},{"id":"prove-one-action-conversation-delivery","desired_result":"Prove one real conversation-to-PR delivery and document the operator flow. Recommended role: implementer, standard tier; size S; live proof waits for separately valid adoption and one-Action operator confirmation.","why":"The milestone requires an observable delivery through the new conversation, not source tests or an installed page.","dependencies":["reconcile-conversation-retries-and-reconnects"],"references":["https://github.com/pmark/arcadia/issues/1894","START_HERE.md","docs/managed-documents.md","docs/working-copy-safety.md"],"acceptance":["Requirement REQ-008; Issue AC7. After current-head source review/checks and separately receipted adoption, one authorized operator-assisted conversation flow resolves an eligible isolated trivial Action, presents the protected preview, obtains the existing confirmation and reaches an actual Session, validated change and accessible draft PR. Source fixtures, manual delivery substitutes and blocked attempts do not satisfy live acceptance. Evidence may reference the delivery PR without claiming that this evidence Action's future PR already exists.","Requirement REQ-009; Issue AC8. A retained delivery Artifact names source revision and required-check results, installed revision/adoption receipt, and the actual conversation request, Session, validation, commit and draft PR receipts separately; it records every operator intervention and independent review/check status. Unknown or failed stages remain visible, and real-delivery completion requires the declared actual delivery evidence.","Requirement REQ-010; Issue AC9-10. START_HERE.md documents What is next, Go, confirmation consequences, Status, Session/result links and unknown-outcome recovery. An executable operator QA checklist covers success, changed preview, refusal and reconnect, and records desktop/mobile plus keyboard/screen-reader results with numbered text choices and consequences.","The final evidence maps Issue1894 AC1-AC10 to this Plan's owning requirements and actual proofs, confirms no automatic next Action, scope amendment, authority change or Production activation, and lists remaining external gates honestly. External messaging, direct text approvals, multi-Action continuation and new stop controls remain deferred until their separately approved triggers; existing work and permissions remain preserved."]}]}
