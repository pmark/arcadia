{"agent_ask":"v1","request_id":"plan-ask-intent-dispatch-20261008","project":"arcadia","intent":"plan","requested_authority":"propose","target_ref":"plan/operator-to-do-list-with-ask-only-input","desired_result":"Add six Actions so operator Asks never vanish, state what Arcadia heard, take a one-reply correction that sticks, use a local model tie-breaker, route do-for-me tasks to the operator, and prove the routing improves. Make the existing proof Action depend on the first two.","rationale":"Operator direction, 2026-10-08, captured as proposal agentask_6598957375a7e1f3f5. The operator's Asks landed in the Back Burner, which arcadia todo does not read. The operator chose: one todo list with two sections, seven Ask types, corrections become tests, and existing Back Burner items left in place. The operator then asked for an adversarial review, Fable's 80/20 analysis, and a pragmatic plan.\nThe adversarial review found the failure is one fallback branch, not the taxonomy. It also found:\n- Answer and Status must stay deterministic so model output never answers a Decision.\n- The fix belongs inside this Plan, before prove-operator-request-to-started-work.\nFable's 80/20 analysis ordered these six slices. Its one metric is the vanish rate, with a target of zero.\nHow the seven Ask types map onto the slices:\n- Build/Fix and Do-for-me share one intake class, and clarify's actor splits them.\n- Answer and Status are deterministic only.\n- Plan and Schedule are flags on Work.\n- Remember is explicit only.\nDeferred, with revival triggers:\n- Schedule materializer: 3 Work rows with recurrence detected, counted by the report.\n- Automatic planning interview: the trigger in planning-process.md.\n- Fuzzy memo matching: 20 or more memos and 5 or more near-duplicate misses.\n- The full 'Agents are doing' todo section: after prove-operator-request-to-started-work passes; until then a count line.\n- A dashboard page: when the operator asks for one.","actions":[{"id":"stop-asks-vanishing","desired_result":"Make every operator Ask that is not explicitly an idea visible in arcadia todo, so no Ask vanishes into the Back Burner.","acceptance":["An operator Ask that matches no execution pattern routes to Clarify First (a review_item that arcadia todo lists, with an ask-origin answer command), not to the Back Burner. The Back Burner still receives an Ask only when the intake classification is Idea or the operator passes --back-burner. A Review Response with no resolvable reference also routes to Clarify First instead of the Back Burner. Agent-sourced Asks (agent.ask envelopes) keep today's routing.","The intake imperative and feedback patterns (src/intake/index.ts) recognise 'I should be able to', 'I want (to be able) to', 'let me' and 'it would be good if', so the operator's example 'I should be able to Ask Arcadia to schedule a recurring action' is captured as work, not as an incubating thought.","arcadia todo shows one counts line 'Back Burner: N incubating (M new in 7 days)' with the command that lists them. Ask-originated questions appear in an uncapped 'Your Asks need one answer (N)' group, newest first, and the morning packet counts them. Existing Back Burner items are not moved or changed.","Tests cover the routing change for each classification, the review-reply fallback, the new phrasings, an agent-sourced Ask keeping its route, and the todo lines. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":[],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/backBurner/surfacing.ts","src/orientation/operatorTodoLines.ts"]},{"id":"ask-receipt-and-one-reply-correction","desired_result":"Make every Ask reply state what Arcadia heard and where it put it, and let the operator correct it with one reply.","acceptance":["Every arcadia ask result (CLI and the Discord bot's reply) opens with one line of the form 'Heard: <type> (<confidence>, <rule|memo|model>) -> <what was created and where> . wrong? reply type: work|task|idea|answer|status' before any detail. The stewardship detail stays available with --verbose or --json.","arcadia ask correct <ask_id> --type <work|task|idea|answer|status> [--project <slug>] re-routes the Ask only through the existing governed writers (create work_item, create review_item, promote or archive a Back Burner item, create an operator task), links the new record to the old one as superseded, and never deletes the original capture or record. In Discord, a reply to an Ask receipt that starts with 'type:' or 'project:' calls the same command. A correction to 'answer' requires an explicit reference to a pending item and is otherwise refused, so a correction never approves a Decision on inference.","ask-trail (arcadia ask show) displays the supersession. Tests cover each correction target, the refusal for an answer correction with no reference, and the Discord reply path. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["stop-asks-vanishing"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","apps/discord-bot/src/events/messageCreate.ts","src/commands/askTrail.ts"]},{"id":"ask-corrections-stick","desired_result":"Make a corrected Ask route correctly the next time it is sent, instantly and with no model call.","acceptance":["An additive migration creates ask_corrections (ask_request_id, normalized_text, text_hash, predicted_type, corrected_type, corrected_project, source, created_at), with no cascade delete, and adds nullable confidence and corrected_type columns to ask_requests. Each correction row is written in the same transaction as the re-route, so a correction cannot exist without its memo.","A memo stage runs before the intake patterns. An operator Ask whose normalized text exactly matches a stored correction routes to the corrected type and Project, and its receipt says '(memo <date>)'. There is no fuzzy matching. An answer to an ask-origin clarification question also writes a correction row. Raw Ask text stays in the workspace database and is never written to the repository.","Tests cover the transactional write, a memo hit on the identical Ask, a miss on different text, and the no-cascade guarantee. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-receipt-and-one-reply-correction"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/db/schema.ts"]},{"id":"ask-local-model-tiebreaker","desired_result":"Give an unmatched operator Ask a typed interpretation from the local model within seconds, falling back to one question.","acceptance":["The IntakeClassifier seam (src/intake/index.ts) becomes injectable. A model-assisted classifier calls the local-preferred Intelligence route (operation arcadia.ask.classify, allowPaidUsage false) with an 8 second budget, only for operator Asks that the deterministic rules and the memo did not resolve. Its output schema is an enum of work, task, idea or unknown, plus actor, recurrence and one question. It can never output answer or status, and its extracted fields never set a Project, a Decision or authority.","When the model is unavailable, slow or unsure, the Ask becomes the one Clarify First question from stop-asks-vanishing, never an error and never the Back Burner. The classifier is behind a config flag that is off by default until prove-operator-request-to-started-work passes. Ask text is marked untrusted wherever it reaches a coding agent through a handoff Ask.","Tests use a stubbed model to cover a pass, a timeout, an unavailable route, a forbidden output type and a malformed output. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-corrections-stick"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/clarify/engine.ts","src/intelligence/types.ts"]},{"id":"ask-do-for-me-operator-tasks","desired_result":"Make an Ask for something only the operator can do land in the Yours part of arcadia todo as an operator task.","acceptance":["The operator-task ledger (src/docs/operatorTasks.ts) accepts a third origin kind ask:<ask_id>. An operator Ask classified as task, or as work whose clarified actor is operator (RESPONSIBILITY_FOR_ACTOR), becomes a waiting operator task in the target Project's ledger. An Ask with no resolvable Project becomes the one Clarify First question asking which Project, instead of being dropped.","arcadia todo lists the task as operator_task with origin ask:<ask_id>, and closing it uses the existing operator-task close path. Tests cover the new origin kind, the actor routing and the no-Project question. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["stop-asks-vanishing"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/docs/operatorTasks.ts","src/clarify/contract.ts"]},{"id":"ask-golden-set-and-vanish-report","desired_result":"Prove Ask routing keeps improving: a checked-in golden set guards it and a weekly report shows the vanish rate.","acceptance":["tests/fixtures/ask-golden.jsonl holds operator-approved paraphrased cases, never raw Ask text, each with an expected type. A test replays every case through the pure intake, memo and stewardship functions, and fails CI on any regression.","arcadia ask report --since <window> [--json] prints, per operator source:\n- vanish rate: operator Asks neither visible in todo, nor acted or answered, nor filed as Idea by the operator; target zero;\n- corrected ÷ classified;\n- questions ÷ Asks;\n- Back Burner arrivals;\n- memo hits;\n- the count of Work items with recurrence detected, which is the Schedule revival trigger;\n- corrections not yet backed by a golden case.","When at least 3 memos share a corrected type and a token pattern, the report says so. An agent may then propose a deterministic rule plus a golden case in a reviewed PR; no rule is generated automatically. Type, lint and build pass. A pushed PR with exact-head independent review and all required checks is the delivered Artifact."],"dependencies":["ask-corrections-stick"],"references":["CONSTITUTION.md","docs/arcadia-ask-product-vision.md","docs/planning-process.md","src/commands/ask.ts","src/intake/index.ts","src/stewardship/index.ts","src/commands/todo.ts","src/commands/askCoverage.ts"]},{"target_ref":"action/prove-operator-request-to-started-work","desired_result":"Prove a real operator request travels through Ask to graded work that a fresh session starts, with the operator touching only Ask, the to-do list and arcadia go.","acceptance":["The operator sends one genuine request for real work, phrased as work to create, through an existing Ask or Ingress surface (Discord message, dashboard Ask or iCloud Ingress); an agent never writes or posts it. The receipt binds the capture envelope, ask request and resulting work_item. A request that lands only in Back Burner or a review_item without a work_item is reported as a failed attempt, not a pass.","The work_item is graded by the delivered generator and grader, triggered by the arcadia clarify --work <id> --apply command that arcadia todo lists for the new work_item: either a passing next action with actor and done-condition, or exactly one question shown in arcadia todo that the operator answers through its listed CLI command or Discord reply, after which automatic re-grading passes. A passing coding-agent verdict yields the handoff Agent Ask, which appears in arcadia todo.","The operator settles that Agent Ask from arcadia todo, placing the new Action in the active Plan's queue, then starts a new session with only arcadia go; that session works the resulting Plan Action by id without relay and produces a commit or PR naming both the Action id and the work_item id. A gate receipt, launched process or approval request alone never satisfies this. The working session's commits carry the Session protocol trailers, and the evidence index cites the commit paragraph with Arcadia-Agent and Arcadia-Action.","An evidence index records one verdict and receipt per criterion pinned to the envelope, work_item, Agent Ask, Action id, candidate revisions and PR heads, the arcadia todo and arcadia plans --plan outputs before and after, and the coverage report for the window; missing or stale proof blocks a success claim, and no production acceptance threshold or unfinished Action status of other Plans changed. If any supervised session in the proof stops without completion, the evidence index includes its inactivity ping (id, link and message); the proof does not pass without it."],"dependencies":["grade-next-actions-before-actionable","capture-operator-decision-replies-as-asks","point-operator-surfaces-at-todo","render-plan-progress-as-todo","stop-asks-vanishing","ask-receipt-and-one-reply-correction"],"references":["CONSTITUTION.md","docs/managed-documents.md","docs/planning-process.md","docs/agent-guidance/index.json","docs/plans/bootstrap-managed-production-to-build-flight-deck.md","https://www.anthropic.com/engineering/harness-design-long-running-apps","src/commands/ask.ts","src/commands/go.ts","apps/discord-bot/src/events/messageCreate.ts"]}]}
