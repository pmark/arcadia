"acceptance":["Only after Decision 0082 is approved (it is), guard-experiment-workspaces is merged and installed and the identity blocks are installed: each of Claude Code, Codex and OpenCode creates its own experiment workspace with `arcadia init --profile experiment` at /Users/pmark/Dev/MR/Arcadia/workspaces/exp-<agent>-<yyyymmdd>, addressed only inline (ARCADIA_WORKSPACE=... on the command, never exported), with a fresh disposable no-remote fixture repository inside <workspace>/projects/<fixture> registered as a Project with a Plan of exactly one Action; the three workspace paths differ and each agent's `arcadia workspace resolve` and status name its own.","Each agent independently advances its one Action (pointer moves) and settles it to done in its own workspace with a settlement receipt and a Log entry in that workspace; the three settle steps overlap in wall-clock time with timing and receipts attached and produce no SQLITE_BUSY, lost update or pointer collision; no command run in one workspace reads another's database, and no experiment workspace shares Git refs or worktrees with the live workspace or another experiment workspace.","The leak check (live project count, queue revision, user config and Codex/Claude configuration hashes, launchd plists, `git -C <live> status` clean, no new refs or branches in the live repository; activity-event rows written by read-only commands against the live workspace are excluded and counted separately) is recorded before and after every session and is identical; inner-workspace work (Asks, queue, pointer, settle, docs sync, local git, tests, gh reads) succeeds, and every named refusal (production activation and Grants, broker, services and ingress install, GitHub and Discord posting, default-workspace switch) is attempted once from an experiment workspace and refuses with its named reason, the exact messages recorded.","A report in issue #940 and a checked-in evidence file catalogs the per-agent receipts, leak-check output and refusal messages, compares settle, preview and make-next error rates and contention error codes against the live workspace's seven-day baseline (settle 16.7%, preview 30%, make-next 12.7% errors), names which Arcadia flows still require the live workspace and what would have to change for agents to do real work in more than one workspace as proposed Actions, retains the experiment workspaces until the operator says to delete them with the exact rollback command, and ends with one line: extend, narrow or abandon; any live-workspace mutation, bypassed guard refusal or cross-workspace read stops the trial, preserves evidence and is reported with no retry by silence."],
