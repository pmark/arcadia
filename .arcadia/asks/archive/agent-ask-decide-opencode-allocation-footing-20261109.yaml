{"label":"A. Helpers use it freely; production's order stays","consequence":"Corrects 0118's premise. A coordinator can start an OpenCode helper or reviewer the way it starts a Codex or Claude one, with no separate approval, so low-cost mechanical work can move there straight away. Production keeps OpenCode last and 0118's admission rule, so the critical path doesn't change. A helper can run out of allowance without warning, and the coordinator then falls back to another provider. Revisit production's order once Arcadia can read the remaining allowance.","recommended":true},
{"label":"B. Same footing everywhere, including production","consequence":"Does everything in A, and also moves OpenCode up production's provider order and retires 0118's daily ceiling, which could save Codex and Claude allocation. A production run could hit the weekly limit with no warning and stop. It needs a reviewed config change and a replay before the next run, so it spends critical-path time and adds a failure mode."},
{"label":"C. Correct the record only","consequence":"Corrects 0118's premise in the record and changes no behavior. Each OpenCode helper still needs its own approval, so a request like last night's can stall again, and production stays as it is. It's the smallest change."}
