"rationale":"Operator, 2026-11-09: \"OpenCode's usage works exactly like my Codex and Claude Code plans, where I am allocated tokens on a weekly basis.\" Decision 0118 admitted OpenCode to unattended production under a daily token ceiling because it \"runs on API-key billing with no rolling window\", and docs/model-selection.md ranks it last, for the case where Codex and Claude credits run out. On that same premise, a triage held the operator's requested OpenCode helper for a night (Issue 2342). What stays true under every option: Arcadia has no probe for remaining OpenCode allowance (src/codingAgents/providerUsage.ts:57), so it can't warn before the weekly allocation runs out. This Decision also answers the pending proposal correct-decision-0118-opencode-plan-premise-20261109. It raises the question only; it changes no config, Plan or queue.",
