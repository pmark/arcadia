"rationale":"A live smoke of the real codex reviewer on the captured PR #1 patch after #934 (scratch workspace, only gh stubbed; receipts in the smoke scratchpad na-smoke/) showed the model answers not-applicable for all five non-correctness criteria, and the deterministic classifier correctly classes every touched file inert-document or governed-record, but three claims (state and concurrency, security and authority, tests) were refused with 'the evidence names no file the patch touches' because the model wrote generic text ('all touched files', 'the marker', 'governed records'), so the verdict was needs-follow-up and unattended integration still would not happen. Docs-only patches under docs/reports/ passed; under docs/ they were correctly refused; a one-line prompt fix (each claim's own evidence names every touched file by exact path) produced PASS once. The classifier already proves the patch inert by itself, so per-claim naming adds little protection and is brittle. No authority is added.",
