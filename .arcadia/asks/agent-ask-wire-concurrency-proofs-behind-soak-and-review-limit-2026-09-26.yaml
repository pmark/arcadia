{"agent_ask":"v1","request_id":"wire-concurrency-proofs-behind-soak-and-review-limit-2026-09-26","project":"arcadia","intent":"plan","target_ref":"plan/bootstrap-managed-production-to-build-flight-deck","desired_result":"Hold the live concurrency proof behind the fixture soak, and pipelining behind the per-repository review limit it relies on.","rationale":"prove-concurrent-ready-set-admission is the first live concurrent run; soak-ready-set-admission-with-fixture-provider proves every limit and invariant at zero token cost first. pipeline-independent-actions-while-pr-unmerged relies on an operator-configured review limit that only limit-unmerged-candidates-per-repository builds. Dependencies only; acceptance criteria unchanged.","actions":[{"target_ref":"action/prove-concurrent-ready-set-admission","desired_result":"Prove that two independent Actions in two different repositories launch and complete correctly from the same production tick under ready-set admission, with no settlement or pointer-projection race, before real concurrent admission is ever allowed.","acceptance":["Provide or reuse two disposable or explicitly approved real Projects/repositories, each with at least one ready Action that does not depend on the other, and a reachable existing production control (CLI or dashboard), before requesting live execution.","Under bounded rehearsal authority, with a policy scope activated at maxConcurrentSessions 2 or more through the expiring rehearsal exception defined by enforce-concurrency-gate-at-admission (the only path that lifts the concurrency cap before both proofs are done), one production tick admits and launches Sessions for both independent Actions in their separate repositories with no per-launch operator confirmation in between.","Both Sessions run to completion holding disjoint resources throughout: each Action's claim, worktree, and repository lease belong only to that Session, and neither Session's admission, launch, or settlement observably blocks or interferes with the other.","Both completions settle correctly in either order: each repository's current_action projection reflects that repository's correct highest-priority ready or claimed Action after each settlement, and the workspace-database state the two Sessions share (production admissions, the host-slot count, Action claims) shows no lost, duplicated or misattributed row; record which order happened live and cover the other order with a deterministic test against the new projection writer, not the removed selectNextAfterCompletion path.","Turn the standing policy Off while both Sessions are in flight; prove no new launch occurs, both in-flight Sessions reconcile visibly, and no duplicate or reactivated Session appears after Off.","Record exact revisions, hosts, providers, Action/Session identities, and receipts for both repositories; missing real authorization or input remains one precise review, never fixture-as-live success, and any deferred gap (same-repository pipelining, provider-account slots, review headroom) is named rather than implied proven.","This proof activates only once prove-two-action-unattended-production is status: done and admit-ready-set-across-repositories has shipped; preserve deterministic integration evidence and an exact operator procedure/target in the PR."],"dependencies":["admit-ready-set-across-repositories","prove-two-action-unattended-production","soak-ready-set-admission-with-fixture-provider"],"references":["docs/proposals/portfolio-parallel-execution.md","docs/decisions/0071-decide-whether-to-reopen-decision-0023-and-adopt-ready-set-admission-for.md","docs/decisions/0066-record-when-arcadia-should-widen-beyond-one-coding-agent-session-per-repository.md","docs/decisions/0051-decide-whether-sequential-coding-agent-sessions-for-the-same-governed-action-may.md","docs/operator-demo-and-release-contract.md","src/production/tick.ts","src/ask/settlement.ts","src/production/policy.ts","docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md"]},{"target_ref":"action/pipeline-independent-actions-while-pr-unmerged","desired_result":"Let an independent, non-overlapping Action start in a repository whose previous candidate PR is still unmerged, up to a per-repository review limit, using declared touches: scope to prevent overlap.","acceptance":["Plan Actions may declare touches: <paths>; an Action whose touches: is absent, empty, or not a list of paths (including a single scalar string) is treated as touching the whole repository and never pipelines.","Admission may start a new Action in a repository with an unmerged candidate only when the ready Action's declared touches: do not overlap the unmerged candidate's actual changed paths, and the repository's unmerged-candidate count is below the operator's configured review limit; otherwise it records scope_overlap or review_backlog as the wait reason.","Overlap is rechecked against both candidates' actual changed paths whenever either is pushed or preserved; a new candidate whose actual diff leaves its declared touches:, or an overlap that appears after admission, stops pipelining for that repository and is reported as scope_overlap.","Pipelining is available only once admit-ready-set-across-repositories, settle-squash-merged-completion-drafts and sweep-merged-completions-before-dispatch are all built, since the host settler must already be the sole current_action writer and merged completions must settle serially on main before a second unmerged candidate in one repository is safe.","Deterministic tests cover: a non-overlapping Action pipelining while the prior PR is unmerged, an overlapping Action refused with scope_overlap, a repository at its review limit refused with review_backlog, an empty or scalar touches: never pipelining, and an overlap introduced by a later push to the prior candidate being caught; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":["admit-ready-set-across-repositories","settle-squash-merged-completion-drafts","sweep-merged-completions-before-dispatch","limit-unmerged-candidates-per-repository"],"references":["src/production/tick.ts","src/ask/settlement.ts","docs/proposals/portfolio-parallel-execution.md","docs/decisions/0071-decide-whether-to-reopen-decision-0023-and-adopt-ready-set-admission-for.md","docs/decisions/0070-decide-whether-an-action-s-completion-settles-after-its-pr-merges-applied.md","docs/decisions/0066-record-when-arcadia-should-widen-beyond-one-coding-agent-session-per-repository.md","docs/reviews/2026-09-25-ready-set-admission-adversarial-review.md"]}]}
