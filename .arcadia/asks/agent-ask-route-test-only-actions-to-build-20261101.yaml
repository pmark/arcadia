{"agent_ask":"v1","request_id":"route-test-only-actions-to-build-20261101","project":"arcadia","intent":"plan","target_ref":"plan/arcadia-runs-production-unattended-on-its-own-repository-on-the-claude-provider","desired_result":"Declare the build route on three test-only Actions so the worker stops sending them to a Decision-gated planning run.","rationale":"The worker guesses a route from keywords when an Action declares none. These three test-only Actions lack implement, code or prototype, so each went to a planning run that needs a separate operator approval per step (R494). Only the route changes: next_action and acceptance are restated verbatim, and dependencies and references are omitted so they stay as checked in.","actions":[{"target_ref":"action/bound-guidance-test-teardown-retries","desired_result":"Make the agent-guidance test's scratch-directory teardown retry a transient ENOTEMPTY, with a test that fails if the retries are removed, closing Issue #1419.","execution":"build","acceptance":["tests/agent-guidance.test.ts defines removeScratchRoots(roots: string[], remove = rmSync), which calls remove(root, { recursive: true, force: true, maxRetries: 3, retryDelay: 50 }) (or larger maxRetries and retryDelay values) for each root and then empties the array; the afterEach body is exactly one call to removeScratchRoots(roots) and contains no rmSync literal.","A new test calls removeScratchRoots with a vi.fn() as remove and two paths and asserts each call's options object has recursive true, force true, maxRetries of at least 3 and retryDelay of at least 50; it also asserts the default is the real rmSync by removing a real mkdtemp directory with no remove argument.","Every existing assertion in that file remains unchanged and no test in it is marked skip or todo.","The change touches only tests/agent-guidance.test.ts; the focused vitest run of that file, pnpm lint and tsc pass."]},{"target_ref":"action/assert-tmux-temp-launcher-removed","desired_result":"Make the no-launcherDirectory tmux long-command test prove its temporary launcher directory is removed, closing Issue #1536.","execution":"build","acceptance":["In tests/system-tmux-long-command.test.ts, the test named 'delivers the brief byte-identical with no launcherDirectory (temporary directory removed)' points TMPDIR at a directory the test owns for the launch, and after the provider has written its argv asserts that no entry starting with arcadia-launch- remains in that directory.","TMPDIR is set before systemTmux.launch is called and restored in a finally block (deleted if it was originally unset); the PR body reports that temporarily removing the launcher's rm -rf cleanup in writeSessionLauncher makes this test fail, and that it passes again once reverted, while the final diff touches only the test file.","The same test still asserts argv equals ['--print', LONG_BRIEF], and every other test in the file passes unchanged.","The change touches only tests/system-tmux-long-command.test.ts; the focused vitest run of that file, pnpm lint and tsc pass."]},{"target_ref":"action/cover-retired-descriptor-byte-change","desired_result":"Cover a pinned retired operator-script entry whose descriptor bytes changed while its script bytes did not, closing the first item of Issue #1262.","execution":"build","acceptance":["apps/dashboard/app/api/operator-script/retired-entries.test.ts gains a test in which the retirement pins the sha256 of the original descriptor and the original script, only the written descriptor bytes differ (for example a trailing newline) while the script bytes equal the pinned bytes, the changed descriptor stays invalid, and GET returns no scripts with console.error called exactly once.","Every other test in that file passes unchanged.","The change touches only apps/dashboard/app/api/operator-script/retired-entries.test.ts; the focused vitest run of that file, pnpm lint and tsc pass."]}],"requested_authority":"propose"}
