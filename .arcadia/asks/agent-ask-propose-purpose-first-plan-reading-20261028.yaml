"rationale":"Operator request 2026-10-28 (Issue 1843): Plans are too dense and too many to read; 455 of 538 Actions record no why. The design in docs/design/purpose-first-plans.md (PR 1842) keeps summaries as derived reading aids in docs/generated/plan-summaries/, never authoritative and never read as intent (Decision 0004). This is a separate inactive draft Plan, not an amendment to the active Go Plan, so settling it moves no pointer, queue or active Plan file. The operator directed the work to run alongside the Go Plan as operator-directed work, touching only dashboard reading surfaces, a check script and the generated summaries. It fulfils the trigger of the deferred portfolio-docs-protocol Action narrative-summarization ('a summary someone actually wants'). Drafting uses a lightweight hosted model by operator direction (light-tier Claude, a light OpenAI model through Codex, or OpenCode), with Clara reviewing anything active, upcoming or proposed.",
