 "why":"So the operator reads one sentence on why each Plan and Action exists instead of its raw record.",
 "acceptance":["The workspace Plan and Action views read docs/generated/plan-summaries/<slug>.json through the existing read path and show the plain title, why and done-when; acceptance criteria and the record stay available behind disclosure.","A summary whose fingerprint no longer matches is labelled as written before the record changed; a missing or invalid summary falls back to the record's own title without error; end-to-end coverage proves fresh, stale and missing cases and that no summary is ever presented as authoritative."],
