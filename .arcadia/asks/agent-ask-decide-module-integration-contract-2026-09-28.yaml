{"agent_ask":"v1","request_id":"decide-module-integration-contract-2026-09-28","project":"arcadia","intent":"decision","gate_question":"reasonable_disagreement","requested_authority":"propose","desired_result":"Should every Arcadia website module follow the module integration contract in docs/proposals/module-integration-contract.md (neutral library, CLI printing versioned schema-defined JSON, Capability Contract v1 module that alone holds governance, MCP facade generated from the same JSON on a trigger), with Uplink and Downlink as the first worked example?","rationale":"This sets the precedent for every future website module (Downlink, imagery, deploy, analytics, forms). A reasonable person could weigh MCP timing, or whether to fix a shape before a second module exists, differently. The proposal authorizes no build: Decision 0073's extraction trigger still gates all Arcadia work.","references":["docs/proposals/module-integration-contract.md","docs/proposals/site-copy-and-seo-capability-modules.md","docs/decisions/0073-adopt-seo-audit-and-copywriting-capability-modules.md"],"options":[{"label":"Adopt the four-layer contract, with MCP on its trigger","consequence":"Engine extraction draws its boundaries to this shape and every later website module starts from it; governance lives only in layer 3; MCP is built read-only plus drafting once Uplink's copy-audit mode ships AND a coding-agent session needs it mid-build, and never exposes approval-gated operations.","recommended":true},{"label":"Adopt layers 1-3 only, with no MCP policy","consequence":"Less to agree on today; coding agents shell to the CLI indefinitely, nothing binds a future facade's authority, and schemas are not held to generatable. Revisit when a coding-agent session needs a module mid-build."},{"label":"No general contract; decide per module","consequence":"Uplink and Downlink follow #744 as written and each later module picks its own shape, so the first module's accidents become the de facto rule and the public-repository dependency question is answered per module. Revisit when a second module proposal is filed."}]}
