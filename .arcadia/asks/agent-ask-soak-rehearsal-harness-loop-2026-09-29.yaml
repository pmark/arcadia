{"agent_ask":"v1","request_id":"soak-rehearsal-harness-loop-2026-09-29","project":"arcadia","intent":"action","requested_authority":"propose","desired_result":"Run a bounded, token-cheap hermetic soak loop over the rehearsal harness that files, triages and fixes production defects without any live production grant.","rationale":"PR 728 made the two-Action rehearsal replayable hermetically against the real production tick. Looping it with fixed stop conditions finds the next class of defects at zero live authority, before any live rehearsal.","actions":[{"id":"soak-rehearsal-harness-until-clean","desired_result":"Run the hermetic rehearsal harness in a bounded soak loop that files each defect as an Issue, fixes only loop-blocking ones, and stops on fixed conditions.","acceptance":["A single documented command runs tests/rehearsal-two-action.test.ts repeatedly against a freshly prepared fixture each iteration, and refuses to start when the fixture shows leftover repair budget, stale handoffs, live claims or a reused request_id.","The loop stops on any of: N consecutive clean iterations (default 5), a configured iteration or token budget, or the same failure recurring after three fix attempts; each stop reason is printed and recorded.","Every failing iteration files or updates one bug Issue in the owning repository with evidence and file:line, and only a failure that blocks the loop becomes a fix; non-blocking failures stay Issues.","The loop never merges a change to the concurrency gate, admission policy or approval boundaries; such a fix is left as an open pull request for the operator.","Deterministic tests cover the clean-fixture refusal, each stop condition, and the gate-file merge refusal; pnpm test and the core, Discord and Dashboard builds pass."],"dependencies":["harden-dispatch-and-claim-lifecycle"]}]}
