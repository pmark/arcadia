  "rationale": "Triage of the open bug backlog on 2026-09-23 found these ungoverned defects that block or corrupt governed work: #512 (settle never commits when .arcadia/asks is gitignored), #505 (decisionDeferral lost update), #526 (arcadia go's fallback hands a claimed Action to a second session), #511 (a candidate is prepared from a stale checkout for an Action already completed on the base), #326 (preservation runs candidate-controlled checks), #460 (zero-prompt fixture has no build packet) and #494 (status: blocked reported dispatchable). #511 is governed separately from #526 because the fallback-claim guard does not cover a stale-checkout pointer Action. Each is filed rather than repaired here so it is scoped and reviewed deliberately. #266, #319, #308 and #465 were closed as already fixed; #320, #321, #455, #459, #452 and #514 were verified still open and are not promoted in this bundle.",
