        "Paid inference is refused without an explicit Decision covering the scoped budget; missing prices are shown as unavailable, and no review request can approve a Decision, activate a Plan, or widen authority.",
        "Deterministic tests cover valid and invalid scope, cap, Project ownership, stale preview, and unauthorized spend; the contract reuses Ask capture and preview rather than adding a separate operator entry point."
