        "The output contains the frozen brief and manifest, reviewer reports for passes actually run, synthesis, and receipt; every consequential finding distinguishes observed fact, inference, proposal, or unknown and records status, exact evidence, mechanism, guard, replay path, confidence, and missing proof.",
