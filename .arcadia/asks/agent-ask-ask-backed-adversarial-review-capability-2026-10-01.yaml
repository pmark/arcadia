        "Reviewer prompts test purpose, problem evidence, plausible remedies, blocking guards, replay and recovery, and untested claims; agreement is allowed and findings are capped at five.",
        "Provider selection uses the least costly available compliant model and reasoning level; hard limits cover tokens, money when priced, elapsed time, source and tool counts, reviewer passes, and permitted test count and runtime.",
        "Read-only enforcement and explicit test permission are checked before execution; cap exhaustion or unavailable compliant routing preserves completed work and returns a partial or refusal receipt with exact remaining work.",
        "Stubbed-provider tests cover each profile, cap boundary, failed read-only preflight, unavailable pricing, forbidden test, provider substitution refusal, and an allowed extra pass only for a named decision-critical missing fact."
