{"agent_ask": "v1", "request_id": "plan-action-economic-evidence-20261026-r3", "project": "arcadia", "intent": "plan", "requested_authority": "propose", "desired_result": "Create an inactive spend-insight Plan: the operator can see which roles, identity profiles, providers, tiers and models spend the most tokens, including delegated helpers, next to what that work produced. Milestone: a read-only spend report backed by captured provider usage receipts, with coverage stated, so model policy (light-tier session starts, delegating searches to cheaper helpers) is judged from evidence.", "rationale": "Operator request 2026-10-26: better insight into which agents spend the most tokens and how valuable that spend is, before changing model policy. Narrows r2 (plan-action-economic-evidence-20261011-r2, registered proposal agentask_d89203864aaa466a4e, never settled) to that question and supersedes it; settle at most one of r2 and r3. Keeps r2's receipt and both provider collectors with their acceptance. Adds automatic filling of the session ledger, where tokens_out is null in all 31 legacy rows and subagent totals appear in only 8. Replaces per-Action dollar rating and billing reconciliation with a spend-by-role/model/outcome report. Deferred, each with a revival trigger: dollar rating and pricing tables (operator asks for dollar figures, or token counts prove insufficient to compare); billing reconciliation against provider exports (dollar rating exists and the operator approves sanitized export access); subscription cost allocation (operator chooses an allocation method); changing sessionStartTier or adding a standing cheap search helper (the spend report shows at least ten comparable completed Actions with receipt coverage). Distinct from project-token-burn-rate, which throttles against provider allowance windows; this plan explains spend after the fact. Token impact low: collectors, ledger fill and report are deterministic with zero model calls; one bounded build and independent review per activated Action. Grants no spending, credential, telemetry or authority change.", "references": ["docs/reports/action-cost-evidence-plan-2026-10-11.md", ".arcadia/asks/agent-ask-plan-action-economic-evidence-20261011-r2.yaml", "docs/reports/session-ledger.jsonl", "docs/model-selection.md", "docs/plans/governed-agent-roles-one-real-action-and-one-interactive-session-each-run-as-a.md", "docs/plans/provider-capacity-harvesting.md"], "actions": [{"id": "define-action-economic-receipt", "desired_result": "Define the smallest additive usage receipt and bind it to existing Action/Session/role-attempt lineage. Tokens first: monetary fields hold only a provider-reported estimate labelled as such; dollar rating is deferred. Role implementer, size S, standard tier/e2_standard; deterministic validation, one bounded build/review; no operator gate for local implementation.", "acceptance": ["A new focused tests/action-cost-receipts.test.ts validates versioned receipts with requested versus observed provider/model/effort, source/version/digest, timestamps, stable receipt/provider request IDs, Action reference and existing Session/attempt or explicit unallocated state; missing observations remain null with reason, never inferred from launch parameters.", "Fixtures reject negative/nonfinite counts, malformed IDs, changed-content replays and cyclic attribution; accept success, denied-before-launch, failed, interrupted, missing and late receipts; append-only corrections refer to superseded receipts without erasing failures.", "Explicit scope fields distinguish request delta, turn delta, session cumulative, resumed/forked baseline and parent totals that include descendants; unchanged replay counts once and unknown coverage prevents a complete-total claim. Existing IntelligenceUsage remains compatible; no new task model, queue or capacity snapshot contract.", "Each receipt can carry a per-model usage breakdown inside one Session (for example a parent model plus a delegated light-tier helper), with the parent total marked as including or excluding descendants, so delegated work is visible without being counted twice."], "dependencies": [], "references": ["docs/reports/action-cost-evidence-plan-2026-10-11.md", "src/sessions/index.ts", "src/sessions/reconciliation.ts", "src/sessions/roleLineage.ts", "src/reports/sessionLedger.ts"]}, {"id": "capture-claude-economic-evidence", "desired_result": "Capture Claude Code JSON usage from existing managed Session logs/reconciliation and Intelligence executor paths. Role implementer, size M, standard tier/e2_standard; bounded fixture-driven build/review; live private-log access needs existing scoped authorization, no new inference.", "acceptance": ["Focused tests exercise BOTH managed coding-Session stream-json logs produced by src/sessions/index.ts and collected at existing src/sessions/reconciliation.ts boundaries AND src/intelligence/claudeCode/textExecutor.ts. A real authorized sanitized provider result fixture retains source hash/version, session_id, modelUsage keys, cache categories and total_cost_usd as estimate; demonstrate association to real existing managed Session/role-attempt evidence when authorized, otherwise mark it unallocated and missing managed coverage rather than fabricate a match.", "Fixtures prove is_error can fail even exit zero, error results still preserve usage, crashes with zeroed final counts retain earlier evidence as partial, missing result never means zero, and replay/resume cumulative totals are not summed as independent deltas; Claude modelUsage already including delegates is never added to delegate receipts again.", "Bounded collector tests link available session/attempt IDs to receipts without replacing or wrapping the standard harness; preserve existing process stdout evidence by digest/reference and safe normalized fields, never prompt/transcript bodies or secrets in API/PR output. No enabling telemetry, paid mode, new credentials, delegates or services.", "Disposable end-to-end fixture builds existing Session/enrollment/development plus independent-review attempt lineage, ingests real sanitized provider payload under explicitly fixture-only associations and reports an Action rollup with replay-stable totals and coverage. Production associations require actual existing Session/log/provider-session evidence; shared clock/cost conceptual consultation remains unallocated shared overhead and never appears fully charged to both Actions.", "The per-model breakdown from Claude modelUsage is retained, so a Session that delegated to a smaller helper model (for example haiku) reports that model's tokens separately from the parent model's."], "dependencies": ["define-action-economic-receipt"], "references": ["docs/reports/action-cost-evidence-plan-2026-10-11.md", "src/sessions/index.ts", "src/sessions/reconciliation.ts", "src/sessions/roleLineage.ts", "src/reports/sessionLedger.ts"]}, {"id": "capture-codex-economic-evidence", "desired_result": "Capture Codex JSONL usage from existing managed Session logs/reconciliation and Intelligence executors, and preserve current LiteLLM details. Role implementer, size M, standard tier/e2_standard; fixture-driven build/review; no live account/API gate crossed.", "acceptance": ["Focused tests exercise BOTH managed coding-Session JSONL logs from src/sessions/index.ts with collector association through existing src/sessions/reconciliation.ts and Intelligence src/intelligence/codex/textExecutor.ts stdout. A real authorized sanitized Codex provider event fixture retains source hash/version, turn.completed usage and thread ID; preserve requested model/effort separately and missing observed fields explicitly, and failed/truncated stream partial coverage. If no real fixture is authorized/available, record an evidence blocker instead of declaring this criterion met from a synthetic event.", "Existing LiteLLM transport fixture tests retain provider-returned model, prompt/completion and available details without re-tokenizing usage; equivalent fields normalize with adapter/version provenance while unsupported cache/reasoning/tier stays null.", "Fixtures distinguish provider inclusive input/output totals from subset details: OpenAI cached input and reasoning output are not added again; provider-specific cache-write categories and optional pricing modifiers are preserved or cause unavailable rating. Existing executor outputs, timeout recovery and Intelligence compatibility tests continue to pass."], "dependencies": ["define-action-economic-receipt"], "references": ["docs/reports/action-cost-evidence-plan-2026-10-11.md", "src/sessions/index.ts", "src/sessions/reconciliation.ts", "src/sessions/roleLineage.ts", "src/reports/sessionLedger.ts"]}, {"id": "fill-session-ledger-usage-from-receipts", "desired_result": "Fill the session ledger's token fields from captured receipts instead of leaving them for the handing-off agent to type. Role implementer, size S, light tier/e1_brief; deterministic, zero model calls; one bounded build/review.", "acceptance": ["When a captured receipt matches a ledger row's Session, the ledger reports tokens_in_uncached, tokens_in_cached, tokens_out and subagent_tokens_total from the receipt with a named source and coverage; with no matching receipt the fields stay null and are never estimated.", "A value typed by hand is never silently overwritten: a conflicting receipt value is reported side by side with both sources.", "pnpm check:session-ledger and the existing ledger tests still pass, and a fixture shows a previously all-null row gaining receipt-backed token counts."], "dependencies": ["capture-claude-economic-evidence", "capture-codex-economic-evidence"], "references": ["src/reports/sessionLedger.ts", "src/reports/sessionLedgerSource.ts", "scripts/check-session-ledger.ts", "docs/reports/session-ledger.jsonl"]}, {"id": "report-spend-by-role-model-and-outcome", "desired_result": "Add a read-only spend report that groups token usage by role, identity profile, provider, requested tier, observed model and start tier versus plan tier, next to what that work produced. Role implementer, size M, standard tier/e2_standard; zero model calls at runtime; one bounded build/review.", "acceptance": ["A proposed read-only command (for example arcadia spend --by role|model|tier --since <date> --json; final name settled in review) lists, per group: Sessions, attempts, total tokens by category, delegated-helper tokens, and coverage (how many Sessions had receipts); it performs no workspace writes and no model calls.", "Each group shows the outcome evidence that already exists (completed, split or stopped Actions, merged PRs, review rounds, blocking findings caught, operator touches) and tokens per completed Action, so the most expensive and the least productive groups are visible together.", "Groups whose Sessions started on the light tier and those that started on the plan's tier are shown separately; when comparable completed Actions are fewer than ten the report says the comparison is not yet meaningful rather than ranking them.", "Fixture golden tests cover a Session with a delegated light-tier helper, a resumed Session, a failed attempt and a Session with no receipt; each token is counted once and missing coverage is shown, never treated as zero."], "dependencies": ["fill-session-ledger-usage-from-receipts"], "references": ["src/reports/sessionLedger.ts", "src/sessions/roleLineage.ts", "src/codingAgents/modelTiers.ts", "config/defaults/agent-roles.json", "docs/model-selection.md"]}]}
