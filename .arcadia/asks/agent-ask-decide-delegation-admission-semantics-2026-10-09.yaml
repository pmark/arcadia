{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-delegation-admission-semantics-2026-10-09","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide how a subagent request is admitted, queued or declined, and how strongly Arcadia enforces it.","rationale":"The operator wants delegation strictly controlled by Arcadia: agents request subagents, and requests may be declined or queued. Today Claude headless Sessions may spawn Agent freely, and Codex uses spawn_agent at its own discretion. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Deterministic broker plus a hook where the provider has one. Each request is admitted (with a model and effort), queued (with a reason and a bounded wait, then declined), or declined (with a reason code). For headless Claude, Arcadia's own settings file adds a PreToolUse rule that denies a spawn with no admitted receipt. Codex and opencode follow by convention","consequence":"Headless Claude gets real enforcement now, with no change to the harness itself, only to the Arcadia-written settings. Codex and opencode stay convention-only until they have a hook. Queueing adds latency, and nothing is lost because every request leaves a receipt.","recommended":true},{"label":"Deterministic broker, convention only: agents run arcadia delegation request and obey its verdict. No hook","consequence":"The cheapest, and it leaves the harness entirely untouched. An agent that ignores the brief can still spawn unrecorded subagents, and that shows up only afterwards."},{"label":"Arcadia launches every delegate itself as a separate Session; in-process subagents are retired","consequence":"The strongest control and full visibility. But each delegate pays Session launch and cold-context cost, and the in-process Calling in help path from PR #1145 goes away."}],"references":["src/sessions/headlessPermissions.ts","src/sessions/actionBrief.ts","docs/agent-guidance/standard-harness.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
