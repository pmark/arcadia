{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-operator-reserve-size-2026-10-09","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide the starting size of the operator emergency reserve, as a share of each provider capacity window.","rationale":"The operator asked for a configurable emergency amount that is always available. The size is separate from the mechanism: raising it is always allowed, while lowering it later needs the same operator-verified /runs step as releasing it. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"20% of each provider window","consequence":"A clearly usable emergency allowance is always there, and unattended work gets 80% of each window. It throttles earlier under sustained 24/7 load.","recommended":true},{"label":"10% of each provider window","consequence":"Unattended work gets 90%. The emergency allowance is smaller, and a burst can reach it faster than observations refresh."},{"label":"30% of each provider window","consequence":"The largest emergency margin. Unattended throughput drops to 70%, so 24/7 work throttles soonest."}],"references":["src/codingAgents/capacity.ts","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
