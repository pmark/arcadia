{"agent_ask":"v1","request_id":"installed-host-evidence-success-session-prompt-2026-10-02","project":"arcadia","intent":"proposal","requested_authority":"propose","desired_result":"Preserve the execution-oriented critical-path prompt for a session that may report only verified installed-host rehearsal success.","rationale":"This evidence-only prompt supersedes no governed record, creates no Action, and grants no authority.\\n\\n# Mission\nReach a verified installed-host autonomous managed-production rehearsal and do not report success early.\n\n# Success condition\nSuccess exists only when Arcadia has autonomously completed the exact disposable three-Action Plan below under one fresh, narrow Grant; every Action has an immutable candidate/input revision, deterministic acceptance evidence, a completion settlement and integration receipt; Action 2 began only after Action 1 integrated; Action 3 began only after Action 2 integrated; a controlled worker restart and an Off fence are evidenced; all candidates remain recoverable; and terminal state has zero live admissions and leases.\n\nThe rehearsal Plan is exactly:\n1. write-start-marker — create the declared marker and pass its check.\n2. transform-start-marker — consume Action 1's integrated result, create the transformed marker and pass its check.\n3. verify-final-rehearsal — consume Action 2's integrated result, write the final machine-readable receipt and pass its check.\n\n# Start safely\n1. Read AGENTS.md, CONSTITUTION.md, PROJECT.md, the active Plan, managed-production readiness, current martianrover policy, claims, admissions, immutable receipts and the pending enrollment/saved-configuration proposal.\n2. Invoke only the fixed host broker for Arcadia Go. Never run mutable Arcadia Git/worktree commands or recreate their behavior.\n3. If broker preflight finds the existing unlaunched current-proof worktree, inspect it read-only. Preserve the two untracked Agent Ask drafts through a narrow reviewed handoff; do not discard, merge, reset, or copy them into another checkout. The relevant browser-close Decision remains an operator judgment. The unrelated Mission Control proposal must remain outside this rehearsal.\n4. Re-run the host broker only after that candidate is resolved through its authorized preservation route.\n\n# The only implementation path\nA. Ensure the existing exact operator action accepting enroll-session-through-governed-host-request and persist-inactive-production-configuration has been settled. If not, surface that one existing /runs action and wait; do not duplicate the Ask or invent a replacement.\nB. Implement and validate those two accepted Actions first:\n   - Preserve revision-bound inactive configuration separately from active authority; explicit activation restores only the saved scoped policy.\n   - Enroll external/native sessions only through the protected host request path, recording identity, liveness, candidate, policy epoch, provider/model/effort, terminal result and restart evidence. Refuse unsupported supervision before launch.\nC. Implement durable serial orchestration for one Plan:\n   - Persist requirement identity/input revision separately from attempt ordinal/request ID.\n   - Replay/lost response returns the same receipt; only an explicitly authorized terminal-failure retry allocates one bounded next attempt atomically.\n   - One principal owns mutations. Helpers are separately identified, bounded and read-only.\n   - Planner draft receives independent adversarial review; development then gets exact-head independent review and QA. Deterministic checks precede reviewer calls. Head/criteria/evidence changes invalidate affected verdicts.\nD. Prepare the disposable three-Action rehearsal only after these capabilities pass focused tests.\nE. Request one fresh exact Grant scoped only to the rehearsal repository, Plan, three Action IDs, compliant provider, concurrency one, bounded integration and expiry. This is an operator gate; never reactivate an old policy or reuse a consumed Grant.\nF. Under that Grant, launch the installed supervised provider and continue automatically until the success condition is evidenced. Run no fixture-only proof, no second mutation principal, no unsupervised native adoption, no general announcement work, no generalized cleanup, and no unrelated planning.\n\n# Role economy\nUse one high-reasoning planner only for the exact rehearsal shape, one independently identified adversarial reviewer for that draft, the least-cost compliant configured development profile for implementation, then independent exact-head code review and QA. Do not call a model when deterministic state decides the outcome.\n\n# Failure behavior\nOff, null/expired authority, changed scope, stale receipt, changed candidate head, live lease, missing exact Grant, unsupported host observation, or a failed deterministic check must stop before launch, preserve all state, and surface one precise existing or newly prepared operator action. Never claim success from fixtures, a prepared worktree, a passing critique, or a launched process.\n\n# Final report\nSay exactly “Installed-host autonomous three-Action rehearsal succeeded” only with links/identities for all three completion/integration receipts, validation outputs, restart and Off evidence, terminal zero-admission/lease observation, and intervention ledger. Otherwise name the first unmet criterion and its exact preserved handoff."}
