{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"plan-governed-agent-roles-2026-10-09","intent":"plan","desired_result":"Governed agent roles: one real Action and one interactive session each run as a light-tier session-start role that requests delegates through Arcadia, gets a deterministic model and effort or a recorded queue or decline, reports through its supervisor chain, stays inside the burn budget and operator reserve, and appears on /agents.","rationale":"Outcome: every Arcadia Session runs as a small governed team that starts on the smallest sufficient model in one named role, delegates only through Arcadia-admitted roles at a deterministic model and effort, reports through a supervisor chain ending at the operator, and keeps token burn inside a budget that always preserves an operator emergency reserve, visible on /agents. The smallest usable slice ships first: the role registry and arcadia role brief work for interactive sessions before the broker, reserve, supervisors or /agents exist. Every selection, admission, queue, reserve and burn-rate step is deterministic and makes zero model calls; models are spent only by each Action's own Session and admitted delegates. True token_impact is large (13 bounded Sessions), but plan-intent settlement writes medium and a stock budget, so the Plan needs a governed amendment to record it. Each Action names its recommended role in its text, because Agent Ask action children have no role field yet (add-action-role-field adds it). The ten Decisions in docs/reviews/2026-10-09-governed-agent-roles-design.md must be answered before the Actions that name them dispatch. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Create as an inactive draft only; activation, pointers and queue order stay with the operator.","references":["docs/reviews/2026-10-09-governed-agent-roles-design.md"],"actions":[{"id":"define-governed-role-registry","desired_result":"Add a checked-in governed role registry and a read-only arcadia roles command that lists each role's charter, mutation right, delegation right, supervisor and default model tier and effort. Recommended role: implementer, standard tier. Waits on Decisions decide-session-start-role-name-2026-10-09, decide-agent-role-taxonomy-2026-10-09 and decide-which-roles-may-delegate-2026-10-09.","acceptance":["config/defaults/agent-roles.json (schema arcadia-agent-roles-v1) defines every role the answered taxonomy Decision names, each with id, purpose, attempt_role (a SESSION_ATTEMPT_ROLES value or null), identity_role (builder or critic), mutates, may_delegate, allowed_delegate_roles, max_delegation_depth, supervisor, default_tier and default_effort, and marks exactly one role as the session-start role under the answered name.","A loader under src/agentRoles/ validates the registry and refuses, naming the offending role and field, an unknown attempt_role, a mutating role whose attempt_role is not development, a critic-identity role that mutates, a delegate role missing from the registry, and a delegation depth above the answered delegator Decision's limit; a workspace config/agent-roles.json override merges the same way config/coding-agent-models.json does.","Tests prove every SESSION_ATTEMPT_ROLES value maps to at least one registry role, that the code-review and qa roles require independent lineage, and that the bundled registry loads byte-stably.","arcadia roles --json (schema arcadia-roles-v1) and arcadia roles show <id> print the registry with zero model calls and no workspace writes."],"dependencies":[],"references":["src/sessions/enrollment.ts","src/sessions/roleLineage.ts","src/codingAgents/agentIdentity.ts","src/codingAgents/modelTiers.ts"]},{"id":"render-role-brief","desired_result":"Add arcadia role brief so any interactive or launched Session can print the governed brief for its role today, and add that role block to the Action brief. Recommended role: implementer, standard tier.","acceptance":["arcadia role brief --role <id> --agent <codex|claude|opencode> --tier <light|standard|heavy> prints the role's charter, what it may and may not do, its supervisor, its delegation rights with the exact command to request a delegate, the Identity block from renderIdentityBlock, and the resolved start and escalation models; --json emits schema arcadia-role-brief-v1.","With --action <plan-slug>#<action-id> the brief also quotes that Action's next action and acceptance criteria verbatim, and refuses with a named error when the Action is missing or declares no criteria, as renderActionBrief does.","renderActionBrief adds a Role section for the session-start role with the same text, and the existing actionBrief tests pass with updated snapshots.","The command makes zero model calls and writes nothing; a snapshot test pins one brief per agent."],"dependencies":["define-governed-role-registry"],"references":["src/sessions/actionBrief.ts","src/qa/prReview.ts","src/codex/packets.ts"]},{"id":"add-action-role-field","desired_result":"Add an optional role field to Plan Actions and to Agent Ask action children so a Plan records each Action's recommended role, validated against the registry. Recommended role: implementer, standard tier.","acceptance":["The plan parser reads role on an Action into PlanActionDoc, and document validation refuses an unknown role id with the Plan, Action and field named; an Action without role stays valid.","arcadia agent-ask contract lists role among action fields, preview validates it against the registry, settling a plan or action Ask writes role into each created Action, and a target_ref amendment changes it.","A read-only report (arcadia roles --unassigned or the existing plans command) lists, per draft or active Plan, the open Actions that declare no role, with zero model calls.","Tests cover create, amend, unknown-role refusal and a legacy Action without role."],"dependencies":["define-governed-role-registry"],"references":["src/docs/types.ts","src/ask/settlement.ts","docs/managed-documents.md","docs/agent-guidance/agent-asks.md"]},{"id":"teach-planners-divide-and-conquer-roles","desired_result":"Update the Staff Planning Architect prompt and the planner packet prompt so every planned Action names its recommended role and is sized for one Session in that role. Recommended role: implementer, light tier.","acceptance":["docs/planning-process.md's Phase 2 prompt requires each Action to carry role, to split work needing two roles' authority into separate Actions, and lists role in its Deliverable.","The planner packet prompt rendered by src/codex/packets.ts carries the same requirement, and a test asserts the text.","The unassigned-role report from add-action-role-field is named in the Phase 2 prompt as the check a planner runs before submitting its plan Ask."],"dependencies":["add-action-role-field"],"references":["docs/planning-process.md","src/codex/packets.ts"]},{"id":"select-model-for-delegated-task","desired_result":"Build the deterministic just-in-time model and effort selector for a role and task, with a dry-run command and a golden table. Recommended role: implementer, standard tier, with a plan-critic review of the golden table. Waits on Decision decide-budget-pressure-model-selection-2026-10-09.","acceptance":["selectDelegateModel takes the role's registry defaults, the task's capability, effort and escalation triggers in src/execution/profiles.ts vocabulary, provider enablement and hard evidence, capacity and reserve state, costRank, review-independence exclusion and prior attempt outcomes, and returns provider, model, effort, every rejected candidate with its reason, and a sha256 of its normalized inputs.","It extends selectCompliantCodingAgent rather than replacing it, and config/defaults/provider-adapters.json gains c1_bounded bindings for the light-tier models already pinned in src/codingAgents/modelTiers.ts.","It never selects below the task's required capability, behaves under budget pressure as the answered Decision says, and raises the next selection by one tier after a failed attempt at a tier, capped at heavy.","A checked-in golden table of at least 12 cases, including reserve reached, provider excluded and after a failure, passes, and identical inputs produce byte-identical output.","arcadia delegation plan --role <id> --capability <tier> --effort <level> --json prints the selection with zero model calls and no writes."],"dependencies":["define-governed-role-registry"],"references":["src/codingAgents/providerAdapters.ts","config/defaults/provider-adapters.json","src/execution/profiles.ts","src/codingAgents/capacity.ts","docs/model-selection.md"]},{"id":"broker-delegation-requests","desired_result":"Build the delegation broker: arcadia delegation request admits, queues or declines a subagent request with a recorded receipt, and arcadia delegation finish closes it. Recommended role: implementer, standard tier. Waits on Decisions decide-which-roles-may-delegate-2026-10-09 and decide-delegation-admission-semantics-2026-10-09.","acceptance":["A migration adds a delegation_requests store; each row records request id, the requester's agent, tier, role and Session id or interactive receipt, the Project and Action when known, requested role, one-line task, requested capability and effort, verdict (admitted, queued or declined), reason code, the provider, model and effort from selectDelegateModel, supervisor, and timestamps; replaying a request id returns the original receipt and changed content under it is refused.","Admission is deterministic: it declines a role the registry does not let the requester delegate to, a depth above the limit, and a code-reviewer or qa request made as an in-process child of the mutating lead (returning the existing independent review path instead); it queues when the per-lead or per-provider concurrency cap or the operator reserve is reached; a queued request past its bounded wait is declined with reason queue_timeout.","arcadia delegation finish <id> --outcome <done|failed|abandoned> records the outcome, and arcadia delegation list --json shows open, queued and recent requests.","Tests cover admit, each decline reason, queue, queue timeout, replay and refused changed replay, with zero model calls."],"dependencies":["select-model-for-delegated-task"],"references":["src/db/schema.ts","src/sessions/roleLineage.ts","src/qa/prReview.ts"]},{"id":"route-subagent-spawns-through-broker","desired_result":"Make every Session brief and the headless Claude settings route subagent spawns through the delegation broker, replacing the prose-only Calling in help path. Recommended role: implementer, standard tier. Waits on Decision decide-delegation-admission-semantics-2026-10-09 for the enforcement mechanism.","acceptance":["renderCallingInHelp is replaced by a section telling the agent to run arcadia delegation request first and to spawn only an admitted delegate with the returned model and effort; on queued it continues other work or waits, and on declined it proceeds without the delegate or files an Agent Ask.","The headless Claude allow list adds exactly the delegation request and finish commands, and its tests still prove nothing else is widened.","If the answered Decision chooses hook enforcement, the Arcadia-written headless Claude settings add a PreToolUse rule on the Agent tool that denies a spawn without an admitted, unfinished receipt for that Session, proven by a test; the Codex and opencode briefs state the convention and that no enforcement exists for them.","The existing actionBrief and headlessPermissions tests pass with updated snapshots."],"dependencies":["render-role-brief","broker-delegation-requests"],"references":["src/sessions/actionBrief.ts","src/sessions/headlessPermissions.ts","docs/model-selection.md"]},{"id":"reserve-operator-emergency-capacity","desired_result":"Replace the fixed 5% capacity reserve margin with a configurable operator emergency reserve that unattended Sessions and delegations cannot consume. Recommended role: implementer, standard tier. Waits on Decision decide-burn-rate-and-emergency-reserve-2026-10-09.","acceptance":["config/defaults/token-budget.json (schema arcadia-token-budget-v1), overridable by a workspace config/token-budget.json, sets the reserve per provider window at the answered default, and CAPACITY_ADMISSION_LIMITS.reserveMarginPercentage reads it instead of a constant.","Production admission and delegation admission refuse or queue work on a provider window that has reached the reserve, with reason operator_reserve; an operator-attended launch with an explicit --use-reserve flag is admitted and records a receipt naming the operator and window.","arcadia production capacity shows each window's reserve and remaining non-reserve allowance, and a stale or missing observation never counts as available capacity.","Tests cover reserve reached, attended override, stale observation and a workspace override."],"dependencies":["broker-delegation-requests"],"references":["src/codingAgents/capacity.ts","src/commands/capacity.ts","src/production/policy.ts","docs/plans/provider-capacity-harvesting.md"]},{"id":"project-token-burn-rate","desired_result":"Store capacity observations as history, compute each provider window's burn rate and projected time to the reserve, and throttle new delegations and then new Sessions when the reserve would be crossed before reset. Recommended role: implementer, standard tier.","acceptance":["Each capacity refresh appends its normalized observation to a bounded append-only history store, and burn rate per provider window is derived from it deterministically, with an explicit unknown state when samples are too few or stale.","When projected use reaches the reserve before the window resets, delegation admission queues new requests with reason burn_rate; if the projection still crosses, production admission stops admitting new Sessions; both lift when the projection clears.","arcadia production capacity --json reports burn rate, projected reserve-crossing time, reset time and throttle state per window.","Tests with fixture observation series cover steady, spiking, too-few-samples and post-reset cases, with zero model calls."],"dependencies":["reserve-operator-emergency-capacity"],"references":["src/codingAgents/capacity.ts","src/production/policy.ts"]},{"id":"assign-supervisors-and-relay","desired_result":"Resolve a supervisor for every agent deterministically, give each role a relay path to it, and add a read-only team view. Recommended role: implementer, standard tier. Waits on Decisions decide-supervisor-chain-2026-10-09 and decide-inter-agent-channel-2026-10-09.","acceptance":["supervisorFor returns, for any delegate, Session or interactive receipt, its supervisor as the answered supervisor-chain Decision defines, ending at operator, and every delegation receipt records it.","A relay to a supervisor uses the answered channel; under the reuse option it is an Agent Ask with intent proposal whose references cite the requester's delegation or Session id, and arcadia agents team --session <id> --json lists the team and its relays.","The session-start role's brief lists its supervision duties for its team (monitoring through peer-watch classification and stall signals, direction through queue and decline verdicts, learning through a notes-to-self entry or proposal for repeated friction), each mapped to an existing command.","Tests prove the chain ends at the operator for every registry role, and that no relay can approve, settle or dispatch anything."],"dependencies":["broker-delegation-requests"],"references":["docs/agent-guidance/agent-peer-watch.md","docs/agent-guidance/agent-comms.md","src/agentWatch/classify.ts","src/production/stallDetection.ts"]},{"id":"record-interactive-role-sessions","desired_result":"Let an interactive coding-agent session record its role start and end so it is reported the same way as managed Sessions. Recommended role: implementer, light tier. Waits on Decision decide-interactive-session-crutch-mapping-2026-10-09.","acceptance":["Under the recommended option, arcadia role start --role <id> --agent <a> --tier <t> --label <title> [--action <plan-slug>#<action-id>] records an idempotent activity receipt and prints the role brief, and arcadia role end <receipt-id> --state <done|handed_off|needs_input> closes it; under the enrollment option the same is done through native-adopt enrollment.","Delegation requests from an interactive session cite that receipt, so its team resolves without a managed Session row.","A role start makes zero model calls, grants no claim or lease, and refuses an Action that another live Session claims.","Tests cover start, end, replay, claimed-Action refusal and delegation linkage."],"dependencies":["broker-delegation-requests"],"references":["src/sessions/hostEnrollment.ts","docs/agent-guidance/operator-directed-work.md","docs/harness-engineering.md"]},{"id":"build-agents-page","desired_result":"Add the dashboard /agents page showing every managed and interactive session with its role, supervisor, delegates, model and effort and state, plus each provider's burn rate and reserve. Recommended role: implementer, standard tier, with a qa review. Waits on Decision decide-agents-page-scope-2026-10-09.","acceptance":["/agents renders from one read model, arcadia agents overview --json (schema arcadia-agents-overview-v1): a team tree per Session or interactive receipt with role, supervisor, delegates and their verdicts, provider, model and effort, last activity and state, and per-provider burn rate, reserve and throttle state.","States come only from governed rows and peer-watch classification; anything unreadable shows unknown, never healthy, and stale data shows its age.","The page is read-only under the recommended option; any control the answered Decision adds calls an existing command and leaves a receipt.","START_HERE.md names the route, and a dashboard test renders fixtures for an active team, a queued and a declined delegation, and a throttled provider."],"dependencies":["project-token-burn-rate","assign-supervisors-and-relay","record-interactive-role-sessions"],"references":["apps/dashboard/app/production","src/timeline","docs/proposals/operator-timeline.md","START_HERE.md"]},{"id":"prove-governed-role-team-end-to-end","desired_result":"Prove the scheme on one Action and one interactive session: a light-tier session-start Session gets one admitted, one queued and one declined delegation, relays to its supervisor, stays outside the reserve, and appears on /agents. Recommended role: qa, standard tier, independent of the implementers.","acceptance":["An offline fast-rehearsal test drives a fixture Action through a light-tier launch in the session-start role, one admitted delegate whose model equals selectDelegateModel's choice, one queued-then-admitted delegate, one declined delegate, one supervisor relay and Session completion, asserting every receipt.","One real interactive session runs the same sequence with arcadia role start and arcadia delegation request, and its receipt ids appear in the completion evidence.","arcadia agents overview --json and the /agents page show both teams with the correct roles, supervisors, verdicts and reserve state.","No delegation in either run consumed the operator reserve, and the headless Claude Session shows no subagent spawn without an admitted receipt."],"dependencies":["route-subagent-spawns-through-broker","build-agents-page"],"references":["docs/harness-engineering.md"]}]}
