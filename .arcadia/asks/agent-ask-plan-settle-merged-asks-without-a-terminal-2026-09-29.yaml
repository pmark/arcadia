{"agent_ask":"v1","request_id":"plan-settle-merged-asks-without-a-terminal-2026-09-29","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"The operator never needs their computer to settle an Agent Ask: the managed-production worker surfaces every merged Ask on the dashboard and Discord, settles low-stakes intents on its own, and publishes its settlement commits through a pull request.","rationale":"The operator wants to run Arcadia from the Claude app, the dashboard, or Discord exclusively. Today an Ask drafted in a cloud session and merged to main only becomes a pending approval after someone runs an agent-ask command on the operator's machine (discoverUnprocessedAgentAsks runs only inside agent-ask commands), so it can never be accepted from the phone; and every settlement commit lands on the operator's local main unpushed. Cloud-drafted Discord pings (log Asks) are never sent for the same reason. Filed as an inactive draft Plan so it does not reorder the active managed-production Plan; the operator decides when to activate it. Operator direction for the push path: the worker opens a settlement pull request rather than pushing to main. The first step, surfacing merged Asks from the worker tick (surfaceMergedAgentAsks), was built directly at the operator's request in the same pull request that amended this Ask, so it is not an Action here.","references":["src/ask/discovery.ts","src/ask/autoSettleBeforeDispatch.ts","src/production/tick.ts","apps/dashboard/app/api/approvals/route.ts","apps/discord-bot/src/notifications/poller.ts","docs/decisions/0076-answer-decisions-through-discord-and-the-dashboard.md"],"actions":[{"id":"ping-discord-for-pending-asks","desired_result":"Tell the operator on Discord when an Ask is waiting on them, with a direct link to accept or reject it.","acceptance":["Each Ask that becomes pending for the operator produces one Discord message naming what it would change, with a link to that Ask's approval on the dashboard built from ARCADIA_DASHBOARD_URL.","The same Ask is announced once per content version, not on every tick, and a test proves it.","A pending Ask can be accepted or rejected from Discord, or through the linked dashboard page, without a terminal."],"dependencies":[]},{"id":"auto-settle-low-stakes-asks","desired_result":"Let the worker settle low-stakes Asks without the operator.","acceptance":["The worker settles, with no operator action, a merged Ask whose intent is `log`, `proposal`, `artifact`, or `plan` without `target_ref` (an inactive draft Plan).","An Ask of any other intent, or one that opens a Decision or names an approval boundary, stays pending for the operator and is never auto-settled; tests cover each intent.","Each auto-settlement is recorded as an event naming the Ask, its intent and the settlement receipt, so it is auditable after the fact."],"dependencies":[]},{"id":"publish-worker-settlements-via-pull-request","desired_result":"Publish the worker's settlement commits through a pull request instead of leaving them on the operator's local base branch.","acceptance":["A settlement the worker performs is committed to its own branch and opened as a pull request containing only the managed documents and archived Ask it produced; the local base branch is left untouched, so later fast-forwards keep working.","The settlement PR is merged under the existing Merge on green rule when eligible; one that opens or carries a Decision waits for the operator, and the operator is pinged with its link.","A settlement PR that fails CI or conflicts is reported to the operator on Discord, not retried silently, and a test covers the conflict path."],"dependencies":["auto-settle-low-stakes-asks"]}]}
