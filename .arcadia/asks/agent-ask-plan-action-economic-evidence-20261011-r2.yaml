{"agent_ask":"v1","request_id":"plan-action-economic-evidence-20261011-r2","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Create an inactive Action economic evidence Plan: the operator can inspect chosen and observed provider/model/effort, authoritative tokens and generated size, and qualified actual or near-exact cost across all work attributable to an Action. Milestone: read-only CLI rollup over durable provider receipts reconciles sanitized billing evidence without promising precision providers do not expose.","rationale":"User requested research/planning, not accounting implementation or activation. Separate per-Action economics from existing provider-capacity-harvesting allowance windows and governed-agent-role burn-rate admission. Vital few: truthful receipt, current provider collectors, deterministic rating/rollup, then scoped billing reconciliation. Plan token_impact medium: collection/rating/rollup/reconciliation zero-model; one bounded build and independent review per activated session-sized Action. Requested Opus High conceptual advice will be attributed only if actually returned; repository planning coordinator is Codex. Fixed subscription allocation and future live admin/API credential access remain separate operator choices. Supersedes registered draft plan-action-economic-evidence-20261011 after independent critique required managed coding-Session capture and actual sanitized evidence proof; prior receipt is preserved, not settled.","references":["docs/reports/action-cost-evidence-plan-2026-10-11.md","docs/plans/provider-capacity-harvesting.md","docs/plans/governed-agent-roles-one-real-action-and-one-interactive-session-each-run-as-a.md","docs/planning-process.md","src/intelligence/types.ts","src/sessions/enrollment.ts"],"actions":[{"id":"define-action-economic-receipt","desired_result":"Define the smallest additive receipt and bind it to existing Action/Session/attempt lineage. Role implementer, size S, standard tier/e2_standard; deterministic validation, one bounded build/review; no operator gate for local implementation.","acceptance":["A new focused tests/action-cost-receipts.test.ts validates versioned receipts with requested versus observed provider/model/effort, source/version/digest, timestamps, stable receipt/provider request IDs, Action reference and existing Session/attempt or explicit unallocated state; missing observations remain null with reason, never inferred from launch parameters.","Fixtures reject negative/nonfinite counts, malformed currencies/IDs, changed-content replays and cyclic attribution; accept success, denied-before-launch, failed, interrupted, missing and late receipts; append-only corrections refer to superseded receipts without erasing failures.","Explicit scope fields distinguish request delta, turn delta, session cumulative, resumed/forked baseline and parent totals that include descendants; unchanged replay counts once and unknown coverage prevents a complete-total claim. Existing IntelligenceUsage remains compatible; no new task model, queue or capacity snapshot contract."],"dependencies":[],"references":["docs/reports/action-cost-evidence-plan-2026-10-11.md","src/intelligence/types.ts","src/sessions/enrollment.ts","src/sessions/index.ts","src/sessions/reconciliation.ts"]},{"id":"capture-claude-economic-evidence","desired_result":"Capture Claude Code JSON usage from existing managed Session logs/reconciliation and Intelligence executor paths. Role implementer, size M, standard tier/e2_standard; bounded fixture-driven build/review; live private-log access needs existing scoped authorization, no new inference.","acceptance":["Focused tests exercise BOTH managed coding-Session stream-json logs produced by src/sessions/index.ts and collected at existing src/sessions/reconciliation.ts boundaries AND src/intelligence/claudeCode/textExecutor.ts. A real authorized sanitized provider result fixture retains source hash/version, session_id, modelUsage keys, cache categories and total_cost_usd as estimate; demonstrate association to real existing managed Session/role-attempt evidence when authorized, otherwise mark it unallocated and missing managed coverage rather than fabricate a match.","Fixtures prove is_error can fail even exit zero, error results still preserve usage, crashes with zeroed final counts retain earlier evidence as partial, missing result never means zero, and replay/resume cumulative totals are not summed as independent deltas; Claude modelUsage already including delegates is never added to delegate receipts again.","Bounded collector tests link available session/attempt IDs to receipts without replacing or wrapping the standard harness; preserve existing process stdout evidence by digest/reference and safe normalized fields, never prompt/transcript bodies or secrets in API/PR output. No enabling telemetry, paid mode, new credentials, delegates or services.","Disposable end-to-end fixture builds existing Session/enrollment/development plus independent-review attempt lineage, ingests real sanitized provider payload under explicitly fixture-only associations and reports an Action rollup with replay-stable totals and coverage. Production associations require actual existing Session/log/provider-session evidence; shared clock/cost conceptual consultation remains unallocated shared overhead and never appears fully charged to both Actions."],"dependencies":["define-action-economic-receipt"],"references":["docs/reports/action-cost-evidence-plan-2026-10-11.md","src/intelligence/types.ts","src/sessions/enrollment.ts","src/sessions/index.ts","src/sessions/reconciliation.ts"]},{"id":"capture-codex-economic-evidence","desired_result":"Capture Codex JSONL usage from existing managed Session logs/reconciliation and Intelligence executors, and preserve current LiteLLM details. Role implementer, size M, standard tier/e2_standard; fixture-driven build/review; no live account/API gate crossed.","acceptance":["Focused tests exercise BOTH managed coding-Session JSONL logs from src/sessions/index.ts with collector association through existing src/sessions/reconciliation.ts and Intelligence src/intelligence/codex/textExecutor.ts stdout. A real authorized sanitized Codex provider event fixture retains source hash/version, turn.completed usage and thread ID; preserve requested model/effort separately and missing observed fields explicitly, and failed/truncated stream partial coverage. If no real fixture is authorized/available, record an evidence blocker instead of declaring this criterion met from a synthetic event.","Existing LiteLLM transport fixture tests retain provider-returned model, prompt/completion and available details without re-tokenizing usage; equivalent fields normalize with adapter/version provenance while unsupported cache/reasoning/tier stays null.","Fixtures distinguish provider inclusive input/output totals from subset details: OpenAI cached input and reasoning output are not added again; provider-specific cache-write categories and optional pricing modifiers are preserved or cause unavailable rating. Existing executor outputs, timeout recovery and Intelligence compatibility tests continue to pass."],"dependencies":["define-action-economic-receipt"],"references":["docs/reports/action-cost-evidence-plan-2026-10-11.md","src/intelligence/types.ts","src/sessions/enrollment.ts","src/sessions/index.ts","src/sessions/reconciliation.ts"]},{"id":"rate-and-report-action-economics","desired_result":"Add deterministic versioned rating and a read-only per-Action economic rollup. Role implementer, size M, standard tier/e2_standard; no model calls at runtime; one bounded build/review; no subscription allocation chosen or paid effect authorized.","acceptance":["A focused tests/action-cost-rollup.test.ts proves arcadia action cost <plan-slug>#<action-id> --json projects existing receipts for every attempt, independent reviewer and delegate, failed/abandoned work and unallocated evidence, with receipt links, requested versus observed model/effort, coverage and no workspace writes or model calls.","Rating fixtures pin pricing source URL/effective interval/currency/units/model snapshot/cache-write TTL/batch/tier/geography/tool quantities and rates; decimal arithmetic reproduces synthetic golden totals with documented rounding, unknown model/modifier yields unpriced rather than zero, and historical results keep original rate version.","Rollup fixtures keep provider estimate, locally rated API-equivalent estimate, billing-confirmed cash and subscription inclusion separate; included allowance may show zero incremental cash only with mode evidence, fixed subscription allocation remains unavailable unless separately decided; known subtotals plus missing coverage never become an exact complete total.","Duplicate request/delta, session cumulative/resume, parent-inclusive descendant and late-correction fixtures count each unit once. Generated UTF-8 bytes/Unicode codepoints and optional visible-text tokenizer estimate (tokenizer/version named) remain distinct from provider output tokens; cost per million input/cache/output tokens is not conflated with effective total cash per visible output token."],"dependencies":["capture-claude-economic-evidence","capture-codex-economic-evidence"],"references":["docs/reports/action-cost-evidence-plan-2026-10-11.md","src/intelligence/types.ts","src/sessions/enrollment.ts","src/sessions/index.ts","src/sessions/reconciliation.ts"]},{"id":"reconcile-action-billing-evidence","desired_result":"Reconcile economic receipts against sanitized exported provider billing buckets. Role implementer, size S, standard tier/e2_standard; fixture-only ingestion and reporting, zero model calls; no admin-key acquisition or API access; live source expansion requires operator approval.","acceptance":["Focused reconciliation fixture tests import sanitized Anthropic/OpenAI exported usage/cost buckets idempotently with exact units, time bounds, scope, pagination completeness and source digest; an amount expressed as cents decimal string converts correctly and missing/pending buckets stay unknown.","Fixtures compare compatible local usage/cost and invoice scope, preserve tolerance and residual unattributed spend, never claim bucket totals are request/Action billed truth without unique attribution, and retain previous report revisions when a late provider adjustment arrives.","Read-only Action cost output labels reconciled scope and attribution precision; fixture golden cases cover two concurrent Actions sharing a billing bucket, subscription inclusion, contracted-rate mismatch, partial export and late correction. An operator QA recipe imports only a disposable sanitized fixture; no credentials, network billing calls, spending, notification, runtime install or production write."],"dependencies":["rate-and-report-action-economics"],"references":["docs/reports/action-cost-evidence-plan-2026-10-11.md","src/intelligence/types.ts","src/sessions/enrollment.ts","src/sessions/index.ts","src/sessions/reconciliation.ts"]}]}
