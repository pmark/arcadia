{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-session-start-role-name-2026-10-09","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide the name and semantics of the governed role every Session starts in, on the smallest model, before it delegates.","rationale":"The operator asked for an explicitly named semantic role for the lightweight agent that starts each Session. The name sets what that role may do. Existing names already in use: dispatch (dispatch journal), steward (src/stewardship) and Brief supervisor (src/briefSupervisor.ts). Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Lead (Action Lead): owns the Action and its candidate, does the routine work itself, requests delegates for hard sub-problems, then integrates and settles","consequence":"Matches today's Calling in help brief and the single development attempt, so exactly one agent mutates. A light model still writes code, and delegation covers its weak spots. It is a standard engineering title with no clash in Arcadia.","recommended":true},{"label":"Coordinator: never edits; only divides the work, requests delegates and integrates what they return","consequence":"The smallest model never writes code, which may improve quality. But every edit needs a delegate, so Sessions cost more tokens. Delegates would have to mutate, which breaks the one-mutation-owner rule unless the Coordinator applies their patches itself."},{"label":"Dispatcher: the same semantics as Coordinator","consequence":"The same costs as Coordinator, and the name clashes with Arcadia's existing dispatch vocabulary (dispatch journal, arcadia next), so readers would confuse the two."},{"label":"Foreman: the same semantics as Lead, under a different name","consequence":"The behavior is identical to Lead and the name clashes with nothing, but it is not a familiar software-engineering title, so it needs more explaining."}],"references":["src/sessions/actionBrief.ts","src/codingAgents/modelTiers.ts","src/sessions/enrollment.ts","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
