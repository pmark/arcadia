{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-delegation-admission-semantics-2026-10-09-r2","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide how a subagent request is admitted, queued or declined, and how strongly Arcadia enforces it.","rationale":"The operator wants delegation strictly controlled by Arcadia: agents request subagents, and requests may be declined or queued. Today headless Claude Sessions may spawn Agent freely, and Codex uses spawn_agent at its own discretion. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Deterministic broker, plus a hook where the provider has one. Admitted means a model, an effort and a lease with a TTL. Queued means it is re-evaluated when a delegation finishes, when a lease expires or when the requester polls, and is declined as queue_timeout once its bounded wait ends. Declined carries a reason code. For headless Claude, Arcadia's per-Session settings allow the delegation commands, plus a PreToolUse hook on Agent that permits exactly one spawn per admitted receipt, at the admitted model. Codex and opencode follow by convention. A broker that cannot answer admits nothing","consequence":"Headless Claude gets real enforcement without changing the harness itself. The per-Session allow list widens by the delegation commands and the hook. Codex and opencode spawns outside the broker are neither prevented nor detected afterwards, until a provider exposes spawn events. If the broker is down, no delegate is spawned and the parent continues alone. Every request leaves a receipt.","recommended":true},{"label":"Deterministic broker, convention only: agents run arcadia delegation request and obey its verdict. No hook and no allow-list change beyond the commands","consequence":"The cheapest, and it leaves Claude settings almost untouched. Any agent that ignores the brief can spawn unrecorded subagents, and nothing detects it."},{"label":"Arcadia launches every delegate itself as a separate Session; in-process subagents are retired","consequence":"The strongest control and full visibility for every provider. Each delegate pays Session launch and cold-context cost, and the in-process Calling in help path from PR #1145 goes away."}],"references":["src/sessions/headlessPermissions.ts","src/sessions/actionBrief.ts","docs/agent-guidance/standard-harness.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
