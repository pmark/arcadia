{"agent_ask":"v1","request_id":"decide-operator-directed-work-path-2026-10-05","project":"arcadia","intent":"decision","requested_authority":"propose","gate_question":"reasonable_disagreement","desired_result":"Decide whether coding agents may do operator-directed work: work the operator asks for in a session's own chat, started immediately in an isolated worktree outside the active Plan pointer and queue, and recorded as a one-Action inactive draft Plan that the agent itself settles and completes on the strength of that chat instruction.","rationale":"PR #975 (arcadia ping) showed the pattern works but left no governed Action or completion, skipped start-of-session retrieval, and left unclear what may be ad hoc. Today the bootstrap and continuation procedure tie executable work to the active Plan's pointer, and the Agent Ask contract says a proposal is never self-approving and the operator settles it, while non-complete settlements are recorded with operator_acceptance authority. Letting an operator's chat instruction stand in for that acceptance changes what agents are authorized to do, so it needs the operator's answer. The procedure is drafted in docs/agent-guidance/operator-directed-work.md. It grants nothing beyond the named work and those two settlements: approval boundaries, Decision 0060/0080 merge rules and the rehearsal freeze window are unchanged.","options":[{"label":"Sanction operator-directed work as drafted","consequence":"Agents may start operator-requested work immediately in an isolated worktree and settle its one-Action inactive draft Plan and its complete Ask in that candidate, so each request leaves a completed docs/plans/operator-directed-*.md record in its PR. The active Plan, current_action and queue stay untouched. Deploy, spend, credentials, messaging and merge still require their own Decisions under the unchanged rules.","recommended":true},{"label":"Sanction the path but require the operator to settle the track's opening plan Ask","consequence":"The same record exists, but every request costs one extra operator touch before the agent can file its completion, because complete needs the Plan to exist. Work can begin at once, but the session may end waiting on that settlement."},{"label":"Sanction the work with only a Log entry, no governed Action","consequence":"This is the lightest record: an intent log Ask plus the PR. No Plan document or completion evidence exists, so one session completes one Action stays unsatisfied for this work and dashboards show no Plan trace."},{"label":"Do not sanction; operator requests must first become an Action in the active Plan","consequence":"Each request needs an intent action Ask settled from the main checkout with queue placement. That reorders the active queue and touches shared state that the rehearsal freeze window restricts. Work starts later, and the ambiguity PR #975 exposed remains for chat requests that arrive mid-session."}],"references":["docs/agent-guidance/operator-directed-work.md","docs/agent-guidance/agent-asks.md","docs/agent-guidance/continuation.md","https://github.com/pmark/arcadia/pull/975"]}
