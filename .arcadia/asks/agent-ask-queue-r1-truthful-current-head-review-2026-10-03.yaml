{"agent_ask":"v1","request_id":"queue-r1-truthful-current-head-review-2026-10-03","project":"arcadia","intent":"action","requested_authority":"propose","rationale":"Overnight round #899 row R1. Issues #874 and #892 reproduce in one boundary (src/stewardship/codeRabbitReview.ts, src/commands/prCodeReview.ts, CLI rendering, tests/code-rabbit-review.test.ts); one writer, no split. Preserves Decision 0060. Grants no merge, install, restart or production authority.","desired_result":"Make independent PR review truthful: a paused, skipped, rate-limited or otherwise non-review status never counts as a completed review, and approval binds the actual reviewer and the current PR head.","references":["https://github.com/pmark/arcadia/issues/874","https://github.com/pmark/arcadia/issues/892","https://github.com/pmark/arcadia/issues/899","src/stewardship/codeRabbitReview.ts","src/commands/prCodeReview.ts","tests/code-rabbit-review.test.ts"],"actions":[{"id":"make-pr-review-verdict-truthful-for-current-head","desired_result":"Fix the CodeRabbit loop and `arcadia pr code-review` so only a genuinely completed review of the current head can yield done or approved.","acceptance":["Regression tests reproduce, before the fix, that a `Review paused` success status with an old APPROVED head and a `Review rate limited` success with no review each wrongly yield verdict done.","After the fix, paused or skipped success plus an old approval is not a completed review, and rate-limited success with no review is not a completed review.","A genuinely completed review without approval is reported as completed-not-approved, and a genuine approval of the exact current head by the actual reviewer identity is reported as approved; an approval of an earlier head never approves a changed head.","Unresolved review findings keep the verdict not done, and a push invalidates all earlier review evidence for that PR.","Decision 0060 and the exact-head independent review, QA and required-check gates are unchanged, and no gate, test or branch protection is weakened.","Show by test or code trace that the rehearsal and managed path consume the corrected classification, and state explicitly that installed verification is not claimed until the separate reviewed install."],"dependencies":[]}]}
