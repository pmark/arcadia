      "dependencies": [],
      "references": ["https://github.com/pmark/arcadia/issues/526", "https://github.com/pmark/arcadia/issues/511", "src/commands/go.ts", "src/git/worktrees.ts"]
    },
    {
      "id": "bind-preservation-checks-to-host-owned-code",
      "desired_result": "Stop a candidate from neutering its own protected-preservation check by binding the declared check's definition or content digest to the authorized packet.",
      "acceptance": [
