{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-burn-rate-and-emergency-reserve-2026-10-09-r2","intent":"decision","gate_question":"resists_reversal","desired_result":"Decide how token burn is measured and limited so 24/7 work can continue, and how the operator emergency reserve is protected from agents.","rationale":"The operator wants token burn rate monitored and managed so 24/7 work can be sustained, with a configurable amount of emergency tokens always available for the operator. Providers report windows as percentages used. Admission today keeps a fixed reserveMarginPercentage of 5 (src/codingAgents/capacity.ts:164, inside CAPACITY_ADMISSION_LIMITS at :160), and arcadia production capacity attest can be run by an agent, so it does not prove operator presence. The reserve's size is a separate Decision. This concerns included provider capacity only, and paid credits stay off-limits. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Percent-of-window budget with an operator-verified reserve. Unattended Sessions and delegations cannot use the reserve. Releasing reserve, or lowering its size, needs a one-shot kind grant /runs operator step under the operator-actions contract, and an agent-invoked use or change is refused. Burn rate comes from stored capacity observations. When projected use reaches the reserve before reset, new delegations queue first and then new Sessions stop","consequence":"Deterministic, and it reuses the capacity observations that already exist. No agent can spend or shrink the reserve, not even by editing a workspace file. In an emergency the operator presses one /runs action. Precision is limited to provider percentages and the 15-minute freshness window.","recommended":true},{"label":"Per-Session token counts parsed from provider usage output, with a daily token cap per provider and the same operator-verified reserve","consequence":"Precise attribution to each agent. It needs new usage collectors per provider, which some may not expose, and window percentages are still needed for resets."},{"label":"Fixed concurrency caps only (at most N Sessions and M delegates), with no burn measurement and no reserve","consequence":"Trivial to build. It protects no reserve for the operator and cannot tell whether 24/7 work will last until reset."}],"references":["src/codingAgents/capacity.ts","src/commands/capacity.ts","docs/agent-guidance/operator-actions.md","docs/plans/provider-capacity-harvesting.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
