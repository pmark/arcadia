{"agent_ask":"v1","request_id":"add-clean-run-actions-20261021","project":"arcadia","intent":"plan","target_ref":"plan/arcadia-runs-production-unattended-on-its-own-repository-on-the-claude-provider","requested_authority":"propose","desired_result":"Add three small tests-only Actions for the next clean unattended Claude production run, and make first-unattended-run depend on them without changing its criteria.","rationale":"The 2026-10-20 run failed to prove unattended operation because its Actions touched gated source. The worker merges unattended only PRs whose own changes are in the WORKER_MERGE_SAFE_PATHS allowlist in src/production/workerMerge.ts (tests/** minus helpers and fixtures; non-governance docs/**/*.md; Decision 0098 gate list stays operator-merged). Each Action below touches only tests/**, closes a real gap in an open Issue verified against origin/main 76a79bcd2, shares no file with the others, and has a focused vitest file that runs in seconds. first-unattended-run keeps its criteria unchanged; only its depends_on gains the three ids so it stays ineligible until they are merged.","actions":[{"id":"assert-tmux-temp-launcher-dir-removed","desired_result":"Make the tmux no-launcherDirectory test in tests/system-tmux-long-command.test.ts assert that the temporary launcher directory is removed, closing Issue #1536.","why":"Issue #1536: the test is named for temporary directory removal but only asserts argv, so a cleanup regression would pass.","acceptance":["In tests/system-tmux-long-command.test.ts, the test named 'delivers the brief byte-identical with no launcherDirectory (temporary directory removed)' points TMPDIR at a fresh empty directory under its own scratch root before launching, restores TMPDIR afterwards, and asserts that once the stub provider has written its argv no entry whose name starts with arcadia-launch- remains in that directory.","The existing argv assertion in that test is kept, and the other three tests in the file still pass unchanged on the private tmux socket.","The change touches only tests/system-tmux-long-command.test.ts; the focused vitest run of that file, pnpm lint and tsc pass."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/1536"]},{"id":"isolate-launch-preview-tmux-name","desired_result":"Stop tests/launch-preview.test.ts from consulting the host tmux server for its deterministic Session name, closing Issue #1628.","why":"Issue #1628: a fixed fixture clock yields a fixed tmux Session name, so a leftover host session fails the already-leased test with 'The tmux Session name already exists'.","acceptance":["In tests/launch-preview.test.ts, the prepareSession call inside the test named 'names an already-leased repository as a conflicting-execution prerequisite' passes a tmux stub whose hasSession returns false and records the names it was asked about, and the test asserts the stub was asked exactly once about a name starting with arcadia-test-project-.","The test still asserts preview.ready is false and a prerequisite starting with 'conflicting execution', and the file neither imports systemTmux nor spawns tmux, so no test in it depends on the host tmux server.","The change touches only tests/launch-preview.test.ts; the focused vitest run of that file, pnpm lint and tsc pass."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/1628"]},{"id":"bound-scratch-teardown-retries","desired_result":"Make the scratch-directory teardown in tests/agent-guidance.test.ts and tests/agent-ask-complete.test.ts retry a transient ENOTEMPTY instead of failing the shard, closing Issues #1419 and #1329.","why":"Issues #1419 and #1329: both suites failed CI in afterEach with ENOTEMPTY from an unbounded rmSync while a concurrent writer was still active.","acceptance":["In tests/agent-guidance.test.ts, the afterEach rmSync of the scratch roots passes recursive true, force true, maxRetries of at least 3 and retryDelay of at least 50 milliseconds.","In tests/agent-ask-complete.test.ts, the afterEach rmSync of the scratch roots passes the same options, and neither suite weakens or skips any assertion.","The change touches only those two test files; the focused vitest runs of both files, pnpm lint and tsc pass."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/1419","https://github.com/pmark/arcadia/issues/1329"]},{"target_ref":"action/first-unattended-run","desired_result":"Evidence a multi-Action unattended production run on Arcadia's own repository whose only operator touches are activation and merges of authority-adjacent PRs.","acceptance":["A production preview for at least three ready Actions on claude-code is published and its activation presented as one card; agents do not activate.","The run's ledger rows show every Action reaching a merged PR, with each operator touch listed and none other than activation and authority-adjacent merges.","docs/managed-production-readiness.md is re-derived from the run, stating the new verdict and every failure observed."],"dependencies":["worker-review-and-merge","production-spend-budget","credential-preflight","test-transient-review-retry-after-exhaustion","refresh-decision-0130-status-and-1559-fake","guard-repair-gate-upsert-role","assert-tmux-temp-launcher-dir-removed","isolate-launch-preview-tmux-name","bound-scratch-teardown-retries"]}]}
