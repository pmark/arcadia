y, settles nothing and changes no pointer or queue.", "references": ["src/ask/settlement.ts", "src/commands/agentAsk.ts", "tests/agent-ask-settlement.test.ts", ".arcadia/asks/agent-ask-plan-action-economic-evidence-20261011-r2.yaml", "docs/agent-guidance/agent-asks.md"], "actions": [{"id": "refuse-overlapping-draft-plan-settlement", "desired_result": "Make an accepted new-draft-Plan settlement refuse explicit Action ids that overlap another unsettled plan proposal or an existing draft or active Plan in the same Project, naming the overlap and the remedy. Role implementer, size S, standard tier/e2_standard; deterministic, zero model calls; one bounded build and independent review.", "acceptance": ["In tests/agent-ask-settlement.test.ts, a fixture with two unsettled plan proposals sharing explicit Action ids: previewing acceptance of either reports each overlapping proposal (id and request_id) and the shared ids, with a remedy naming arcadia agent-ask settle --proposal <id> --disposition rejected; applying it refuses with the same details and writes nothing (no Plan file, no settlement receipt, the Ask file is not archived, the queue is unchanged).", "A fixture where one of the two proposals was already accepted: accepting the other refuses because its explicit ids match Actions in the resulting draft Plan, naming the Plan slug and the shared ids. A Plan whose status is complete or superseded does not trigger the refusal.", "After the overlapping proposal is rejected through agent-ask settle --disposition rejected, the same acceptance applies successfully and creates exactly one draft Plan.", "Unchanged behaviour is proven by tests: auto-derived Action ids are still suffixed rather than refused; rejected settlements, Asks with no overlap, and target_ref amendments to an existing Plan behave as before; the existing agent-ask settlement, split and complete test files pass."], "dependencies": [], "references": ["src/ask/settlement.ts", "src/commands/agentAsk.ts", "tests/