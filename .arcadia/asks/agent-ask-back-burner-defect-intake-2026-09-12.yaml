agent_ask: v1
request_id: back-burner-defect-intake-2026-09-12
project: arcadia
intent: decision
requested_authority: propose
desired_result: >-
  Add a one-line defect intake whose periodically token-budgeted Back Burner
  process investigates, deduplicates, prioritizes, promotes, and when safely
  authorized repairs defects without requiring the reporter to author a formal
  Action first.
rationale: >-
  Decision 0037 explicitly used an open Decision as the defect-record stopgap
  until recurrence justified a dedicated path; repeated Arcadia Go, Agent Ask,
  pointer, and review-application defects have now fired that trigger. Back
  Burner already preserves deferred items and evaluates conditions, while the
  provider-capacity plan already proposes bounded use of otherwise-expiring
  included agent capacity. Reuse both rather than create another backlog or
  scheduler. A simple defect report is evidence, not proof of severity or
  authority. Deterministic deduplication and reproduction come before model
  triage; automatic fixes stay limited to reversible, validated, explicitly
  policy-authorized repository work.
options:
  - label: Bounded autonomous defect triage
    recommended: true
    consequence: >-
      Add `arcadia defect <summary>` as a thin Back Burner intake with captured
      Project, source, revision, context, and optional evidence. A periodic
      process receives a fixed token allowance, investigates and deduplicates,
      then closes noise, enriches the item, promotes a formal Action, or fixes
      low-risk reversible work under standing authority. Stop-the-line defects
      bypass cadence; consequential effects still require the operator.
  - label: Triage and promote only
    consequence: >-
      The periodic process investigates, deduplicates, and creates formal
      Actions but never edits code. This reduces authority risk but leaves even
      obvious, reversible repairs waiting for another production cycle.
  - label: Intake without automation
    consequence: >-
      Add the one-line defect inbox but require the operator to review and
      promote every item. Capture becomes easier, but prioritization and repair
      remain another recurring operator chore.
references:
  - docs/decisions/0037-project-to-arcadia-signal-channel.md
  - docs/plans/provider-capacity-harvesting.md
  - docs/plans/agent-advance-queue.md
  - docs/back-burner-guide.md
  - START_HERE.md
