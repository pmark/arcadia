{"agent_ask":"v1","request_id":"decide-literal-browser-close-proof-route-2026-10-02","project":"arcadia","intent":"decision","requested_authority":"propose","gate_question":"reasonable_disagreement","desired_result":"Decide whether Arcadia may introduce a supported observed browser-close route solely to prove the literal browser-close conjunct of prove-literal-split-browser-and-ledger, or must leave that criterion open until an already-governed production UI supplies such an event.","rationale":"The retained v6 receipts prove Off and worker restart but contain no browser-close event. Treating the CLI restart as a browser closure would change the literal acceptance criterion; adding a browser observation route would extend the current action scope. Either choice needs operator judgment.","options":[{"label":"Keep the criterion open until an existing governed production UI records browser closure","consequence":"No browser instrumentation or provider/browser-audit work is added now; v6 evidence remains honest, production stays Off, and this Action can only close the browser conjunct after a separately governed observable route exists.","recommended":true},{"label":"Authorize a minimal observed browser-close route for this proof","consequence":"A future scoped implementation may record one real browser close and post-close production observation without changing provider support or reusing v6 authority; it still needs a fresh disposable rehearsal and one-shot Grant before live execution."},{"label":"Amend the criterion to accept worker restart without a browser event","consequence":"The Action acceptance wording would need a separately governed Plan amendment; existing Off/restart receipts could then be reassessed, but no literal browser-close proof would be claimed."}],"references":["docs/reports/v6-two-action-evidence-assessment-2026-10-01.md","docs/managed-production-readiness.md","docs/decisions/0051-decide-whether-sequential-coding-agent-sessions-for-the-same-gove