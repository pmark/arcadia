{"agent_ask":"v1","request_id":"minimal-autonomous-managed-production-critical-path-2026-10-02","project":"arcadia","intent":"proposal","requested_authority":"propose","desired_result":"Preserve the minimal three-Action critical-path prompt for autonomous managed-production rehearsal without creating or accepting governed work.","rationale":"This evidence-only prompt is the requested next-session orchestration brief. It deliberately leaves the current pointer unchanged and creates no authority.\\n\\n# Primary objective\nProve that Arcadia can autonomously start, route, recover, and finish one explicitly scoped three-Action managed-production Plan through the installed host. After a fresh, exact rehearsal Grant is issued, no human may need to select work, start a second agent, repair a lease, decide a retry, merge an unreviewed change, or reconcile a worktree.\n\n# Definition of done\nUse one disposable rehearsal repository and exactly one active Plan, `autonomous-three-action-rehearsal`, with exactly these serial Actions:\n1. `write-start-marker`: create a declared marker and passing deterministic check.\n2. `transform-start-marker`: consume Action 1's committed result, produce the declared transformed marker, and pass its deterministic check.\n3. `verify-final-rehearsal`: consume Action 2's committed result, produce a final machine-readable receipt, and pass the Plan's final deterministic check.\nEach Action must have objective acceptance criteria, its own immutable candidate/input revision, completion evidence, and a settled completion receipt. Action 2 must never start before Action 1 is integrated; Action 3 must never start before Action 2 is integrated. The final receipt must show all three Actions done, no live admission or lease, exactly one mutation-owning principal at any instant, and every original candidate/commit recoverable.\n\n# Preconditions and authority\nThis is a bounded rehearsal, not standing production. Before launch, deterministically refuse unless the repository is clean and disposable, its exact Plan/Action IDs and checks are present, the configured provider/model/effort is compliant, the installed host is observable, and one fresh unconsumed Grant explicitly names only this repository, Plan, all three Actions, the provider, concurrency one, bounded integration, and expiry. Off, browser/worker restart, grant expiry, changed head, changed scope, a stale receipt, or a live lease must fence new launches. Do not silently reactivate an old policy or reuse a consumed Grant.\nA passing fixture provider may test code paths but cannot satisfy this objective; the final rehearsal uses the installed supervised coding-agent adapter and records its host/session identity.\n\n# Critical-path Actions — exactly these three\n## 1. Make scope recovery and protected enrollment total\nImplement only the missing path that preserves a revision-bound inactive production configuration separately from active authority, restores it only through explicit current activation, and enrolls an external/native session through the protected host request path. Persist exact policy revision, epoch, principal identity, candidate, provider/model/effort and liveness/terminal evidence. Refuse unsupported native supervision before launch.\nAcceptance: Off clears live authority without deleting the saved inactive configuration; activation never derives scope from queue state; duplicate/concurrent enrollment returns one receipt; an unobserved native session is refused; focused tests pass.\n\n## 2. Make one-plan serial execution durable\nPersist a requirement identity/input revision and distinct attempt ordinal/request ID for planner, critique, development, exact-head code review and independent QA. Transport replay returns the same receipt; an explicitly authorized retry after terminal failure atomically allocates the next bounded ordinal. Route only one mutation-owning principal; helpers are separately identified and read-only. Deterministic readiness precedes inference, and push/criteria/evidence changes invalidate dependent verdicts.\nAcceptance: a three-Action Plan always selects only its next dependency-ready Action; restart resumes or reconciles its current attempt without duplication; Off fences a between-Action launch; independent review/QA cannot be supplied by the developer; focused migration/race/replay/restart/Off tests pass.\n\n## 3. Run and prove the three-Action rehearsal\nPrepare the disposable repository and the exact Plan above, then under the fresh bounded Grant run the installed managed worker until the Plan is complete. Exercise at least one controlled worker restart between Actions and one Off fence after completion/reconciliation; do not synthesize a browser event. Preserve all receipts, revisions, model/effort selections, candidate identities, test output, recovery events and intervention ledger.\nAcceptance: Arcadia autonomously begins all three Actions in order, completes/integrates each once, terminates with no live admission, and emits a single evidence report whose receipts prove every definition-of-done condition. A failure at any stage preserves work and produces one exact actionable blocker, never a second principal or invented task.\n\n# Subagent roles and economy\nUse a high-reasoning planner only to confirm this exact scope; have an independently identified adversary critique that exact draft; then use the least-cost compliant configured development profile. Run deterministic checks before reviewer calls. Use an independent reviewer and QA identity for exact-head verdicts. Do not build a workflow DSL, generalized role marketplace, dashboard redesign, notification system, broad cleanup system, multi-project scheduling, or a general branch-removal mechanism.\n\n# Operating rules\nRead the canonical pointer, policy, claims, receipts and existing pending Asks first. Reuse the existing enrollment/saved-configuration proposal rather than duplicating it. Never hand-edit governed documents or database state. Use Agent Asks for governed changes and host brokers for worktrees. A prompt, a safe-to-run label, a successful critique, or idempotence does not grant authority. Stop only with a pull request/evidence report or one exact operator action for a genuine unresolved gate.\n\n# Completion report\nReport “Arcadia can autonomously run the three-Action managed-production rehearsal” only when the installed-host evidence meets every Definition-of-done criterion. Otherwise report the first unmet criterion, its preserved receipt, and the exact next gate."}
