{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-agents-page-scope-2026-10-09-r3","intent":"decision","gate_question":"reasonable_disagreement","desired_result":"Decide what the first version of the dashboard /agents page shows and whether it can change anything.","rationale":"The operator wants all Session and agent activity monitored, captured, reported and shown on a new /agents page. The dashboard already has /production and an operator-script library listing, and the operator-timeline proposal covers the same need. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"Read-only first version: a team tree per Session or interactive session (role, supervisor, delegates and verdicts, model and effort, state, last activity) plus each provider's burn rate, reserve and throttle state, with no controls","consequence":"The fastest to ship, with no new mutation or auth surface. The operator still acts through existing commands and arcadia todo. Controls come back only on their named trigger.","recommended":true},{"label":"Read plus controls: approve or decline queued delegations, pause a team, and start a reserve release, which still needs the operator presence proof","consequence":"More useful from a phone. Each control is a new mutation that needs receipts, and the dashboard has no identity layer, so every control beyond reserve release needs its own proof design."},{"label":"No new route: fold the same read model into the existing /production page","consequence":"Less surface to maintain. It does not give the explicit /agents route the operator asked for."}],"references":["apps/dashboard/app/production","src/timeline","docs/proposals/operator-timeline.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
