{"agent_ask":"v1","request_id":"queue-r2-managed-preservation-timeout-reset-2026-10-03","project":"arcadia","intent":"action","requested_authority":"propose","rationale":"Overnight round #899 row R2 (issue #896). Defect confirmed at src/production/sessionHandoff.ts: the managed tick calls preserveCandidate outside guardPreservationTimeouts, so a later success never clears timeout:<session.id>. Builds on merged #895 (ff5cb1955) whose preserved worktree is clean and must not be repurposed; needs a fresh current-main candidate. The owner comment on #896 widens scope to tick timeout counting/reset, live lock safety, typed malformed lock errors and index_locked budget separation; that expansion is included here because the operator-authored issue names it. Grants no merge, install, restart or production authority.","desired_result":"Make managed-production preservation share the CLI timeout budget so timeout, then successful preservation, then timeout resets the consecutive timeout history, without weakening the bounded stop.","references":["https://github.com/pmark/arcadia/issues/896","https://github.com/pmark/arcadia/issues/899","src/production/sessionHandoff.ts","tests/preservation-git-timeout.test.ts","tests/candidate-preservation.test.ts"],"actions":[{"id":"reset-managed-preservation-timeout-history-on-success","desired_result":"Route the managed tick's preserve call through the shared timeout guard so a success clears the consecutive timeout count.","acceptance":["A regression test reproduces, before the fix, that a managed tick timeout followed by a successful preservation leaves timeout:<session.id> uncleared.","After the fix, timeout then successful managed preservation then timeout counts the second timeout as the first consecutive one, while ten identical consecutive timeouts still stop automatic retries.","The managed tick and the CLI use one shared budget; index_locked is counted separately from timeouts, bounded retry behavior is unchanged and the stop condition is not weakened.","A malformed or live preservation lock yields a typed bounded error with preserved diagnostics instead of an unhandled exception.","The actual managed handoff is exercised in a temporary repository and its structured receipts are retained; the original candidate commits and index remain recoverable.","Merge and install are not claimed; the exact reviewed install step and host-path verification are named as the next gate."],"dependencies":[]}]}
