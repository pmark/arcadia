{"agent_ask":"v1","project":"arcadia","requested_authority":"propose","request_id":"decide-burn-rate-and-emergency-reserve-2026-10-09","intent":"decision","gate_question":"resists_reversal","desired_result":"Decide how token burn is measured and limited so 24/7 work can continue, and how the operator emergency reserve is sized and released.","rationale":"The operator wants token burn rate monitored and managed so 24/7 work can be sustained, with a configurable amount of emergency tokens always available for the operator. Providers report windows as percentages used (src/codingAgents/capacity.ts), and admission today keeps a fixed 5% margin. This concerns included provider capacity only. Paid credits stay off-limits, as they are now. Operator direction 2026-10-09 (governed subagent roles), recorded verbatim in the planning brief; the operator was unavailable for a live interview, so that text stands in for one. Recommended option is listed first; the operator decides.","options":[{"label":"A percent-of-window budget in a configurable token-budget file. The operator reserve defaults to 20% of each provider window, and only an operator-attended launch with an explicit flag may use it. Burn rate comes from stored capacity observations, and when projected use reaches the reserve before reset, new delegations queue first and then new Sessions stop","consequence":"Fully deterministic, reusing the capacity observations that already exist. A reserve that unattended work cannot spend sits there at all times. Precision is limited to the provider's percentages and the 15-minute freshness window. 20% of capacity is held back from unattended work.","recommended":true},{"label":"The same mechanism with a 10% default reserve","consequence":"More capacity goes to unattended work. The reserve covers less urgent work, and a burst can reach it faster than observations refresh."},{"label":"Per-Session token counts parsed from provider usage output, with a daily token cap per provider","consequence":"Precise attribution to each agent. It needs new usage collectors for each provider, which some may not expose, and window percentages are still needed for resets."},{"label":"Fixed concurrency caps only (at most N Sessions and M delegates), with no burn measurement","consequence":"Trivial to build. It protects no reserve and cannot tell whether 24/7 work will last until reset."}],"references":["src/codingAgents/capacity.ts","src/commands/capacity.ts","docs/plans/provider-capacity-harvesting.md","docs/reviews/2026-10-09-governed-agent-roles-design.md"]}
