{"agent_ask":"v1","request_id":"file-live-production-blockers-2026-09-24","project":"arcadia","intent":"action","requested_authority":"propose","desired_result":"File the five defects the 2026-09-23/24 live standing-policy runs exposed as Actions, so single-lane managed production can run unattended.","rationale":"docs/managed-production-readiness.md (refreshed 2026-09-24) found that the worker already launched real Sessions under the standing policy (session_e7748a398de14978b4 on 2026-09-23, session_5c1a2543cae24319a6 on 2026-09-24). Those runs, not the old critical path, now name what stops unattended production, and five of their defects have no owning Action: #610, #611 (two parts), #539, #572. Each is filed here so it can be queued ahead of Gate 6 UI work.","actions":[
{"id":"release-committed-admissions-on-session-end","desired_result":"Release a committed production admission when its Session reaches a terminal outcome, so finished Sessions stop counting against maxConcurrentSessions.","acceptance":["When a Session backed by a committed production admission is reconciled to any terminal outcome (accepted completion, incomplete-resumable exit, failure, or operator stop), its admission is released through the existing releaseAdmission writer in the same transaction as the reconciliation.","countLiveAdmissions no longer counts a committed admission whose Session is terminal; already-leaked committed admissions on an existing workspace stop counting without a manual database edit.","A deterministic test reproduces Issue #610: with maxConcurrentSessions 1, one Session launches, completes, and a second Action is then admitted on the next tick instead of being refused concurrency_limit.","pnpm test and the core, Discord and Dashboard builds pass, and the PR closes Issue #610."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/610","src/production/policy.ts","src/sessions/reconciliation.ts"]},
{"id":"name-failing-preservation-check-and-bound-retries","desired_result":"Make a preservation refusal name the check that failed, and stop a Session from retrying an identical refusal forever.","acceptance":["The 'Declared preservation validation failed or was skipped.' refusal returned by the preserve broker carries non-empty details naming each failing or skipped check, its command, and its exit status or skip reason.","The brief delivered to a managed Session instructs it to stop after a bounded number of identical preservation refusals and exit incomplete with the refusal recorded, rather than investigating host source outside its worktree.","A deterministic test covers a failing check (details name it) and a skipped check (details name the skip reason).","pnpm test and the core, Discord and Dashboard builds pass, and the PR refs Issue #611."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/611","src/sessions/preservationValidation.ts"]},
{"id":"withhold-worker-lifecycle-from-sessions","desired_result":"Stop a dispatched coding-agent Session from stopping, starting, or restarting the shared host worker.","acceptance":["arcadia worker stop, start, restart and install refuse, with a named reason, when invoked from inside a managed coding-agent Session's process environment or prepared worktree, the same way the go host-controller executable is already withheld from agent allowlists.","The operator's own terminal and the launchd agent can still run every worker command unchanged.","A deterministic test proves the refusal from a Session environment and the unchanged operator path.","pnpm test and the core, Discord and Dashboard builds pass, and the PR closes Issue #611 together with name-failing-preservation-check-and-bound-retries or refs it if that Action has not merged."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/611","src/commands/worker.ts"]},
{"id":"preserve-candidates-across-base-advance","desired_result":"Let a candidate be preserved after the base branch advanced during its Session, and bind preservation to the Session's own dispatched Action rather than the current pointer.","acceptance":["Manual and protected preservation accept a candidate whose base branch advanced after preparation when the candidate still merges cleanly onto the new base, and refuse with a message naming the old base, the new base and the recovery when it does not.","Preservation compares the candidate's Action definition against the Session's own dispatched Action, not resolveDispatch's pointer Action, so a non-pointer Session can be preserved.","Deterministic tests cover a base that advanced cleanly (preserved), a conflicting advance (named refusal), and a non-pointer Action (preserved).","pnpm test and the core, Discord and Dashboard builds pass, and the PR closes Issue #539."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/539","src/sessions/manualPreservation.ts"]},
{"id":"refuse-packets-without-validation-commands","desired_result":"Refuse to prepare a build packet or launch a managed Session for a Project that declares no validation commands, since such a Session can never be preserved or auto-completed.","acceptance":["Build-packet preparation refuses, naming the remedy arcadia project metadata <project> --validation-command <command>, when the Project's validation_commands list is empty.","buildLaunchPreview reports the same condition as a named prerequisite, and the managed-production tick escalates it once through production_operator_escalations instead of launching.","A deterministic test covers the empty-list refusal and an unchanged launch for a Project with declared commands.","pnpm test and the core, Discord and Dashboard builds pass, and the PR closes Issue #572."],"dependencies":[],"references":["https://github.com/pmark/arcadia/issues/572","src/sessions/reconciliation.ts"]}
