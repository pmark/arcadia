{"agent_ask":"v1","request_id":"plan-operator-moonlet-2026-10-25","project":"arcadia","intent":"plan","requested_authority":"propose","desired_result":"Create an inactive draft Plan for the operator moonlet on /workspace: a tappable moon companion showing the operator's ambient atmosphere and momentary state, kept as a browser-local display signal with no authority.","rationale":"Operator back-burner request in Issue 1761 (2026-10-25). In Claude Code session https://claude.ai/code/session_019wikccyoTwVWoRwuAsNdht the operator reviewed the UX prototype (checked in at docs/design/prototypes/operator-moonlet.html), asked for this Plan, and directed an ungoverned scaffold at /workspace/moonlet in PR 1768; these Actions harden that scaffold to their criteria rather than rebuild it. The Plan stays inactive until the operator chooses to activate it; nothing here touches the active Plan, queue or North Star critical path. Any use of the signal beyond display (agents adapting, Ask stamps, sync, Discord) is held for an operator Decision in the last Action.","references":["https://github.com/pmark/arcadia/issues/1761","docs/design/operator-moonlet.md","docs/design/prototypes/operator-moonlet.html","docs/design/conversational-ui-shell.md","https://github.com/pmark/arcadia/pull/1768","apps/dashboard/app/workspace/moonlet/page.tsx","apps/dashboard/components/workspace/sky/controller.ts","apps/dashboard/components/workspace/workspace-ask.tsx","apps/dashboard/app/workspace/layout.tsx"],"actions":[{"id":"define-operator-mood-signal","desired_result":"Define the browser-local operator mood signal: atmosphere plus an optional momentary state with an expiry, persisted on the workspace surface and readable as a display-only snapshot.","why":"One small typed contract keeps the picker, sky layer and any later Decision talking about the same state.","acceptance":["A typed module in apps/dashboard defines the atmosphere set, the momentary state set, custom entries and a snapshot shape whose authority field is always none.","Unit tests cover setting a state, expiry falling back to the atmosphere, a never-expire setting, reload restoring state, and blocked or corrupt storage falling back to defaults without throwing.","No server route, database write, Ask payload change or governed document change is introduced."],"dependencies":[],"references":["docs/design/operator-moonlet.md","apps/dashboard/components/workspace/workspace-ask.tsx"]},{"id":"add-workspace-moonlet","desired_result":"Harden the moonlet on /workspace/moonlet, docked at the bottom of the page, with a one-tap orbit picker for Right now and Atmosphere and a fade-back trail; moving it beside the /workspace composer is a separate later choice.","why":"This is the feature the operator touches; it must feel instant and never get in the way of the composer.","acceptance":["On /workspace/moonlet the moonlet renders docked at the bottom of the page at desktop and 390px phone width with no horizontal page scroll.","Tapping or pressing Enter on the moonlet opens the picker; one tap on a state or atmosphere applies it and closes the picker; Escape and an outside tap close it without change.","The moonlet's face and motion change with the momentary state, the trail shows remaining time, and expiry returns it to the atmosphere; under prefers-reduced-motion no CSS animation runs on the moonlet, its chips or its badge, and the weather layer repaints on a 250 ms timer instead of animation frames.","tests/e2e/workspace-moonlet.spec.ts covers open, choose, Escape, expiry and reload, and passes alongside the existing workspace-shell spec."],"dependencies":["define-operator-mood-signal"],"references":["docs/design/prototypes/operator-moonlet.html","tests/e2e/workspace-shell.spec.ts","apps/dashboard/app/workspace/layout.tsx"]},{"id":"layer-atmosphere-weather-on-sol-sky","desired_result":"Render the atmosphere as a weather layer over the existing sol-phase sky (tint, haze, dust, aurora) without changing the sky's time-of-day behavior.","why":"The brand idea is that your mood is the weather on Mars; it has to compose with the sol clock rather than replace it.","acceptance":["sol-phase.ts and sky-scroll.ts keep blob ids 2e577f294190dd2298b092c9e9172bdb4fc15883 and d29019aa5e26a2ab0ebb7b1c306bf91a2270690a; the weather layer lives in its own module and canvas and reads only the published --night property.","A unit test shows every atmosphere has a distinct weather parameter set, and a change eases with a 600 ms time constant (at least 95 percent within 2000 ms) without restarting the sky renderer.","With prefers-reduced-motion the weather is drawn statically, and hidden-tab and cleanup behavior match the existing controller.","Screenshots of at least three atmospheres at two frozen phases are attached to the PR."],"dependencies":["add-workspace-moonlet"],"references":["apps/dashboard/components/workspace/sky/controller.ts","docs/design/mission-control-sky-react-reuse.md"]},{"id":"add-custom-moonlet-states","desired_result":"Let the operator add their own momentary states from any emoji or an uploaded sticker or GIF, kept in the picker for reuse.","why":"The operator explicitly asked for GIFs and stickers; personal states are what make it theirs.","acceptance":["The picker offers a custom entry that accepts any emoji or an image file up to 1 MB; larger files are refused with a message naming the limit.","Up to three custom states persist browser-locally and appear in the picker after reload; a quota or storage failure shows a message, keeps the earlier custom states and leaves the built-in states working.","The e2e spec covers adding an emoji state and an image state."],"dependencies":["add-workspace-moonlet"],"references":["docs/design/prototypes/operator-moonlet.html"]},{"id":"read-live-missions-on-moonlet","desired_result":"Replace the moonlet page's sample mission fixture with live arcadia-plan-journey-v1 reads for every Plan with work in progress, listed from /api/plans and read per Plan from /api/journey/<project>/plan/<plan>.","why":"The missions panel is how the operator sees all rover work at a glance; it must show records, not samples.","acceptance":["/workspace/moonlet lists one mission per governed Plan from /api/plans whose action counts show work not done, each read from /api/journey/<project>/plan/<plan>, with the fixture used only by tests.","A Plan whose journey read fails shows that failure on its own line while the other missions still render.","The e2e spec covers a live mission list, an expanded mission and one failed read."],"dependencies":["add-workspace-moonlet"],"references":["apps/dashboard/lib/journey-fixture.ts","apps/dashboard/lib/journey-types.ts",".agents/skills/arcadia-rover-journey/SKILL.md"]},{"id":"propose-mood-signal-use-decision","desired_result":"Prepare an operator Decision on what, if anything, may read the mood signal beyond display.","why":"Agent adaptation, Ask stamps, cross-device sync and Discord presence each change what the signal can influence, so the operator decides.","acceptance":["A validated decision-intent Agent Ask is drafted with options covering display only, stamping Asks and messages, agent adaptation rules, cross-device sync and Discord presence, each with its consequence and at most one recommended option.","The Ask names its gate question and cites operator usage of the shipped moonlet as evidence.","A repository search shows lib/operator-mood.ts is imported only under apps/dashboard/components/workspace/ and its own tests until that Decision is answered."],"dependencies":["add-workspace-moonlet"],"references":["CONSTITUTION.md","docs/agent-guidance/agent-asks.md"]}]}
