{"agent_ask":"v1","request_id":"decision-design-brief-home-experiments-project-2026-10-31","project":"arcadia","intent":"decision","requested_authority":"propose","gate_question":"reasonable_disagreement","desired_result":"Where should sustained design briefs live?","rationale":"Supersedes Decision 0153, whose options did not include the operator's answer given in Claude Code on 2026-10-31. The recommended option is that answer, with refinements the operator accepted. Gates establish-design-brief-home in Plan unify-how-arcadia-agents-identify-themselves-and-their-teammates-and-make.","options":[{"label":"Default experiments Project","consequence":"A brief lives in its own Project. Work not ready for, or not tied to, a Project goes in a default experiments Project, kept in a local git repository that Arcadia creates and maintains. Arcadia commits locally only: adding a remote and pushing stays the operator's action, and until then the briefs exist on one disk. An experiment that earns its own Project moves there, with the original kept linked. Creating and maintaining the repository is new capability built by the brief-home Action.","recommended":true},{"label":"Existing Projects only","consequence":"Briefs live only in existing Projects, with no default experiments Project. Cheapest; a design that isn't tied to a Project can't keep a brief until the operator creates one."}]}
