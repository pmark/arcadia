ns (src/operatorActions/startRunPins.ts). The approved content of each Action in pins.actions is the sha256 of a canonical JSON object {\"next_action\", \"acceptance_criteria\", \"references\"}, keys in that order, built from the values of that Action's next_action, acceptance_criteria and references keys as parsed from the YAML front matter of the Plan file docs/plans/<pins.plan>.md at pins.reviewedRevision (the slug convention of src/commands/startRun.ts; quoting and YAML style do not matter); a missing acceptance_criteria or references is an empty list. Each text item (next_action, each acceptance criterion, each reference) has every run of whitespace (JavaScript /\\s+/) collapsed to one space and is trimmed, with no other Unicode normalization; acceptance_criteria keeps its order, and references is sorted by UTF-16 code-unit order (the default JavaScript sort), keeping duplicates. The object is serialized compactly with JSON.stringify (keys in the stated order) and its UTF-8 bytes are hashed with sha256, compared as lowercase hex. The worker computes it and compares it with the same fields of the same Action at merge-time main; title, expected_artifact, depends_on, decisions, execution, responsibility and effort are deliberately not hashed (dependency changes are ordering-only and do not void approval), a pinned Action with no next_action field parks, and no new pin is written. A card whose pins carry a delegation block (a card Rowan or the standing-grant timer pressed) records no operator-pressed content for its Actions (the standing-grant card carries no Action list or revision), so on such a run C1 parks. Added scope (an Action not in pins.actions), any change to the text of next_action, acceptance_criteria or references, or a reordering of acceptance_criteria (a newly named authority path shows up as a references change) voids that approval and parks the Action until the operator re-approves; whitespace-only edits, reordering references, and queue-order or ordering-only dependency changes do not. Tests cover each case, including a delegated card, and an unreadable library, card, pins or revision parks.","status":"met","note":"src/production/standingMerge.ts implements requirementHash/planActionHash and C1 in evaluateStandingMerge using validateStartRunPins on the card in the library of the registered repo main checkout (defaultRunWindowDeps libraryDir), the card id from production policy authority.requestId, the Plan read with git show at pins.reviewedRevision and at merge-time origin main. Ran pnpm exec vitest run tests/worker-merge.test.ts: 133 passed, including tests for whitespace-only/reordered-references/title/depends_on edits passing; next_action, criterion, reordered criteria and new reference changes parking; added scope; a delegated card; unreadable library, card, pins, either revision, front matter, and missing next_action parking; and the canonical hash bytes."},{"criterion":"A PR whose diff touches the shared gate set or a hard class parks for the operator; a test covers each.","status":"met","note":"C4 in evaluateStandingMerge parks when classifyGatePath protects any changed path (gate module, spend path, hard class) or batchMerge classifies decisions or agent_permissions. Ran pnpm exec vitest run tests/worker-merge.test.ts: 133 passed, covering a gate module path, the spend path, a gate-set hard class path, a batch-merge agent_permissions path, an unreadable diff and gate set, and an end-to-end mergeCandidatePullRequest park (refused authority_adjacent, Standing merge parked at C4, no gh pr merge call)."},{"criterion":"The receipt comment (card or run id, head sha, review marker URL, 'Loosens a gate' line, check conclusions, merge state, classes, release sha) is posted before the merge call; a test with injected GitHub dependencies records the call order and shows the receipt post precedes the merge call, with no live merge required.","status":"met","note":"mergeCandidatePullRequest posts renderStandingM