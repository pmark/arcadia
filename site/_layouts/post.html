---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.author %} &middot; {{ page.author }}{% endif %}{% if page.status == "draft" %} &middot; <span class="badge">draft source article</span>{% endif %}</p>
  {{ content }}
</article>
