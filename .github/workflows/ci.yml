name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm lint
      - name: Validate default agent instruction delivery
        run: mise exec -- pnpm check:agent-guidance
      - name: Validate every generated operator action
        run: mise exec -- pnpm check:operator-scripts
      - name: Validate the session ledger
        run: mise exec -- pnpm check:session-ledger
      - name: Validate frozen records are unchanged
        run: mise exec -- pnpm check:frozen-records
      - name: Validate Plan close-out records
        run: mise exec -- pnpm check:plan-close-outs

  unit:
    # Required checks are named unit-1..unit-4; `name` keeps those exact check
    # names. Shards come from scripts/ci-test-shard.mjs (duration-balanced,
    # every test file in exactly one shard) instead of vitest's hash shards.
    name: unit-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      # Unit tests resolve workspace imports through vitest aliases, but a few
      # suites read dist/. `pnpm build` also runs ESLint, which the lint job
      # already enforces, so CI builds only the artifacts.
      - run: mise exec -- pnpm build:artifacts
      - name: Run this shard's test files
        run: mise exec -- pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=vt.json
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vt-${{ matrix.shard }}
          path: vt.json

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build:artifacts
      - run: mise exec -- pnpm dashboard:build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCADIA_CONFIG_PATH: ${{ github.workspace }}/.tmp/isolated-arcadia-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build:artifacts
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: apps/dashboard/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('apps/dashboard/app/**', 'apps/dashboard/components/**', 'apps/dashboard/lib/**', 'apps/dashboard/hooks/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            next-build-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise exec -- pnpm dashboard:build
      - run: mise exec -- pnpm test:e2e
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/playwright
            playwright-report
            /tmp/arcadia-e2e-*/database
            /tmp/arcadia-e2e-*/*.log
          if-no-files-found: ignore
          retention-days: 7
