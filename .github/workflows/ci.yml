name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm lint

  unit-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      # Unit tests resolve workspace imports through vitest aliases, but the
      # package-boundary suite builds dist itself if it is missing; a
      # pre-existing build keeps that hook instant.
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm exec vitest run --shard=1/3

  unit-2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm exec vitest run --shard=2/3

  unit-3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm exec vitest run --shard=3/3

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm dashboard:build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCADIA_CONFIG_PATH: ${{ github.workspace }}/.tmp/isolated-arcadia-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: mise exec -- corepack enable pnpm
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: apps/dashboard/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('apps/dashboard/**', 'src/**', 'pnpm-lock.yaml', 'tsconfig.json') }}
          restore-keys: |
            next-build-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise exec -- pnpm dashboard:build
      - run: mise exec -- pnpm test:e2e
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/playwright
            playwright-report
            /tmp/arcadia-e2e-*/database
            /tmp/arcadia-e2e-*/*.log
          if-no-files-found: ignore
          retention-days: 7
